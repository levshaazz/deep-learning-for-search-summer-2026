  <!-- Apply saved theme/lang BEFORE first paint to avoid a flash of the
       wrong theme. Mirrors tools.js prefs key. -->
  <script>
    try {
      var __p = JSON.parse(localStorage.getItem('lecture.template.prefs.v1') || '{}');
      var __de = document.documentElement;
      if (__p.theme === 'dark' || __p.theme === 'light') __de.setAttribute('data-theme', __p.theme);
      if (__p.lang === 'ru' || __p.lang === 'en') {
        __de.setAttribute('data-lang', __p.lang);
        __de.setAttribute('lang', __p.lang);
      }
    } catch (e) {}
  </script>

  <!-- Asset-load failure banner. If a vendored dependency fails to load
       (e.g. the vendor/ folder was lost when copying the deck), tell the
       lecturer in plain language instead of silently degrading. -->
  <script>
    window.__assetFail = (function () {
      var failed = [];
      return function (name) {
        if (failed.indexOf(name) !== -1) return;
        failed.push(name);
        function show() {
          if (!document.body) { document.addEventListener('DOMContentLoaded', show); return; }
          var el = document.getElementById('__asset-banner');
          if (!el) {
            el = document.createElement('div');
            el.id = '__asset-banner';
            el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:2147483647;' +
              'background:#D7522C;color:#fff;font:600 15px/1.4 system-ui,sans-serif;' +
              'padding:10px 16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.3)';
            el.addEventListener('click', function () { el.remove(); });
            document.body.appendChild(el);
          }
          el.textContent = 'Не загрузились ресурсы: ' + failed.join(', ') +
            '. Формулы/подсветка/QR могут не отрисоваться — запустите офлайн-файл ' +
            '«Lecture Template (Standalone).html». · Failed to load: ' + failed.join(', ') +
            ' — use the Standalone file. (клик чтобы скрыть)';
        }
        show();
      };
    })();
  </script>

  <!-- KaTeX — vendored locally (zero runtime CDN). 4× faster + lighter than
       MathJax; handles 99% of CS/ML formulas. See README to swap to MathJax. -->
  <link rel="stylesheet" href="vendor/katex/katex.min.css"
        onerror="window.__assetFail&&window.__assetFail('KaTeX')">
  <script defer src="vendor/katex/katex.min.js"
        onerror="window.__assetFail&&window.__assetFail('KaTeX')"></script>
  <script defer src="vendor/katex/auto-render.min.js"
    onerror="window.__assetFail&&window.__assetFail('KaTeX')"
    onload="renderMathInElement(document.body, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false,
      strict: 'ignore'
    });
    document.dispatchEvent(new CustomEvent('katex:done'));"></script>

  <!-- Prism — vendored core + python/bash/yaml/json. The autoloader is
       intentionally dropped: it fetches grammars from a CDN at runtime,
       which defeats the zero-network goal. Long-tail languages won't
       highlight; add their grammar files to vendor/prism/ if needed. -->
  <script src="vendor/prism/prism-core.min.js"
        onerror="window.__assetFail&&window.__assetFail('Prism')"></script>
  <script src="vendor/prism/prism-python.min.js"></script>
  <script src="vendor/prism/prism-bash.min.js"></script>
  <script src="vendor/prism/prism-yaml.min.js"></script>
  <script src="vendor/prism/prism-json.min.js"></script>

  <!-- QR code generator — vendored. -->
  <script src="vendor/qrcode/qrcode.js"
        onerror="window.__assetFail&&window.__assetFail('QR')"></script>
