name: site-ci

# On every push / PR that touches the site or its single-source layers, build the Astro site
# (so the gates can inspect the rendered Book) and run the deterministic site gates. Each gate
# also runs its --selftest, so a detector that has gone blind FAILS CI too (AUDIT_V2 §2.4).

on:
  push:
    paths:
      - 'src/**'
      - 'data/**'
      - 'content/**'
      - 'widgets/**'
      - 'narrative/**'
      - 'tokens/**'
      - 'Lectures/**'
      - '_research/check_claims.py'
      - '_audit/*.mjs'
      - '_audit/lib/**'
      - '_audit/baselines/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - '.github/workflows/site-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'data/**'
      - 'content/**'
      - 'widgets/**'
      - 'narrative/**'
      - 'tokens/**'
      - 'Lectures/**'
      - '_research/check_claims.py'
      - '_audit/*.mjs'
      - '_audit/lib/**'
      - '_audit/baselines/**'
  workflow_dispatch: {}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      # Build assembles BOTH the Book chapters (content/book/lN.js) and the decks
      # (Lectures/NN-*.html) from their fragments, then renders the site. Both are BUILD
      # OUTPUT (gitignored) reassembled byte-identically from their tracked fragments
      # (content/book/<stem>/beats/, Lectures/<slug>/parts/). Every gate below — including
      # the four that read content/book/lN.js directly (beat-coverage, i18n, scroll-step,
      # widget-render) — runs AFTER this step, so the chapters and decks are present.
      - name: Build site (assemble chapters + decks + render)
        run: npm run build

      # G1 — facts-gate: data/ is the single source; decks must match; provenance + arithmetic.
      - name: G1 facts-gate
        run: python3 _research/check_claims.py
      - name: G1 facts-gate self-test
        run: python3 _research/check_claims.py --selftest

      # G6 — every Book scroll-step maps to a real widget step.
      - name: G6 scroll-step
        run: node _audit/scroll-step-gate.mjs
      - name: G6 scroll-step self-test
        run: node _audit/scroll-step-gate.mjs --selftest

      # G7 — the Book matches the narrative beat sheet (no drift / reorder).
      - name: G7 beat-coverage
        run: node _audit/beat-coverage-gate.mjs
      - name: G7 beat-coverage self-test
        run: node _audit/beat-coverage-gate.mjs --selftest

      # G2 — one design-token source (no rogue :root; brand values match the decks).
      - name: G2 token
        run: node _audit/token-gate.mjs
      - name: G2 token self-test
        run: node _audit/token-gate.mjs --selftest

      # G2b — font-size lint: ratchet on raw `font-size` literals in deck CSS (vs the --fs-* scale).
      #        HARD-fails if the count exceeds the frozen baseline (a NEW raw font-size was added).
      - name: G2b font-gate
        run: node _audit/font-gate.mjs
      - name: G2b font-gate self-test
        run: node _audit/font-gate.mjs --selftest

      # G2c — layout-gate: bind placeLabels' label separation to slide-viz's overprint threshold
      #        (shared _audit/lib/thresholds.mjs) so "overlap has one definition" — pure, no browser.
      - name: G2c layout-gate (placeLabels minGap vs overprint threshold)
        run: node _audit/layout-gate.mjs
      - name: G2c layout-gate self-test
        run: node _audit/layout-gate.mjs --selftest

      # G3 — translation coverage (HARD on EN holes; RU/TT reported for the badge).
      - name: G3 i18n-coverage
        run: node _audit/i18n-coverage-gate.mjs
      - name: G3 i18n-coverage self-test
        run: node _audit/i18n-coverage-gate.mjs --selftest

      # G8 — the Book reads on phone/tablet (no horizontal overflow). Needs Playwright/Chromium.
      - name: Install audit deps + Chromium
        working-directory: _audit
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: G8 responsive
        working-directory: _audit
        run: node responsive-gate.mjs
      - name: G8 responsive self-test
        working-directory: _audit
        run: node responsive-gate.mjs --selftest

      # G9 — slide visual defects the box-size gates are blind to: everything-at-step-0
      #       (no progressive reveal), label overlap / out-of-bounds inside the SVG, and
      #       near-identical colours on distinct elements. AUTO-GLOBS every stepped deck slide
      #       (decks 00–06) + every scrolly Book widget (chapters 00–06) — 92 figures, all 7
      #       units (was 26 curated L5/L6). Adding a unit needs ZERO target edits. Needs Chromium.
      - name: G9 slide-viz
        working-directory: _audit
        run: node slide-viz-gate.mjs --strict
      - name: G9 slide-viz self-test
        working-directory: _audit
        run: node slide-viz-gate.mjs --selftest

      # G10 — "does it RUN" + "does it render the SAME": every Book scroll-step widget mounts and
      #        steps WITHOUT a runtime error (console.error / pageerror / unhandledrejection /
      #        setStep-throw / missing export) and WITHOUT an empty/degenerate figure, in both themes
      #        (complements G9's "does it look right"). It ALSO compares each (widget,theme,step) to a
      #        committed paint-signature baseline (_audit/baselines/widget-viz.json) and HARD-fails on
      #        DRIFT — a vanished mark, a collapsed step, a fill/stroke/HALO change (the regression a
      #        dropped .svg-halo is). An intentional visual change is re-frozen via --update-baseline.
      - name: G10 widget-render-check
        working-directory: _audit
        run: node widget-render-check.mjs
      - name: G10 widget-render-check self-test
        working-directory: _audit
        run: node widget-render-check.mjs --selftest

      # G11 — word-by-word gate over the SHIPPED decks (Lectures/NN-*.html): engine registered
      #        every slide (total === DOM .slide count), 0 pageerrors, 0 console errors, KaTeX
      #        typeset (no raw $$), pre-flight 0 errors. Deck list is glob-derived (zero edits for
      #        L7). Closes the coverage hole: ci.yml only smoke-tests the template, never the decks.
      - name: G11 wbw-check (shipped decks)
        working-directory: _audit
        run: node wbw-check.mjs
      - name: G11 wbw-check self-test
        working-directory: _audit
        run: node wbw-check.mjs --selftest
