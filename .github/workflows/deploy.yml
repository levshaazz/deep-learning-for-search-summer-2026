name: Deploy site to GitHub Pages

# Builds the Astro site (landing/syllabus/schedule + copied decks) and publishes it.
# Runs on push to main and on demand. To activate: repo Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'content/**'
      - 'widgets/**'
      - 'tokens/**'
      - 'public/**'
      - 'Lectures/**'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The illustration masters live in LFS; checkout leaves pointer stubs. Restore the
      # objects from the actions cache (seeded by the lfs-warm workflow) and pull only the
      # delta — never the full 380 MB per job, which would burn the free LFS bandwidth.
      - name: LFS assets (cache-first)
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-manifest
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-manifest') }}
          restore-keys: lfs-
      - name: Materialise LFS files
        run: git lfs pull
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Persist the content-addressed WebP cache so unchanged plates are never
      # re-encoded (optimize-images.mjs → .cache/webp). Key on the PNG sources;
      # restore-keys rolls the cache forward when only some images change.
      - name: Cache optimized images (WebP)
        uses: actions/cache@v4
        with:
          path: .cache/webp
          key: webp-${{ hashFiles('Lectures/assets/img/**/*.png') }}
          restore-keys: webp-
      - name: Build (astro build + copy decks)
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
