name: Deploy site to GitHub Pages

# Builds the Astro site (landing/syllabus/schedule + copied decks) and publishes it.
# Runs on push to main and on demand. To activate: repo Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'tokens/**'
      - 'public/**'
      - 'Lectures/**'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (astro build + copy decks)
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
