<!DOCTYPE html>
<html lang="en" data-theme="light" data-lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>deck-adapter · slide-driver proof (real deck.js engine)</title>
  <!-- PROOF: the cosine-sphere widget mounted inside a real DECK slide, driven by the deck's own
       step engine (arrow keys → slide:step → setStep). Same widget + same data as the Book. Serve
       over HTTP (the published decks run over HTTP); on file:// ship a classic widget bundle. -->
  <link rel="stylesheet" href="../Lectures/css/template.css" />
  <link rel="stylesheet" href="./_base.css" />
  <link rel="stylesheet" href="./cosine-sphere/style.css" />
  <style>
    .widget-mount { max-width: 720px; margin: 0 auto; }
    .slide-kicker { color: var(--warm-ink); }
  </style>
</head>
<body>
  <div class="deck">
    <div class="stage">
      <div class="slides">
        <section class="slide" data-type="e2e" data-max-step="4" data-current-step="0" data-screen-label="01 Cosine">
          <div class="slide-header">
            <h2>Measure the angle, not the length</h2>
            <span class="slide-kicker">deck step engine drives the widget (← / →)</span>
          </div>
          <div class="widget-mount" data-widget="cosine-sphere"></div>
          <script class="widget-data" type="application/json">
          {
            "data": {
              "primary": "same-dir",
              "coordSpace": { "w": 520, "h": 360 },
              "relation": "‖x − y‖² = 2(1 − cos θ)",
              "pairs": [
                { "id": "same-dir", "u": [1,1], "v": [10,10], "cos": 1.0, "angleDeg": 0.0,
                  "euclid": 12.727922, "euclidExact": "√162" }
              ]
            },
            "labels": {
              "role": "img",
              "alt": "Two vectors from the origin; cosine measures the angle, Euclidean the gap between tips.",
              "angleLabel": "θ", "cosLabel": "cos",
              "s0": "Two vectors, u = (1,1) and v = (10,10). They point the same way — but one is much longer.",
              "s1": "Euclidean distance: ‖u − v‖ = √162 ≈ 12.73. It calls them far apart.",
              "s2": "But the angle between them is θ = 0°, so cosine = 1.",
              "s3": "Project both onto the unit sphere — they land on the same point.",
              "s4": "For unit vectors: ‖x − y‖² = 2(1 − cos θ). Same direction ⇒ distance 0, cosine 1."
            }
          }
          </script>
        </section>
        <section class="slide" data-type="title" data-screen-label="02 End">
          <div class="slide-header"><h2>End</h2></div>
        </section>
      </div>
    </div>
  </div>

  <!-- widget logic (ES module) sets window.mountCosineSphere before DOMContentLoaded -->
  <script type="module" src="./cosine-sphere/logic.js"></script>
  <!-- the real deck engine (classic IIFE) + the adapter (classic) -->
  <script src="../Lectures/js/deck.js"></script>
  <script src="./deck-adapter.js"></script>
</body>
</html>
