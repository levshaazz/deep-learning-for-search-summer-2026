":-0.103,"y":-0.728,"c":"capitals"},{"w":"prince","x":-0.7,"y":-0.123,"c":"royalty"},{"w":"princess","x":-0.504,"y":-0.12,"c":"royalty"},{"w":"puppy","x":-0.019,"y":0.775,"c":"animals"},{"w":"queen","x":-0.588,"y":-0.145,"c":"royalty"},{"w":"rome","x":-0.229,"y":-0.737,"c":"capitals"},{"w":"software","x":0.997,"y":0.234,"c":"tech"},{"w":"spain","x":-0.248,"y":-0.95,"c":"countries"},{"w":"throne","x":-0.805,"y":-0.263,"c":"royalty"},{"w":"tiger","x":-0.331,"y":0.816,"c":"animals"},{"w":"tokyo","x":0.423,"y":-0.74,"c":"capitals"},{"w":"train","x":0.236,"y":0.115,"c":"transport"},{"w":"truck","x":0.368,"y":0.212,"c":"transport"},{"w":"woman","x":-0.493,"y":0.33,"c":"family"}]}}},"i18n":{"_doc":"Step captions + small labels for dimred-projection. EN canonical + RU + TT (all written). Every NUMBER (37.7% 2-D total, the per-component % bars, every point) comes from data/l5-dimred.json, never from these strings. Protected terms: PCA, t-SNE.","alt":{"en":"A 300-D word space folded to 2-D: a faint cloud, then a PCA scatter colored by cluster, then per-component variance bars, then a t-SNE neighbor plot.","ru":"300-D пространство слов, свёрнутое в 2-D: туманное облако, затем PCA-диаграмма, окрашенная по кластерам, затем столбики дисперсии по компонентам, затем t-SNE по соседям.","tt":"300-D сүз киңлеге 2-D'га бөкләнгән: томанлы болыт, аннары кластерлар буенча төсләнгән PCA сибелеше, аннары компонентлар буенча дисперсия баганалары, аннары t-SNE күршеләр графигы."},"t300":{"en":"300-D space","ru":"300-D пространство","tt":"300-D киңлек"},"tPca":{"en":"PCA → 2-D","ru":"PCA → 2-D","tt":"PCA → 2-D"},"tEvr":{"en":"per-component variance","ru":"дисперсия по компонентам","tt":"компонентлар буенча дисперсия"},"tTsne":{"en":"t-SNE → 2-D","ru":"t-SNE → 2-D","tt":"t-SNE → 2-D"},"blur300":{"en":"300-D · unseeable","ru":"300-D · не увидеть","tt":"300-D · күреп булмый"},"varKept":{"en":"variance kept","ru":"дисперсии сохранено","tt":"дисперсия сакланды"},"neighbors":{"en":"neighbors preserved","ru":"соседи сохранены","tt":"күршеләр сакланды"},"evrTitle":{"en":"PCA explained variance per component","ru":"PCA: объяснённая дисперсия по компонентам","tt":"PCA: компонент саен аңлатылган дисперсия"},"first2":{"en":"PC1 + PC2 keep","ru":"PC1 + PC2 хранят","tt":"PC1 + PC2 саклый"},"tsneCaveat":{"en":"distances not global","ru":"расстояния не глобальны","tt":"ераклыклар глобаль түгел"},"s0":{"en":"Each word lives as 300 numbers — 300 dimensions. We can hold three at most in our heads, so 300-D is just a blur: real structure is in there, but no eye can see it. The Cartographer's job is to fold the map small enough to carry, keeping the shape.","ru":"Каждое слово живёт как 300 чисел — 300 измерений. В голове мы удержим максимум три, так что 300-D — просто туман: структура там есть, но глаз её не видит. Задача Картографа — свернуть карту до переносимого размера, сохранив форму.","tt":"Һәр сүз 300 сан булып яши — 300 үлчәм. Башыбызда күп дигәндә өчне тотабыз, шуңа күрә 300-D — бары томан: чын төзелеш анда, әмма аны күз күрми. Картографның эше — картаны күтәреп йөрерлек итеп бөкләү, формасын саклап."},"s1":{"en":"PCA finds the directions of greatest spread and projects onto the top two. The 44 words drop into a flat scatter, and same-meaning words land together — royalty, animals, countries, tech each form their own island. These two axes keep 37.7% of the original variance.","ru":"PCA находит направления наибольшего разброса и проецирует на два главных. 44 слова падают в плоскую диаграмму, и слова одного смысла оказываются вместе — сан, животные, страны, техника образуют свои острова. Эти две оси хранят 37,7% исходной дисперсии.","tt":"PCA иң зур таралыш юнәлешләрен таба һәм өске икесенә проекцияли. 44 сүз яссы сибелешкә төшә, һәм бер мәгънәле сүзләр бергә җыела — дәрәҗә, хайваннар, илләр, техника һәрберсе үз утравын ясый. Бу ике күчәр асыл дисперсиянең 37.7%'ын саклый."},"s2":{"en":"Why only 37.7%? Look at the variance each component carries: PC1 holds 19.6%, PC2 18.1%, and after that the bars shrink fast. The first two axes are the richest pair, but the rest of the meaning is spread thin across many smaller directions we had to drop.","ru":"Почему лишь 37,7%? Посмотри, сколько дисперсии несёт каждая компонента: PC1 — 19,6%, PC2 — 18,1%, дальше столбики быстро тают. Первые две оси — самая богатая пара, но остальной смысл размазан тонким слоем по множеству меньших направлений, которые пришлось отбросить.","tt":"Ни өчен бары 37.7%? Һәр компонент күпме дисперсия йөртә, кара: PC1 — 19.6%, PC2 — 18.1%, аннан соң баганалар тиз кими. Беренче ике күчәр — иң бай пар, әмма калган мәгънә ташланырга тиеш булган күп кенә кечерәк юнәлешләр буенча юка катлам булып таралган."},"s3":{"en":"t-SNE chases a different goal: keep each word near its true neighbors, even if the global layout bends. The clusters pull in tight and the islands separate cleanly — a far more readable map. But beware: in a t-SNE plot the gaps between clusters and the cluster sizes are NOT meaningful distances.","ru":"t-SNE преследует другую цель: держать каждое слово рядом с настоящими соседями, даже если глобальная раскладка искривится. Кластеры стягиваются плотно, острова чётко разделяются — карта куда читабельнее. Но осторожно: на t-SNE промежутки между кластерами и размеры кластеров — НЕ осмысленные расстояния.","tt":"t-SNE башка максат куа: һәр сүзне чын күршеләре янында тоту, гомуми урнашу бөгелсә дә. Кластерлар тыгыз җыела, утраулар ачык аерыла — күпкә укылышлырак карта. Әмма сак бул: t-SNE графигында кластерлар арасындагы бушлыклар һәм кластер зурлыклары — мәгънәле ераклыклар ТҮГЕЛ."}},"title":{"en":"Folding 300-D down: PCA and t-SNE","ru":"Складываем 300-D: PCA и t-SNE","tt":"300-D'ны бөклибез: PCA һәм t-SNE"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
