e.json, never from these strings — i18n carries only human prose + structural labels. Protected terms: GloVe, word2vec, PCA, PMI.","alt":{"en":"GloVe on a tiny king/queen/man/woman/cat/dog corpus: a sliding window builds a symmetric word-word co-occurrence matrix X; the weighting f(x) down-weights rare pairs and caps frequent ones; the objective fits w_i·w̃_j + b_i + b̃_j to log X_ij, shown worked on the king·queen pair; factorising X lands the learned vectors as a 2-D map like the predictive route; count-based GloVe and predictive word2vec are two faces of one coin.","ru":"GloVe на крошечном корпусе king/queen/man/woman/cat/dog: скользящее окно строит симметричную матрицу совстречаемости слов X; весовая функция f(x) понижает вес редких пар и ограничивает частые; цель подгоняет w_i·w̃_j + b_i + b̃_j к log X_ij, показано на паре king·queen; факторизация X размещает обученные векторы как 2-мерную карту, как и предсказательный путь; счётный GloVe и предсказательный word2vec — две стороны одной монеты.","tt":"Кечкенә king/queen/man/woman/cat/dog корпусында GloVe: шуышучы тәрәзә симметрик сүз-сүз бергә очрашу матрицасы X төзи; авырлык функциясе f(x) сирәк парларның авырлыгын киметә һәм еш очраганнарын чикли; максат w_i·w̃_j + b_i + b̃_j'ны log X_ij'га туры китерә, king·queen парында күрсәтелгән; X'ны факторлау өйрәнелгән векторларны 2 үлчәмле карта итеп урнаштыра; санаулы GloVe һәм фаразлаучы word2vec — бер тәңкәнең ике ягы."},"corpusHead":{"en":"mini-corpus + sliding window","ru":"мини-корпус + скользящее окно","tt":"мини-корпус + шуышучы тәрәзә"},"matrixHead":{"en":"co-occurrence matrix X","ru":"матрица совстречаемости X","tt":"бергә очрашу матрицасы X"},"matrixSub":{"en":"symmetric · window 1/distance counts","ru":"симметрична · окно, счёт 1/расстояние","tt":"симметрик · тәрәзә, 1/ара исәбе"},"curveHead":{"en":"weighting f(x)","ru":"весовая функция f(x)","tt":"авырлык функциясе f(x)"},"curveSub":{"en":"rare pairs down-weighted · frequent pairs capped","ru":"редкие пары — меньший вес · частые — потолок","tt":"сирәк парлар — кечерәк авырлык · еш парлар — чик"},"objHead":{"en":"objective · worked pair","ru":"цель · разобранная пара","tt":"максат · аерым пар"},"mapHead":{"en":"factorise X → the map","ru":"факторизация X → карта","tt":"X'ны факторлау → карта"},"mapSub":{"en":"PCA-2D of W+W̃ — same geometry as word2vec","ru":"PCA-2D от W+W̃ — та же геометрия, что у word2vec","tt":"W+W̃'ның PCA-2D'ы — word2vec кебек үк геометрия"},"coinHead":{"en":"two faces of one coin","ru":"две стороны одной монеты","tt":"бер тәңкәнең ике ягы"},"coinCount":{"en":"count-based · GloVe factorises log-counts","ru":"счётный · GloVe факторизует лог-счёты","tt":"санаулы · GloVe лог-исәпләрне факторлый"},"coinPred":{"en":"predictive · word2vec predicts context","ru":"предсказательный · word2vec предсказывает контекст","tt":"фаразлаучы · word2vec контекстны фаразлый"},"coinPmi":{"en":"Levy–Goldberg: skip-gram ≈ factorising shifted PMI","ru":"Леви–Голдберг: skip-gram ≈ факторизация сдвинутого PMI","tt":"Леви–Голдберг: skip-gram ≈ күчерелгән PMI факторлау"},"xCell":{"en":"X","ru":"X","tt":"X"},"logLabel":{"en":"log X","ru":"log X","tt":"log X"},"fLabel":{"en":"f(X)","ru":"f(X)","tt":"f(X)"},"dotLabel":{"en":"w·w̃","ru":"w·w̃","tt":"w·w̃"},"biasLabel":{"en":"+ b + b̃","ru":"+ b + b̃","tt":"+ b + b̃"},"modelLabel":{"en":"model","ru":"модель","tt":"модель"},"errLabel":{"en":"weighted error","ru":"взвеш. ошибка","tt":"авырлыклы хата"},"lossBefore":{"en":"loss before","ru":"потеря до","tt":"югалту алда"},"lossAfter":{"en":"loss after","ru":"потеря после","tt":"югалту соң"},"xMaxTick":{"en":"x_max","ru":"x_max","tt":"x_max"},"capLabel":{"en":"capped at 1","ru":"потолок 1","tt":"чик 1"},"s0":{"en":"Start from raw counts, not predictions. A small window slides over the mini-corpus, and every time two words fall inside it together their co-occurrence count grows — closer words count more (a word d steps away adds only 1/d). The result is the symmetric matrix X on the right: how often each word keeps company with each other word. This table of context statistics is the only thing GloVe ever looks at.","ru":"Начинаем со счётов, а не предсказаний. Маленькое окно скользит по мини-корпусу, и каждый раз, когда два слова попадают в него вместе, их счёт совстречаемости растёт — ближние слова считаются больше (слово в d шагах добавляет лишь 1/d). Итог — симметричная матрица X справа: как часто каждое слово соседствует с каждым другим. Эта таблица контекстной статистики — всё, на что вообще смотрит GloVe.","tt":"Фаразлардан түгел, исәпләрдән башлыйбыз. Кечкенә тәрәзә мини-корпус буйлап шуыша, һәм ике сүз аңа бергә кергән саен аларның бергә очрашу исәбе үсә — якын сүзләр күбрәк санала (d адымдагы сүз бары 1/d өсти). Нәтиҗә — уңдагы симметрик X матрицасы: һәр сүз һәр башка сүз белән ничек еш күршеләшә. Бу контекст статистикасы таблицасы — GloVe гомумән караган бердәнбер нәрсә."},"s1":{"en":"Not every count deserves equal trust. A pair seen once or twice is noisy; a pair seen very often shouldn't drown out everything else. GloVe weights each entry by f(x) = (x/x_max)^0.75, but caps it at 1 once x reaches x_max. The curve climbs gently from zero — rare pairs get little say — then flattens to a ceiling so the most frequent pairs can't dominate the fit. The dots are the real f-values for the matrix cells.","ru":"Не каждый счёт заслуживает равного доверия. Пара, встреченная раз-другой, шумна; пара, встречаемая очень часто, не должна заглушать всё остальное. GloVe взвешивает каждую запись через f(x) = (x/x_max)^0,75, но ограничивает её единицей, как только x достигает x_max. Кривая мягко поднимается от нуля — редкие пары почти не влияют — затем выходит на потолок, чтобы самые частые пары не доминировали в подгонке. Точки — реальные значения f для ячеек матрицы.","tt":"Һәр исәп тигез ышанычка лаек түгел. Бер-ике тапкыр очраган пар шаулы; бик еш очраган пар калганын басарга тиеш түгел. GloVe һәр язманы f(x) = (x/x_max)^0.75 аша авырлыклый, әмма x x_max'ка җиткәч аны 1 белән чикли. Кәкре нульдән йомшак күтәрелә — сирәк парлар аз тәэсир итә — аннары чиккә чыга, иң еш парлар туры китерүдә өстенлек итмәсен. Нокталар — матрица ячейкалары өчен f'ның чын кыйммәтләре."},"s2":{"en":"Now the model itself. GloVe asks each pair's dot-product plus two bias terms to land near the log of its count: w_i·w̃_j + b_i + b̃_j ≈ log X_ij. Take a real pair from this corpus and read every term off the data — the count X, its logarithm log X, the weight f(X), the model's dot-product and biases, and the resulting residual times its weight. That weighted squared error, summed over all pairs, is the whole loss.","ru":"Теперь сама модель. GloVe требует, чтобы скалярное произведение пары плюс два смещения попадали близко к логарифму её счёта: w_i·w̃_j + b_i + b̃_j ≈ log X_ij. Возьмём реальную пару из корпуса и прочитаем каждое слагаемое из данных — счёт X, его логарифм log X, вес f(X), скалярное произведение модели и смещения, и итоговый остаток, умноженный на вес. Эта взвешенная квадратичная ошибка, просуммированная по всем парам, и есть вся потеря.","tt":"Хәзер модель үзе. GloVe һәр парның скаляр тапкырчыгышы плюс ике авышлык членын аның исәбенең логарифмына якын төшүен сорый: w_i·w̃_j + b_i + b̃_j ≈ log X_ij. Корпустан чын пар алыйк һәм һәр членны мәгълүматтан укыйк — исәп X, аның логарифмы log X, авырлык f(X), модельнең скаляр тапкырчыгышы һәм авышлыклар, һәм нәтиҗәдәге калдыкны авырлыкка тапкырлап. Бу авырлыклы квадрат хата, барлык парлар буенча кушылган, бөтен югалту була."},"s3":{"en":"Fitting that objective is exactly factorising X: rows of W and W̃ are pushed until their dot-products reproduce log X across the whole table. The learned vectors are summed (W+W̃) and projected to two dimensions — and meaning falls out as geometry. Royal words, people words, and animal words separate into their own regions, the same kind of map the predictive route produces. The loss collapses from its starting value to nearly zero.","ru":"Подгонка этой цели — это в точности факторизация X: строки W и W̃ двигаются, пока их скалярные произведения не воспроизведут log X по всей таблице. Обученные векторы суммируются (W+W̃) и проецируются в два измерения — и смысл выпадает как геометрия. Королевские слова, слова о людях и слова о животных расходятся по своим областям — такая же карта, какую даёт предсказательный путь. Потеря падает от стартового значения почти до нуля.","tt":"Бу максатны туры китерү — нәкъ X'ны факторлау: W һәм W̃ юллары аларның скаляр тапкырчыгышлары бөтен таблица буенча log X'ны кабатлаганчы этелә. Өйрәнелгән векторлар кушыла (W+W̃) һәм ике үлчәмгә проекцияләнә — һәм мәгънә геометрия булып чыга. Патша сүзләре, кеше сүзләре һәм хайван сүзләре үз өлкәләренә аерыла — фаразлаучы юл биргән кебек үк карта. Югалту башлангыч кыйммәттән диярлек нульгә кадәр төшә."},"s4":{"en":"So the two routes meet. GloVe is count-based — it factorises a matrix of log co-occurrence counts explicitly. word2vec is predictive — it slides a window and predicts context words. Levy and Goldberg showed these are two faces of one coin: skip-gram with negative sampling is implicitly factorising a shifted pointwise-mutual-information matrix built from the very same counts. Different algorithms, the same underlying co-occurrence geometry.","ru":"Итак, два пути сходятся. GloVe — счётный: он явно факторизует матрицу логарифмов совстречаемости. word2vec — предсказательный: он скользит окном и предсказывает слова-контексты. Леви и Голдберг показали, что это две стороны одной монеты: skip-gram с отрицательным сэмплированием неявно факторизует матрицу сдвинутого PMI, построенную из тех же счётов. Разные алгоритмы — одна и та же геометрия совстречаемости в основе.","tt":"Шулай итеп, ике юл кушыла. GloVe — санаулы: ул бергә очрашу логарифмнары матрицасын ачыктан факторлый. word2vec — фаразлаучы: ул тәрәзә шуыштыра һәм контекст сүзләрен фаразлый. Леви һәм Голдберг моны бер тәңкәнең ике ягы икәнен күрсәтте: тискәре сэмплинглы skip-gram нәкъ шул ук исәпләрдән төзелгән күчерелгән PMI матрицасын яшерен факторлый. Төрле алгоритмнар — нигездә бер үк бергә очрашу геометриясе."}},"title":{"en":"GloVe: factorise the co-occurrence matrix","ru":"GloVe: факторизация матрицы совстречаемости","tt":"GloVe: бергә очрашу матрицасын факторлау"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
