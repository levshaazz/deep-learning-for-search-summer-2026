okens":["frame t=0","frame t=1","frame t=2","frame t=3"],"points":[[-2.588,-2.701],[-3.076,-2.257],[-3.435,-3.357],[-2.803,-2.935]]},{"id":"protein","thing":"a protein","token":"amino-acid residue","tokens":["M","K","T","G"],"points":[[2.24,-2.807],[2.966,-2.997],[2.454,-2.382],[3.649,-2.517]]}],"note":"every modality follows the SAME recipe: cut into tokens, embed each token, place in one shared vector space. Text=word, image=patch, audio=spectrogram frame, protein=residue."},"dataSets":{"l5-domains":{"method":"illustrative shared-space layout (toy 2-D coords; one space, four modalities)","recipe":["thing","tokens","vectors","shared space"],"domains":[{"id":"text","thing":"a sentence","token":"word","tokens":["king","queen","cat","river"],"points":[[-3.183,3.08],[-2.588,2.145],[-3.349,2.136],[-2.915,2.372]]},{"id":"image","thing":"an image","token":"patch (ViT 16×16)","tokens":["patch[0,0]","patch[0,1]","patch[3,5]","patch[7,7]"],"points":[[3.373,1.676],[3.783,2.552],[3.34,2.532],[2.81,2.832]]},{"id":"audio","thing":"a waveform","token":"spectrogram frame","tokens":["frame t=0","frame t=1","frame t=2","frame t=3"],"points":[[-2.588,-2.701],[-3.076,-2.257],[-3.435,-3.357],[-2.803,-2.935]]},{"id":"protein","thing":"a protein","token":"amino-acid residue","tokens":["M","K","T","G"],"points":[[2.24,-2.807],[2.966,-2.997],[2.454,-2.382],[3.649,-2.517]]}],"note":"every modality follows the SAME recipe: cut into tokens, embed each token, place in one shared vector space. Text=word, image=patch, audio=spectrogram frame, protein=residue."}},"i18n":{"_doc":"Step captions + small in-SVG labels for embedding-domains. EN canonical + RU + TT (all written). Every domain name, 'thing' description, token label and point coordinate comes from data/l5-domains.json (text/image/audio/protein; word/patch/frame/residue; the toy 2-D coords), never from these strings — i18n carries only human prose + structural labels. Protected terms: ViT, CLIP. The coordinates are illustrative toy positions; no facts-gate number is printed.","alt":{"en":"The same recipe across four modalities: a sentence, an image, a waveform and a protein are each cut into tokens (word, ViT patch, spectrogram frame, amino-acid residue), each token is embedded, and all four land as colour-coded clusters in one shared 2-D space — the basis for cross-modal search like CLIP.","ru":"Один рецепт для четырёх модальностей: предложение, изображение, звуковая волна и белок режутся на токены (слово, патч ViT, кадр спектрограммы, аминокислотный остаток), каждый токен кодируется в вектор, и все четыре оказываются цветными кластерами в одном общем 2-D пространстве — основа кроссмодального поиска вроде CLIP.","tt":"Дүрт модальлек өчен бер рецепт: җөмлә, рәсем, тавыш дулкыны һәм аксым токеннарга киселә (сүз, ViT патч, спектрограмма кадры, аминокислота калдыгы), һәр токен эмбеддинглана, һәм дүртесе дә бер уртак 2-D киңлектә төсле кластерлар булып төшә — CLIP кебек кросс-модаль эзләүнең нигезе."},"planeTitle":{"en":"one shared embedding space","ru":"одно общее пространство эмбеддингов","tt":"бер уртак эмбеддинг киңлеге"},"recipeR0":{"en":"thing","ru":"объект","tt":"әйбер"},"recipeR1":{"en":"tokens","ru":"токены","tt":"токеннар"},"recipeR2":{"en":"vectors","ru":"векторы","tt":"векторлар"},"recipeR3":{"en":"shared space","ru":"общее пространство","tt":"уртак киңлек"},"tokensTag":{"en":"→ tokens","ru":"→ токены","tt":"→ токеннар"},"embedTag":{"en":"→ embed","ru":"→ эмбеддинг","tt":"→ эмбеддинг"},"dmText":{"en":"text","ru":"текст","tt":"текст"},"dmImage":{"en":"image","ru":"изображение","tt":"рәсем"},"dmAudio":{"en":"audio","ru":"аудио","tt":"аудио"},"dmProtein":{"en":"protein","ru":"белок","tt":"аксым"},"s0":{"en":"Start with four inputs that could not look more different: a sentence of text, an image, a sound waveform, and a protein. Nothing about them obviously belongs in the same picture — yet every one of them is about to be handled by the exact same recipe.","ru":"Начнём с четырёх входов, которые невозможно представить более разными: предложение текста, изображение, звуковая волна и белок. Между ними нет ничего очевидно общего — и всё же с каждым сейчас поступят по абсолютно одному и тому же рецепту.","tt":"Бер-берсеннән болай да аерылып торган дүрт керемнән башлыйк: текст җөмләсе, рәсем, тавыш дулкыны һәм аксым. Аларда уртак бернәрсә дә ачык күренми — әмма һәрберсе белән хәзер нәкъ бер үк рецепт буенча эшләячәкләр."},"s1":{"en":"Step one is always the same: cut the thing into tokens. Text splits into words, an image into ViT patches, audio into spectrogram frames, a protein into amino-acid residues. Wildly different objects, but each is now just a sequence of small pieces.","ru":"Первый шаг всегда один: разрезать объект на токены. Текст делится на слова, изображение — на патчи ViT, аудио — на кадры спектрограммы, белок — на аминокислотные остатки. Совершенно разные объекты, но каждый теперь просто последовательность мелких кусочков.","tt":"Беренче адым һәрвакыт бер үк: әйберне токеннарга кисү. Текст сүзләргә бүленә, рәсем — ViT патчларга, аудио — спектрограмма кадрларына, аксым — аминокислота калдыкларына. Бик аерылган әйберләр, әмма һәрберсе хәзер бары вак кисәкләр эзлеклелеге."},"s2":{"en":"Step two: embed every token into a vector, and the same model places it as a point in ONE shared space. The four modalities settle into four corners here, but they live on the same axes, measured by the same ruler — text dots and image dots are now directly comparable.","ru":"Второй шаг: закодировать каждый токен в вектор, и одна и та же модель ставит его точкой в ОДНО общее пространство. Четыре модальности занимают здесь четыре угла, но живут на одних осях и меряются одной линейкой — точки текста и точки изображения теперь напрямую сравнимы.","tt":"Икенче адым: һәр токенны векторга эмбеддинглау, һәм шул ук модель аны БЕР уртак киңлектә нокта итеп куя. Дүрт модальлек монда дүрт почмакка урнаша, әмма бер үк күчәрләрдә яши, бер үк линейка белән үлчәнә — текст нокталары белән рәсем нокталары хәзер турыдан-туры чагыштырыла ала."},"s3":{"en":"Add the axes and a legend, and the point is made: text, image, audio and protein all live in one geometry. That is exactly why image↔text search works — a caption and the picture it describes can land near each other, the foundation of CLIP-style cross-modal retrieval.","ru":"Добавим оси и легенду — и вывод готов: текст, изображение, аудио и белок живут в одной геометрии. Именно поэтому работает поиск изображение↔текст — подпись и картинка, которую она описывает, могут оказаться рядом, основа кроссмодального поиска вроде CLIP.","tt":"Күчәрләрне һәм легенданы өстик — нәтиҗә әзер: текст, рәсем, аудио һәм аксым бер үк геометриядә яши. Нәкъ шуңа күрә рәсем↔текст эзләве эшли — язма һәм ул сурәтләгән рәсем бер-берсе янына төшә ала, CLIP кебек кросс-модаль эзләүнең нигезе."}},"title":{"en":"One recipe, every field: thing → tokens → vectors → one shared space","ru":"Один рецепт для всех областей: объект → токены → векторы → одно общее пространство","tt":"Бер рецепт, барлык өлкә: әйбер → токеннар → векторлар → бер уртак киңлек"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
