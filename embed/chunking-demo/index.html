 nChunks=ceil((L−o)/(size−o)); recallAt3 = 1 iff a window contains answerSpan.","docLen":1000,"answerSpan":[380,470],"scenarios":[{"size":200,"overlap":0,"nChunks":5,"windows":[[0,200],[200,400],[400,600],[600,800],[800,1000]],"answerChunk":null,"recallAt3":0},{"size":200,"overlap":50,"nChunks":7,"windows":[[0,200],[150,350],[300,500],[450,650],[600,800],[750,950],[900,1000]],"answerChunk":2,"recallAt3":1}],"formula":"ceil((L-o)/(size-o))","sweep":[{"size":200,"overlap":0,"nChunks":5,"windows":[[0,200],[200,400],[400,600],[600,800],[800,1000]],"answerChunk":null,"recallAt3":0},{"size":200,"overlap":50,"nChunks":7,"windows":[[0,200],[150,350],[300,500],[450,650],[600,800],[750,950],[900,1000]],"answerChunk":2,"recallAt3":1},{"size":200,"overlap":100,"nChunks":9,"windows":[[0,200],[100,300],[200,400],[300,500],[400,600],[500,700],[600,800],[700,900],[800,1000]],"answerChunk":3,"recallAt3":1},{"size":200,"overlap":150,"nChunks":17,"windows":[[0,200],[50,250],[100,300],[150,350],[200,400],[250,450],[300,500],[350,550],[400,600],[450,650],[500,700],[550,750],[600,800],[650,850],[700,900],[750,950],[800,1000]],"answerChunk":6,"recallAt3":1}],"sweepDoc":"4-config sweep at FIXED size=200, INCREASING overlap = 0 / 50 / 100 / 150, over the same [380,470] gold span (computed, not authored). recall@3 climbs 0 → 1 → 1 → 1, monotone: overlap=0 → step 200, windows [200,400] & [400,600] STRADDLE boundary 400 → no chunk holds [380,470] whole → recall 0; overlap=50 → step 150, window [300,500] holds it → recall 1; overlap=100 (step 100) and overlap=150 (step 50) keep that [300,500]-style window → recall 1. Lesson (same as climb-chunking-worked): OVERLAP rescues the boundary straddle — more overlap never hurts containment (it costs storage / more chunks: 5 → 7 → 9 → 17)."},"dataSets":{"l10-chunking":{"_doc":"Chunking, exact (stdlib). A 1000-token doc with the answer span at [380,470] (binary answer-containment: recall@3 ∈ {0,1} = does ANY window fully contain the span?). size=200/overlap=0 → ceil(1000/200)=5 chunks; the answer STRADDLES boundary 400 (20 tok in chunk 2, 70 in chunk 3) → no chunk holds it whole → recall@3 = 0. overlap=50 → ceil(950/150)=7 chunks; window [300,500] holds [380,470] whole → recall@3 = 1.0. Overlap costs storage, buys recall. Frontier (essay): Late Chunking (arXiv:2409.04701) fixes the context-loss this exposes.","_source":"_research/gen_l10.py (toy, stdlib): nChunks=ceil((L−o)/(size−o)); recallAt3 = 1 iff a window contains answerSpan.","docLen":1000,"answerSpan":[380,470],"scenarios":[{"size":200,"overlap":0,"nChunks":5,"windows":[[0,200],[200,400],[400,600],[600,800],[800,1000]],"answerChunk":null,"recallAt3":0},{"size":200,"overlap":50,"nChunks":7,"windows":[[0,200],[150,350],[300,500],[450,650],[600,800],[750,950],[900,1000]],"answerChunk":2,"recallAt3":1}],"formula":"ceil((L-o)/(size-o))","sweep":[{"size":200,"overlap":0,"nChunks":5,"windows":[[0,200],[200,400],[400,600],[600,800],[800,1000]],"answerChunk":null,"recallAt3":0},{"size":200,"overlap":50,"nChunks":7,"windows":[[0,200],[150,350],[300,500],[450,650],[600,800],[750,950],[900,1000]],"answerChunk":2,"recallAt3":1},{"size":200,"overlap":100,"nChunks":9,"windows":[[0,200],[100,300],[200,400],[300,500],[400,600],[500,700],[600,800],[700,900],[800,1000]],"answerChunk":3,"recallAt3":1},{"size":200,"overlap":150,"nChunks":17,"windows":[[0,200],[50,250],[100,300],[150,350],[200,400],[250,450],[300,500],[350,550],[400,600],[450,650],[500,700],[550,750],[600,800],[650,850],[700,900],[750,950],[800,1000]],"answerChunk":6,"recallAt3":1}],"sweepDoc":"4-config sweep at FIXED size=200, INCREASING overlap = 0 / 50 / 100 / 150, over the same [380,470] gold span (computed, not authored). recall@3 climbs 0 → 1 → 1 → 1, monotone: overlap=0 → step 200, windows [200,400] & [400,600] STRADDLE boundary 400 → no chunk holds [380,470] whole → recall 0; overlap=50 → step 150, window [300,500] holds it → recall 1; overlap=100 (step 100) and overlap=150 (step 50) keep that [300,500]-style window → recall 1. Lesson (same as climb-chunking-worked): OVERLAP rescues the boundary straddle — more overlap never hurts containment (it costs storage / more chunks: 5 → 7 → 9 → 17)."}},"i18n":{"_doc":"Step captions + small labels for chunking-demo. EN canonical + RU + TT. Every NUMBER (5/7 chunks, recall@3 0/1.0, the span [380,470]) comes from data/l10-chunking.json, never from these strings.","alt":{"en":"A 1000-token document ruler with the answer span [380,470]; size=200/overlap=0 gives 5 windows that straddle the answer (recall 0), overlap=50 gives 7 windows where one holds the whole answer (recall 1.0).","ru":"Линейка документа на 1000 токенов с ответом [380,470]; size=200/overlap=0 даёт 5 окон, рассекающих ответ (recall 0), а overlap=50 — 7 окон, одно из которых держит весь ответ (recall 1,0).","tt":"1000 токенлы документ линейкасы, җавап [380,470] белән; size=200/overlap=0 җавапны кисүче 5 тәрәзә бирә (recall 0), ә overlap=50 — 7 тәрәзә, берсе бөтен җавапны тота (recall 1.0)."},"docLabel":{"en":"document","ru":"документ","tt":"документ"},"tokens":{"en":"tokens","ru":"токенов","tt":"токен"},"answer":{"en":"answer","ru":"ответ","tt":"җавап"},"chunks":{"en":"chunks","ru":"чанков","tt":"чанк"},"sweepLabel":{"en":"fixed size=200, sweeping overlap","ru":"фиксированный size=200, перебираем overlap","tt":"ныгытылган size=200, overlap үтәбез"},"altSweep":{"en":"Overlap sweep at fixed size=200: overlap 0 → 5 chunks straddle the [380,470] answer (recall 0); overlap 50 / 100 / 150 each gives a window that holds the answer whole (recall 1.0) at the cost of 7 / 9 / 17 chunks.","ru":"Перебор overlap при size=200: overlap 0 → 5 чанков рассекают ответ [380,470] (recall 0); overlap 50 / 100 / 150 дают окно, держащее ответ целиком (recall 1,0), ценой 7 / 9 / 17 чанков.","tt":"size=200 да overlap үтү: overlap 0 → 5 чанк [380,470] җавапны кисә (recall 0); overlap 50 / 100 / 150 җавапны бөтенләй тоткан тәрәзә бирә (recall 1.0), 7 / 9 / 17 чанк бәясенә."},"intact":{"en":"answer intact?","ru":"ответ цел?","tt":"җавап бөтенме?"},"formulaLbl":{"en":"chunks","ru":"чанков","tt":"чанк"},"s0":{"en":"A 1000-token document, and the answer to our question lives in tokens [380, 470] — a 90-token span. Retrieval works on chunks, not whole documents, so the question becomes: will any chunk contain this answer whole?","ru":"Документ на 1000 токенов, и ответ на наш вопрос лежит в токенах [380, 470] — отрезок в 90 токенов. Поиск работает по чанкам, а не по целым документам, поэтому вопрос такой: попадёт ли весь ответ целиком хоть в один чанк?","tt":"1000 токенлы документ, һәм безнең сорауга җавап [380, 470] токеннарда — 90 токенлы кисәк. Эзләү бөтен документлар буенча түгел, ә чанклар буенча эшли, шуңа сорау: җавап бөтенләй бер чанкка эләгерме?"},"s1":{"en":"size=200, overlap=0 cuts the document into 5 back-to-back windows. The answer span crosses the boundary at token 400: 20 tokens fall in chunk [200,400], 70 in chunk [400,600]. No single chunk holds it whole — so retrieving any one chunk gives a fragment. Binary answer-containment: recall@3 = 0.","ru":"size=200, overlap=0 режет документ на 5 окон встык. Ответ пересекает границу на токене 400: 20 токенов попадают в чанк [200,400], 70 — в [400,600]. Ни один чанк не держит его целиком — значит, любой отдельный чанк даёт лишь фрагмент. Бинарное содержание: recall@3 = 0.","tt":"size=200, overlap=0 документны 5 тоташ тәрәзәгә кисә. Җавап 400 токенда чикне кисә: 20 токен [200,400] чанкына, 70 — [400,600] га эләгә. Бер чанк та аны бөтенләй тотмый — димәк теләсә кайсы аерым чанк бары кисәк бирә. Бинар эченә алу: recall@3 = 0."},"s2":{"en":"Add overlap=50 and the windows step by 150 instead of 200, giving 7 windows. Now the window [300,500] contains the whole answer span [380,470]. Retrieve that chunk and the answer arrives intact: recall@3 = 1.0.","ru":"Добавь overlap=50 — окна сдвигаются на 150 вместо 200, получается 7 окон. Теперь окно [300,500] содержит весь ответ [380,470]. Извлеки этот чанк — и ответ приходит целиком: recall@3 = 1,0.","tt":"overlap=50 өстә — тәрәзәләр 200 урынына 150 гә күчә, 7 тәрәзә килеп чыга. Хәзер [300,500] тәрәзәсе бөтен җавапны [380,470] эченә ала. Шул чанкны тап — һәм җавап бөтен килә: recall@3 = 1.0."},"s3":{"en":"The count is ⌈(L − overlap) / (size − overlap)⌉: 5 chunks at overlap 0, 7 at overlap 50. Overlap costs storage (more, fatter chunks) and buys recall (no answer falls between the cracks). That tension is exactly what the frontier — Late Chunking — attacks.","ru":"Количество — ⌈(L − overlap) / (size − overlap)⌉: 5 чанков при overlap 0, 7 при overlap 50. Перекрытие стоит памяти (больше, толще чанки) и покупает полноту (ни один ответ не проваливается в щель). Именно это напряжение атакует передний край — Late Chunking.","tt":"Сан — ⌈(L − overlap) / (size − overlap)⌉: overlap 0 да 5 чанк, overlap 50 дә 7. Кисешү хәтер сорый (күбрәк, калынрак чанклар) һәм recall сатып ала (бер җавап та ярыкка төшми). Нәкъ шушы киеренкелеккә алгы чик — Late Chunking — һөҗүм итә."},"_swdoc":"Sweep-variant captions (ctx.variant==='sweep'): a slide/book mounting the sweep maps these onto s0..s3. Every NUMBER (overlap 0/50/100/150, chunks 5/7/9/17, recall 0/1.0) comes from data.sweep in l10-chunking.json.","sweep0":{"en":"Fixed size=200, overlap=0 — the baseline. The document cuts into 5 back-to-back windows and the answer [380,470] straddles boundary 400: no single chunk holds it whole. Binary answer-containment: recall@3 = 0.","ru":"Фиксированный size=200, overlap=0 — базис. Документ режется на 5 окон встык, и ответ [380,470] рассекается границей 400: ни один чанк не держит его целиком. Бинарное содержание: recall@3 = 0.","tt":"Ныгытылган size=200, overlap=0 — нигез. Документ 5 тоташ тәрәзәгә киселә, җавап [380,470] 400 чигендә киселә: бер чанк та аны бөтенләй тотмый. Бинар эченә алу: recall@3 = 0."},"sweep1":{"en":"overlap=50 → 7 chunks (step 150). Now a window [300,500] holds the whole answer [380,470]: recall@3 jumps to 1.0. Two extra chunks bought the boundary rescue.","ru":"overlap=50 → 7 чанков (шаг 150). Теперь окно [300,500] держит весь ответ [380,470]: recall@3 подскакивает до 1,0. Два лишних чанка купили спасение границы.","tt":"overlap=50 → 7 чанк (адым 150). Хәзер [300,500] тәрәзәсе бөтен җавапны [380,470] тота: recall@3 1.0 гә сикерә. Ике өстәмә чанк чик коткаруын сатып алды."},"sweep2":{"en":"overlap=100 → 9 chunks (step 100). The answer still lands whole inside a window, so recall@3 stays 1.0 — but it now costs 9 chunks. More overlap never hurts containment; it only adds storage.","ru":"overlap=100 → 9 чанков (шаг 100). Ответ по-прежнему целиком в окне, recall@3 остаётся 1,0 — но это уже 9 чанков. Большее перекрытие не вредит содержанию; оно лишь добавляет память.","tt":"overlap=100 → 9 чанк (адым 100). Җавап һаман бөтен тәрәзәдә, recall@3 1.0 кала — әмма инде 9 чанк. Күбрәк кисешү эченә алуга зарар китерми; ул бары хәтер өсти."},"sweep3":{"en":"overlap=150 → 17 chunks (step 50). recall@3 is still 1.0, but the index has ballooned to 17 chunks. The sweep is monotone in recall (0 → 1 → 1 → 1) and monotone in cost (5 → 7 → 9 → 17): overlap rescues the straddle, then only buys storage.","ru":"overlap=150 → 17 чанков (шаг 50). recall@3 всё ещё 1,0, но индекс раздулся до 17 чанков. Перебор монотонен по полноте (0 → 1 → 1 → 1) и по цене (5 → 7 → 9 → 17): overlap спасает straddle, дальше лишь покупает память.","tt":"overlap=150 → 17 чанк (адым 50). recall@3 һаман 1.0, әмма индекс 17 чанкка кадәр шартлады. Үтү recall буенча (0 → 1 → 1 → 1) һәм бәя буенча (5 → 7 → 9 → 17) монотон: overlap кисешүне коткара, аннары бары хәтер сатып ала."}},"title":{"en":"Chunking: size, overlap & answer-containment","ru":"Чанкование: размер, перекрытие и содержание ответа","tt":"Чанклау: зурлык, кисешү һәм җавапны эченә алу"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page
