дежей и двух чисел, её различные формы становятся десятью отдельными постинг-листами, у каждого df равен единице. Запрос в одном косвенном падеже достаёт ровно один лист из десяти. Включаешь лемматизацию — десять листов сходятся в один с df, равным десяти, и тот же запрос достаёт уже все документы. Сегмент-контрол меняет существительное на глагол (шестнадцать форм) или прилагательное (восемнадцать).","tt":"Инвертацияләнгән индекс янында бер рус лексемасы. Лемма алты килеш һәм ике сандагы парадигмага җәелә, аның төрле формалары ун аерым кергәннәр исемлегенә әйләнә, һәрберсендә df бергә тигез. Бер кыек килештәге сорау ун исемлектән нәкъ берсен генә таба. Леммалаштыруны кабызасың — ун исемлек df ун булган берсенә җыела, һәм шул ук сорау инде барлык документларны таба. Сегмент-контроль исемне фигыльгә (уналты форма) яки сыйфатка (унсигез) алыштыра."},"s0":{"en":"One lexeme, one dictionary entry, and an empty index. In English this word would be one or two index terms. Watch what Russian does to it.","ru":"Одна лексема, одна словарная статья и пустой индекс. По-английски это слово стало бы одним-двумя термами индекса. Смотри, что с ним делает русский.","tt":"Бер лексема, бер сүзлек мәкаләсе һәм буш индекс. Инглизчә бу сүз бер-ике индекс термы булыр иде. Кара, рус теле аның белән нәрсә эшли."},"s1":{"en":"For a noun: six cases times two numbers. Two cells repeat — nominative and accusative coincide in both numbers — so twelve slots yield ten different strings. Ten, from one dictionary entry. Switch the part of speech and it only gets worse.","ru":"Для существительного: шесть падежей на два числа. Две клетки повторяются — именительный и винительный совпадают в обоих числах, — поэтому из двенадцати слотов выходит десять разных строк. Десять, из одной словарной статьи. Переключи часть речи — станет только хуже.","tt":"Исем өчен: алты килеш ике санга. Ике күзәнәк кабатлана — баш һәм төшем килешләре ике санда да туры килә, — шуңа унике оядан ун төрле юл чыга. Ун, бер сүзлек мәкаләсеннән. Сүз төркемен алыштыр — тагын да начаррак булачак."},"s2":{"en":"The index does not know they are relatives. Each string becomes its own postings list, and each list holds exactly one document. Count the terms one lexeme costs — and every one of them carries a fraction of the frequency it should.","ru":"Индекс не знает, что они родственники. Каждая строка становится своим постинг-листом, и в каждом листе ровно один документ. Посчитай, во сколько термов обходится одна лексема, — и у каждого частота во столько же раз меньше настоящей.","tt":"Индекс аларның туганнар икәнен белми. Һәр юл үзенең кергәннәр исемлеге була, һәм һәр исемлектә нәкъ бер документ. Бер лексема ничә термга төшкәнен сана — һәм һәрберсенең ешлыгы шул ук тапкырга ким."},"s3":{"en":"A user types the word in one oblique form. It matches exactly one list — and every other document, about exactly the same thing, stays invisible.","ru":"Пользователь набирает слово в одной косвенной форме. Совпадает ровно один лист — и все остальные документы, ровно про то же самое, остаются невидимыми.","tt":"Кулланучы сүзне бер кыек формада яза. Нәкъ бер исемлек туры килә — ә калган барлык документлар, нәкъ шул ук нәрсә турында, күренмичә кала."},"s4":{"en":"Lemmatisation on. Every form is looked up in a dictionary and written into the index under one and the same lemma — the ten lists converge onto a single one.","ru":"Лемматизация включена. Каждая форма ищется в словаре и пишется в индекс под одной и той же леммой — десять листов сходятся в один.","tt":"Леммалаштыру кабызылды. Һәр форма сүзлектән эзләнә һәм индекска бер үк лемма астында языла — ун исемлек берсенә җыела."},"s5":{"en":"The same query, normalised the same way, now reaches every document. One term per lexeme instead of a whole handful — that is the whole trick, and the segment control shows a verb and an adjective are worse still.","ru":"Тот же запрос, нормализованный так же, теперь достаёт все документы. Один терм на лексему вместо целой горсти — в этом весь фокус, а переключатель показывает, что у глагола и прилагательного дела ещё хуже.","tt":"Шул ук сорау, шулай ук нормальләштерелгән, инде барлык документларны таба. Лексемага бер уч урынына бер терм — бөтен хикмәт шунда, ә күчергеч фигыль белән сыйфатта хәлләр тагын да начаррак икәнен күрсәтә."},"posHint":{"en":"part of speech:","ru":"часть речи:","tt":"сүз төркеме:"},"posNoun":{"en":"noun","ru":"существительное","tt":"исем"},"posVerb":{"en":"verb","ru":"глагол","tt":"фигыль"},"posAdj":{"en":"adjective","ru":"прилагательное","tt":"сыйфат"},"lemmaTag":{"en":"lemma","ru":"лемма","tt":"лемма"},"slotsTmpl":{"en":"{slots} slots · {distinct} distinct forms","ru":"слотов {slots} · различных форм {distinct}","tt":"оя {slots} · төрле форма {distinct}"},"formsTmpl":{"en":"{n} forms · {distinct} distinct","ru":"форм {n} · различных {distinct}","tt":"форма {n} · төрлесе {distinct}"},"caseTag":{"en":"case","ru":"падеж","tt":"килеш"},"numSg":{"en":"sg.","ru":"ед.","tt":"берл."},"numPl":{"en":"pl.","ru":"мн.","tt":"күпл."},"dupTag":{"en":"repeat","ru":"повтор","tt":"кабатлау"},"indexTag":{"en":"the inverted index","ru":"инвертированный индекс","tt":"инвертацияләнгән индекс"},"emptyIndex":{"en":"the index is empty","ru":"индекс пуст","tt":"индекс буш"},"termsTmpl":{"en":"terms per lexeme: {n}","ru":"термов на лексему: {n}","tt":"лексемага термнар: {n}"},"queryTag":{"en":"query","ru":"запрос","tt":"сорау"},"recallTmpl":{"en":"recall {hit} / {all}","ru":"полнота {hit} / {all}","tt":"тулылык {hit} / {all}"}},"title":{"en":"Declension bench: one word, ten terms","ru":"Склонятор: одно слово, десять термов","tt":"Килешләү станогы: бер сүз, ун терм"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"},{"step":5,"labelKey":"s5"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
