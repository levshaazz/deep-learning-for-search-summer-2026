</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>Self-correcting RAG: CRAG + self-RAG decision graph</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="4" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>4</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"rag-control-flow","mountName":"mountRagControlFlow","maxStep":4,"data":{"_doc":"Self-correcting RAG (descriptive + toy thresholds). CRAG (Yan et al. 2024) runs a lightweight retrieval evaluator that grades each retrieval Correct / Ambiguous / Wrong (toy score thresholds below) and acts: keep, augment with web search, or discard+rewrite. Self-RAG (Asai et al. ICLR 2024) trains the LM to emit REFLECTION TOKENS — Retrieve, IsRel, IsSup, IsUse — that gate whether to retrieve, and to critique relevance / support / usefulness. Thresholds are illustrative, not measured.","_source":"_research/gen_l10.py (static, descriptive): toy thresholds; cites CRAG arXiv:2401.15884, Self-RAG arXiv:2310.11511.","crag":{"grades":["correct","ambiguous","wrong"],"thresholds":{"correct":">= 0.7","ambiguous":"0.3 .. 0.7","wrong":"< 0.3"},"actions":{"correct":"use retrieved context as-is","ambiguous":"combine retrieved + corrective web search","wrong":"discard, fall back to web search / query rewrite"},"source":"Yan, Gu, Zhu & Ling, 'Corrective Retrieval Augmented Generation', arXiv:2401.15884 (2024)"},"selfRag":{"reflectionTokens":["Retrieve","IsRel","IsSup","IsUse"],"gates":{"Retrieve":"decide whether retrieval is needed for this segment","IsRel":"is the retrieved passage relevant?","IsSup":"is the generated claim supported by the passage?","IsUse":"is the overall response useful (1..5)?"},"source":"Asai, Wu, Wang, Sil & Hajishirzi, 'Self-RAG: Learning to Retrieve, Generate, and Critique through Self-Reflection', ICLR 2024 (arXiv:2310.11511)"}},"dataSets":{"l10-selfrag":{"_doc":"Self-correcting RAG (descriptive + toy thresholds). CRAG (Yan et al. 2024) runs a lightweight retrieval evaluator that grades each retrieval Correct / Ambiguous / Wrong (toy score thresholds below) and acts: keep, augment with web search, or discard+rewrite. Self-RAG (Asai et al. ICLR 2024) trains the LM to emit REFLECTION TOKENS — Retrieve, IsRel, IsSup, IsUse — that gate whether to retrieve, and to critique relevance / support / usefulness. Thresholds are illustrative, not measured.","_source":"_research/gen_l10.py (static, descriptive): toy thresholds; cites CRAG arXiv:2401.15884, Self-RAG arXiv:2310.11511.","crag":{"grades":["correct","ambiguous","wrong"],"thresholds":{"correct":">= 0.7","ambiguous":"0.3 .. 0.7","wrong":"< 0.3"},"actions":{"correct":"use retrieved context as-is","ambiguous":"combine retrieved + corrective web search","wrong":"discard, fall back to web search / query rewrite"},"source":"Yan, Gu, Zhu & Ling, 'Corrective Retrieval Augmented Generation', arXiv:2401.15884 (2024)"},"selfRag":{"reflectionTokens":["Retrieve","IsRel","IsSup","IsUse"],"gates":{"Retrieve":"decide whether retrieval is needed for this segment","IsRel":"is the retrieved passage relevant?","IsSup":"is the generated claim supported by the passage?","IsUse":"is the overall response useful (1..5)?"},"source":"Asai, Wu, Wang, Sil & Hajishirzi, 'Self-RAG: Learning to Retrieve, Generate, and Critique through Self-Reflection', ICLR 2024 (arXiv:2310.11511)"}}},"i18n":{"_doc":"Step captions + node/edge labels for rag-control-flow. EN canonical + RU + TT. The grades, toy thresholds, actions and reflection tokens are read from data/l10-selfrag.json; this file only narrates and names. The grade KEYS (correct/ambiguous/wrong) double as the edge-label words that prefix each branch's threshold tag.","alt":{"en":"A directed decision graph: CRAG retrieves, grades each document in a diamond as correct, ambiguous, or wrong, and branches to three actions (use as-is, combine with web search, or discard and fall back to web search); below, self-RAG strings four reflection-token decision diamonds (Retrieve, IsRel, IsSup, IsUse) into a chain ending in a grounded answer.","ru":"Направленный граф решений: CRAG извлекает, оценивает каждый документ в ромбе как correct, ambiguous или wrong и ветвится на три действия (использовать как есть, объединить с веб-поиском или отбросить и перейти к веб-поиску); ниже self-RAG выстраивает четыре ромба рефлексивных токенов (Retrieve, IsRel, IsSup, IsUse) в цепочку, завершающуюся обоснованным ответом.","tt":"Юнәлешле карар графы: CRAG ала, һәр документны ромбта correct, ambiguous яки wrong дип бәяли һәм өч гамәлгә тармаклана (булганча куллану, веб-эзләү белән берләштерү яки ташлап веб-эзләүгә күчү); астарак self-RAG дүрт рефлексия-токен ромбын (Retrieve, IsRel, IsSup, IsUse) нигезле җавап белән тәмамлана торган чылбырга тезә."},"cragTitle":{"en":"CRAG · grade the retrieval, then act","ru":"CRAG · оцени извлечение, затем действуй","tt":"CRAG · алуны бәялә, аннары эшлә"},"selfRagTitle":{"en":"self-RAG · reflection-token gates","ru":"self-RAG · ворота рефлексивных токенов","tt":"self-RAG · рефлексия-токен капкалары"},"retrieve":{"en":"retrieve","ru":"извлечь","tt":"алу"},"grade":{"en":"grade each doc","ru":"оценить каждый док","tt":"һәр докны бәялә"},"correct":{"en":"correct","ru":"correct","tt":"correct"},"ambiguous":{"en":"ambiguous","ru":"ambiguous","tt":"ambiguous"},"wrong":{"en":"wrong","ru":"wrong","tt":"wrong"},"pass":{"en":"pass","ru":"пройдено","tt":"узды"},"answer":{"en":"grounded answer","ru":"обоснованный ответ","tt":"нигезле җавап"},"s0":{"en":"Naive RAG retrieves once and trusts whatever comes back. Self-correcting RAG adds a gate. CRAG first retrieves, then runs a lightweight retrieval evaluator that GRADES each document — a decision diamond with toy score thresholds.","ru":"Наивный RAG извлекает один раз и доверяет всему, что вернулось. Самокорректирующийся RAG добавляет ворота. CRAG сначала извлекает, затем запускает лёгкий оценщик извлечения, который ОЦЕНИВАЕТ каждый документ — ромб решения с игрушечными порогами оценки.","tt":"Беркатлы RAG бер тапкыр ала һәм кайтканның барысына ышана. Үзен төзәтүче RAG капка өсти. CRAG башта ала, аннары һәр документны БӘЯЛИ торган җиңел алу бәяләгечен эшләтә — уенчык балл бусагалары булган карар ромбы."},"s1":{"en":"The grade falls into three buckets by score: correct (≥ 0.7), ambiguous (0.3 .. 0.7), or wrong (< 0.3). Each is a labelled branch out of the diamond — the same retrieval, three possible verdicts.","ru":"Оценка попадает в три корзины по баллу: correct (≥ 0,7), ambiguous (0,3 .. 0,7) или wrong (< 0,3). Каждая — помеченная ветвь из ромба — то же извлечение, три возможных вердикта.","tt":"Бәя балл буенча өч чиләккә төшә: correct (≥ 0.7), ambiguous (0.3 .. 0.7) яки wrong (< 0.3). Һәрберсе — ромбтан билгеле тармак — шул ук алу, өч мөмкин хөкем."},"s2":{"en":"Now act on the verdict. correct → use the retrieved context as-is. ambiguous → combine it with a corrective web search. wrong → discard it and fall back to web search or a query rewrite. The pipeline repairs its own bad retrievals.","ru":"Теперь действуем по вердикту. correct → использовать извлечённый контекст как есть. ambiguous → объединить его с корректирующим веб-поиском. wrong → отбросить и перейти к веб-поиску или переписыванию запроса. Конвейер чинит свои плохие извлечения.","tt":"Хәзер хөкем буенча эшлибез. correct → алынган контекстны булганча куллану. ambiguous → аны төзәтүче веб-эзләү белән берләштерү. wrong → ташлап веб-эзләүгә яки сорауны яңадан язуга күчү. Пайплайн үзенең начар алуларын төзәтә."},"s3":{"en":"Self-RAG goes further: it trains the model to emit reflection tokens as it generates. Retrieve? decides whether retrieval is even needed; IsRel asks if a retrieved passage is relevant; IsSup asks if the claim is supported by it. Each is a gate in the chain.","ru":"Self-RAG идёт дальше: он учит модель выдавать рефлексивные токены по ходу генерации. Retrieve? решает, нужно ли вообще извлечение; IsRel спрашивает, релевантен ли извлечённый отрывок; IsSup — подтверждается ли им утверждение. Каждый — ворота в цепочке.","tt":"Self-RAG алгарак китә: ул моделне генерация барышында рефлексия токеннары чыгарырга өйрәтә. Retrieve? гомумән алу кирәкме дип хәл итә; IsRel алынган өзек релевантмы дип сорый; IsSup — раслау аның белән дәлилләнәме. Һәрберсе — чылбырдагы капка."},"s4":{"en":"The last gate, IsUse, scores how useful the overall response is (1..5). Only a response that clears every reflection gate becomes the grounded answer — the model critiques itself before it commits, instead of trusting one retrieval blindly.","ru":"IsUse оценивает полезность ответа по шкале 1..5. В Self-RAG оценки рефлексивных токенов помогают выбирать продолжение: их можно учитывать как взвешенные мягкие оценки или жёсткие ограничения. Это не обязательная цепочка бинарных проверок и не гарантия истинности ответа.","tt":"Соңгы капка, IsUse, гомуми җавапның никадәр файдалы булуын бәяли (1..5). Бары тик һәр рефлексия капкасын узган җавап кына нигезле җавап була — модель бер алуга сукырларча ышану урынына, беркетү алдыннан үзен тәнкыйтьли."}},"title":{"en":"Self-correcting RAG: CRAG + self-RAG decision graph","ru":"Самокорректирующийся RAG: граф решений CRAG + self-RAG","tt":"Үзен төзәтүче RAG: CRAG + self-RAG карар графы"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
