</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>Query reshaping: decomposition fan-out &amp; step-back ladder</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="4" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>4</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"query-tree","mountName":"mountQueryTree","maxStep":4,"data":{"_doc":"Query decomposition + step-back, exact-binary (stdlib). The multi-part question asks TWO things at once; binary answer-containment shows why one retrieval fails: each sub-answer sits in its OWN chunk (recallSub=[1,1]) but no single chunk contains BOTH facts (recallJoint=0) — so splitting into 2 sub-questions and retrieving each separately recovers both. step-back: abstract a specific question to a generic one, retrieve the underlying PRINCIPLE, then answer the specific (Zheng et al. 2023).","_source":"_research/gen_l10.py (toy, stdlib): binary answer-containment recall; step-back cites arXiv:2310.06117.","question":"Does the heart pump faster during exercise, and what controls that rate?","subQuestions":["Does heart rate increase during exercise?","What controls heart rate?"],"recallSub":[1,1],"recallJoint":0,"recallNote":"each sub-answer is contained in its own chunk (1,1); no single chunk contains both (joint=0) — decomposition recovers both facts.","stepBack":{"specific":"Why did my heart rate hit 180 bpm running up the stairs?","generic":"What physiological mechanism regulates heart rate under exertion?","principleRetrieved":"The sympathetic nervous system raises heart rate during exertion (autonomic regulation of cardiac output).","idea":"abstract the specific query to a generic one → retrieve the underlying principle → answer the specific","source":"Zheng, Mishra, Chen, Cheng, Chi, Le & Zhou, 'Take a Step Back: Evoking Reasoning via Abstraction in Large Language Models', arXiv:2310.06117 (2023)"}},"dataSets":{"l10-decomp":{"_doc":"Query decomposition + step-back, exact-binary (stdlib). The multi-part question asks TWO things at once; binary answer-containment shows why one retrieval fails: each sub-answer sits in its OWN chunk (recallSub=[1,1]) but no single chunk contains BOTH facts (recallJoint=0) — so splitting into 2 sub-questions and retrieving each separately recovers both. step-back: abstract a specific question to a generic one, retrieve the underlying PRINCIPLE, then answer the specific (Zheng et al. 2023).","_source":"_research/gen_l10.py (toy, stdlib): binary answer-containment recall; step-back cites arXiv:2310.06117.","question":"Does the heart pump faster during exercise, and what controls that rate?","subQuestions":["Does heart rate increase during exercise?","What controls heart rate?"],"recallSub":[1,1],"recallJoint":0,"recallNote":"each sub-answer is contained in its own chunk (1,1); no single chunk contains both (joint=0) — decomposition recovers both facts.","stepBack":{"specific":"Why did my heart rate hit 180 bpm running up the stairs?","generic":"What physiological mechanism regulates heart rate under exertion?","principleRetrieved":"The sympathetic nervous system raises heart rate during exertion (autonomic regulation of cardiac output).","idea":"abstract the specific query to a generic one → retrieve the underlying principle → answer the specific","source":"Zheng, Mishra, Chen, Cheng, Chi, Le & Zhou, 'Take a Step Back: Evoking Reasoning via Abstraction in Large Language Models', arXiv:2310.06117 (2023)"}}},"i18n":{"_doc":"Step captions + small labels for query-tree. EN canonical + RU + TT. The QUESTION text, the two sub-questions, recallSub [1,1] / recallJoint 0, and the three step-back rungs (specific/generic/principle) all come from data/l10-decomp.json, never from these strings — these are only the captions and the static tags.","alt":{"en":"A one-question-to-two fan-out (each sub-question retrieves its own chunk, recall 1 each, but one joint retrieval gets recall 0), above a three-rung step-back ladder: specific question abstracted to a generic one to retrieve the underlying principle.","ru":"Веер из одного вопроса в два (каждый подвопрос достаёт свой чанк, полнота 1, но покрытие обоих фактов одним чанком равно 0), над трёхступенчатой лестницей step-back: конкретный вопрос абстрагируется в общий, чтобы достать принцип.","tt":"Бер сораудан икегә җәелү (һәр асссорау үз чанкын ала, recall 1, әмма бер уртак алу recall 0 бирә), өч баскычлы step-back баскычы өстендә: конкрет сорау гомуми сорауга абстракцияләнә, принципны алу өчен."},"fanTitle":{"en":"A · Decomposition fan-out","ru":"A · Декомпозиция (веер)","tt":"A · Декомпозиция (җәелү)"},"stepBackTitle":{"en":"B · Step-back ladder","ru":"B · Лестница step-back","tt":"B · Step-back баскычы"},"subPrefix":{"en":"sub","ru":"под","tt":"асс"},"chunk":{"en":"chunk","ru":"чанк","tt":"чанк"},"recallSub":{"en":"recall per sub","ru":"полнота по подвопросам","tt":"ассораулар буенча recall"},"recallJoint":{"en":"recall on one joint retrieval","ru":"оба факта в одном чанке","tt":"бер уртак алуда recall"},"specific":{"en":"specific","ru":"конкретный","tt":"конкрет"},"generic":{"en":"generic","ru":"общий","tt":"гомуми"},"principle":{"en":"principle","ru":"принцип","tt":"принцип"},"s0":{"en":"Some questions ask two things at once. This one wants BOTH whether heart rate rises during exercise AND what controls it. Retrieval works on chunks, and these two facts may live in different chunks — so the multi-part query is a trap.","ru":"Некоторые вопросы спрашивают сразу о двух вещах. Здесь нужны ОБА ответа: растёт ли пульс при нагрузке И что им управляет. Поиск работает по чанкам, а эти два факта могут лежать в разных чанках — так что составной вопрос — ловушка.","tt":"Кайбер сораулар берьюлы ике нәрсә сорый. Бу икесен дә тели: йөрәк тибеше йөкләмәдә артамы ҺӘМ аны нәрсә идарә итә. Эзләү чанклар буенча эшли, ә бу ике факт төрле чанкларда булырга мөмкин — димәк кушма сорау — тозак."},"s1":{"en":"Decompose it. The one question fans out into two single-purpose sub-questions: 'Does heart rate increase during exercise?' and 'What controls heart rate?' Each is now a clean, atomic retrieval target.","ru":"Разложи его. Один вопрос распадается на два узких подвопроса: «Растёт ли пульс при нагрузке?» и «Что управляет пульсом?» Каждый теперь — чистая атомарная цель поиска.","tt":"Аны таркат. Бер сорау ике тар ассорауга җәелә: «Йөрәк тибеше йөкләмәдә артамы?» һәм «Йөрәк тибешен нәрсә идарә итә?» Һәркайсы хәзер чиста атомар эзләү максаты."},"s2":{"en":"Retrieve each sub-question separately. Sub-answer 1 lives in its own chunk, sub-answer 2 in another: recall per sub = [1, 1] — both found. But a SINGLE retrieval over the joint question hits no chunk that contains both: recall on one joint retrieval = 0. Decomposition recovers what one pass drops.","ru":"Выполни поиск по каждому подвопросу отдельно. Подответ 1 — в своём чанке, подответ 2 — в другом: полнота по подвопросам = [1, 1] — найдены оба. Но в этом условном примере НИ ОДИН чанк не содержит оба факта: показатель «оба факта в одном чанке» = 0. Это не полнота обычной выдачи из нескольких чанков. Декомпозиция позволяет явно искать каждую часть ответа.","tt":"Һәр ассорауны аерым ал. Ассжавап 1 үз чанкында, ассжавап 2 — башкасында: ассораулар буенча recall = [1, 1] — икесе дә табылды. Әмма кушма сорау буенча БЕР алу икесен дә тоткан чанкка эләкми: бер уртак алуда recall = 0. Декомпозиция бер үтүдә югалганны кайтара."},"s3":{"en":"A different reshape: step-back. Start from a too-specific question — 'Why did my heart rate hit 180 bpm running up the stairs?' Taken literally, that exact event may not be in any chunk.","ru":"Другая перекройка: step-back. Начни со слишком конкретного вопроса — «Почему мой пульс достиг 180 уд/мин, когда я бежал по лестнице?» Буквально такого события может не быть ни в одном чанке.","tt":"Башка үзгәртү: step-back. Артык конкрет сораудан башла — «Баскычтан йөгергәндә йөрәк тибешем ник 180 ка җитте?» Сүзгә-сүз андый вакыйга бер чанкта да булмаска мөмкин."},"s4":{"en":"Abstract UP the ladder: the specific question becomes a generic one — 'What mechanism regulates heart rate under exertion?' — which retrieves the underlying PRINCIPLE (the sympathetic nervous system raises heart rate). Answer the principle, then come back down to the specific. Climb to retrieve, descend to answer (Zheng et al. 2023).","ru":"Абстрагируй ВВЕРХ по лестнице: конкретный вопрос становится общим — «Какой механизм регулирует пульс при нагрузке?» — и достаёт лежащий в основе ПРИНЦИП (симпатическая нервная система повышает пульс). Найди объяснение общего принципа, затем спустись к конкретике. Поднимись, чтобы извлечь, спустись, чтобы ответить (Zheng et al. 2023).","tt":"Баскыч буйлап ӨСКӘ абстракциялә: конкрет сорау гомуми була — «Йөкләмәдә йөрәк тибешен нинди механизм көйли?» — һәм нигездәге ПРИНЦИПны ала (симпатик нерв системасы тибешне арттыра). Принципка җавап бир, аннары конкретка төш. Алу өчен мен, җавап бирү өчен төш (Zheng et al. 2023)."}},"title":{"en":"Query reshaping: decomposition fan-out & step-back ladder","ru":"Перекройка запроса: декомпозиция и лестница step-back","tt":"Сорауны үзгәртү: декомпозиция һәм step-back баскычы"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
