 тукталышлы маршрут: Get Data, Measure, Rank, Generate — теләсә кайсы эзләү-җавап системасының умыртка баганасы."},"leg0":{"en":"Get Data","ru":"Get Data","tt":"Get Data"},"leg1":{"en":"Measure","ru":"Measure","tt":"Measure"},"leg2":{"en":"Rank","ru":"Rank","tt":"Rank"},"leg3":{"en":"Generate","ru":"Generate","tt":"Generate"},"terr0":{"en":"The Archives","ru":"Архивы","tt":"Архивлар"},"terr1":{"en":"The Instruments","ru":"Инструменты","tt":"Кораллар"},"terr2":{"en":"The Bridge","ru":"Мостик","tt":"Күпер"},"terr3":{"en":"The Oracle","ru":"Оракул","tt":"Оракул"},"ship0":{"en":"sensors + index","ru":"сенсоры + индекс","tt":"сенсорлар + индекс"},"ship1":{"en":"similarity + metrics","ru":"близость + метрики","tt":"охшашлык + метрикалар"},"ship2":{"en":"cascade + serving","ru":"каскад + выдача","tt":"каскад + бирү"},"ship3":{"en":"retrieve + generate","ru":"поиск + генерация","tt":"эзләү + генерация"},"s0":{"en":"Welcome aboard. Here's the whole galaxy we're about to cross — four territories, one route. Every search-and-answer system, ours included, makes these moves.","ru":"Добро пожаловать на борт. Вот вся галактика, которую нам предстоит пересечь — четыре территории, один маршрут. Любая система поиска и ответа, и наша тоже, делает эти ходы.","tt":"Хуш килдегез. Менә безгә кичәргә тиешле бөтен галактика — дүрт территория, бер маршрут. Теләсә кайсы эзләү-җавап системасы, безнеке дә, шушы хәрәкәтләрне ясый."},"s1":{"en":"First territory — The Archives: Get Data. Turn the messy world into something computable — tokens, embeddings, an index. This is where the Ship grows its sensors.","ru":"Первая территория — Архивы: Get Data. Превращаем хаотичный мир в нечто вычислимое — токены, эмбеддинги, индекс. Здесь Корабль отращивает свои сенсоры.","tt":"Беренче территория — Архивлар: Get Data. Тәртипсез дөньяны исәпләп була торган нәрсәгә әйләндерәбез — токеннар, эмбеддинглар, индекс. Менә монда Корабль үз сенсорларын үстерә."},"s2":{"en":"Second — The Instruments: Measure. How close are two meanings? How good is a ranking? Without honest measurement you're flying blind.","ru":"Вторая — Инструменты: Measure. Насколько близки два смысла? Насколько хорош порядок выдачи? Без честного измерения ты летишь вслепую.","tt":"Икенче — Кораллар: Measure. Ике мәгънә никадәр якын? Ранжлау никадәр яхшы? Намуслы үлчәүсез син сукырларча очасың."},"s3":{"en":"Third — The Bridge: Rank. Order the answers and deliver them, at scale, forever — the index, the cascade, the hyperspace lanes that keep the Ship fast.","ru":"Третья — Мостик: Rank. Упорядочить ответы и выдать их, в масштабе, навсегда — индекс, каскад, гиперпространственные коридоры, которые держат Корабль быстрым.","tt":"Өченче — Күпер: Rank. Җавапларны тәртипкә сал һәм аларны масштабта, мәңгегә бир — индекс, каскад, Корабльне тиз тота торган гиперкосмик коридорлар."},"s4":{"en":"Fourth — The Oracle: Generate. The Ship stops merely finding and starts answering — retrieve, then speak, grounded in what we found. By Project Defense, you'll be the one at the helm.","ru":"Четвёртая — Оракул: Generate. Корабль перестаёт лишь находить и начинает отвечать — найти, затем сказать, опираясь на найденное. К защите проекта именно ты будешь у штурвала.","tt":"Дүртенче — Оракул: Generate. Корабль тик табу белән генә калмый, җавап бирә башлый — тап, аннары тапканга таянып сөйлә. Проект яклавына нәкъ менә син штурвал янында булырсың."}},"title":{"en":"The Galaxy of Information — the course map","ru":"Галактика Информации — карта курса","tt":"Мәгълүмат Галактикасы — курс картасы"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
