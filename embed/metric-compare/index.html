</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>Metrics disagree: L2 vs cosine vs inner-product</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="4" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>4</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"metric-compare","mountName":"mountMetricCompare","maxStep":4,"data":{"_doc":"Distance/similarity metrics, by hand (stdlib). pair = two frozen D=4 integer vectors with l2, dot, cosine, the two norms and normalizedDot (= cosine). disagree = a pair where L2 and cosine pick DIFFERENT candidates. ranking = 1 query, 3 candidates whose top-1 differs under L2 vs cosine vs inner-product. The lesson: the metric choice changes the answer.","_source":"_research/gen_l9.py (toy, stdlib): exact integer-vector arithmetic, rounded to 4 places.","pair":{"a":[1,2,2,0],"b":[2,0,1,1],"l2":2.6458,"dot":4,"cosine":0.5443,"aNorm":3,"bNorm":2.4495,"normalizedDot":0.5443},"disagree":{"query":[3,3],"p1":[1,0],"p2":[6,6],"l2":{"p1":3.6056,"p2":4.2426,"winner":"p1"},"cosine":{"p1":0.7071,"p2":1,"winner":"p2"},"note":"L2 prefers the nearer-but-misaligned p1; cosine prefers the aligned-but-farther p2 — rankings flip."},"ranking":{"query":[2,2,0,0],"candidates":{"d1":{"vector":[2,1,0,0],"l2":1,"dot":6,"cosine":0.9487},"d2":{"vector":[3,3,0,0],"l2":1.4142,"dot":12,"cosine":1},"d3":{"vector":[7,4,0,0],"l2":5.3852,"dot":22,"cosine":0.9648}},"top1":{"l2":"d1","cosine":"d2","innerProduct":"d3"},"note":"L2 → nearest displacement; cosine → best alignment; inner-product → largest magnitude·alignment."}},"dataSets":{"l9-metrics":{"_doc":"Distance/similarity metrics, by hand (stdlib). pair = two frozen D=4 integer vectors with l2, dot, cosine, the two norms and normalizedDot (= cosine). disagree = a pair where L2 and cosine pick DIFFERENT candidates. ranking = 1 query, 3 candidates whose top-1 differs under L2 vs cosine vs inner-product. The lesson: the metric choice changes the answer.","_source":"_research/gen_l9.py (toy, stdlib): exact integer-vector arithmetic, rounded to 4 places.","pair":{"a":[1,2,2,0],"b":[2,0,1,1],"l2":2.6458,"dot":4,"cosine":0.5443,"aNorm":3,"bNorm":2.4495,"normalizedDot":0.5443},"disagree":{"query":[3,3],"p1":[1,0],"p2":[6,6],"l2":{"p1":3.6056,"p2":4.2426,"winner":"p1"},"cosine":{"p1":0.7071,"p2":1,"winner":"p2"},"note":"L2 prefers the nearer-but-misaligned p1; cosine prefers the aligned-but-farther p2 — rankings flip."},"ranking":{"query":[2,2,0,0],"candidates":{"d1":{"vector":[2,1,0,0],"l2":1,"dot":6,"cosine":0.9487},"d2":{"vector":[3,3,0,0],"l2":1.4142,"dot":12,"cosine":1},"d3":{"vector":[7,4,0,0],"l2":5.3852,"dot":22,"cosine":0.9648}},"top1":{"l2":"d1","cosine":"d2","innerProduct":"d3"},"note":"L2 → nearest displacement; cosine → best alignment; inner-product → largest magnitude·alignment."}}},"i18n":{"_doc":"Step captions + small labels for metric-compare. EN canonical + RU + TT. Every NUMBER (the pair's l2 2.6458 / cosine 0.5443 / dot 4 / norms; the ranking l2/cosine/dot per candidate; the top-1 winners d1/d2/d3) comes from data/l9-metrics.json, never from these strings.","alt":{"en":"One vector pair scored by L2 distance, cosine similarity, and inner product; then a query with three candidates where L2, cosine, and inner-product each pick a different top-1.","ru":"Одна пара векторов, оценённая по L2-расстоянию, косинусной близости и скалярному произведению; затем запрос с тремя кандидатами, где L2, косинус и скалярное произведение выбирают разные top-1.","tt":"Бер вектор пары L2 ара, косинус охшашлык һәм скаляр тапкырчыгыш белән бәяләнә; аннары өч кандидатлы сорау, анда L2, косинус һәм скаляр тапкырчыгыш төрле top-1 сайлый."},"pairHead":{"en":"one vector pair","ru":"одна пара векторов","tt":"бер вектор пары"},"l2":{"en":"L2 distance","ru":"L2-расстояние","tt":"L2 ара"},"l2note":{"en":"smaller = nearer","ru":"меньше = ближе","tt":"кечерәк = якынрак"},"cosine":{"en":"cosine similarity","ru":"косинусная близость","tt":"косинус охшашлык"},"cosNote":{"en":"unit-vector dot =","ru":"скалярное произведение единичных =","tt":"берәмлек векторлар тапкырчыгышы ="},"dot":{"en":"inner product","ru":"скалярное произведение","tt":"скаляр тапкырчыгыш"},"dotNote":{"en":"grows with magnitude","ru":"зависит от длины вектора","tt":"озынлык белән арта"},"rankHead":{"en":"one query, three candidates — the metrics disagree","ru":"один запрос, три кандидата — метрики расходятся","tt":"бер сорау, өч кандидат — метрикалар каршылыкта"},"query":{"en":"query","ru":"запрос","tt":"сорау"},"cand":{"en":"candidate","ru":"кандидат","tt":"кандидат"},"l2short":{"en":"L2","ru":"L2","tt":"L2"},"cosShort":{"en":"cosine","ru":"косинус","tt":"косинус"},"dotShort":{"en":"a·b","ru":"a·b","tt":"a·b"},"lesson":{"en":"three metrics, three different winners — the metric choice changes the answer","ru":"три метрики, три разных победителя — выбор метрики меняет ответ","tt":"өч метрика, өч төрле җиңүче — метрика сайлау җавапны үзгәртә"},"s0":{"en":"Two vectors, a and b. Before we can rank anything, we must choose how to compare them. The norms ‖a‖ and ‖b‖ already differ — a hint that magnitude will matter for some metrics and not others.","ru":"Два вектора, a и b. Прежде чем что-то ранжировать, нужно выбрать способ их сравнения. Нормы ‖a‖ и ‖b‖ уже различаются — намёк, что для одних метрик длина важна, а для других нет.","tt":"Ике вектор, a һәм b. Берәр нәрсә ранжирлаганчы, аларны ничек чагыштырырга кирәклеген сайларга кирәк. ‖a‖ һәм ‖b‖ нормалары инде аерыла — кайбер метрикалар өчен озынлык мөһим, ә башкалары өчен юк дигән ишарә."},"s1":{"en":"L2 distance ‖a − b‖ measures straight-line displacement: how far apart the two points sit. Smaller means nearer. It cares about absolute position, so a long vector and a short one are far apart even if they point the same way.","ru":"L2-расстояние ‖a − b‖ измеряет прямое смещение: насколько далеко друг от друга стоят две точки. Меньше — ближе. Оно учитывает абсолютное положение, поэтому длинный и короткий векторы далеки, даже если смотрят в одну сторону.","tt":"L2 ара ‖a − b‖ туры сызыклы күчешне үлчи: ике нокта бер-берсеннән никадәр ерак тора. Кечерәк — якынрак. Ул абсолют урынны исәпкә ала, шуңа озын һәм кыска вектор бер якка караса да ерак була."},"s2":{"en":"Cosine similarity is the dot of the two unit vectors: a·b / (‖a‖‖b‖). It throws magnitude away and keeps only direction — two vectors pointing the same way score 1 no matter how long they are. That is why it equals the normalized (unit-vector) dot.","ru":"Косинусная близость — это скалярное произведение двух единичных векторов: a·b / (‖a‖‖b‖). Она отбрасывает длину и оставляет только направление — два сонаправленных вектора дают 1 при любой длине. Поэтому она равна скалярному произведению нормированных векторов.","tt":"Косинус охшашлык — ике берәмлек векторның тапкырчыгышы: a·b / (‖a‖‖b‖). Ул озынлыкны ташлый һәм бары юнәлешне калдыра — бер якка караган ике вектор озынлыгына карамастан 1 бирә. Шуңа ул нормалаштырылган (берәмлек) тапкырчыгышка тигез."},"s3":{"en":"The raw inner product a·b mixes both: it grows with alignment AND with magnitude. A longer vector can beat a better-aligned shorter one purely by being bigger. So the same pair now has three different scores — and the comparison is not over yet.","ru":"Сырое скалярное произведение a·b смешивает оба: зависит и от угла, и от длины; при положительном косинусе растёт с длиной. Более длинный вектор может обойти лучше выровненный короткий просто за счёт размера. Так у одной пары теперь три разных оценки — и сравнение ещё не закончено.","tt":"Чимал скаляр тапкырчыгыш a·b икесен дә кушып бирә: тигезләнү белән дә, озынлык белән дә арта. Озынрак вектор яхшырак тигезләнгән кыскасын бары зуррак булганы өчен җиңә ала. Шулай бер парада хәзер өч төрле бәя — һәм чагыштыру әле тәмамланмаган."},"s4":{"en":"Now rank a query against three candidates. L2 crowns the nearest displacement, cosine crowns the best alignment, and the inner product crowns the largest magnitude·alignment — and they pick three different top-1 candidates. The metric choice changes the answer: pick the one that matches your task.","ru":"Теперь ранжируем запрос против трёх кандидатов. L2 выбирает ближайшее смещение, косинус — лучшее выравнивание, скалярное произведение — наибольшее длина·выравнивание, и они выбирают три разных top-1. Выбор метрики меняет ответ: бери ту, которая подходит твоей задаче.","tt":"Хәзер сорауны өч кандидатка каршы ранжирлыйбыз. L2 иң якын күчешне, косинус иң яхшы тигезләнүне, скаляр тапкырчыгыш иң зур озынлык·тигезләнүне сайлый — һәм алар өч төрле top-1 сайлый. Метрика сайлау җавапны үзгәртә: бурычыгызга туры килгәнен алыгыз."}},"title":{"en":"Metrics disagree: L2 vs cosine vs inner-product","ru":"Метрики расходятся: L2 vs косинус vs скалярное произведение","tt":"Метрикалар каршылыкта: L2 vs косинус vs скаляр тапкырчыгыш"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
