the inertia (Σ||x−c||²) they induce, then the recompute. Inertia sequence [284.0, 20.6875, 2.6667] is monotone non-increasing.","subvectors":[[1,1],[2,1],[1,2],[8,8],[9,8],[8,9]],"k":2,"init":[[1,1],[2,1]],"iterations":[{"iter":0,"assign":[0,1,0,1,1,1],"centroids":[[1,1],[2,1]],"inertia":284},{"iter":1,"assign":[0,0,0,1,1,1],"centroids":[[1,1.5],[6.75,6.5]],"inertia":20.6875}],"final":{"assign":[0,0,0,1,1,1],"centroids":[[1.3333,1.3333],[8.3333,8.3333]],"inertia":2.6667},"inertiaSequence":[284,20.6875,2.6667]}}},"i18n":{"_doc":"Step captions + small labels for pq-quantize. EN canonical + RU + TT. The byte/compression NUMBERS (32→4, 8×, 768→96 32×, 128→8 64×, recall ≈0.70) come from data/l9-pq.json; the example float/index values in the widget are illustrative decoration.","alt":{"en":"A D=8 float32 vector (32 bytes) split into 4 subvectors, each mapped to a 1-byte codebook index, shrinking to 4 bytes — compression 8×.","ru":"Вектор float32 при D=8 (32 байта) делится на 4 подвектора, каждый кодируется 1-байтовым индексом кодовой книги, сжимаясь до 4 байт — сжатие 8×.","tt":"D=8 float32 векторы (32 байт) 4 субвекторга бүленә, һәрберсе 1-байтлы кодбук индексына кодлана, 4 байтка кысыла — кысу 8×."},"bytes":{"en":"B","ru":"Б","tt":"Б"},"floatHead":{"en":"float32 vector (D = 8)","ru":"вектор float32 (D = 8)","tt":"float32 векторы (D = 8)"},"subHead":{"en":"m = 4 subvectors (d* = 2 dims each)","ru":"m = 4 подвектора (по d* = 2 измерения)","tt":"m = 4 субвектор (һәрберсе d* = 2 үлчәм)"},"codeHead":{"en":"nearest of k = 256 centroids → 1-byte index","ru":"ближайший из k = 256 центроидов → 1-байтовый индекс","tt":"k = 256 центроидның иң якыны → 1-байтлы индекс"},"floatLbl":{"en":"float32","ru":"float32","tt":"float32"},"scaleLbl":{"en":"at scale","ru":"на масштабе","tt":"масштабта"},"adc":{"en":"ADC: an m×k distance table turns search into table lookups","ru":"ADC: таблица расстояний m×k превращает поиск в обращения к таблице","tt":"ADC: m×k ара таблицасы эзләүне таблицага мөрәҗәгатькә әйләндерә"},"recallLbl":{"en":"representative recall@1 (PQ-m4 vs exact)","ru":"репрезентативный recall@1 (PQ-m4 против точного)","tt":"вәкаләтле recall@1 (PQ-m4 төгәлгә каршы)"},"adcTableHead":{"en":"ADC distance table — squared sub-distances","ru":"Таблица расстояний ADC — квадраты подрасстояний","tt":"ADC ара таблицасы — квадрат асты-араларга"},"adcSubspace":{"en":"subspace","ru":"подпространство","tt":"асткиңлек"},"adcStart":{"en":"one squared sub-distance per (subspace, centroid); trace the stored codes [2, 0, 3, 1] →","ru":"одно квадратичное подрасстояние на (подпространство, центроид); проследим сохранённые коды [2, 0, 3, 1] →","tt":"һәр (асткиңлек, центроид) өчен бер квадрат асты-ара; сакланган кодларны [2, 0, 3, 1] эзлик →"},"adcSum":{"en":"sum of looked-up cells","ru":"сумма выбранных ячеек","tt":"сайланган күзәнәкләр суммасы"},"adcVs":{"en":"vs","ru":"против","tt":"каршы"},"adcExact":{"en":"exact","ru":"точное","tt":"төгәл"},"adcErr":{"en":"quantization error","ru":"ошибка квантизации","tt":"квантизация хатасы"},"memHead":{"en":"PQ memory ledger — bytes/vector and compression","ru":"Память PQ — байт/вектор и сжатие","tt":"PQ хәтере — байт/вектор һәм кысу"},"memBits":{"en":"bits/code","ru":"бит/код","tt":"бит/код"},"memVec":{"en":"vec","ru":"вектор","tt":"вектор"},"memIndex":{"en":"index @ 1e9 vectors","ru":"индекс при 1e9 векторов","tt":"1e9 векторда индекс"},"s0":{"en":"A raw embedding is a list of floats. Here D = 8 dimensions in float32 — 4 bytes each — so the vector costs 8 × 4 = 32 bytes. Multiply that by a billion vectors and memory, not compute, becomes the wall.","ru":"Сырой эмбеддинг — это список float-чисел. Здесь D = 8 измерений в float32 — по 4 байта — значит вектор стоит 8 × 4 = 32 байта. Умножь на миллиард векторов, и стеной становится память, а не вычисления.","tt":"Чимал эмбеддинг — float саннар исемлеге. Биредә D = 8 үлчәм float32 та — һәрберсе 4 байт — димәк вектор 8 × 4 = 32 байт тора. Аны миллиард векторга тапкырла, һәм стена исәпләү түгел, ә хәтер була."},"s1":{"en":"Product quantization splits the vector into m = 4 subvectors of d* = 2 dimensions each. Each subvector lives in its own little subspace and will be quantized independently — that is the “product” in product quantization.","ru":"Product-квантизация делит вектор на m = 4 подвектора по d* = 2 измерения. Каждый подвектор живёт в своём маленьком подпространстве и квантуется независимо — это и есть «произведение» в product-квантизации.","tt":"Product-квантизация векторны m = 4 субвекторга, һәрберсе d* = 2 үлчәм, бүлә. Һәр субвектор үз кечкенә асткиңлегендә яши һәм мөстәкыйль квантлана — product-квантизациядәге «тапкырчыгыш» шул."},"s2":{"en":"Each subvector is replaced by the nearest of k = 256 learned centroids, so it stores just a centroid index. With 256 centroids the index fits in one byte. Four subvectors → four bytes.","ru":"Каждый подвектор заменяется ближайшим из k = 256 обученных центроидов, поэтому хранится лишь индекс центроида. При 256 центроидах индекс умещается в один байт. Четыре подвектора → четыре байта.","tt":"Һәр субвектор k = 256 өйрәтелгән центроидның иң якыны белән алмаштырыла, шуңа бары центроид индексы саклана. 256 центроид белән индекс бер байтка сыя. Дүрт субвектор → дүрт байт."},"s3":{"en":"32 bytes became 4 — compression 8×. At real sizes the win is bigger: a 768-d vector → 96 B (32×), a 128-d vector → 8 B (64×). Distances are then approximate via ADC — an m×k table lookup — and a representative recall@1 for PQ-m4 is ≈ 0.70. Memory shrinks; a little recall is the price (the memory↔recall dial).","ru":"32 байта стали 4 — сжатие 8×. На реальных размерах выигрыш больше: вектор 768-d → 96 Б (32×), 128-d → 8 Б (64×). Расстояния затем приближённые через ADC — обращение к таблице m×k — а репрезентативный recall@1 для PQ-m4 ≈ 0,70. Память сжимается; немного полноты — это цена (регулятор память↔полнота).","tt":"32 байт 4 булды — кысу 8×. Чын зурлыкларда откыш зуррак: 768-d векторы → 96 Б (32×), 128-d → 8 Б (64×). Аралар аннары ADC аша якынча — m×k таблицасына мөрәҗәгать — ә PQ-m4 өчен вәкаләтле recall@1 ≈ 0.70. Хәтер кысыла; бераз recall — бу бәя (хәтер↔recall көйләгече)."}},"title":{"en":"Product quantization: 32 bytes → 4 bytes","ru":"Product-квантизация: 32 байта → 4 байта","tt":"Product-квантизация: 32 байт → 4 байт"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
