es 0 -> 1/sqrt(2) = 0.7071. It also gets shorter (2 -> sqrt(2)): reading more spreads the average thinner — the same dilution that sinks late chunking on Needle tasks.","tokens":["Berlin","is","Its","residents"],"values":[[4,0],[0,0],[0,0],[0,4]],"boundary":2,"query":[1,0],"naiveTheta":[0,2],"lateTheta":[1,1],"naiveChunkVec":[0,2],"lateChunkVec":[1,1],"naiveCos":0,"lateCos":0.7071},"gapLaw":{"_doc":"W2 (widgets/chunk-size-law). DERIVED, not measured: with a referent g tokens behind a mention and a chunk grid of size s at a uniform offset, the chunk holds its own referent with probability max(0, 1 - g/s), so the orphaned fraction is min(1, g/s). The `anchors` are the REPORTED BeIR deltas (Table 2 averages, Guenther et al. 2024) and exist to TEST the law: the law says smaller chunks -> bigger delta, and the three published strategies order exactly that way (sentence > fixed-256 > semantic). The SHAPE of Figure 3 agrees; its numeric values are not published, so they are not here.","gapTokens":40,"sizes":[32,64,128,256,512],"orphanFraction":[1,0.625,0.3125,0.1563,0.0781],"anchors":{"sentence":1.9,"fixed256":1.8,"semantic":1.4}},"longLate":{"_doc":"W3 (widgets/long-late-window). Algorithm 2: cut the document into macro-chunks of l_max tokens overlapping by omega, encode each, and DISCARD the embeddings of the overlapping tokens (line 14) so every token lands in exactly one chunk. l_max and omega are OUR example values: the paper publishes no hyper-parameters and the repository ships two different defaults (omega = 256 and omega = 512).","docTokens":20000,"lMax":8192,"omega":512,"stride":7680,"macroChunks":3,"starts":[0,7680,15360],"tokensEncoded":21024,"overheadTokens":1024,"overheadPct":5.12}}},"i18n":{"_doc":"Step captions + static labels for chunk-size-law (L16). EN + RU + TT. ALL numbers (g, the chunk sizes, the orphaned fractions, the three reported Δ anchors) come from data/l16-chunk.json → gapLaw — never from this file.","alt":{"en":"A window of a document with a referent and, forty tokens later, the pronoun that needs it; a chunk grid slides over them and the seam that falls between the pair is highlighted, while beside it a curve of the orphaned fraction falls from one hundred per cent at thirty-two tokens to almost nothing at five hundred and twelve.","ru":"Окно документа с референтом и — сорока токенами позже — местоимением, которому он нужен; поверх скользит сетка чанков, и шов, попавший между парой, подсвечен, а рядом кривая доли осиротевших падает со ста процентов при тридцати двух токенах почти до нуля при пятистах двенадцати.","tt":"Документ тәрәзәсендә референт һәм кырык токеннан соң аңа мохтаҗ алмашлык; өстеннән чанк челтәре шуыша, парның арасына эләккән тегеш яктыртылган, ә янәшәдә ятим калганнар өлеше кәкресе утыз ике токенда йөз проценттан биш йөз уникедә бөтенләй юкка кадәр төшә."},"docHead":{"en":"272-token window · referent, then pronoun","ru":"окно 272 токена · референт и местоимение","tt":"272 токен тәрәзә · референт һәм алмашлык"},"plotHead":{"en":"orphaned fraction = min(1, g/s)","ru":"доля осиротевших = min(1, g/s)","tt":"ятим калганнар өлеше = min(1, g/s)"},"refTag":{"en":"«Berlin»","ru":"«Berlin»","tt":"«Berlin»"},"menTag":{"en":"«Its …»","ru":"«Its …»","tt":"«Its …»"},"noCut":{"en":"all","ru":"весь","tt":"барысы"},"axisS":{"en":"chunk size s (tokens)","ru":"размер чанка s (токенов)","tt":"чанк зурлыгы s (токен)"},"sizeTag":{"en":"chunk size s =","ru":"размер чанка s =","tt":"чанк зурлыгы s ="},"orphanTag":{"en":"orphaned:","ru":"осиротело:","tt":"ятим калды:"},"setup":{"en":"named once, then only pronouns","ru":"назван один раз, дальше — местоимения","tt":"бер тапкыр аталган, аннары алмашлыклар"},"noCutTag":{"en":"no cut at all — nothing is orphaned","ru":"не режем вовсе — сирот нет","tt":"бөтенләй кисмибез — ятимнәр юк"},"noCutNote":{"en":"…length collapse is back: answers average away","ru":"…и вернулся коллапс длины: ответ размазан","tt":"…озынлык коллапсы кайтты: җавап уртачада югала"},"anchorHead":{"en":"the law predicts an ORDER — the reported Δ nDCG@10 obeys it","ru":"закон предсказывает ПОРЯДОК — отчётные Δ nDCG@10 ему подчиняются","tt":"закон ТӘРТИПне алдан әйтә — хисаптагы Δ nDCG@10 аңа буйсына"},"aSentence":{"en":"sentence (smallest chunks)","ru":"по предложениям (самые мелкие)","tt":"җөмләләр буенча (иң вагы)"},"aFixed":{"en":"fixed-256 (middle)","ru":"фиксированные, 256 (средние)","tt":"фиксацияле, 256 (уртача)"},"aSemantic":{"en":"semantic (largest chunks)","ru":"семантическая (самые крупные)","tt":"семантик (иң эресе)"},"counter":{"en":"Needle-8192: the neighbours carry no referent — Δ goes NEGATIVE.","ru":"Needle-8192: соседи не несут референта — Δ становится ОТРИЦАТЕЛЬНОЙ.","tt":"Needle-8192: күршеләр референт йөртми — Δ ТИСКӘРЕ була."},"counter2":{"en":"The law predicts a gain only when the neighbour is relevant.","ru":"Закон обещает выигрыш, только если сосед релевантен.","tt":"Закон отышны күрше релевант булганда гына вәгъдә итә."},"s0":{"en":"A referent is named once and then carried by pronouns. Take a typical distance of g = 40 tokens between the naming and the mention that needs it. Nothing has been cut yet.","ru":"Референт назван один раз, дальше его тащат местоимения. Возьмём типичное расстояние g = 40 токенов между называнием и упоминанием, которому оно нужно. Пока ничего не резали.","tt":"Референт бер тапкыр атала, аннары аны алмашлыклар йөртә. Атау белән аңа мохтаҗ телгә алу арасында типик ара g = 40 токен алыйк. Әле берни кисмәдек."},"s1":{"en":"Cut at s = 32 tokens. The chunk is shorter than the gap itself, so a seam falls between the pair no matter where the grid starts: min(1, 40/32) = 1. Every single mention is orphaned.","ru":"Режем по s = 32 токена. Чанк короче самого разрыва, поэтому шов падает между парой при любом сдвиге сетки: min(1, 40/32) = 1. Осиротело каждое упоминание.","tt":"s = 32 токен буенча кисәбез. Чанк өзеклекнең үзеннән кыскарак, шуңа челтәр кайдан башлансын, тегеш пар арасына төшә: min(1, 40/32) = 1. Һәр телгә алу ятим калды."},"s2":{"en":"Double it to s = 64 and part of the pairs collapse safely inside one chunk: 40/64 = 0.625. Still nearly two mentions in three do not know who they are about.","ru":"Удваиваем до s = 64 — часть пар схлопывается внутрь одного чанка: 40/64 = 0,625. Всё ещё почти два упоминания из трёх не знают, о ком они.","tt":"s = 64 кадәр икеләтәбез — парларның бер өлеше бер чанк эченә җыела: 40/64 = 0,625. Барыбер өч телгә алуның икесе диярлек кем турында икәнен белми."},"s3":{"en":"s = 128: 40/128 = 0.3125. About one mention in three is still severed from its referent. Notice the curve is a hyperbola, not a straight line — the first doublings buy the most.","ru":"s = 128: 40/128 = 0,3125. Примерно каждое третье упоминание всё ещё отрезано от референта. Заметь: кривая — гипербола, а не прямая; первые удвоения покупают больше всего.","tt":"s = 128: 40/128 = 0,3125. Якынча һәр өченче телгә алу әле дә референтыннан киселгән. Игътибар ит: кәкре — гипербола, туры сызык түгел; беренче икеләтүләр иң күбен бирә."},"s4":{"en":"s = 256 — the paper's fixed-size setting. 40/256 = 0.1563: roughly one chunk with a pronoun in six still does not know its subject. That is the share late chunking hands back.","ru":"s = 256 — фиксированное чанкование статьи. 40/256 = 0,1563: примерно каждый шестой чанк с местоимением по-прежнему не знает своего подлежащего. Ровно эту долю позднее чанкование и возвращает.","tt":"s = 256 — мәкаләдәге фиксацияле кисү. 40/256 = 0,1563: якынча алмашлыклы һәр алтынчы чанк әле дә иясен белми. Нәкъ шул өлешне late chunking кире кайтара."},"s5":{"en":"s = 512: 40/512 = 0.0781. The curve has visibly settled — big chunks mostly hold their own referent, which is why the naive pipeline catches up there and the late-chunking gain shrinks.","ru":"s = 512: 40/512 = 0,0781. Кривая заметно осела — крупные чанки чаще держат свой референт, поэтому наивный конвейер здесь догоняет, а выигрыш позднего чанкования сжимается.","tt":"s = 512: 40/512 = 0,0781. Кәкре сизелерлек утырды — эре чанклар үз референтын күбрәк саклый, шуңа наив конвейер монда куып җитә, ә соңгы чанклауның отышы кими."},"s6":{"en":"Do not cut at all and nobody is orphaned — but length collapse returns and the answer is averaged away. Now the test: the law predicts smaller chunks → bigger gain, and the three published strategies obey it, three out of three. And the counterexample: on Needle-8192 the neighbours are pure filler, Δ is negative, and min(1, g/s) says nothing about that case.","ru":"Не режем вовсе — сирот нет, но возвращается коллапс длины и ответ размазывается по среднему. Теперь проверка: закон обещает «мельче чанк — крупнее выигрыш», и три опубликованные стратегии подчиняются, три из трёх. И контрпример: на Needle-8192 соседи — чистый наполнитель, Δ отрицательна, и min(1, g/s) про этот случай не говорит ничего.","tt":"Бөтенләй кисмибез — ятимнәр юк, ләкин озынлык коллапсы кайта һәм җавап уртачада юкка чыга. Хәзер сынау: закон «чанк ваграк — отыш зуррак» ди, һәм өч бастырылган стратегия аңа буйсына, өчтән өче. Һәм капма-каршы мисал: Needle-8192-дә күршеләр саф тутыргыч, Δ тискәре, ә min(1, g/s) бу очрак турында берни әйтми."}},"title":{"en":"The gap law: turn the chunk-size dial","ru":"Закон разрыва: прокрути размер чанка","tt":"Өзеклек законы: чанк зурлыгын борып кара"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"},{"step":5,"labelKey":"s5"},{"step":6,"labelKey":"s6"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
