lse},{"left":"o","right":"w","joined":"ow","count":7,"isWinner":false},{"left":"e","right":"w","joined":"ew","count":6,"isWinner":false},{"left":"n","right":"e","joined":"ne","count":6,"isWinner":false},{"left":"w","right":"est","joined":"west","count":6,"isWinner":false}],"winner":{"left":"est","right":"</w>","joined":"est</w>","count":9,"breakdown":[{"word":"newest","freq":6,"occurrences":1,"contribution":6},{"word":"widest","freq":3,"occurrences":1,"contribution":3}]},"tie":[],"tokensAfter":[{"word":"low","freq":5,"tokens":["l","o","w","</w>"]},{"word":"lower","freq":2,"tokens":["l","o","w","e","r","</w>"]},{"word":"newest","freq":6,"tokens":["n","e","w","est</w>"]},{"word":"widest","freq":3,"tokens":["w","i","d","est</w>"]}]},{"step":3,"tokensBefore":[{"word":"low","freq":5,"tokens":["l","o","w","</w>"]},{"word":"lower","freq":2,"tokens":["l","o","w","e","r","</w>"]},{"word":"newest","freq":6,"tokens":["n","e","w","est</w>"]},{"word":"widest","freq":3,"tokens":["w","i","d","est</w>"]}],"tally":[{"left":"l","right":"o","joined":"lo","count":7,"isWinner":true},{"left":"o","right":"w","joined":"ow","count":7,"isWinner":false},{"left":"e","right":"w","joined":"ew","count":6,"isWinner":false},{"left":"n","right":"e","joined":"ne","count":6,"isWinner":false},{"left":"w","right":"est</w>","joined":"west</w>","count":6,"isWinner":false},{"left":"w","right":"</w>","joined":"w</w>","count":5,"isWinner":false}],"winner":{"left":"l","right":"o","joined":"lo","count":7,"breakdown":[{"word":"low","freq":5,"occurrences":1,"contribution":5},{"word":"lower","freq":2,"occurrences":1,"contribution":2}]},"tie":["lo","ow"],"tokensAfter":[{"word":"low","freq":5,"tokens":["lo","w","</w>"]},{"word":"lower","freq":2,"tokens":["lo","w","e","r","</w>"]},{"word":"newest","freq":6,"tokens":["n","e","w","est</w>"]},{"word":"widest","freq":3,"tokens":["w","i","d","est</w>"]}]},{"step":4,"tokensBefore":[{"word":"low","freq":5,"tokens":["lo","w","</w>"]},{"word":"lower","freq":2,"tokens":["lo","w","e","r","</w>"]},{"word":"newest","freq":6,"tokens":["n","e","w","est</w>"]},{"word":"widest","freq":3,"tokens":["w","i","d","est</w>"]}],"tally":[{"left":"lo","right":"w","joined":"low","count":7,"isWinner":true},{"left":"e","right":"w","joined":"ew","count":6,"isWinner":false},{"left":"n","right":"e","joined":"ne","count":6,"isWinner":false},{"left":"w","right":"est</w>","joined":"west</w>","count":6,"isWinner":false},{"left":"w","right":"</w>","joined":"w</w>","count":5,"isWinner":false},{"left":"d","right":"est</w>","joined":"dest</w>","count":3,"isWinner":false}],"winner":{"left":"lo","right":"w","joined":"low","count":7,"breakdown":[{"word":"low","freq":5,"occurrences":1,"contribution":5},{"word":"lower","freq":2,"occurrences":1,"contribution":2}]},"tie":[],"tokensAfter":[{"word":"low","freq":5,"tokens":["low","</w>"]},{"word":"lower","freq":2,"tokens":["low","e","r","</w>"]},{"word":"newest","freq":6,"tokens":["n","e","w","est</w>"]},{"word":"widest","freq":3,"tokens":["w","i","d","est</w>"]}]}]}},"i18n":{"alt":{"en":"Byte-Pair Encoding step by step: each step merges the most frequent character pair, shortening the token sequence toward subwords.","ru":"Byte-Pair Encoding по шагам: каждый шаг сливает самую частую пару символов, укорачивая последовательность токенов до подслов.","tt":"Byte-Pair Encoding адымлап: һәр адым иң еш символлар парын берләштерә, токен эзлеклелеген субсүзләргә кадәр кыскарта."},"_doc":"Step captions + small labels for bpe-steps (the live BPE training loop). EN canonical + RU + TT. The corpus, pair tallies, winners and merges all live in data/l2-bpe-steps.json (the deck's {low^5, lower^2, newest^6, widest^3} example). Each of the five merges is WATCHED in two phases (audit #0): the EVEN caption (s0/s2/s4/s6/s8) narrates COUNTING the pairs (tally shown, no winner yet); the ODD caption (s1/s3/s5/s7/s9) narrates PICKING the max + MERGING + re-tokenizing. maxStep=9. Small labels name the three regions; countHint is the placeholder shown in the merge region during a count phase.","corpusHead":{"en":"Corpus — current tokens (× word frequency)","ru":"Корпус — текущие токены (× частота слова)","tt":"Корпус — агымдагы токеннар (× сүз ешлыгы)"},"tallyHead":{"en":"Count adjacent pairs, weighted by frequency","ru":"Считаем соседние пары, взвешенные по частоте","tt":"Күрше парларны саныйбыз, ешлыкка карап үлчәп"},"mergeHead":{"en":"Merge the winner, re-tokenize","ru":"Сливаем победителя, обновляем токенизацию","tt":"Җиңүчене берләштерәбез, кабат токенлаштырабыз"},"pairCol":{"en":"pair","ru":"пара","tt":"пар"},"countCol":{"en":"count","ru":"счёт","tt":"саны"},"winnerTag":{"en":"max","ru":"макс","tt":"макс"},"winnerTieTag":{"en":"max·tie-break","ru":"макс·ничья→правило","tt":"макс·тигезлек→кагыйдә"},"tieTag":{"en":"tie","ru":"ничья","tt":"тигезлек"},"mergeRule":{"en":"rule","ru":"правило","tt":"кагыйдә"},"freqMark":{"en":"×","ru":"×","tt":"×"},"countHint":{"en":"Pick the max next →","ru":"Дальше выбираем максимум →","tt":"Аннары максимумны сайлыйбыз →"},"unseenLab":{"en":"unseen word","ru":"новое слово","tt":"күрелмәгән сүз"},"noUnk":{"en":"no [UNK]","ru":"без [UNK]","tt":"[UNK] юк"},"s0":{"en":"Count first. Split every word into characters plus an end-of-word marker </w>, then count each adjacent pair weighted by the word's frequency. The pair e·s appears in newest (6) and widest (3), so e·s = 6 + 3 = 9 — and s·t and t·</w> also hit 9: a three-way tie. Nothing is merged yet — just read the counts.","ru":"Сначала считаем. Разбиваем каждое слово на символы плюс маркер конца слова </w>, затем считаем каждую соседнюю пару, взвешивая её частотой слова. Пара e·s встречается в newest (6) и widest (3), так что e·s = 6 + 3 = 9 — и s·t, и t·</w> тоже дают 9: тройная ничья. Пока ничего не сливаем — просто читаем счёт.","tt":"Башта саныйбыз. Һәр сүзне символларга плюс сүз ахыры маркеры </w>-га бүлик, аннары һәр күрше парны сүз ешлыгына карап үлчәп саныйк. e·s пары newest-та (6) һәм widest-та (3) очрый, шуңа e·s = 6 + 3 = 9 — һәм s·t, t·</w> да 9 бирә: өчле тигезлек. Әле берни берләштермибез — бары тик саннарны укыйбыз."},"s1":{"en":"Now pick the max and merge. e·s wins the tie (broken by rule order), so e·s → es and we re-tokenize: newest becomes n e w es t </w>. Watch the pick CAUSE the re-split — that is the loop running, not a finished result.","ru":"Теперь выбираем максимум и сливаем. e·s выигрывает ничью (она разбита порядком правил), так что e·s → es и мы обновляем токенизацию: newest становится n e w es t </w>. Смотри, как выбор ВЫЗЫВАЕТ новое разбиение — это работающий цикл, а не готовый результат.","tt":"Хәзер максимумны сайлап берләштерәбез. e·s тигезлекне җиңә (кагыйдә тәртибе белән хәл ителгән), шуңа e·s → es һәм кабат токенлаштырабыз: newest n e w es t </w> була. Сайлау пере-бүленүне КИТЕРЕП ЧЫГАРГАНЫН күзәт — бу эшләүче цикл, әзер нәтиҗә түгел."},"s2":{"en":"Count again on the new token sequences. The pair es·t now carries the same 9 (still from newest + widest), tied with t·</w>. Read the tally before choosing.","ru":"Считаем снова на новых последовательностях токенов. Пара es·t теперь несёт те же 9 (по-прежнему из newest + widest), вничью с t·</w>. Читаем таблицу, прежде чем выбирать.","tt":"Яңа токен эзлеклелекләрендә кабат саныйбыз. es·t пары хәзер шул ук 9-ны йөртә (һаман newest + widest-тан), t·</w> белән тигезлектә. Сайлаганчы таблицаны укыйбыз."},"s3":{"en":"es·t wins → est. The suffix is assembling itself one piece at a time, chosen purely by frequency, nothing hand-coded. Re-tokenize and the est piece appears in both newest and widest.","ru":"es·t побеждает → est. Суффикс собирается по кусочку, выбранному чисто по частоте, ничего не зашито вручную. Обновляем токенизацию — и кусок est появляется и в newest, и в widest.","tt":"es·t җиңә → est. Кушымча үзен кисәкләп җыя, саф ешлык буенча сайланган, бернәрсә дә кул белән язылмаган. Кабат токенлаштырабыз — est кисәге newest та, widest та да күренә."},"s4":{"en":"Count the third round. The pair est·</w> still scores 9 — the highest. Just the counts for now; the merge comes next.","ru":"Считаем третий круг. Пара est·</w> по-прежнему даёт 9 — наибольшее. Пока только счёт; слияние следующим шагом.","tt":"Өченче әйләнешне саныйбыз. est·</w> пары һаман 9 бирә — иң зурысы. Хәзергә бары санау; берләштерү киләсе адымда."},"s5":{"en":"Merge est·</w> → est</w>: the suffix binds to the word boundary. Both newest and widest now end in one shared piece — exactly the reuse that makes sub-words beat whole words.","ru":"Сливаем est·</w> → est</w>: суффикс привязывается к границе слова. И newest, и widest теперь оканчиваются одним общим куском — ровно то переиспользование, которое даёт подсловам преимущество над целыми словами.","tt":"est·</w> → est</w> берләштерәбез: кушымча сүз чигенә бәйләнә. Хәзер newest та, widest та бер уртак кисәк белән тәмамлана — нәкъ шул кабат куллану өлеш-сүзләргә бөтен сүзләр өстеннән өстенлек бирә."},"s6":{"en":"Count the fourth round. The 9-count cluster is exhausted; the top count drops to 7. l·o appears in low (5) and lower (2), so l·o = 5 + 2 = 7 — tied with o·w.","ru":"Считаем четвёртый круг. Кластер со счётом 9 исчерпан; верхний счёт падает до 7. l·o встречается в low (5) и lower (2), так что l·o = 5 + 2 = 7 — вничью с o·w.","tt":"Дүртенче әйләнешне саныйбыз. Саны 9 булган кластер бетте; өске сан 7-гә төшә. l·o low-та (5) һәм lower-да (2) очрый, шуңа l·o = 5 + 2 = 7 — o·w белән тигезлектә."},"s7":{"en":"Merge l·o → lo. The loop has moved on to a different part of the vocabulary, driven only by what is now most frequent. Re-tokenize: low and lower both start with lo.","ru":"Сливаем l·o → lo. Цикл перешёл к другой части словаря, ведомый лишь тем, что теперь чаще всего. Обновляем токенизацию: и low, и lower теперь начинаются с lo.","tt":"l·o → lo берләштерәбез. Цикл сүзлекнең башка өлешенә күчте, бары тик хәзер иң еш очраганы белән җитәкләнеп. Кабат токенлаштырабыз: low та, lower да хәзер lo белән башлана."},"s8":{"en":"Last count. lo·w now scores 5 + 2 = 7 — the maximum. One more pick to go.","ru":"Последний счёт. lo·w теперь даёт 5 + 2 = 7 — максимум. Остался ещё один выбор.","tt":"Соңгы санау. lo·w хәзер 5 + 2 = 7 бирә — максимум. Тагын бер сайлау калды."},"s9":{"en":"Merge lo·w → low. Five merges done — es, est, est</w>, lo, low — and an unseen word like lowest now falls out for free as low + est</w>, no [UNK]. That is the whole algorithm: count, pick the most frequent, merge, repeat.","ru":"Сливаем lo·w → low. Пять слияний выполнены — es, est, est</w>, lo, low — и новое слово вроде lowest теперь собирается из выученных частей как low + est</w>, без [UNK]. Это и есть весь алгоритм: считай, выбирай самую частую, сливай, повторяй.","tt":"lo·w → low берләштерәбез. Биш берләштерү әзер — es, est, est</w>, lo, low — һәм lowest кебек күрелмәгән сүз хәзер бушлай low + est</w> итеп җыела, [UNK]-сыз. Менә бөтен алгоритм: сана, иң еш очраганны сайла, берләштер, кабатла."}},"title":{"en":"BPE training loop, step by step","ru":"Цикл обучения BPE, шаг за шагом","tt":"BPE өйрәнү циклы, адымлап"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"},{"step":5,"labelKey":"s5"},{"step":6,"labelKey":"s6"},{"step":7,"labelKey":"s7"},{"step":8,"labelKey":"s8"},{"step":9,"labelKey":"s9"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
