</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>LLM-as-a-judge</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="4" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>4</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"llm-judge","mountName":"mountLlmJudge","maxStep":4,"data":{"_src":"toy rubric arithmetic (gen_l11.py) + REAL frozen llama3.1:8b judge runs","rubric":{"criteria":["relevance","grounding","completeness"],"scaleMin":1,"scaleMax":5},"answers":[{"id":"A","scores":[5,4,3],"mean":4},{"id":"B","scores":[4,2,2],"mean":2.6667}],"pairwiseWinner":"A","goodhart":{"honest":{"good":4.3333,"gamed":4,"winner":"A"},"lengthBiased":{"good":4,"gamed":4.25,"winner":"C"},"goodScores":[5,5,3],"gamedScores":[4,3,5],"note":"Honest mean: A (4.3333) > C (4.0). Over-weight 'completeness' ×2 (a proxy for length) and C (4.25) beats A (4.0): the metric became a target. This is Goodhart's law — L1→L4→L11."},"real":{"_model":"llama3.1:8b","accuracyClear":1,"nClear":6,"positionFollowRateTie":0.6667,"positionAnchoredTie":4,"nTie":6,"verbosityPreferenceRate":1,"verbosityLongerWins":10,"nVerbosityJudgements":10,"nVerbosityPairs":5,"faithfulnessCaughtPlanted":true,"note":"Real llama3.1:8b judge (temp 0, seed 42). Accurate when quality is CLEAR (1.0), but anchors to slot under a TIE (0.6667) and ALWAYS prefers the longer answer (1.0) — Goodhart, measured."}},"dataSets":{"l11-judge":{"_src":"toy rubric arithmetic (gen_l11.py) + REAL frozen llama3.1:8b judge runs","rubric":{"criteria":["relevance","grounding","completeness"],"scaleMin":1,"scaleMax":5},"answers":[{"id":"A","scores":[5,4,3],"mean":4},{"id":"B","scores":[4,2,2],"mean":2.6667}],"pairwiseWinner":"A","goodhart":{"honest":{"good":4.3333,"gamed":4,"winner":"A"},"lengthBiased":{"good":4,"gamed":4.25,"winner":"C"},"goodScores":[5,5,3],"gamedScores":[4,3,5],"note":"Honest mean: A (4.3333) > C (4.0). Over-weight 'completeness' ×2 (a proxy for length) and C (4.25) beats A (4.0): the metric became a target. This is Goodhart's law — L1→L4→L11."},"real":{"_model":"llama3.1:8b","accuracyClear":1,"nClear":6,"positionFollowRateTie":0.6667,"positionAnchoredTie":4,"nTie":6,"verbosityPreferenceRate":1,"verbosityLongerWins":10,"nVerbosityJudgements":10,"nVerbosityPairs":5,"faithfulnessCaughtPlanted":true,"note":"Real llama3.1:8b judge (temp 0, seed 42). Accurate when quality is CLEAR (1.0), but anchors to slot under a TIE (0.6667) and ALWAYS prefers the longer answer (1.0) — Goodhart, measured."}}},"i18n":{"_doc":"Step captions + small labels for llm-judge. EN canonical + RU + TT. Every NUMBER (the rubric scores and means 4.0 / 2.6667; the Goodhart honest 4.3333 vs 4.0 and length-biased 4.0 vs 4.25; the real accuracy 1.0 / position-follow 0.6667 / verbosity 1.0 and the n's) comes from data/l11-judge.json, never from these strings.","alt":{"en":"An LLM-as-a-judge scorecard: a three-criterion rubric scoring two answers, their pointwise means as bars, a pairwise verdict, a Goodhart flip where over-weighting length makes a worse verbose answer win, and three measured bias bars — accurate when quality is clear, but anchored to slot under a tie and always preferring the longer answer.","ru":"Карточка «LLM как судья»: рубрика из трёх критериев оценивает два ответа, их поточечные средние в виде столбцов, попарный вердикт, эффект Гудхарта, где переоценка длины делает победителем худший многословный ответ, и три измеренных столбца смещения — точно, когда качество очевидно, но с привязкой к позиции при ничьей и всегда в пользу более длинного ответа.","tt":"«LLM хөкемче буларак» картасы: өч критерийлы рубрика ике җавапны бәяли, аларның ноктадагы уртачалары баганалар буларак, парлы хөкем, Гудхарт борылышы — анда озынлыкны артык бәяләү начаррак, сүзгә бай җавапны җиңүче итә, һәм өч үлчәнгән авышу баганасы — сыйфат ачык булганда төгәл, ләкин тигезлектә урынга бәйле һәм һәрвакыт озынрак җавап файдасына."},"rubricHead":{"en":"rubric · per-criterion scores","ru":"рубрика · оценки по критериям","tt":"рубрика · критерийлар буенча бәяләр"},"crit_relevance":{"en":"relevance","ru":"релевантность","tt":"релевантлык"},"crit_grounding":{"en":"grounding","ru":"обоснованность","tt":"нигезләнү"},"crit_completeness":{"en":"completeness","ru":"полнота","tt":"тулылык"},"answer":{"en":"answer","ru":"ответ","tt":"җавап"},"scaleNote":{"en":"scale","ru":"шкала","tt":"шкала"},"pointwiseHead":{"en":"pointwise mean score","ru":"поточечная средняя оценка","tt":"ноктадагы уртача бәя"},"pairwiseHead":{"en":"pairwise verdict — A vs B","ru":"попарный вердикт — A против B","tt":"парлы хөкем — A каршы B"},"winsPrefix":{"en":"winner:","ru":"победитель:","tt":"җиңүче:"},"goodAns":{"en":"honest answer","ru":"честный ответ","tt":"намуслы җавап"},"gamedAns":{"en":"verbose answer","ru":"многословный ответ","tt":"сүзгә бай җавап"},"honestJudge":{"en":"honest judge","ru":"честный судья","tt":"намуслы хөкемче"},"lengthJudge":{"en":"length-biased judge","ru":"судья со смещением к длине","tt":"озынлыкка авышкан хөкемче"},"realHead":{"en":"measured judge behaviour (real model)","ru":"измеренное поведение судьи (реальная модель)","tt":"үлчәнгән хөкемче тәртибе (чын модель)"},"rAccuracy":{"en":"accuracy when quality is clear","ru":"точность, когда качество очевидно","tt":"сыйфат ачык булганда төгәллек"},"rPosition":{"en":"follows first slot on a tie","ru":"следует первой позиции при ничьей","tt":"тигезлектә беренче урынга иярә"},"rVerbosity":{"en":"prefers the longer answer","ru":"предпочитает более длинный ответ","tt":"озынрак җавапны өстен күрә"},"s0":{"en":"Instead of a single label, we hand the judge a rubric: relevance, grounding, completeness. It scores each answer on every criterion. Answer A reads strong across the board; answer B is weaker on grounding and completeness. This is pointwise scoring — each answer judged alone, criterion by criterion.","ru":"Вместо одной метки мы даём судье рубрику: релевантность, обоснованность, полнота. Он оценивает каждый ответ по каждому критерию. Ответ A силён по всем; ответ B слабее по обоснованности и полноте. Это поточечная оценка — каждый ответ судится сам по себе, критерий за критерием.","tt":"Бер билге урынына без хөкемчегә рубрика бирәбез: релевантлык, нигезләнү, тулылык. Ул һәр җавапны һәр критерий буенча бәяли. A җавабы барысы буенча да көчле; B җавабы нигезләнү һәм тулылык буенча йомшаграк. Бу ноктадагы бәяләү — һәр җавап ялгызы, критерийлап хөкем ителә."},"s1":{"en":"Average the criteria and each answer gets one pointwise number. A clears the rubric comfortably; B lags well behind. The means look clean and decisive — which is exactly why a single rubric score feels trustworthy. Hold that thought: the same judge can be steered.","ru":"Усредняем критерии — и каждый ответ получает одно поточечное число. A уверенно проходит рубрику; B заметно отстаёт. Средние выглядят чисто и убедительно — именно поэтому одна оценка по рубрике кажется надёжной. Запомни это: тем же судьёй можно управлять.","tt":"Критерийларны уртачалыйбыз — һәм һәр җавап бер ноктадагы сан ала. A рубриканы ышанычлы уза; B сизелерлек артта кала. Уртачалар чиста һәм ышандыргыч күренә — нәкъ шуңа бер рубрика бәясе ышанычлы тоела. Моны истә тотыгыз: шул ук хөкемчене юнәлтеп була."},"s2":{"en":"Pairwise comparison asks a cleaner question: not “what score,” but “which is better, A or B?” The judge picks A. Comparing two answers side by side is usually more reliable than asking for an absolute number — there is no shared scale to drift. So far the judge agrees with us.","ru":"Попарное сравнение задаёт более чистый вопрос: не «какая оценка», а «что лучше, A или B?» Судья выбирает A. Сравнивать два ответа бок о бок обычно надёжнее, чем просить абсолютное число — нет общей шкалы, которая бы плыла. Пока судья согласен с нами.","tt":"Парлы чагыштыру чистарак сорау куя: «нинди бәя» түгел, ә «кайсысы яхшырак, A әллә B?» Хөкемче A ны сайлый. Ике җавапны янәшә чагыштыру гадәттә абсолют сан сораганга караганда ышанычлырак — авышачак уртак шкала юк. Әлегә хөкемче безнең белән килешә."},"s3":{"en":"Now Goodhart strikes. An honest judge prefers the truly better answer over a longer, padded one. But tweak the judge to over-weight length, and the verdict flips: the worse, verbose answer now wins. The moment a score becomes a target — “write longer to score higher” — it stops measuring quality and starts measuring length.","ru":"Тут вступает Гудхарт. Честный судья предпочитает действительно лучший ответ более длинному и раздутому. Но настрой судью переоценивать длину — и вердикт переворачивается: побеждает худший многословный ответ. Как только оценка становится целью — «пиши длиннее, чтобы получить выше» — она перестаёт измерять качество и начинает измерять длину.","tt":"Менә Гудхарт килеп керә. Намуслы хөкемче чыннан да яхшырак җавапны озынрак, шешерелгәненә караганда өстен күрә. Ләкин хөкемчене озынлыкны артык бәяләргә көйләсәң — хөкем әйләнә: начаррак, сүзгә бай җавап җиңә. Бәя максатка әйләнгән мизгелдә — «югарырак алыр өчен озынрак яз» — ул сыйфатны түгел, озынлыкны үлчи башлый."},"s4":{"en":"These biases are not hypothetical — they are measured on a real, frozen judge model. When quality is clearly different, it judges perfectly. But on a genuine tie it anchors to whichever answer sits in the first slot, and across the verbosity tests it picks the longer answer every single time. Use a judge — but audit it for exactly these biases.","ru":"Эти смещения не гипотетические — они измерены на реальной, зафиксированной модели-судье. Когда качество явно различается, она судит безупречно. Но при настоящей ничьей привязывается к ответу, стоящему первым, а во всех тестах на многословность каждый раз выбирает более длинный ответ. Используй судью — но проверяй его именно на эти смещения.","tt":"Бу авышулар фараз гына түгел — алар чын, катырылган хөкемче модельдә үлчәнгән. Сыйфат ачык аерылганда ул камил хөкем итә. Ләкин чын тигезлектә беренче урында торган җавапка бәйләнә, ә сүзгә байлык тестларында һәрвакыт озынрак җавапны сайлый. Хөкемче кулланыгыз — ләкин аны нәкъ менә шул авышуларга тикшерегез."}},"title":{"en":"LLM-as-a-judge","ru":"LLM как судья","tt":"LLM хөкемче буларак"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
