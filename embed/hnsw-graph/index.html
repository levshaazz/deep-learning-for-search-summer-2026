":1},{"ef":4,"candidatesEvaluated":15,"recallAt1":1},{"ef":8,"candidatesEvaluated":15,"recallAt1":1},{"ef":16,"candidatesEvaluated":26,"recallAt1":1}]}}},"i18n":{"_doc":"Step captions + small labels for hnsw-graph. EN canonical + RU + TT. Every NUMBER (distances 0.7071/1.58/2.55, hops, recall 1.0) comes from data/l9-hnsw.json, never from these strings.","alt":{"en":"A six-node small-world graph in 2-D with a query point; greedy search hops n0→n1→n2 to the nearest neighbour.","ru":"Граф «тесного мира» из шести узлов в 2-D с точкой-запросом; жадный поиск прыгает n0→n1→n2 к ближайшему соседу.","tt":"2-D та алты төенле «тыгыз дөнья» графы, сорау ноктасы белән; комсыз эзләү n0→n1→n2 иң якын күршегә сикерә."},"query":{"en":"query","ru":"запрос","tt":"сорау"},"dist":{"en":"dist","ru":"расст.","tt":"ара"},"hop":{"en":"hop","ru":"прыжок","tt":"сикерү"},"move":{"en":"move","ru":"идём","tt":"күчәбез"},"localMin":{"en":"all neighbours farther → local minimum, stop","ru":"все соседи дальше → локальный минимум, стоп","tt":"барлык күршеләр ерактарак → локаль минимум, тукта"},"atNN":{"en":"arrive at the nearest node","ru":"приходим к ближайшему узлу","tt":"иң якын төенгә киләбез"},"isNN":{"en":"is the true nearest neighbour","ru":"— истинный ближайший сосед","tt":"— чын иң якын күрше"},"hops":{"en":"hops","ru":"прыжков","tt":"сикерү"},"efKnob":{"en":"the ef knob — a wider candidate list escapes a local-min trap:","ru":"регулятор ef — более широкий список кандидатов выходит из ловушки локального минимума:","tt":"ef борыч — киңрәк кандидатлар исемлеге локаль минимум капкыныннан чыга:"},"readStart":{"en":"greedy search — start at the entry node","ru":"жадный поиск — старт с входного узла","tt":"комсыз эзләү — керү төененнән башла"},"s0":{"en":"Six vectors become six nodes in 2-D, wired into a navigable small-world graph (M = 2 — the link budget each node spends on insertion; a node also collects back-links, so actual degrees here run 2–3). The query ◆ sits to the right. Greedy search starts at the entry node n0 and will hop toward the query, one neighbour at a time.","ru":"Шесть векторов становятся шестью узлами в 2-D, связанными в навигируемый граф «тесного мира» (M = 2 — столько рёбер узел тратит при вставке; обратные рёбра ему добавляют соседи, поэтому фактические степени здесь 2–3). Запрос ◆ — справа. Жадный поиск стартует с входного узла n0 и прыгает к запросу, по одному соседу за шаг.","tt":"Алты вектор 2-D та алты төенгә әйләнә, навигацияле «тыгыз дөнья» графына тоташтырылган (M = 2 — төен урнаштырганда сарыф иткән кырлар бюджеты; күршеләре аңа кире кырлар өсти, шуңа монда чын дәрәҗәләр 2–3). Сорау ◆ уңда. Комсыз эзләү n0 керү төененнән башлана һәм сорауга таба, бер күршедән бер адым, сикерә."},"s1":{"en":"From n0, compare its neighbours: n1 is 2.55 away, n3 is 4.30. The closest one wins — step to n1. Greedy always walks to the neighbour nearest the query.","ru":"От n0 сравниваем соседей: n1 на расстоянии 2,55, n3 — 4,30. Побеждает ближайший — идём в n1. Жадный всегда шагает к соседу, ближайшему к запросу.","tt":"n0 дан күршеләрне чагыштырабыз: n1 2.55 ераклыкта, n3 — 4.30. Иң якыны җиңә — n1 гә күчәбез. Комсыз һәрвакыт сорауга иң якын күршегә атлый."},"s2":{"en":"From n1, the closest neighbour is n2 at 0.7071 — step there. Now look around: every neighbour of n2 is farther than 0.7071. No move improves things, so greedy stops. n2 is a local minimum.","ru":"От n1 ближайший сосед — n2 на 0,7071, идём туда. Теперь осмотримся: каждый сосед n2 дальше, чем 0,7071. Ни один ход не улучшает результат, и жадный останавливается. n2 — локальный минимум.","tt":"n1 дән иң якын күрше — n2, 0.7071 дә, шунда күчәбез. Хәзер тирә-якка карыйк: n2 нең һәр күршесе 0.7071 дән ерактарак. Бер адым да яхшыртмый, шуңа комсыз туктый. n2 — локаль минимум."},"s3":{"en":"And n2 is exactly the brute-force nearest neighbour (0.7071): recall@1 = 1.0. On six nodes this only shows the mechanism — greedy descent — not a speedup; the O(log N) win appears at scale. The ef knob keeps a wider candidate list so a single local-min trap (ef = 1 → recall 0.0) is escaped (ef = 3 → 1.0).","ru":"И n2 — в точности ближайший сосед полным перебором (0,7071): recall@1 = 1,0. На шести узлах это лишь механизм — жадный спуск, — а не ускорение; на больших коллекциях часто наблюдают близкий к O(log N) рост затрат, но это не универсальная гарантия. Регулятор ef держит более широкий список кандидатов, поэтому ловушка локального минимума (ef = 1 → recall 0,0) преодолевается (ef = 3 → 1,0).","tt":"Һәм n2 — нәкъ тулы эзләү иң якын күршесе (0.7071): recall@1 = 1.0. Алты төендә бу бары механизм — комсыз төшү, — тизләтү түгел; O(log N) откышы масштабта күренә. ef борычы киңрәк кандидатлар исемлеген тота, шуңа локаль минимум капкыны (ef = 1 → recall 0.0) җиңелә (ef = 3 → 1.0)."},"_doc_toy2":"Two-layer climb (toy2 variant). Step captions t0..t5 + small read-out labels. Selected by labels.variant === 'toy2'. Every NUMBER (distances 1.4142/2.0/13.0, hops, recall 0.0/1.0) comes from data.toy2 in l9-hnsw.json, never from these strings.","layerHub":{"en":"layer 1 — hubs","ru":"слой 1 — хабы","tt":"1-катлам — хаблар"},"layerBase":{"en":"layer 0 — base","ru":"слой 0 — база","tt":"0-катлам — нигез"},"baseEntry":{"en":"base entry","ru":"вход базы","tt":"нигез керү"},"entryHubLbl":{"en":"hub entry","ru":"вход-хаб","tt":"хаб керү"},"baseOnly":{"en":"base-only","ru":"только база","tt":"бары нигез"},"hubEntry":{"en":"hub-entry","ru":"вход-хаб","tt":"хаб-керү"},"trapped":{"en":"no base edge crosses the gap → trapped at a local minimum","ru":"ни одно базовое ребро не пересекает разрыв → застряли в локальном минимуме","tt":"бер нигез кыры да ярыкны кичми → локаль минимумда кысылдык"},"trappedAt":{"en":"trapped at","ru":"застряли в","tt":"кысылдык"},"recall":{"en":"recall@1","ru":"recall@1","tt":"recall@1"},"restart":{"en":"restart at the upper hub","ru":"перезапуск с верхнего хаба","tt":"өске хабтан яңадан башла"},"hubWhy":{"en":"the hub layer has long-range edges the base layer lacks","ru":"у слоя хабов есть дальние рёбра, которых нет у базы","tt":"хаблар катламында нигездә булмаган ерак кырлар бар"},"hubHop":{"en":"layer-1 hub hop","ru":"прыжок по хабам (слой 1)","tt":"хаб сикерүе (1-катлам)"},"crossGap":{"en":"the long-range edge crosses the gap to the right cluster","ru":"дальнее ребро пересекает разрыв к правому кластеру","tt":"ерак кыр уң кластерга ярыкны кичә"},"descend":{"en":"descend to base, then the layer-0 hop","ru":"спускаемся к базе, затем прыжок по слою 0","tt":"нигезгә төшәбез, аннары 0-катлам сикерүе"},"contrast":{"en":"recall contrast:","ru":"контраст полноты:","tt":"recall каршылыгы:"},"readStartBase":{"en":"two layers: an upper hub band + the base band. Base-only greedy starts at the base entry.","ru":"два слоя: верхняя полоса хабов + полоса базы. Жадный поиск только по базе стартует со входа базы.","tt":"ике катлам: өске хаблар полосасы + нигез полосасы. Бары нигез буенча комсыз эзләү нигез керүеннән башлана."},"t0":{"en":"Twelve vectors form a TWO-layer graph. Layer 0 (base) holds every node; layer 1 (the upper band) keeps only a few hub nodes joined by long-range edges. The query ◆ sits in the right-hand cluster. We first try a base-only greedy search from the base entry b0.","ru":"Двенадцать векторов образуют ДВУХслойный граф. Слой 0 (база) содержит все узлы; слой 1 (верхняя полоса) — лишь несколько узлов-хабов, связанных дальними рёбрами. Запрос ◆ — в правом кластере. Сначала пробуем жадный поиск только по базе от входа b0.","tt":"Унике вектор ИКЕ катламлы граф төзи. 0-катлам (нигез) барлык төеннәрне тота; 1-катлам (өске полоса) — бары берничә хаб төен, ерак кырлар белән тоташтырылган. Сорау ◆ уң кластерда. Башта b0 нигез керүеннән бары нигез буенча комсыз эзләү сынап карыйбыз."},"t1":{"en":"Base-only greedy walks b0→b1→b2→b4 and STOPS: every base neighbour of b4 is farther from the query, and no base edge crosses the gap to the right-hand cluster. It is stuck at a local minimum — recall@1 = 0.0. The true neighbour is unreachable on the base layer alone.","ru":"Жадный поиск только по базе идёт b0→b1→b2→b4 и ОСТАНАВЛИВАЕТСЯ: все базовые соседи b4 дальше от запроса, и ни одно базовое ребро не пересекает разрыв к правому кластеру. Застряли в локальном минимуме — recall@1 = 0,0. Истинный сосед недостижим только по базе.","tt":"Бары нигез буенча комсыз эзләү b0→b1→b2→b4 бара һәм ТУКТЫЙ: b4 нең барлык нигез күршеләре сораудан ерактарак, һәм бер нигез кыры да уң кластерга ярыкны кичми. Локаль минимумда кысылдык — recall@1 = 0.0. Чын күрше бары нигездә ирешеп булмый."},"t2":{"en":"So real HNSW does not start on the base. It enters at the UPPER hub layer, at hub b2. The hub layer is sparse but its edges are long-range — they leap across the empty space the base layer cannot bridge.","ru":"Поэтому настоящий HNSW не стартует на базе. Он входит на ВЕРХНЕМ слое хабов, в хабе b2. Слой хабов разрежён, но его рёбра дальние — они перепрыгивают пустое пространство, которое база не может перекрыть.","tt":"Шуңа чын HNSW нигездә башламый. Ул ӨСКЕ хаблар катламына, b2 хабына керә. Хаблар катламы сирәк, ләкин аның кырлары ерак — алар нигез кичә алмаган буш киңлекне сикереп үтәләр."},"t3":{"en":"One hop on the hub layer, b2→b7 (distance 2.0): the long-range upper edge crosses the gap and lands us right beside the right-hand cluster — exactly the move the base layer could not make.","ru":"Один прыжок по слою хабов, b2→b7 (расстояние 2,0): дальнее верхнее ребро пересекает разрыв и выводит нас прямо к правому кластеру — именно тот ход, который база не могла сделать.","tt":"Хаблар катламы буенча бер сикерү, b2→b7 (ара 2.0): ерак өске кыр ярыкны кичә һәм безне нәкъ уң кластер янына китерә — нигез ясый алмаган нәкъ шул адым."},"t4":{"en":"Now descend from hub b7 down to the base layer and continue greedily there: b7→b9 (distance 1.4142). On the base layer the neighbourhood is dense, so the final approach to the true neighbour is precise.","ru":"Теперь спускаемся от хаба b7 на базовый слой и продолжаем жадно там: b7→b9 (расстояние 1,4142). На базе окрестность плотная, в этом примере поиск достигает истинного ближайшего соседа.","tt":"Хәзер b7 хабыннан нигез катламына төшәбез һәм анда комсыз дәвам итәбез: b7→b9 (ара 1.4142). Нигездә тирәлек тыгыз, шуңа чын күршегә соңгы якынлашу төгәл."},"t5":{"en":"b9 is exactly the brute-force nearest neighbour (1.4142): recall@1 = 1.0. The contrast is the whole point — base-only greedy trapped at recall 0.0, while entering through the hub layer reached the true neighbour with recall 1.0. The upper layers are the express lanes.","ru":"b9 — в точности ближайший сосед полным перебором (1,4142): recall@1 = 1,0. Контраст и есть суть — жадный поиск только по базе застрял на recall 0,0, а вход через слой хабов достиг истинного соседа с recall 1,0. Верхние слои — это скоростные полосы.","tt":"b9 — нәкъ тулы эзләү иң якын күршесе (1.4142): recall@1 = 1.0. Каршылык — төп мәгънә: бары нигез буенча комсыз эзләү recall 0.0 да кысылды, ә хаблар катламы аша керү чын күршегә recall 1.0 белән иреште. Өске катламнар — тизлек полосалары."}},"title":{"en":"HNSW: greedy search on a small-world graph","ru":"HNSW: жадный поиск по графу «тесного мира»","tt":"HNSW: «тыгыз дөнья» графы буенча комсыз эзләү"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
