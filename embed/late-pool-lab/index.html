dgets/long-late-window). Algorithm 2: cut the document into macro-chunks of l_max tokens overlapping by omega, encode each, and DISCARD the embeddings of the overlapping tokens (line 14) so every token lands in exactly one chunk. l_max and omega are OUR example values: the paper publishes no hyper-parameters and the repository ships two different defaults (omega = 256 and omega = 512).","docTokens":20000,"lMax":8192,"omega":512,"stride":7680,"macroChunks":3,"starts":[0,7680,15360],"tokensEncoded":21024,"overheadTokens":1024,"overheadPct":5.12}},"dataSets":{"l16-chunk":{"_doc":"MEASURED on a constructed coreference corpus (stdlib set-overlap cosine). Reproduces the ORDERING INVERSION — naively a GENERIC DISTRACTOR that merely repeats the query words outranks the answer chunk (0.5774 > 0.5164); late chunking binds 'it' -> 'acme' into the answer chunk and it takes rank 1 (0.7071). The header chunk is a weaker third rival (0.2887) and never buries the answer. Not the paper's magnitudes. Blocks `pool`, `gapLaw` and `longLate` are pure arithmetic feeding the three L16 widgets. Generator: _research/gen_l16.py.","query":["acme","revenue","growth"],"entity":"acme","goldChunk":"c2_answer","chunks":{"c1_header":{"naive":0.2887,"late":0.2887,"coref":false},"c2_answer":{"naive":0.5164,"late":0.7071,"coref":true},"c3_distractor":{"naive":0.5774,"late":0.5774,"coref":false},"c4_prior":{"naive":0,"late":0.2582,"coref":true},"c5_outlook":{"naive":0,"late":0,"coref":false}},"goldRankNaive":2,"goldRankLate":1,"goldNaive":0.5164,"goldLate":0.7071,"distractorNaive":0.5774,"distractorLate":0.5774,"headerNaive":0.2887,"headerLate":0.2887,"inversion":true,"pool":{"_doc":"W1 (widgets/late-pool-lab). A 4-token document where ONLY the order of {cut, attend} moves. ONE rule applied twice: a token's vector is the average of the tokens it may read — naive reads its own chunk, late reads the whole document. Mean-pool the same segment either way: the chunk vector turns from (0,2) to (1,1) and cos(q,·) goes 0 -> 1/sqrt(2) = 0.7071. It also gets shorter (2 -> sqrt(2)): reading more spreads the average thinner — the same dilution that sinks late chunking on Needle tasks.","tokens":["Berlin","is","Its","residents"],"values":[[4,0],[0,0],[0,0],[0,4]],"boundary":2,"query":[1,0],"naiveTheta":[0,2],"lateTheta":[1,1],"naiveChunkVec":[0,2],"lateChunkVec":[1,1],"naiveCos":0,"lateCos":0.7071},"gapLaw":{"_doc":"W2 (widgets/chunk-size-law). DERIVED, not measured: with a referent g tokens behind a mention and a chunk grid of size s at a uniform offset, the chunk holds its own referent with probability max(0, 1 - g/s), so the orphaned fraction is min(1, g/s). The `anchors` are the REPORTED BeIR deltas (Table 2 averages, Guenther et al. 2024) and exist to TEST the law: the law says smaller chunks -> bigger delta, and the three published strategies order exactly that way (sentence > fixed-256 > semantic). The SHAPE of Figure 3 agrees; its numeric values are not published, so they are not here.","gapTokens":40,"sizes":[32,64,128,256,512],"orphanFraction":[1,0.625,0.3125,0.1563,0.0781],"anchors":{"sentence":1.9,"fixed256":1.8,"semantic":1.4}},"longLate":{"_doc":"W3 (widgets/long-late-window). Algorithm 2: cut the document into macro-chunks of l_max tokens overlapping by omega, encode each, and DISCARD the embeddings of the overlapping tokens (line 14) so every token lands in exactly one chunk. l_max and omega are OUR example values: the paper publishes no hyper-parameters and the repository ships two different defaults (omega = 256 and omega = 512).","docTokens":20000,"lMax":8192,"omega":512,"stride":7680,"macroChunks":3,"starts":[0,7680,15360],"tokensEncoded":21024,"overheadTokens":1024,"overheadPct":5.12}}},"i18n":{"_doc":"Step captions + static labels for late-pool-lab (L16). EN + RU + TT. ALL numbers (the token values, the two chunk vectors, both cosines) come from data/l16-chunk.json → pool — never from this file.","alt":{"en":"A four-token document with a chunk boundary after the second token; attention arcs from the chunk-B tokens are first stopped by a wall in the boundary and then reach across to Berlin, while on a small two-axis plane the chunk vector turns from straight up to forty-five degrees, toward the query ray.","ru":"Документ из четырёх токенов с границей чанка после второго; дуги внимания от токенов чанка B сперва упираются в стену на границе, а потом дотягиваются до Berlin, и на маленькой плоскости с двумя осями вектор чанка поворачивается из вертикали на сорок пять градусов — к лучу запроса.","tt":"Икенче токеннан соң чанк чиге булган дүрт токенлы документ; B чанкы токеннарыннан игътибар дугалары башта чиктәге стенага барып төртелә, аннары Berlin'га җитә, ә ике күчәрле кечкенә яссылыкта чанк векторы вертикальдән кырык биш градуска — сорау нурына таба борыла."},"docHead":{"en":"one document · one boundary · two moments to pool","ru":"один документ · одна граница · два момента усреднить","tt":"бер документ · бер чик · уртачалау өчен ике мизгел"},"chunkA":{"en":"chunk A","ru":"чанк A","tt":"A чанкы"},"chunkB":{"en":"chunk B — the one we score","ru":"чанк B — его и оцениваем","tt":"B чанкы — шуны бәялибез"},"wall":{"en":"the wall","ru":"стена","tt":"стена"},"axisX":{"en":"Berlin-ness","ru":"Berlin-ность","tt":"Berlin-лык"},"axisY":{"en":"population","ru":"население","tt":"халык саны"},"query":{"en":"query q","ru":"запрос q","tt":"сорау q"},"naiveTag":{"en":"naive","ru":"наивно","tt":"наив"},"lateTag":{"en":"late","ru":"поздно","tt":"соң"},"ledgerHead":{"en":"cos(q, chunk B)","ru":"cos(q, чанк B)","tt":"cos(q, B чанкы)"},"legNote":{"en":"same boundary, same model,","ru":"та же граница, та же модель,","tt":"шул ук чик, шул ук модель,"},"ctxNote":{"en":"each token of B now averages all four → ϑ","ru":"каждый токен B усредняет все четыре → ϑ","tt":"B ның һәр токены дүртесен уртачалый → ϑ"},"legNote2":{"en":"only the moment of pooling moved.","ru":"сдвинут лишь момент усреднения.","tt":"бары уртачалау мизгеле генә күчте."},"s0":{"en":"Four tokens, one chunk boundary after the second. Only «Berlin» and «residents» carry meaning — (4,0) and (0,4) on the two axes. A wall stands in the boundary: nothing may read across it.","ru":"Четыре токена, граница чанка после второго. Смысл несут только «Berlin» и «residents» — (4,0) и (0,4) по двум осям. В границе стоит стена: читать сквозь неё нельзя.","tt":"Дүрт токен, икенчесеннән соң чанк чиге. Мәгънәне бары «Berlin» белән «residents» йөртә — ике күчәр буенча (4,0) һәм (0,4). Чиктә стена тора: аның аша уку мөмкин түгел."},"s1":{"en":"Naive: chunk B is encoded ALONE. Each of its tokens can only average what it reads inside the chunk, so both come out (0,2) and the pooled chunk vector points straight up — cos to the query is exactly 0. The chunk is about residents in general.","ru":"Наивно: чанк B кодируется В ОДИНОЧКУ. Каждый его токен усредняет лишь то, что читает внутри чанка, — оба выходят (0,2), и вектор чанка смотрит строго вверх: косинус к запросу ровно 0. Чанк — про жителей вообще.","tt":"Наив: B чанкы ЯЛГЫЗЫ кодлана. Аның һәр токены чанк эчендә укыганын гына уртачалый — икесе дә (0,2) килеп чыга, ә чанк векторы төп-төз өскә карый: сорауга косинус нәкъ 0. Чанк гомумән халык турында."},"s2":{"en":"Now encode the whole document instead. The wall falls, and the attention arcs from «Its» and «residents» reach across the boundary to «Berlin». Nothing about the cut has changed — only what the encoder was allowed to see.","ru":"Теперь кодируем весь документ. Стена падает, и дуги внимания от «Its» и «residents» дотягиваются через границу до «Berlin». Про разрез ничего не изменилось — изменилось лишь то, что энкодеру дали увидеть.","tt":"Хәзер бөтен документны кодлыйбыз. Стена ега, «Its» һәм «residents»тан игътибар дугалары чик аша «Berlin»га җитә. Кисү турында берни үзгәрмәде — бары энкодерга күрергә рөхсәт ителгәне генә."},"s3":{"en":"One rule, applied twice: a token's vector is the average of what it may read. Reading all four tokens, both chunk-B tokens become (1,1) — «Berlin-ness» has been written into the pronoun before anyone pooled anything.","ru":"Одно правило, применённое дважды: вектор токена — среднее того, что он может прочитать. Читая все четыре токена, оба токена чанка B становятся (1,1): «Berlin-ность» вписана в местоимение ещё до того, как кто-либо усреднял.","tt":"Бер кагыйдә, ике тапкыр кулланылган: токен векторы — ул укый алганының уртачасы. Дүрт токенны да укыгач, B чанкының ике токены да (1,1) була: «Berlin-лык» алмашлыкка кемдер уртачалаганчы ук язылган."},"s4":{"en":"Pool the SAME segment — and the chunk vector has turned 45° onto the query ray: cos 0 → 0.7071. Note it also got shorter, from 2 to √2: reading more spreads the average thinner. Hold that thought for the Needle test.","ru":"Усредняем ТОТ ЖЕ сегмент — и вектор чанка повернулся на 45° к лучу запроса: cos 0 → 0,7071. Заметь, он ещё и укоротился, с 2 до √2: чем больше читаешь, тем тоньше размазано среднее. Запомни это до теста Needle.","tt":"ШУЛ УК сегментны уртачалыйбыз — һәм чанк векторы сорау нурына 45° борылган: cos 0 → 0,7071. Игътибар ит, ул кыскарган да: 2-дән √2-гә. Күбрәк укыган саен уртача юкарак җәелә. Needle сынавына кадәр шуны истә тот."},"s5":{"en":"Both vectors at once. Same document, same boundary, same model, the same one vector out — the only thing that moved is WHEN the average was taken. That is the whole method.","ru":"Оба вектора разом. Тот же документ, та же граница, та же модель, столько же векторов на выходе — сдвинулось только то, КОГДА взято среднее. В этом весь приём.","tt":"Ике вектор бергә. Шул ук документ, шул ук чик, шул ук модель, чыгышта шул ук вектор — бары уртача КАЙЧАН алынганы гына күчте. Методның бөтен җисеме шул."}},"title":{"en":"The pooling lab: cut before or after attention","ru":"Лаборатория пулинга: резать до внимания или после","tt":"Pooling лабораториясе: игътибарга кадәр кисәргәме, соңмы"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"st
