Dense":2,"score":0.032},{"id":"D1","rSparse":1,"rDense":5,"score":0.0318},{"id":"D4","rSparse":4,"rDense":3,"score":0.0315},{"id":"D5","rSparse":5,"rDense":4,"score":0.031}],"note":"D1 is the sparse #1 (lexical match) but dense ranks it last; the consensus doc D2 wins. RRF rewards agreement."},"dataSets":{"l8-hybrid":{"_doc":"Hybrid retrieval / RRF. Toy = hand-computable reciprocal-rank fusion, k=60 (stdlib): score = 1/(k+rSparse) + 1/(k+rDense). The consensus doc D2 (0.0325) wins; the sparse favourite D1 — dense ranks it last — falls to 3rd (0.0318).","_source":"_research/gen_l8.py (toy, stdlib). Callback BEIR numbers live in data/l3-benchmarks.json (not duplicated).","k":60,"docs":["D1","D2","D3","D4","D5"],"sparse":{"label":"BM25 / SPLADE","order":["D1","D2","D3","D4","D5"]},"dense":{"label":"SBERT (dense)","order":["D2","D3","D4","D5","D1"]},"fused":[{"id":"D2","rSparse":2,"rDense":1,"score":0.0325},{"id":"D3","rSparse":3,"rDense":2,"score":0.032},{"id":"D1","rSparse":1,"rDense":5,"score":0.0318},{"id":"D4","rSparse":4,"rDense":3,"score":0.0315},{"id":"D5","rSparse":5,"rDense":4,"score":0.031}],"note":"D1 is the sparse #1 (lexical match) but dense ranks it last; the consensus doc D2 wins. RRF rewards agreement."}},"i18n":{"_doc":"Column heads + step captions for hybrid-fusion (SVG). EN canonical + RU (native) + TT. Doc ids, ranks and scores live in data/l8-hybrid.json (k=60).","alt":{"en":"Three ranked columns — a sparse ranker, a dense ranker, and the RRF-fused result — where the consensus document rises to the top of the fused column while the sparse favourite falls to third.","ru":"Три ранжированных столбца — разрежённый ранкер, плотный и итог слияния RRF — где консенсусный документ поднимается наверх итогового столбца, а фаворит разрежённого падает на третье место.","tt":"Өч ранжланган баган — сирәк ранжлаучы, тыгыз һәм RRF берләштерүе нәтиҗәсе — анда консенсус документ нәтиҗә баганасының өскә күтәрелә, ә сирәкнең фавориты өченче урынга төшә."},"headSparse":
