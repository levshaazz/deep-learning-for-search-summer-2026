иатура ЙЦУКЕН/QWERTY с двумя буквами на каждой клавише, имитация строки запроса и игрушечный корпус. Запрос, набранный не в той раскладке, не находит ничего; карта раскладки чинит его и сохраняет ё с клавиши обратного апострофа; в этом запросе отдельно выбрана е вместо ё; свёртка ё в е в обоих плечах находит документ; запрос-гомоглиф, набранный латинскими двойниками, попиксельно совпадает с настоящим словом и всё-таки не находит ничего, пока не включена confusables-нормализация. Лесенка полноты считает, сколько стоит каждая починка, а тумблер показывает: свернуть только на индексе — значит вернуть полноту в ноль.","tt":"Һәр клавишасында ике хәреф булган ЙЦУКЕН/QWERTY клавиатурасы, сорау юлы имитациясе һәм уенчык корпус. Дөрес булмаган макетта язылган сорау бернәрсә дә тапмый; макет картасы аны төзәтә һәм кире апостроф клавишасындагы ё ны саклый; бу сорауда аерым рәвештә ё урынына е сайланган; ике якта да ё-ны е-гә җыю документны таба; латин игезәкләре белән язылган гомоглиф-сорау чын сүз белән пиксельгә кадәр туры килә, ләкин confusables-нормальләштерү кабызылганчы бернәрсә дә тапмый. Тулылык баскычы һәр төзәтүнең бәясен саный, ә тумблер күрсәтә: бары тик индекста гына җыю — тулылыкны нульгә кайтару дигән сүз."},"s0":{"en":"A real user query. They forgot to switch the layout, so the fingers typed Russian and the machine received Latin. Not a single document matches — and the search log will record this as «no results», not as «a typo».","ru":"Настоящий пользовательский запрос. Человек забыл переключить раскладку, поэтому пальцы набрали русское, а машина получила латиницу. Ни одного документа — и в логе поиска это осядет как «ничего не нашлось», а не как «опечатка».","tt":"Чын кулланучы сорауы. Кеше макетны күчерергә оныткан, шуңа бармаклар русча язган, ә машина латинча алган. Бер документ та юк — һәм эзләү журналында бу «бернәрсә табылмады» булып кала, «хата» булып түгел."},"s1":{"en":"Switch the layout map on: key by key, the Latin string turns back into Russian. But look at the key marked in red — ё does not sit among the letters, it sits on the backtick, and the map preserves it when that key was pressed. This query uses е instead, a separate spelling choice.","ru":"Включи карту раскладки: клавиша за клавишей латинская строка превращается обратно в русскую. Но посмотри на клавишу, отмеченную красным: ё живёт не среди букв, а на обратном апострофе, и карта сохраняет её, если нажата эта клавиша. В этом запросе е вместо ё — отдельный орфографический выбор.","tt":"Макет картасын кабыз: клавиша артыннан клавиша латин юлы кире русчага әйләнә. Ләкин кызыл белән билгеләнгән клавишага кара: ё хәрефләр арасында түгел, ә кире апострофта яши, һәм бу клавиша басылганда карта аны саклый. Бу сорауда ё урынына е язу — аерым орфографик сайлау."},"s2":{"en":"The repaired query meets the corpus — and still finds nothing. The document is spelled with ё, the query with е. To a human they are the same word; to the index they are two different terms, different bytes, different postings lists.","ru":"Починенный запрос встречается с корпусом — и всё равно ничего не находит. В документе написано через ё, в запросе через е. Для человека это одно слово, для индекса — два разных терма, разные байты, разные постинг-листы.","tt":"Төзәтелгән сорау корпус белән очраша — һәм барыбер бернәрсә дә тапмый. Документта ё аша язылган, сорауда е аша. Кеше өчен бу бер сүз, индекс өчен — ике төрле терм, төрле байтлар, төрле кергәннәр исемлекләре."},"s3":{"en":"Fold ё to е in BOTH arms — in the analyser and in the query pipeline — and the document is found. Recall starts climbing. Now press the toggle and fold it on the index only: recall drops straight back to zero. A one-armed normalisation is worse than none.","ru":"Сверни ё в е в ОБОИХ плечах — и в аналайзере, и в конвейере запроса — и документ находится. Полнота пошла вверх. А теперь нажми тумблер и сверни только на индексе: полнота падает обратно в ноль. Односторонняя нормализация хуже, чем никакой.","tt":"ё-ны е-гә ИКЕ якта да җый — анализаторда да, сорау конвейерында да — һәм документ табыла. Тулылык үсә башлады. Ә хәзер тумблерга бас һәм бары тик индекста гына җый: тулылык кире нульгә төшә. Бер яклы нормальләштерү бөтенләй юктан да начаррак."},"s4":{"en":"A different cut, same wound. This query looks exactly like the real word — but several of its letters are Latin twins of Cyrillic ones. Same pixels, different code points, and a score of exactly zero. This is how spam gets past filters and how deduplication breaks.","ru":"Другой порез, та же рана. Этот запрос выглядит в точности как настоящее слово — но несколько его букв латинские двойники кириллических. Те же пиксели, другие кодовые точки и скор ровно ноль. Так спам проходит мимо фильтров и так ломается дедупликация.","tt":"Башка кисем, шул ук яра. Бу сорау нәкъ чын сүз кебек күренә — ләкин аның берничә хәрефе кирилл хәрефләренең латин игезәкләре. Шул ук пикселләр, башка код нокталары һәм нәкъ нуль балл. Спам фильтрлар яныннан шулай уза һәм дедупликация шулай ватыла."},"s5":{"en":"Confusables normalisation (Unicode UTS #39) maps the Latin twins back onto Cyrillic and the word is found. Read the ladder: each repair is worth a measured amount, and every one of them obeys the same rule — normalise in BOTH arms, or you make things worse than doing nothing.","ru":"Confusables-нормализация (Unicode UTS #39) возвращает латинских двойников в кириллицу, и слово находится. Прочти лесенку: каждая починка стоит измеренной прибавки, и каждая подчиняется одному правилу — нормализуй в ОБОИХ плечах, иначе сделаешь хуже, чем если бы не делал ничего.","tt":"Confusables-нормальләштерү (Unicode UTS #39) латин игезәкләрен кириллицага кайтара, һәм сүз табыла. Баскычны укы: һәр төзәтү үлчәнгән өстәмә бирә, һәм һәрберсе бер кагыйдәгә буйсына — ИКЕ якта да нормальләштер, юкса бөтенләй эшләмәгәннән дә начаррак ясарсың."},"kbTag":{"en":"one key, two letters","ru":"одна клавиша — две буквы","tt":"бер клавиша — ике хәреф"},"typedTag":{"en":"what the machine received","ru":"что получила машина","tt":"машина нәрсә алды"},"queryTag":{"en":"the query","ru":"строка запроса","tt":"сорау юлы"},"corpusTag":{"en":"the corpus","ru":"корпус","tt":"корпус"},"fixLayout":{"en":"layout map","ru":"карта раскладки","tt":"макет картасы"},"fixYo":{"en":"ё → е, both arms","ru":"ё → е, оба плеча","tt":"ё → е, ике як"},"fixConfus":{"en":"confusables (UTS #39)","ru":"confusables (UTS #39)","tt":"confusables (UTS #39)"},"startNote":{"en":"the fingers typed Russian, the machine received Latin","ru":"пальцы набрали русское, машина получила латиницу","tt":"бармаклар русча язган, машина латинча алган"},"yoLostTmpl":{"en":"«{letter}» lives on the «{key}» key — the layout map preserves it","ru":"«{letter}» живёт на клавише «{key}» — карта раскладки сохраняет её","tt":"«{letter}» «{key}» клавишасында яши — макет картасы аны саклый"},"yoPlaque":{"en":"ё ≠ е: same word to a human, two terms to the index","ru":"ё ≠ е: для человека одно слово, для индекса — два терма","tt":"ё ≠ е: кеше өчен бер сүз, индекс өчен — ике терм"},"yoFixed":{"en":"folded in both arms — the document is found","ru":"свёрнуто в обоих плечах — документ находится","tt":"ике якта да җыелды — документ табыла"},"homoNote":{"en":"{n} of these letters are Latin — same pixels, different code points","ru":"{n} буквы здесь латинские — те же пиксели, другие кодовые точки","tt":"монда {n} хәреф латин — шул ук пиксельләр, башка код нокталары"},"homoFixed":{"en":"the Latin twins are mapped back onto Cyrillic — the word is found","ru":"латинские двойники возвращены в кириллицу — слово находится","tt":"латин игезәкләре кириллицага кайтарылды — сүз табыла"},"cpReal":{"en":"the real word","ru":"настоящее слово","tt":"чын сүз"},"cpFake":{"en":"the homoglyph query","ru":"запрос-гомоглиф","tt":"гомоглиф-сорау"},"foundTmpl":{"en":"found: {n} of {N}","ru":"найдено: {n} из {N}","tt":"табылды: {N} документтан {n}"},"recallTmpl":{"en":"recall: {a} → {b}","ru":"полнота: {a} → {b}","tt":"тулылык: {a} → {b}"},"oneArm":{"en":"one-armed normalisation: index only","ru":"односторонняя нормализация: только индекс","tt":"бер яклы нормальләштерү: бары индекс"},"oneArmWarn":{"en":"only one arm is normalised — worse than doing nothing","ru":"нормализовано только одно плечо — хуже, чем ничего","tt":"бары бер як нормальләштерелгән — бернәрсә эшләмәүдән дә начаррак"},"ladderTag":{"en":"the recall ladder, measured on the ё/е toy corpus","ru":"лесенка полноты, измеренная на игрушечном корпусе ё/е","tt":"ё/е уенчык корпусында үлчәнгән тулылык баскычы"},"ladderRaw":{"en":"no fix","ru":"без починки","tt":"төзәтүсез"},"ladderBoth":{"en":"ё→е, both arms","ru":"ё→е, оба плеча","tt":"ё→е, ике як"},"ladderStem":{"en":"+ stemming","ru":"+ стемминг","tt":"+ стемминг"},"ladderOne":{"en":"index arm only","ru":"только плечо индекса","tt":"бары индекс ягы"},"ruleLine":{"en":"normalise in BOTH arms — otherwise you make it worse than nothing","ru":"нормализуй в ОБОИХ плечах — иначе сделаешь хуже, чем ничего","tt":"ИКЕ якта да нормальләштер — юкса бернәрсә эшләмәүдән дә начаррак ясарсың"}},"title":{"en":"Cuts: layout · ё/е · homoglyph","ru":"Порезы: раскладка · ё/е · гомоглиф","tt":"Кисемнәр: макет · ё/е · гомоглиф"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"},{"step":5,"labelKey":"s5"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
