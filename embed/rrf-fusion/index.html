ankBm25":4,"rankCosine":3},{"id":"D7","rrf":0.031498,"contributions":{"bm25":0.015873,"cosine":0.015625},"rankBm25":3,"rankCosine":4},{"id":"D0","rrf":0.030536,"contributions":{"bm25":0.015152,"cosine":0.015385},"rankBm25":6,"rankCosine":5},{"id":"D5","rrf":0.03031,"contributions":{"bm25":0.015385,"cosine":0.014925},"rankBm25":5,"rankCosine":7},{"id":"D4","rrf":0.030077,"contributions":{"bm25":0.014925,"cosine":0.015152},"rankBm25":7,"rankCosine":6},{"id":"D1","rrf":0.029412,"contributions":{"bm25":0.014706,"cosine":0.014706},"rankBm25":8,"rankCosine":8}],"order":["D6","D3","D2","D7","D0","D5","D4","D1"]},"dataSets":{"l3-rrf":{"_doc":"Rank fusion for L3 climb-rrf: two rankers (BM25 vs TF-IDF cosine) fused with RRF (k=60).","_source":"_research/gen_l3.py · 20 Newsgroups (sci.space, rec.sport.hockey), 8 shortest docs, deterministic","k":60,"lists":{"bm25":["D6","D3","D7","D2","D5","D0","D4","D1"],"cosine":["D6","D3","D2","D7","D0","D4","D5","D1"]},"fused":[{"id":"D6","rrf":0.032787,"contributions":{"bm25":0.016393,"cosine":0.016393},"rankBm25":1,"rankCosine":1},{"id":"D3","rrf":0.032258,"contributions":{"bm25":0.016129,"cosine":0.016129},"rankBm25":2,"rankCosine":2},{"id":"D2","rrf":0.031498,"contributions":{"bm25":0.015625,"cosine":0.015873},"rankBm25":4,"rankCosine":3},{"id":"D7","rrf":0.031498,"contributions":{"bm25":0.015873,"cosine":0.015625},"rankBm25":3,"rankCosine":4},{"id":"D0","rrf":0.030536,"contributions":{"bm25":0.015152,"cosine":0.015385},"rankBm25":6,"rankCosine":5},{"id":"D5","rrf":0.03031,"contributions":{"bm25":0.015385,"cosine":0.014925},"rankBm25":5,"rankCosine":7},{"id":"D4","rrf":0.030077,"contributions":{"bm25":0.014925,"cosine":0.015152},"rankBm25":7,"rankCosine":6},{"id":"D1","rrf":0.029412,"contributions":{"bm25":0.014706,"cosine":0.014706},"rankBm25":8,"rankCosine":8}],"order":["D6","D3","D2","D7","D0","D5","D4","D1"]}},"i18n":{"alt":{"en":"Reciprocal Rank Fusion merges two ranked lists by summing 1/(k+rank), so a document ranked high in either list rises in the combined order.","ru":"Reciprocal Rank Fusion сливает два ранжированных списка, суммируя 1/(k+ранг), поэтому документ, высоко стоящий хотя бы в одном списке, поднимается в общем порядке.","tt":"Reciprocal Rank Fusion ике ранжланган исемлекне 1/(k+ранг) кушып берләштерә, шуңа берәр исемлектә югары торган документ гомуми тәртиптә күтәрелә."},"_doc":"Column heads + step captions for rrf-fusion. EN canonical + RU; no TT. Doc ids, ranks and scores live in data/l3-rrf.json (k=60).","headBm25":{"en":"BM25","ru":"BM25","tt":"BM25"},"headCosine":{"en":"Cosine","ru":"Косинус","tt":"Косинус"},"headFused":{"en":"Fused (RRF)","ru":"Слияние (RRF)","tt":"Берләштерү (RRF)"},"tblDoc":{"en":"Doc","ru":"Док","tt":"Док"},"tblRrf":{"en":"Σ 1/(k+r)","ru":"Σ 1/(k+r)","tt":"Σ 1/(k+r)"},"tieNote":{"en":"{a} and {b} TIE at {score}: {a} = 1/({k}+{ar1})+1/({k}+{ar2}), {b} = 1/({k}+{br1})+1/({k}+{br2}) — same sum, the ranks just swapped between the two lists.","ru":"У {a} и {b} РАВНЫЕ оценки: {score}: {a} = 1/({k}+{ar1})+1/({k}+{ar2}), {b} = 1/({k}+{br1})+1/({k}+{br2}) — сумма та же, ранги лишь поменялись местами между списками.","tt":"{a} һәм {b} {score}'та ТИГЕЗ: {a} = 1/({k}+{ar1})+1/({k}+{ar2}), {b} = 1/({k}+{br1})+1/({k}+{br2}) — сумма шул ук, ранглар ике исемлек арасында урыннарын гына алыштырган."},"upsetNote":{"en":"{loser} was ranked {lbest} by one ranker, yet {winner} — only ({wr1},{wr2}) — outscores it ({ws} > {ls}): middling by both beats high by just one.","ru":"{loser} занял {lbest}-е место у одного ранкера, но {winner} — лишь ({wr1},{wr2}) — обходит его ({ws} > {ls}): средне у обоих лучше, чем высоко лишь у одного.","tt":"{loser} бер ранжлаучыда {lbest}-нче урынны алды, әмма {winner} — бары ({wr1},{wr2}) — аны узып китә ({ws} > {ls}): икесендә дә уртача бер генә җирдә югары булудан яхшырак."},"s0":{"en":"Two rankers, two different orders. BM25 and cosine similarity each return the same documents — but they disagree on the order, and their scores live on scales you can't compare directly.","ru":"Два ранкера, два разных порядка. BM25 и косинусная близость возвращают одни и те же документы — но расходятся в порядке, и их оценки лежат на несравнимых шкалах.","tt":"Ике ранжлаучы, ике төрле тәртип. BM25 һәм косинус охшашлык икесе дә шул ук документларны кайтара — әмма тәртиптә ризалашмыйлар, һәм аларның балллары турыдан-туры чагыштырып булмаслык шкалаларда ята."},"s1":{"en":"Forget the raw scores — each list votes with 1/(k+rank), k=60. A doc near the top of a list casts a big vote; a doc lower down casts a smaller one. The same document gets one reciprocal-rank vote from each ranker.","ru":"Забудь про сырые оценки — каждый список голосует величиной 1/(k+rank), k=60. Документ у вершины списка получает большой голос; ниже — меньший. Один и тот же документ получает по голосу от каждого ранкера.","tt":"Чи балларны онытыгыз — һәр исемлек 1/(k+rank), k=60 зурлыгы белән тавыш бирә. Исемлек башындагы документ зур тавыш бирә; түбәндәгесе — кечерәк. Бер үк документ һәр ранжлаучыдан берәр кире-ранг тавышы ала."},"s2":{"en":"Sum the reciprocal ranks across lists: RRF = Σ 1/(k+rank). This document scored near the top in both rankers, so its two votes add up to the largest combined score.","ru":"Суммируем обратные величины рангов со сдвигом по спискам: RRF = Σ 1/(k+rank). Этот документ оказался у вершины в обоих ранкерах, поэтому два его голоса складываются в наибольшую суммарную оценку.","tt":"Кире рангларны исемлекләр буенча кушабыз: RRF = Σ 1/(k+rank). Бу документ ике ранжлаучыда да баш тирәсендә булды, шуңа күрә аның ике тавышы иң зур җыелма баллга кушыла."},"s3":{"en":"Sort every document by its summed score and you get the fused ranking. A document ranked well by both lists rises to the top — rank-based fusion is robust to incomparable score scales, no calibration needed.","ru":"Сортируем все документы по суммарной оценке — получаем итоговое слияние. Документ, высоко оценённый обоими списками, поднимается наверх: слияние по рангам устойчиво к несравнимым шкалам оценок и не требует калибровки.","tt":"Барлык документларны җыелма балл буенча тәртипкә салабыз — йомгак берләштерүне алабыз. Ике исемлек тә югары бәяләгән документ өскә күтәрелә: ранглар буенча берләштерү чагыштырып булмаслык балл шкалаларына тотрыклы һәм калибровка таләп итми."},"s4":{"en":"Now read the full table: two effects rank-based fusion makes visible. A TIE — two docs each ranker saw differently land on the same sum because their ranks just swapped — and an UPSET — a doc only middling in both lists outscores one ranked high by just one. Balanced beats lopsided.","ru":"Теперь прочитай полную таблицу: два эффекта, которые делает видимыми слияние по рангам. РАВЕНСТВО — два документа, по-разному увиденные ранкерами, дают одинаковую сумму, потому что их ранги просто поменялись местами — и ПЕРЕВОРОТ — документ, средний в обоих списках, обходит того, кто высоко лишь у одного. В этом примере сбалансированность побеждает перекос.","tt":"Хәзер тулы таблицаны укыгыз: ранглар буенча берләштерү күрсәтә торган ике эффект. ТИГЕЗЛЕК — ранжлаучылар төрлечә күргән ике документ бер үк суммага килә, чөнки аларның ранглары урыннарын алыштырган — һәм ӨСТЕНЛЕК — ике исемлектә дә уртача документ бары берсендә генә югары булганны узып китә. Тигезлек авышлыкны җиңә."}},"title":{"en":"Reciprocal Rank Fusion","ru":"Слияние по обратным рангам (RRF)"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
