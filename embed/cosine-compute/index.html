</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>Cosine, computed step by step</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="4" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>4</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"cosine-compute","mountName":"mountCosineCompute","maxStep":4,"data":{"_doc":"Canonical worked example for L2 'First Contact' similarity arc (climb-cosine beat). Single source for the cosine-sphere widget (slide + Book) AND the facts-gate. Pedagogical point: (1,1) and (10,10) point the SAME way → cosine sees them as identical (1.0), but Euclidean treats them as far apart (√162 ≈ 12.73) — length lies.","_source":"_research/data/cosine_examples.json :: classic_pairs (generator output; the facts-gate asserts this file == that artifact)","primary":"same-dir","relation":"‖x − y‖² = 2(1 − cos θ)   (for unit vectors)","pairs":[{"id":"same-dir","name":"same direction, different magnitude","u":[1,1],"v":[10,10],"u_dot_v":20,"normU":1.414214,"normV":14.142136,"cos":1,"angleDeg":0,"euclid":12.727922,"euclidExact":"√162","story":"(1,1) and (10,10) point the same way — cosine sees them as identical (1.0); Euclidean treats them as far apart (≈12.73)."},{"id":"orthogonal","name":"orthogonal","u":[1,0],"v":[0,1],"u_dot_v":0,"normU":1,"normV":1,"cos":0,"angleDeg":90,"euclid":1.414214,"euclidExact":"√2","story":"(1,0) and (0,1) are at 90° — cosine = 0 (no shared direction)."},{"id":"opposite","name":"opposite","u":[1,1],"v":[-1,-1],"u_dot_v":-2,"normU":1.414214,"normV":1.414214,"cos":-1,"angleDeg":180,"euclid":2.828427,"euclidExact":"2√2","story":"(1,1) and (-1,-1) point the opposite way — cosine = -1."}]},"dataSets":{"l2-cosine":{"_doc":"Canonical worked example for L2 'First Contact' similarity arc (climb-cosine beat). Single source for the cosine-sphere widget (slide + Book) AND the facts-gate. Pedagogical point: (1,1) and (10,10) point the SAME way → cosine sees them as identical (1.0), but Euclidean treats them as far apart (√162 ≈ 12.73) — length lies.","_source":"_research/data/cosine_examples.json :: classic_pairs (generator output; the facts-gate asserts this file == that artifact)","primary":"same-dir","relation":"‖x − y‖² = 2(1 − cos θ)   (for unit vectors)","pairs":[{"id":"same-dir","name":"same direction, different magnitude","u":[1,1],"v":[10,10],"u_dot_v":20,"normU":1.414214,"normV":14.142136,"cos":1,"angleDeg":0,"euclid":12.727922,"euclidExact":"√162","story":"(1,1) and (10,10) point the same way — cosine sees them as identical (1.0); Euclidean treats them as far apart (≈12.73)."},{"id":"orthogonal","name":"orthogonal","u":[1,0],"v":[0,1],"u_dot_v":0,"normU":1,"normV":1,"cos":0,"angleDeg":90,"euclid":1.414214,"euclidExact":"√2","story":"(1,0) and (0,1) are at 90° — cosine = 0 (no shared direction)."},{"id":"opposite","name":"opposite","u":[1,1],"v":[-1,-1],"u_dot_v":-2,"normU":1.414214,"normV":1.414214,"cos":-1,"angleDeg":180,"euclid":2.828427,"euclidExact":"2√2","story":"(1,1) and (-1,-1) point the opposite way — cosine = -1."}]}},"i18n":{"alt":{"en":"Cosine similarity worked by hand: the dot product divided by the product of the two vector norms — measuring direction, not magnitude.","ru":"Косинусная близость вручную: скалярное произведение, делённое на произведение норм двух векторов — измеряет направление, а не длину.","tt":"Косинус якынлыгы кулдан: ике векторның нормалары тапкырчыгышына бүленгән скаляр тапкырчыгыш — озынлыкны түгел, юнәлешне үлчи."},"_doc":"Step captions + small labels for cosine-compute (the ARITHMETIC of cosine: dot → norms → ratio). EN canonical + RU; TT falls back to EN. All numbers come from data/l2-cosine.json primary pair 'same-dir': a=(1,1), b=(10,10), a·b=20, ‖a‖=√2≈1.414214, ‖b‖=√200≈14.142136, cos=1.0. Captions are prose for the scroll-steps; the widget's own row text is built from the data in logic.js.","vecHeadA":{"en":"vector a","ru":"вектор a","tt":"вектор a"},"vecHeadB":{"en":"vector b","ru":"вектор b","tt":"вектор b"},"dotHead":{"en":"dot product  a·b","ru":"скалярное произведение  a·b","tt":"скаляр тапкырчыгыш  a·b"},"normHead":{"en":"lengths  ‖a‖, ‖b‖","ru":"длины  ‖a‖, ‖b‖","tt":"озынлыклар  ‖a‖, ‖b‖"},"ratioHead":{"en":"cosine  =  a·b ⁄ (‖a‖·‖b‖)","ru":"косинус  =  a·b ⁄ (‖a‖·‖b‖)","tt":"cosine  =  a·b ⁄ (‖a‖·‖b‖)"},"sameDir":{"en":"same direction → 1.0","ru":"одно направление → 1,0","tt":"бер юнәлеш → 1,0"},"s0":{"en":"Two phrases, two vectors of counts: a = (1, 1) and b = (10, 10). Same direction, very different lengths. We are going to compute their cosine by hand — dot product on top, the two lengths underneath — and watch a single number fall out.","ru":"Две фразы, два вектора счётчиков: a = (1, 1) и b = (10, 10). Одно направление, очень разные длины. Сейчас мы вычислим их косинус вручную — скалярное произведение сверху, две длины снизу — и увидим, как выпадает одно число.","tt":"Ике гыйбарә, санаулардан ике вектор: a = (1, 1) һәм b = (10, 10). Бер юнәлеш, бик төрле озынлыклар. Хәзер без аларның cosine-ын кулдан исәпләрбез — өстә скаляр тапкырчыгыш, астта ике озынлык — һәм бер генә сан килеп чыкканын күрербез."},"s1":{"en":"First the numerator: the dot product a·b. Multiply matching coordinates and add — 1·10 plus 1·10 — which gives 20. That single sum measures how much the two vectors pull in the same direction, before any lengths are divided out.","ru":"Сначала числитель: скалярное произведение a·b. Перемножь совпадающие координаты и сложи — 1·10 плюс 1·10 — выходит 20. Эта сумма мерит, насколько два вектора тянут в одну сторону, ещё до того, как поделить на длины.","tt":"Башта санаучы: скаляр тапкырчыгыш a·b. Туры килгән координаталарны тапкырла да куш — 1·10 плюс 1·10 — 20 чыга. Бу сумма ике вектор бер якка никадәр тартканын үлчи, әле озынлыкларга бүленгәнче үк."},"s2":{"en":"Now the denominator: each vector's length, ‖a‖ = √(1² + 1²) = √2 ≈ 1.41 and ‖b‖ = √(10² + 10²) = √200 ≈ 14.14. Two irrational radicals — not numbers you can divide by cleanly yet.","ru":"Теперь знаменатель: длина каждого вектора, ‖a‖ = √(1² + 1²) = √2 ≈ 1,41 и ‖b‖ = √(10² + 10²) = √200 ≈ 14,14. Два иррациональных корня — на них пока не поделишь начисто.","tt":"Хәзер бүлүче: һәр векторның озынлыгы, ‖a‖ = √(1² + 1²) = √2 ≈ 1,41 һәм ‖b‖ = √(10² + 10²) = √200 ≈ 14,14. Ике иррациональ тамыр — әле аларга чиста итеп бүлеп булмый."},"s3":{"en":"Multiply the two lengths and the radicals cancel: √2 · √200 = √400 = 20 — a clean integer. That is exactly the scale we need to divide the loudness out of the dot product.","ru":"Перемножь две длины — и корни сокращаются: √2 · √200 = √400 = 20 — ровное целое. Ровно тот масштаб, на который нужно поделить, чтобы убрать громкость из скалярного произведения.","tt":"Ике озынлыкны тапкырла — тамырлар кыскара: √2 · √200 = √400 = 20 — төгәл бөтен сан. Нәкъ скаляр тапкырчыгыштан көчлелекне бүлеп алу өчен кирәкле масштаб."},"s4":{"en":"Divide the dot product by the product of lengths: cos θ = 20 ⁄ (√2 · √200) = 20 ⁄ 20 = 1.0. The magnitudes cancelled perfectly — only direction survived. Cosine = 1.0 means a and b point exactly the same way: as similar as it gets.","ru":"Подели скалярное произведение на произведение длин: cos θ = 20 ⁄ (√2 · √200) = 20 ⁄ 20 = 1,0. Величины сократились идеально — выжило только направление. Косинус = 1,0 значит, что a и b смотрят ровно в одну сторону: максимально похожи.","tt":"Скаляр тапкырчыгышны озынлыклар тапкырчыгышына бүл: cos θ = 20 ⁄ (√2 · √200) = 20 ⁄ 20 = 1,0. Зурлыклар идеаль кыскарды — бары тик юнәлеш кенә калды. Cosine = 1,0 a белән b нәкъ бер якка караганын аңлата: мөмкин кадәр охшаш."}},"title":{"en":"Cosine, computed step by step","ru":"Косинус, вычисляемый шаг за шагом","tt":"Косинус, адымлап исәпләнгән"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
