callAt1":1},{"ef":4,"candidatesEvaluated":15,"recallAt1":1},{"ef":8,"candidatesEvaluated":15,"recallAt1":1},{"ef":16,"candidatesEvaluated":26,"recallAt1":1}]}},"l9-ivf":{"_doc":"IVF coarse-quantizer + cell probing. Toy = 9 points, nlist=3 frozen centroids, query q in cell c0 (stdlib). True 3-NN = 2 points in c0 + 1 just across the border in c1. nprobe=1 probes c0 only → 2/3 → recall@3 = 0.6667; nprobe=2 also probes c1 (the 2nd-nearest cell) → 3/3 → 1.0. COMMITTED GEOMETRY is asserted here and in provenance_l9: exactly 2 NN in c0, the 3rd in c1, AND c1 is the 2nd-nearest cell to q (cellRankByDist[1]==c1) — else nprobe=2 would not reach the 3rd NN and recall would not climb 0.6667→1.0. Real = frozen FAISS IVF-PQ recall vs nprobe (gen_l9_real.py).","_source":"_research/gen_l9.py (toy, stdlib) + gen_l9_real.py (FAISS IVF-PQ, /usr/bin/python3)","toy":{"points":[[2.5,2.2],[3,2.8],[4,2],[1.5,1.5],[1,3],[6,1],[5.5,3],[2,6],[3,6.5]],"assign":[0,0,1,0,0,1,1,2,2],"centroids":[[2,2],[5,2],[2,6]],"query":[3,2],"queryCell":0,"nlist":3,"k":3,"trueNN":[0,1,2],"cellRankByDist":[0,1,2],"probe":{"1":{"cells":[0],"found":[0,1],"recall":0.6667},"2":{"cells":[0,1],"found":[0,1,2],"recall":1}}},"toy2":{"_doc":"nprobe sweep: 20 frozen points, nlist=5 committed centroids, k=5. The 5 true-NN are distributed across the first 3 cells-by-distance (3 in c0, 1 in c4, 1 in c1), so probing more cells climbs recall 0.6 -> 0.8 -> 1.0. cellRankByDist orders cells by centroid-to-q distance; nprobe takes the first n of them. Fractions are exact (found / 5).","points":[[5,4],[4,5],[6,6],[8,7],[9,4],[2,2],[12,4],[13,5],[11,3],[4,12],[5,13],[3,11],[12,12],[13,13],[11,11],[10,9],[11,10],[9,8],[1,9],[9,1]],"assign":[0,0,0,4,1,0,1,1,1,2,2,2,3,3,3,4,4,4,2,1],"centroids":[[4,4],[12,4],[4,12],[12,12],[10,9]],"query":[5,5],"queryCell":0,"nlist":5,"k":5,"trueNN":[0,1,2,3,4],"cellRankByDist":[0,4,1,2,3],"sweep":[{"nprobe":1,"cellsProbed":[0],"pointsScanned":4,"found":[0,1,2],"recall":0.6},{"nprobe":2,"cellsProbed":[0,4],"pointsScanned":8,"found":[0,1,2,3],"recall":0.8},{"nprobe":3,"cellsProbed":[0,4,1],"pointsScanned":13,"found":[0,1,2,3,4],"recall":1},{"nprobe":4,"cellsProbed":[0,4,1,2],"pointsScanned":17,"found":[0,1,2,3,4],"recall":1},{"nprobe":5,"cellsProbed":[0,4,1,2,3],"pointsScanned":20,"found":[0,1,2,3,4],"recall":1}]}}},"i18n":{"_doc":"Step captions + small labels for recall-curve, a generic recall-vs-knob plot reused for the HNSW ef-sweep (l9-hnsw.efSweep.sweep) and the IVF nprobe-sweep (l9-ivf.toy2.sweep). Every NUMBER (recall values, ef/nprobe knob ticks, candidatesEvaluated / pointsScanned costs) comes from the data JSON, never from these strings. The captions describe the SHARED shape (recall climbs with the knob at rising cost); a slide passes labels.series ('ef'|'nprobe') to pick the curve.","alt":{"en":"A line plot of recall on the y-axis against a search knob (ef or nprobe) on the x-axis; recall climbs to 1.0 as the knob grows, and a small number under each point shows the cost (candidates evaluated or points scanned).","ru":"Линейный график полноты по оси y против регулятора поиска (ef или nprobe) по оси x; полнота растёт до 1,0 с ростом регулятора, а маленькое число под каждой точкой — это стоимость (оценённые кандидаты или просмотренные точки).","tt":"y күчәрендә recall, x күчәрендә эзләү көйләгече (ef яки nprobe) сызыклы графигы; көйләгеч үскәндә recall 1.0 гә күтәрелә, ә һәр нокта астындагы кечкенә сан — бәя (бәяләнгән кандидатлар яки каралган нокталар)."},"yaxis":{"en":"recall","ru":"полнота","tt":"recall"},"efKnob":{"en":"ef (candidate-list width)","ru":"ef (ширина списка кандидатов)","tt":"ef (кандидатлар исемлеге киңлеге)"},"nprobeKnob":{"en":"nprobe (cells probed)","ru":"nprobe (просматриваемых ячеек)","tt":"nprobe (тикшерелгән күзәнәкләр)"},"efCost":{"en":"candidates evaluated","ru":"оценено кандидатов","tt":"бәяләнгән кандидатлар"},"nprobeCost":{"en":"points scanned","ru":"просмотрено точек","tt":"каралган нокталар"},"costPrefix":{"en":"small number under each point =","ru":"маленькое число под точкой =","tt":"нокта астындагы кечкенә сан ="},"s0":{"en":"Start with the cheapest setting of the knob: the smallest candidate list (ef) or the fewest probed cells (nprobe). One point on the curve. At this setting the search is fast but may stop short of the true neighbour — recall can be well below 1.0.","ru":"Начнём с самой дешёвой настройки регулятора: наименьший список кандидатов (ef) или наименьшее число просматриваемых ячеек (nprobe). Одна точка на кривой. Здесь поиск быстр, но может не дойти до истинного соседа — полнота заметно ниже 1,0.","tt":"Көйләгечнең иң арзан көйләнешеннән башлыйк: иң кечкенә кандидатлар исемлеге (ef) яки иң аз тикшерелгән күзәнәкләр (nprobe). Кәкрелектә бер нокта. Биредә эзләү тиз, ләкин чын күршегә җитмәскә мөмкин — recall 1.0 дән шактый түбән."},"s1":{"en":"Turn the knob up one notch. Recall climbs — a wider candidate list (or one more probed cell) reaches a neighbour the cheaper setting missed. The cost number under the point rises too: more work bought the extra recall.","ru":"Поверни регулятор на одну ступень. Полнота растёт — более широкий список кандидатов (или ещё одна ячейка) достаёт соседа, которого дешёвая настройка пропустила. Оценка затрат под точкой тоже растёт: дополнительная полнота куплена работой.","tt":"Көйләгечне бер баскычка күтәр. Recall үсә — киңрәк кандидатлар исемлеге (яки тагын бер күзәнәк) арзан көйләнеш калдырган күршегә җитә. Нокта астындагы бәя саны да арта: өстәмә recall эш белән сатып алынган."},"s2":{"en":"Keep climbing. Once the knob is large enough to keep the true neighbour in the working set, recall reaches 1.0 and flattens — turning the knob further no longer adds neighbours. The curve has a knee.","ru":"Продолжаем подъём. В этом примере, как только значение параметра достаточно велико, чтобы удержать истинного соседа в рабочем наборе, полнота достигает 1,0 и выходит на плато — дальнейшее вращение уже не добавляет соседей. У кривой есть колено.","tt":"Күтәрелүне дәвам итәбез. Көйләгеч чын күршене эш җыелмасында тотарлык зур булгач, recall 1.0 гә җитә һәм тигезләнә — көйләгечне тагын борсаң да күршеләр өстәлми. Кәкрелектә тез бар."},"s3":{"en":"Past the knee, recall stays at 1.0 but the cost keeps climbing — those extra candidates or scanned points are pure overhead. This is the sweet spot to read off: the smallest knob that already gives the recall you need.","ru":"За коленом полнота остаётся 1,0, но стоимость продолжает расти — лишние кандидаты или просмотренные точки уже чистые накладные расходы. Здесь и читается оптимум: наименьший регулятор, уже дающий нужную полноту.","tt":"Тездән соң recall 1.0 да кала, ләкин бәя үсүен дәвам итә — өстәмә кандидатлар яки каралган нокталар инде саф артык чыгым. Менә монда оптимум укыла: кирәкле recall бирә торган иң кечкенә көйләгеч."},"s4":{"en":"The full curve: recall against the knob, each point tagged with its cost. The knob is the recall↔work dial — slide it to the knee and stop. The same plot shape describes HNSW's ef and IVF's nprobe; only the data behind it changes.","ru":"Полная кривая: полнота против регулятора, каждая точка с её стоимостью. Регулятор — это рычаг полнота↔работа: сдвинь его к колену и остановись. Та же форма графика описывает ef в HNSW и nprobe в IVF; меняются лишь данные за ним.","tt":"Тулы кәкрелек: recall көйләгечкә каршы, һәр нокта үз бәясе белән билгеләнгән. Көйләгеч — recall↔эш көйләгече: аны тезгә күчер дә тукта. Шул ук график формасы HNSW ның ef ын һәм IVF ның nprobe ын тасвирлый; бары артындагы мәгълүмат үзгәрә."}},"title":{"en":"Recall vs the knob: ef-sweep and nprobe-sweep","ru":"Recall и регулятор: перебор ef и nprobe","tt":"Recall һәм көйләгеч: ef-свип һәм nprobe-свип"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
