</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>The atlas: the whole course as one funnel of shapes</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="2" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>2</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"ncd-atlas","mountName":"mountNcdAtlas","maxStep":2,"data":{},"dataSets":{},"i18n":{"_doc":"ncd-atlas — the spine: the whole pipeline as ONE circuit, with every other NCD widget as one of its nodes. The argument lives in the ledger's shape column: n tokens → n×m → n×m → m → N×m → K → k → 1. Pooling kills the axis n; the index is the SAME encoder run offline over N docs; everything after it narrows. Structural, no grounded numbers. EN canonical + RU + TT.","alt":{"en":"An atlas of the whole pipeline drawn as a single neural circuit diagram. The top row is the encoder: text becomes token vectors through an embedding table, positional encoding and a stack of transformer blocks, and then pooling collapses the token axis so that a whole passage becomes one vector. A dashed violet wire shows that same encoder being run over N documents ahead of time — that offline run IS the index. The bottom row is the funnel: the index of N documents narrows to K candidates by retrieval, to a handful by reranking, and to a single answer by generation.","ru":"Атлас всего конвейера в виде одной neural circuit diagram. Верхний ряд — кодировщик: текст превращается в токен-векторы через таблицу эмбеддингов, позиционное кодирование и стопку блоков трансформера, а затем пулинг схлопывает ось токенов, и целый пассаж становится одним вектором. Пунктирный фиолетовый провод показывает тот же кодировщик, прогнанный по N документам заранее — этот офлайн-прогон и ЕСТЬ индекс. Нижний ряд — воронка: индекс из N документов сужается до K кандидатов поиском, до горстки — реранком, и до одного ответа — генерацией.","tt":"Бөтен конвейерның атласы бер neural circuit diagram буларак. Өске рәт — кодлаучы: текст эмбеддинг таблицасы, позицион кодлау һәм трансформер блоклары өеме аша токен-векторларга әйләнә, аннары пулинг токен күчәрен җыя, һәм бөтен пассаж бер векторга әйләнә. Пунктир шәмәхә чыбык шул ук кодлаучының N документ буенча алдан җибәрелүен күрсәтә — бу офлайн-үтү индексның ҮЗЕ. Аскы рәт — воронка: N документлы индекс эзләү белән K кандидатка, реранк белән бер учка, генерация белән бер җавапка кими."},"legMap":{"en":"pooling kills n · the index is the encoder run offline · everything after it narrows","ru":"пулинг убивает n · индекс — это кодировщик, прогнанный офлайн · дальше всё только сужается","tt":"пулинг n ны үтерә · индекс — офлайн җибәрелгән кодлаучы · аннан соң барысы кими"},"rowEnc":{"en":"encode — a passage becomes a point","ru":"кодируем — пассаж становится точкой","tt":"кодлыйбыз — пассаж нокта була"},"rowSearch":{"en":"search — N narrows to one","ru":"ищем — N сужается до одного","tt":"эзлибез — N берәүгә кими"},"cText":{"en":"text","ru":"текст","tt":"текст"},"cBlocks":{"en":"× L blocks","ru":"× L блоков","tt":"× L блок"},"cAttn":{"en":"attention","ru":"внимание","tt":"игътибар"},"cPool":{"en":"pool","ru":"пулинг","tt":"пулинг"},"cVec":{"en":"vector  m","ru":"вектор  m","tt":"вектор  m"},"cRetr":{"en":"retrieve","ru":"извлечь","tt":"алу"},"cRerank":{"en":"rerank","ru":"реранк","tt":"реранк"},"cGen":{"en":"generate","ru":"генерация","tt":"генерация"},"cAns":{"en":"answer","ru":"ответ","tt":"җавап"},"offline":{"en":"× N documents, offline — this IS the index","ru":"× N документов, офлайн — это и ЕСТЬ индекс","tt":"× N документ, офлайн — бу индексның ҮЗЕ"},"queryHere":{"en":"the query — same E, online","ru":"запрос — тот же E, онлайн","tt":"сорау — шул ук E, онлайн"},"lgTitle":{"en":"the shape, end to end","ru":"форма, от начала до конца","tt":"форма, башыннан ахырына"},"rText":{"en":"text","ru":"текст","tt":"текст"},"vTok":{"en":"n tokens","ru":"n токенов","tt":"n токен"},"rEmb":{"en":"after E","ru":"после E","tt":"E дан соң"},"rBlocks":{"en":"after ×L blocks","ru":"после ×L блоков","tt":"×L блоктан соң"},"rPool":{"en":"after pooling","ru":"после пулинга","tt":"пулингтан соң"},"rIndex":{"en":"the index","ru":"индекс","tt":"индекс"},"rRetrieve":{"en":"after retrieve","ru":"после извлечения","tt":"алудан соң"},"rRerank":{"en":"after rerank","ru":"после реранка","tt":"реранктан соң"},"rAnswer":{"en":"the answer","ru":"ответ","tt":"җавап"},"lgN0":{"en":"Pooling is where the axis n DIES: n tokens collapse into one vector of m. That single contraction is what turns a passage into a point you can index.","ru":"Пулинг — это место, где ось n УМИРАЕТ: n токенов схлопываются в один вектор m. Ровно это стягивание превращает пассаж в точку, которую можно проиндексировать.","tt":"Пулинг — n күчәре ҮЛГӘН урын: n токен бер m векторына җыела. Нәкъ шул җыю пассажны индексларга мөмкин булган ноктага әйләндерә."},"lgN1":{"en":"The index is not a second machine. It is the SAME encoder, run over N documents ahead of time. Search works for exactly one reason: the encoder can be applied offline.","ru":"Индекс — это не вторая машина. Это ТОТ ЖЕ кодировщик, прогнанный по N документам заранее. Поиск работает ровно по одной причине: кодировщик можно применить офлайн.","tt":"Индекс — икенче машина түгел. Бу ШУЛ УК кодлаучы, N документ буенча алдан җибәрелгән. Эзләү нәкъ бер сәбәп аркасында эшли: кодлаучыны офлайн кулланып була."},"lgN2":{"en":"Everything after the index is narrowing: N → K → k → one answer. Every arrow in that chain costs money — which is the whole reason the cascade exists.","ru":"Всё, что после индекса, — это сужение: N → K → k → один ответ. Каждая стрелка в этой цепочке стоит денег — ровно поэтому и существует каскад.","tt":"Индекстан соң барысы да кысылу: N → K → k → бер җавап. Бу чылбырдагы һәр ук акча тора — каскад нәкъ шуңа бар."},"s0":{"en":"The encoder row — and the single most important contraction in the course. Text enters as n tokens; the embedding table turns each into a vector (n×m); positional encoding adds where each one sits; L transformer blocks refine them without ever changing the shape. Then POOLING kills the axis n: n token-vectors collapse into ONE vector of m. That is the move that makes a passage indexable — a document stops being a sequence and becomes a point in ℝᵐ. Every widget in this gallery so far has been one box in this row.","ru":"Ряд кодировщика — и самое важное стягивание во всём курсе. Текст входит как n токенов; таблица эмбеддингов превращает каждый в вектор (n×m); позиционное кодирование добавляет, где какой стоит; L блоков трансформера уточняют их, ни разу не меняя форму. А потом ПУЛИНГ убивает ось n: n токен-векторов схлопываются в ОДИН вектор m. Именно этот ход делает пассаж индексируемым — документ перестаёт быть последовательностью и становится точкой в ℝᵐ. Каждый виджет этой галереи до сих пор был одним прямоугольником в этом ряду.","tt":"Кодлаучы рәте — һәм бөтен курстагы иң мөһим җыю. Текст n токен булып керә; эмбеддинг таблицасы һәрберсен векторга әйләндерә (n×m); позицион кодлау кайсы кайда торганын өсти; L трансформер блогы форманы бер тапкыр да үзгәртмичә аларны төгәлли. Аннары ПУЛИНГ n күчәрен үтерә: n токен-вектор БЕР m векторына җыела. Нәкъ шул хәрәкәт пассажны индекслап була торган итә — документ эзлеклелек булудан туктый һәм ℝᵐ тагы ноктага әйләнә."},"s1":{"en":"Now the move that makes search possible at all. Take that same encoder — not a copy, not a different model, the SAME one — and run it over all N documents ahead of time. What falls out is a matrix N×m: a vector per document. That is the index. This is the whole trick: because the encoder can be applied OFFLINE, the expensive part is paid once, in advance, and a query at serve time only has to be compared against points. Take that away — make the scoring depend on query and document together, as a cross-encoder does — and the dashed wire disappears, the index cannot exist, and you are back to running a neural network N times per query.","ru":"А теперь ход, благодаря которому поиск вообще возможен. Берём тот же самый кодировщик — не копию, не другую модель, а ТОТ ЖЕ — и прогоняем его по всем N документам заранее. Выпадает матрица N×m: по вектору на документ. Это и есть индекс. В этом весь фокус: раз кодировщик можно применить ОФЛАЙН, дорогая часть оплачивается один раз, заранее, а запросу в момент обслуживания остаётся лишь сравниться с точками. Убери это — сделай оценку зависящей от запроса и документа вместе, как делает cross-encoder — и пунктирный провод исчезает, индекс существовать не может, и ты возвращаешься к прогону нейросети N раз на каждый запрос.","tt":"Хәзер эзләүне гомумән мөмкин иткән хәрәкәт. Шул ук кодлаучыны алабыз — күчермә түгел, башка модель түгел, нәкъ ШУНЫ — һәм аны барлык N документ буенча алдан җибәрәбез. N×m матрицасы килеп чыга: документка бер вектор. Бу индексның үзе. Бөтен хикмәт шунда: кодлаучыны ОФЛАЙН кулланып булганга, кыйммәтле өлеш бер тапкыр, алдан түләнә, ә хезмәт күрсәтү вакытында сорауга бары тик нокталар белән чагыштырылырга кала. Моны алып ташлагыз — бәяләүне сорау белән документка бергә бәйле итегез, cross-encoder кебек — һәм пунктир чыбык юкка чыга, индекс була алмый."},"s2":{"en":"And the second row is the entire rest of the field: a funnel. N documents in the index → K candidates after retrieval → a handful after reranking → one answer after generation. Read the ledger as a column of shapes and the whole course is there in eight rows: n tokens, n×m, n×m, m, N×m, K, k, 1. Every arrow in that chain costs money, and every arrow is a place where you trade recall against latency — which is precisely why the cascade is shaped the way it is: cheap and wide first, expensive and narrow last. This is the map. Every other circuit in this gallery is one node of it.","ru":"А нижний ряд — это вся остальная область целиком: воронка. N документов в индексе → K кандидатов после поиска → горстка после реранка → один ответ после генерации. Прочитай сводку как столбец форм — и весь курс уместится в восемь строк: n токенов, n×m, n×m, m, N×m, K, k, 1. Каждая стрелка в этой цепочке стоит денег, и каждая — это место, где ты меняешь полноту на задержку. Ровно поэтому каскад устроен именно так: сначала дёшево и широко, в конце дорого и узко. Вот карта. Каждая другая схема этой галереи — один её узел.","tt":"Ә аскы рәт — өлкәнең бөтен калган өлеше: воронка. Индекстагы N документ → эзләүдән соң K кандидат → реранктан соң бер уч → генерациядән соң бер җавап. Җыелманы формалар баганасы итеп укыгыз — һәм бөтен курс сигез юлга сыя: n токен, n×m, n×m, m, N×m, K, k, 1. Бу чылбырдагы һәр ук акча тора, һәм һәрберсе — тулылыкны кичегүгә алыштыра торган урын. Каскад нәкъ шуңа шулай төзелгән: башта арзан һәм киң, ахырда кыйммәт һәм тар. Менә карта. Бу галереяның һәр башка схемасы — аның бер төене."}},"title":{"en":"The atlas: the whole course as one funnel of shapes","ru":"Атлас: весь курс как одна воронка форм","tt":"Атлас: бөтен курс бер форма воронкасы буларак"},"steps":[
