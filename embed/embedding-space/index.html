},{"a":"cat","b":"kitten","cos":0.6386},{"a":"dog","b":"puppy","cos":0.7755},{"a":"cat","b":"airplane","cos":0.3654},{"a":"king","b":"queen","cos":0.7839},{"a":"king","b":"computer","cos":0.2276}],"words":{"king":[0.5045,0.6861,-0.5952,-0.0228,0.6005,-0.135],"queen":[0.3785,1.8233,-1.2648,-0.1043,0.3583,0.6003],"man":[-0.0944,0.4301,-0.1722,-0.4553,1.6447,0.4033],"woman":[-0.1815,0.6483,-0.5821,-0.4945,1.5415,1.345]}},"dataSets":{"l5-embeddings":{"method":"GloVe 6B 50-d (Wikipedia + Gigaword)","dim":50,"analogy":{"expr":"king − man + woman","expected":"queen","top":[{"word":"queen","cos":0.861},{"word":"prince","cos":0.7641},{"word":"throne","cos":0.7635},{"word":"princess","cos":0.7513},{"word":"father","cos":0.7314},{"word":"mother","cos":0.728}],"answerCos":0.861},"genderDirectionCos":0.597,"capitalAnalogy":{"expr":"paris − france + italy","expected":"rome","top":[{"word":"rome","cos":0.8379},{"word":"madrid","cos":0.7458},{"word":"berlin","cos":0.6611},{"word":"spain","cos":0.6304}]},"pairs":[{"a":"cat","b":"dog","cos":0.9218},{"a":"cat","b":"kitten","cos":0.6386},{"a":"dog","b":"puppy","cos":0.7755},{"a":"cat","b":"airplane","cos":0.3654},{"a":"king","b":"queen","cos":0.7839},{"a":"king","b":"computer","cos":0.2276}],"words":{"king":[0.5045,0.6861,-0.5952,-0.0228,0.6005,-0.135],"queen":[0.3785,1.8233,-1.2648,-0.1043,0.3583,0.6003],"man":[-0.0944,0.4301,-0.1722,-0.4553,1.6447,0.4033],"woman":[-0.1815,0.6483,-0.5821,-0.4945,1.5415,1.345]}}},"i18n":{"_doc":"Step captions + small labels for embedding-space. EN canonical + RU + TT (all written). Every NUMBER (cosines 0.861, 0.9218, 0.3654; the ranking) comes from data/l5-embeddings.json, never from these strings.","alt":{"en":"Words as points on a 2-D meaning map; king minus man plus woman lands on queen; pairwise cosine bars.","ru":"Слова как точки на 2-D карте смысла; king минус man плюс woman попадает в queen; столбики попарной косинусной близости.","tt":"Сүзләр 2-D мәгънә картасында нокталар буларак; king тартып man өстәп woman queen'гә төшә; парлы косинус баганалары."},"mapTitle":{"en":"meaning map · 2-D sketch","ru":"карта смысла · 2-D эскиз","tt":"мәгънә картасы · 2-D эскиз"},"axGender":{"en":"gender →","ru":"пол →","tt":"җенес →"},"axRoyalty":{"en":"royal ↑","ru":"сан ↑","tt":"дәрәҗә ↑"},"moveLabel":{"en":"king − man + woman","ru":"king − man + woman","tt":"king − man + woman"},"nearest":{"en":"nearest words","ru":"ближайшие слова","tt":"иң якын сүзләр"},"pairsTitle":{"en":"pairwise cosine — near = related","ru":"попарный косинус — близко = связано","tt":"парлы косинус — якын = бәйле"},"s0":{"en":"Give every word a list of numbers — a vector — and it becomes a point in space. On this little map, gender runs left to right and rank runs bottom to top: “man” and “king” sit on the left, “woman” lower-right, and meaning becomes a place you can point to.","ru":"Дай каждому слову список чисел — вектор — и оно станет точкой в пространстве. На этой маленькой карте пол идёт слева направо, а сан — снизу вверх: «man» и «king» слева, «woman» справа внизу, и смысл превращается в место, на которое можно указать.","tt":"Һәр сүзгә саннар исемлеге — вектор — бир, һәм ул киңлектә ноктага әйләнә. Бу кечкенә картада җенес сулдан уңга, ә дәрәҗә астан өскә бара: «man» һәм «king» сулда, «woman» уңда аста, һәм мәгънә күрсәтеп була торган урынга әйләнә."},"s1":{"en":"Now meaning becomes arithmetic. Start at “king”, subtract the “man” direction and add the “woman” direction — the same move that turns man into woman. Geometrically it is one corner of a parallelogram, and it carries you to a fresh point in the space.","ru":"Теперь смысл становится арифметикой. Начни с «king», вычти направление «man» и прибавь направление «woman» — тот же сдвиг, что превращает man в woman. Геометрически это угол параллелограмма, и он переносит тебя в новую точку пространства.","tt":"Хәзер мәгънә арифметикага әйләнә. «king»'тан башла, «man» юнәлешен тартып ал һәм «woman» юнәлешен өстә — man'ны woman'га әйләндергән шул ук хәрәкәт. Геометрик яктан бу — параллелограмм почмагы, һәм ул сине киңлектәге яңа ноктага күчерә."},"s2":{"en":"And the nearest real word to that point is queen — cosine 0.861, far ahead of the runner-ups prince (0.764) and throne (0.764). The analogy holds with real GloVe vectors: the relation king→queen is the very same direction as man→woman.","ru":"И ближайшее настоящее слово к этой точке — queen, косинус 0,861, далеко впереди преследователей prince (0,764) и throne (0,764). Аналогия работает на настоящих GloVe-векторах: отношение king→queen — это то же направление, что и man→woman.","tt":"Һәм бу ноктага иң якын чын сүз — queen, косинус 0,861, prince (0,764) һәм throne (0,764) дан күпкә алда. Аналогия чын GloVe векторларында эшли: king→queen мөнәсәбәте — нәкъ man→woman белән бер үк юнәлеш."},"s3":{"en":"The same ruler measures any pair. cat·dog scores 0.922 — almost the same direction — while cat·airplane is only 0.365 and king·computer just 0.228. Symbols said every pair was equally far apart; geometry finally says near means related.","ru":"Та же линейка мерит любую пару. cat·dog даёт 0,922 — почти одно направление, — тогда как cat·airplane всего 0,365, а king·computer лишь 0,228. Символы утверждали, что все пары одинаково далеки; геометрия наконец говорит: близко значит связано.","tt":"Шул ук линейка теләсә нинди парны үлчи. cat·dog 0,922 бирә — диярлек бер үк юнәлеш, — ә cat·airplane бары 0,365, king·computer исә нибары 0,228. Символлар һәр пар бертигез ерак диде; геометрия ниһаять әйтә: якын — бәйле дигән сүз."}},"title":{"en":"The map of meaning: king − man + woman ≈ queen","ru":"Карта смысла: king − man + woman ≈ queen","tt":"Мәгънә картасы: king − man + woman ≈ queen"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
