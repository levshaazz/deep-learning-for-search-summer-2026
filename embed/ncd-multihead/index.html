e head, three learned projections L_Q, L_K, L_V map it not into m dimensions but into d_head = m/h = 768/12 = 64, and attention returns an n×64 slice. Then the same circuit is drawn as h literal copies inside a dashed region marking the head axis, with a vertical ellipsis for the heads not drawn. Finally a hexagon marked concat lays the h slices side by side — 12 × 64 = 768 = m — and a chipped rectangle L_O projects the result back to n×m.","ru":"Многоголовое внимание в виде neural circuit diagram. Слева входит матрица токенов x (n×m). В одной голове три обучаемые проекции L_Q, L_K, L_V переводят её не в m измерений, а в d_head = m/h = 768/12 = 64, и внимание возвращает срез n×64. Затем та же схема нарисована как h буквальных копий внутри пунктирной области — оси голов, — с вертикальным многоточием вместо ненарисованных голов. Наконец шестиугольник concat выкладывает h срезов рядом — 12 × 64 = 768 = m, — а скошенный прямоугольник L_O проецирует результат обратно в n×m.","tt":"Күпбашлы игътибар neural circuit diagram буларак. Сулда токеннар матрицасы x (n×m) керә. Бер башта өч өйрәнелә торган проекция L_Q, L_K, L_V аны m үлчәмгә түгел, ә d_head = m/h = 768/12 = 64 га күчерә, һәм игътибар n×64 кисемен кайтара. Аннары шул ук схема башлар күчәрен билгеләүче пунктир өлкә эчендә h чын күчермә итеп сызыла, сызылмаган башлар урынына вертикаль өч нокта. Ахырда concat алтыпочмагы h кисемне янәшә тезә — 12 × 64 = 768 = m, — ә кителгән турыпочмак L_O нәтиҗәне кире n×m га проекцияли."},"lblIn":{"en":"x  (n×m)","ru":"x  (n×m)","tt":"x  (n×m)"},"lblAttn":{"en":"attention","ru":"внимание","tt":"игътибар"},"lblOneHead":{"en":"one head","ru":"одна голова","tt":"бер баш"},"lblHeadOut":{"en":"head output","ru":"выход головы","tt":"баш чыгышы"},"lblHead":{"en":"head","ru":"голова","tt":"баш"},"lblConcat":{"en":"concat","ru":"concat","tt":"concat"},"lblOut":{"en":"out","ru":"выход","tt":"чыгыш"},"lblOneOf":{"en":"one head = 1 strip of 12","ru":"одна голова = 1 полоса из 12","tt":"бер баш = 12 нең 1 полосасы"},"askBack":{"en":"h slices — now put the axis back","ru":"h срезов — теперь верни ось на место","tt":"h кисем — хәзер күчәрне урынына кайтар"},"tagHeads":{"en":"the same circuit, copied","ru":"та же схема, копии","tt":"шул ук схема, күчермә"},"legMap":{"en":"wire = axis · ▭ = learned projection · box = operation","ru":"провод = ось · ▭ = обучаемая проекция · прямоугольник = операция","tt":"чыбык = күчәр · ▭ = өйрәнелә торган проекция · турыпочмак = операция"},"legHeads":{"en":"each head box is the circuit above, copied — same recipe, its own weights","ru":"каждый прямоугольник-голова — это схема выше, скопированная: тот же рецепт, свои веса","tt":"һәр баш-турыпочмак — югарыдагы схеманың күчермәсе: шул ук рецепт, үз авырлыклары"},"legCat":{"en":"⬡ = concat: a reindex, not a computation · ▭ = learned projection · dashed = the head axis h","ru":"⬡ = concat: переиндексация, а не вычисление · ▭ = обучаемая проекция · пунктир = ось голов h","tt":"⬡ = concat: яңадан индексация, исәпләү түгел · ▭ = өйрәнелә торган проекция · пунктир = башлар күчәре h"},"s0":{"en":"One head, honestly. The token matrix x (n×m) enters, and three learned projections L_Q, L_K, L_V map each vector into a SMALLER space: d_head = m/h = 768/12 = 64, not 768. Attention then runs entirely inside those 64 dimensions and hands back n×64 — a head sees a 64-wide strip of the model, never the whole of its width. Remember that number: a head is not a copy of the model, it is a twelfth of it.","ru":"Одна голова, честно. Входит матрица токенов x (n×m), и три обучаемые проекции L_Q, L_K, L_V переводят каждый вектор в БОЛЕЕ УЗКОЕ пространство: d_head = m/h = 768/12 = 64, а не 768. Внимание работает целиком внутри этих 64 измерений и возвращает n×64 — голова видит полосу шириной 64, а не всю ширину модели. Запомни это число: голова — не копия модели, а её двенадцатая часть.","tt":"Бер баш, намуслы рәвештә. Токеннар матрицасы x (n×m) керә, һәм өч өйрәнелә торган проекция L_Q, L_K, L_V һәр векторны ТАРРАК киңлеккә күчерә: d_head = m/h = 768/12 = 64, 768 түгел. Игътибар шул 64 үлчәм эчендә генә эшли һәм n×64 кайтара — баш киңлеге 64 булган полосаны гына күрә, модельнең бөтен киңлеген түгел. Бу санны исегездә тотыгыз: баш — модельнең күчермәсе түгел, ә аның уникедән бер өлеше."},"s1":{"en":"Now the broadcast, made concrete: h heads are h literal COPIES of the circuit above — the same L_Q L_K L_V → σ recipe, twelve times over, each copy with its own weights and each producing its own n×64 slice. The dashed region IS the head axis h; the ⋮ stands for the nine heads we did not draw. Notice what did not change: the SAME x (n×m) is broadcast into every copy. What differs between heads is only what each one learns to look for.","ru":"Теперь broadcast, сделанный конкретным: h голов — это h буквальных КОПИЙ схемы выше. Тот же рецепт L_Q L_K L_V → σ, повторённый двенадцать раз, у каждой копии свои веса и свой срез n×64. Пунктирная область И ЕСТЬ ось голов h, а ⋮ — те девять голов, которые мы не нарисовали. Заметь, что не изменилось: ОДИН И ТОТ ЖЕ x (n×m) приходит в каждую копию. Головы различаются лишь тем, что каждая научилась искать.","tt":"Хәзер broadcast конкрет рәвештә: h баш — югарыдагы схеманың h чын КҮЧЕРМӘСЕ. Шул ук L_Q L_K L_V → σ рецебы унике тапкыр кабатлана, һәр күчермәнең үз авырлыклары һәм үз n×64 кисеме бар. Пунктир өлкә — нәкъ башлар күчәре h, ә ⋮ — без сызмаган тугыз баш. Нәрсә үзгәрмәгәненә игътибар итегез: һәр күчермәгә ШУЛ УК x (n×m) килә. Башлар бер-берсеннән нәрсә эзләргә өйрәнүләре белән генә аерыла."},"s2":{"en":"Concat — the hexagon, a REINDEX rather than a computation — lays the h slices side by side: 12 × 64 = 768 = m, exactly. That is the whole point: concat is the precise INVERSE of the split, so multi-head does not ADD width, it PARTITIONS it. Had every head kept all 768 dimensions, the head axis would have cost h·m = 9216 — twelve times the work (see the red row in the ledger). Instead L_O mixes the reassembled 768 back into the model's width, and the block hands on n×m: the very shape it received.","ru":"Операция concat — шестиугольник, ПЕРЕИНДЕКСАЦИЯ, а не вычисление — выкладывает h срезов рядом: 12 × 64 = 768 = m, ровно. В этом вся суть: concat — точная ОБРАТНАЯ операция к разрезанию, поэтому многоголовость не ДОБАВЛЯЕТ ширину, а ДЕЛИТ её. Если бы каждая голова держала все 768 измерений, ось голов стоила бы h·m = 9216 — в двенадцать раз дороже (см. красную строку в сводке). Вместо этого L_O перемешивает собранные 768 обратно в ширину модели, и блок отдаёт n×m — ровно ту форму, которую получил.","tt":"Операция concat — алтыпочмак, ЯҢАДАН ИНДЕКСАЦИЯ, исәпләү түгел — h кисемне янәшә тезә: 12 × 64 = 768 = m, төп-төгәл. Менә төп фикер: concat — кисүнең нәкъ КИРЕ операциясе, шуңа күрә күпбашлылык киңлекне ӨСТӘМИ, ә аны БҮЛӘ. Әгәр һәр баш 768 үлчәмне дә саклаган булса, башлар күчәре h·m = 9216 торган булыр иде — унике тапкыр кыйммәтрәк (җыелмадагы кызыл юлны карагыз). Аның урынына L_O җыелган 768 не модель киңлегенә кире катнаштыра, һәм блок n×m бирә — нәкъ үзе алган форманы."},"lgTitle":{"en":"width & heads","ru":"ширина и головы","tt":"киңлек һәм башлар"},"lgWidth":{"en":"model width","ru":"ширина модели","tt":"модель киңлеге"},"lgHeads":{"en":"heads","ru":"головы","tt":"башлар"},"lgPerHead":{"en":"per head","ru":"на голову","tt":"бер башка"},"lgCopies":{"en":"copies","ru":"копий","tt":"күчермә"},"lgAfterCat":{"en":"after concat","ru":"после concat","tt":"concat'тан соң"},"lgIfAdded":{"en":"if heads ADDED width","ru":"если бы головы ДОБАВЛЯЛИ ширину","tt":"башлар киңлекне ӨСТӘСӘ"},"lgN0":{"en":"A head does not get its own m. It gets m/h = 64 — one twelfth of the width.","ru":"Голова не получает собственные m. Ей достаётся m/h = 64 — двенадцатая часть ширины.","tt":"Баш үзенә аерым m алмый. Аңа m/h = 64 эләгә — киңлекнең уникедән бер өлеше."},"lgN1":{"en":"h heads are not h models: the SAME 768 dims, cut into 12 strips of 64.","ru":"h голов — это не h моделей: ТЕ ЖЕ 768 измерений, разрезанные на 12 полос по 64.","tt":"h баш — h модель түгел: ШУЛ УК 768 үлчәм, 64 әрдән 12 полосага киселгән."},"lgN2":{"en":"Concat is the inverse of the split: 12·64 = 768 = m. Nothing was added — the width was folded, then unfolded.","ru":"Операция concat — обратная к разрезанию: 12·64 = 768 = m. Ничего не добавили — ширину свернули и развернули обратно.","tt":"Операция concat — кисүнең кире операциясе: 12·64 = 768 = m. Бернәрсә өстәлмәде — киңлек бөкләнде һәм кире җәелде."}},"title":{"en":"h heads, honestly: heads split the width, they do not add to it","ru":"h голов честно: головы делят ширину, а не добавляют её","tt":"h баш намуслы рәвештә: башлар киңлекне бүлә, өстәми"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
