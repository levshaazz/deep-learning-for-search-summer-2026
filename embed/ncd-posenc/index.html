3,"scaled":[0.045,0.045,0.909],"_note":"same dot 6 → softmax(0,0,6)=(…,0.995) peaky vs ÷√4 → softmax(0,0,3)=(…,0.909) softer"},"posEnc":{"d":4,"freqs":[1,0.01],"pos0":[0,1,0,1],"pos1":[0.841,0.54,0.01,1],"_note":"PE d=4: pos0=(0,1,0,1); pos1=(sin1,cos1,sin.01,cos.01)=(0.841,0.540,0.010,1.000)"},"params":{"d":768,"perBlock":7077888,"perBlockM":7.08,"blocks":12,"tokenEmb":23440896,"attnCoef":4,"ffnCoef":8,"blockCoef":12,"_note":"12·768²=7 077 888≈7.08M per block; 12 blocks + embeddings ≈ 110M (BERT-base)"},"causal":{"scores":[0,2,3],"noMask":[0.035,0.259,0.705],"masked":[0.119,0.881],"_note":"no-mask softmax(0,2,3)=(0.035,0.259,0.705) leaks future t3; causal softmax(0,2)=(0.119,0.881)"},"autoregr":{"scores":[0,1,2],"next":[0.09,0.245,0.665],"_note":"next-token softmax(0,1,2)=(0.090,0.245,0.665)"},"decoding":{"logits":[2,1,0.5,0,-1],"base":[0.563,0.207,0.126,0.076,0.028],"cumulative":[0.563,0.77,0.896,0.972,1],"topk2":[0.731,0.269],"tempSharp":[0.829,0.112,0.041,0.015,0.002],"tempSoft":[0.375,0.227,0.177,0.138,0.084],"TSharp":0.5,"TSoft":2,"_note":"z=(2,1,0.5,0,-1) → base (0.563,0.207,0.126,0.076,0.028); top-k(2) (0.731,0.269); T=0.5 (0.829,…); T=2.0 (0.375,…)"},"memory":{"heads":12,"n":[512,4096,32768],"mb512":0.52,"mb4k":33.6,"gb32k":2.15,"mb512x12":6.3,"mb4kx12":403,"gb32kx12":25.8,"_note":"fp16 2n² bytes/head: n=512→0.52MB, n=32k→2.15GB; ×12 heads → 6.3MB / 403MB / 25.8GB (O(n²))"},"uniform3":0.333}},"i18n":{"_doc":"ncd-posenc — sinusoidal positional encoding in the NCD lens. d=4, dims (2i,2i+1), i∈{0,1}. A position broadcasts over the dimension axis; each dim pair has a frequency and a sin/cos op. Every NUMBER (freqs 1/0.01, pos0 (0,1,0,1), pos1 (0.841,0.540,0.010,1.000)) comes from data/l15-attention.json.","alt":{"en":"Sinusoidal positional encoding as a neural circuit diagram. A position index broadcasts over the 4-dimensional axis; each dimension pair carries a frequency (1 and 0.01) and a sin or cos operation. At position 1 the high-frequency dimension swings to 0.841 while the low-frequency one barely moves to 0.010 — so position is encoded at several scales at once.","ru":"Синусоидальное позиционное кодирование как neural circuit diagram. Индекс позиции оплетает 4-мерную ось; каждая пара измерений несёт частоту (1 и 0,01) и операцию sin или cos. На позиции 1 высокочастотное измерение уходит в 0,841, а низкочастотное едва сдвигается в 0,010 — так позиция кодируется сразу в нескольких масштабах.","tt":"Синусоидаль позицион кодлау neural circuit diagram буларак. Позиция индексы 4 үлчәмле күчәрне урый; һәр үлчәм пары ешлек (1 һәм 0.01) һәм sin яки cos операциясен йөртә. 1 позициясендә югары ешлекле үлчәм 0.841 гә китә, түбән ешлеклесе 0.010 гә көчкә генә кыймылдый — позиция берьюлы берничә масштабта кодлана."},"legMap":{"en":"position broadcasts over the dimension axis · sin/cos per dim · frequency sets the scale","ru":"позиция оплетает ось измерений · sin/cos на измерение · частота задаёт масштаб","tt":"позиция үлчәм күчәрен урый · үлчәмгә sin/cos · ешлек масштабны билгели"},"lblPos":{"en":"position","ru":"позиция","tt":"позиция"},"lblDim":{"en":"dim","ru":"изм.","tt":"үлч."},"lblFreq":{"en":"freq","ru":"частота","tt":"ешлек"},"lblPE":{"en":"PE(pos)","ru":"PE(pos)","tt":"PE(pos)"},"tagBroadcast":{"en":"broadcast over dim","ru":"broadcast по измерениям","tt":"үлчәмнәр буенча broadcast"},"fast":{"en":"fast (fine position)","ru":"быстро (точная позиция)","tt":"тиз (төгәл позиция)"},"slow":{"en":"slow (coarse position)","ru":"медленно (грубая позиция)","tt":"әкрен (тупас позиция)"},"s0":{"en":"Positional encoding, one head-on view. A position index (left) is broadcast over the 4-dimensional embedding axis — the same position feeds every dimension. Dimensions come in (sin, cos) pairs; each pair has a frequency: dims 0–1 use freq 1, dims 2–3 use freq 0.01. Each cell is sin(pos·freq) or cos(pos·freq). At position 0 that is (0, 1, 0, 1) — the zero position is always this.","ru":"Позиционное кодирование, вид в лоб. Индекс позиции (слева) оплетает 4-мерную ось эмбеддинга — одна и та же позиция подаётся в каждое измерение. Измерения идут парами (sin, cos); у каждой пары своя частота: изм. 0–1 — частота 1, изм. 2–3 — частота 0,01. Каждая ячейка — sin(pos·freq) или cos(pos·freq). На позиции 0 это (0, 1, 0, 1) — нулевая позиция всегда такая.","tt":"Позицион кодлау, туры караш. Позиция индексы (сулда) 4 үлчәмле эмбеддинг күчәрен урый — бер үк позиция һәр үлчәмгә бирелә. Үлчәмнәр (sin, cos) парлары белән бара; һәр парның үз ешлеге: үлч. 0–1 — ешлек 1, үлч. 2–3 — ешлек 0.01. Һәр күзәнәк — sin(pos·freq) яки cos(pos·freq). 0 позициясендә бу (0, 1, 0, 1)."},"s1":{"en":"Now position 1. The vector becomes (0.841, 0.540, 0.010, 1.000): dim 0 = sin(1·1) = 0.841, dim 1 = cos(1·1) = 0.540, dim 2 = sin(1·0.01) = 0.010, dim 3 = cos(1·0.01) = 1.000. Notice how the frequency changes everything — same position, very different movement per dimension.","ru":"Теперь позиция 1. Вектор становится (0,841, 0,540, 0,010, 1,000): изм. 0 = sin(1·1) = 0,841, изм. 1 = cos(1·1) = 0,540, изм. 2 = sin(1·0,01) = 0,010, изм. 3 = cos(1·0,01) = 1,000. Заметь, как частота меняет всё — та же позиция, но совсем разное движение по измерениям.","tt":"Хәзер 1 позициясе. Вектор (0.841, 0.540, 0.010, 1.000) була: үлч. 0 = sin(1·1) = 0.841, үлч. 1 = cos(1·1) = 0.540, үлч. 2 = sin(1·0.01) = 0.010, үлч. 3 = cos(1·0.01) = 1.000. Ешлек барысын да үзгәртә — шул ук позиция, әмма үлчәмнәр буенча бөтенләй башка хәрәкәт."},"s2":{"en":"Why two scales? The high-frequency pair (freq 1) swung hard from 0 to 0.841 — it distinguishes NEARBY positions finely. The low-frequency pair (freq 0.01) barely moved (0 → 0.010) — it changes slowly, encoding COARSE position over long ranges. A real model stacks many such frequencies, so every position gets a unique multi-scale fingerprint the attention can read.","ru":"Зачем два масштаба? Высокочастотная пара (частота 1) сильно качнулась с 0 до 0,841 — она тонко различает БЛИЗКИЕ позиции. Низкочастотная пара (частота 0,01) едва сдвинулась (0 → 0,010) — она меняется медленно, кодируя ГРУБУЮ позицию на длинных дистанциях. Настоящая модель складывает много таких частот, поэтому у каждой позиции — уникальный многомасштабный отпечаток, который читает внимание.","tt":"Ни өчен ике масштаб? Югары ешлекле пар (ешлек 1) 0 дән 0.841 гә каты селкенде — ул ЯКЫН позицияләрне нечкә аера. Түбән ешлекле пар (ешлек 0.01) көчкә генә кыймылдады (0 → 0.010) — ул әкрен үзгәрә, озын араларда ТУПАС позицияне кодлый. Чын модель мондый күп ешлекне өсти, шуңа һәр позиция уникаль күпмасштаблы эз ала, аны игътибар укый."}},"title":{"en":"Positional encoding as a neural circuit diagram","ru":"Позиционное кодирование как neural circuit diagram","tt":"Позицион кодлау neural circuit diagram буларак"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
