its":[2,0.5,2.5,1.2,-1,-2],"relu":[2,0.5,2.5,1.2,0,0],"weights":[1.0986,0.4055,1.2528,0.7885,0,0],"expansion":["bank","water"]},"doc":{"text":"the riverbank overflowed with water","weights":[0.9,0.7,0.6,1.3,0,0]},"terms":[{"t":"river","q":1.0986,"d":0.9,"prod":0.9887},{"t":"bank","q":0.4055,"d":0.7,"prod":0.2839},{"t":"flood","q":1.2528,"d":0.6,"prod":0.7517},{"t":"water","q":0.7885,"d":1.3,"prod":1.0251}],"dot":3.0494},"real":{"model":"naver/splade-cocondenser-ensembledistil","query":"river flood","queryTopTerms":[{"term":"river","weight":2.8773,"expansion":false},{"term":"flood","weight":2.8367,"expansion":false},{"term":"rivers","weight":2.5002,"expansion":true},{"term":"flooding","weight":2.2237,"expansion":true},{"term":"floods","weight":1.3533,"expansion":true},{"term":"storm","weight":0.7114,"expansion":true},{"term":"reservoir","weight":0.5897,"expansion":true},{"term":"barry","weight":0.5559,"expansion":true},{"term":"erosion","weight":0.5093,"expansion":true},{"term":"water","weight":0.4851,"expansion":true},{"term":"lake","weight":0.4667,"expansion":true},{"term":"waterfall","weight":0.4232,"expansion":true}],"note":"MLM-head logits → log(1+ReLU), max-pooled over positions; top-k by weight; eval()+no_grad()+manual_seed(0); committed frozen. 'expansion'=true for non-literal terms."}},"dataSets":{"l8-splade":{"_doc":"Learned sparse / SPLADE. Toy = hand-computable weights w = log(1+ReLU(logit)) over a 6-word vocabulary + the sparse dot (stdlib). The query 'river flood' grows EXPANSION terms bank/water (positive weight, not literal). dot = 3.0494 is round-then-sum (each displayed product rounded to 4 dp, then summed; sum-then-round would give 3.0493). Real = frozen SPLADE top terms, spliced by _research/gen_l8_real.py.","_source":"_research/gen_l8.py (toy, stdlib) + gen_l8_real.py (SPLADE checkpoint, /usr/bin/python3)","toy":{"vocab":["river","bank","flood","water","loan","money"],"query":{"text":"river flood","logits":[2,0.5,2.5,1.2,-1,-2],"relu":[2,0.5,2.5,1.2,0,0],"weights":[1.0986,0.4055,1.2528,0.7885,0,0],"expansion":["bank","water"]},"doc":{"text":"the riverbank overflowed with water","weights":[0.9,0.7,0.6,1.3,0,0]},"terms":[{"t":"river","q":1.0986,"d":0.9,"prod":0.9887},{"t":"bank","q":0.4055,"d":0.7,"prod":0.2839},{"t":"flood","q":1.2528,"d":0.6,"prod":0.7517},{"t":"water","q":0.7885,"d":1.3,"prod":1.0251}],"dot":3.0494},"real":{"model":"naver/splade-cocondenser-ensembledistil","query":"river flood","queryTopTerms":[{"term":"river","weight":2.8773,"expansion":false},{"term":"flood","weight":2.8367,"expansion":false},{"term":"rivers","weight":2.5002,"expansion":true},{"term":"flooding","weight":2.2237,"expansion":true},{"term":"floods","weight":1.3533,"expansion":true},{"term":"storm","weight":0.7114,"expansion":true},{"term":"reservoir","weight":0.5897,"expansion":true},{"term":"barry","weight":0.5559,"expansion":true},{"term":"erosion","weight":0.5093,"expansion":true},{"term":"water","weight":0.4851,"expansion":true},{"term":"lake","weight":0.4667,"expansion":true},{"term":"waterfall","weight":0.4232,"expansion":true}],"note":"MLM-head logits → log(1+ReLU), max-pooled over positions; top-k by weight; eval()+no_grad()+manual_seed(0); committed frozen. 'expansion'=true for non-literal terms."}}},"i18n":{"_doc":"Labels + step captions for splade-expansion. EN canonical + RU (native) + TT. All numbers (the term weights and the sparse dot) come from data/l8-splade.json — never from i18n.","alt":{"en":"A bar chart of learned SPLADE term weights for the query: the two literal terms, then related expansion terms that light up, then the document's weights overlaid and the sparse dot product.","ru":"Гистограмма выученных весов SPLADE для запроса: два буквальных термина, затем загорающиеся связанные термины расширения, затем наложенные веса документа и разрежённое скалярное произведение.","tt":"Сорау өчен өйрәнелгән SPLADE термин авырлыклары диаграммасы: ике хәрефи термин, аннары кабынган бәйле киңәйтү терминнары, аннары документ авырлыклары һәм сирәк скаляр тапкырчыгыш."},"head":{"en":"learned weights over the vocabulary: wⱼ = log(1 + ReLU(zⱼ))","ru":"выученные веса по словарю: wⱼ = log(1 + ReLU(zⱼ))","tt":"сүзлек буенча өйрәнелгән авырлыклар: wⱼ = log(1 + ReLU(zⱼ))"},"expandLabel":{"en":"+ expansion","ru":"+ расширение","tt":"+ киңәйтү"},"dotLabel":{"en":"sparse dot","ru":"разреж. произв.","tt":"сирәк тапкырчыгыш"},"s0":{"en":"You typed two words. BM25 would weight only these literal terms — raw frequency, nothing more.","ru":"Ты ввёл два слова. BM25 взвесил бы только эти буквальные термины — сырая частота, и всё.","tt":"Син ике сүз яздың. BM25 бары шул хәрефи терминнарны гына үлчәр иде — чи ешлык, шул гына."},"s1":{"en":"SPLADE turns each term's logit into a weight w = log(1 + ReLU(z)) — a learned, saturating weight, not a raw count. ReLU drops negatives; the log tames the large ones.","ru":"SPLADE превращает логит каждого термина в вес w = log(1 + ReLU(z)) — выученный, насыщающийся вес, а не сырой счётчик. ReLU отбрасывает отрицательные, логарифм усмиряет большие.","tt":"SPLADE һәр терминның логитын w = log(1 + ReLU(z)) авырлыгына әйләндерә — чи санау түгел, ә өйрәнелгән, туенучан авырлык. ReLU тискәреләрне ташлый, логарифм зурларны тыя."},"s2":{"en":"It also lights up related terms it never saw typed — that is expansion. The sparse vector grows richer, yet stays sparse and inverted-index compatible.","ru":"Он также зажигает связанные термины, которых ты не вводил — это расширение. Разрежённый вектор становится богаче, но остаётся разрежённым и совместимым с инвертированным индексом.","tt":"Ул шулай ук син язмаган бәйле терминнарны да кабыза — бу киңәйтү. Сирәк вектор баерак була, әмма сирәк һәм инвертланган индекс белән туры килгән булып кала."},"s3":{"en":"Score the document by the sparse dot of the two weight vectors — sum the products over the shared terms. Same inverted index as BM25, a richer signal.","ru":"Оцениваем документ разрежённым скалярным произведением двух векторов весов — сумма произведений по общим терминам. Тот же инвертированный индекс, что у BM25, но сигнал богаче.","tt":"Документны ике авырлык векторының сирәк скаляр тапкырчыгышы белән бәялибез — уртак терминнар буенча тапкырчыгышлар суммасы. BM25 кебек үк инвертланган индекс, әмма сигнал баерак."}},"title":{"en":"Learned sparse (SPLADE)","ru":"Выученная разрежённость (SPLADE)","tt":"Өйрәнелгән сирәклек (SPLADE)"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
