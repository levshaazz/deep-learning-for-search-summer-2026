затем стрелки сил, показывающие, как градиент двигает каждую точку.","tt":"Сулда: «cat» сүзеннән һәр башка сүзгә Гаусс якынлыгын күрсәтүче горизонталь баганалар (якын хайваннар биек, патшалык якынча нуль). Уңда: тугыз сүзнең 2-D диаграммасы Стьюдентның авыр койрыклы сызыгы белән, аннары градиент һәр ноктаны ничек кузгатканын күрсәтүче көч уклары."},"affinityFrom":{"en":"affinity from","ru":"близость от","tt":"якынлык"},"effNeighbours":{"en":"eff. neighbours","ru":"эфф. соседей","tt":"эфф. күршеләр"},"perplexityLbl":{"en":"perplexity","ru":"перплексия","tt":"перплексия"},"lowDLayout":{"en":"low-D layout","ru":"2-D раскладка","tt":"2-D урнашу"},"heavyTail":{"en":"heavy tail","ru":"тяжёлый хвост","tt":"авыр койрык"},"subHighD":{"en":"high-D","ru":"высокая разм.","tt":"югары үлчәм"},"subLowD":{"en":"low-D","ru":"низкая разм.","tt":"түбән үлчәм"},"subKL":{"en":"minimise KL","ru":"минимизируем KL","tt":"KL минимумлаштыру"},"subForce":{"en":"points move","ru":"точки движутся","tt":"нокталар хәрәкәтләнә"},"subCaveat":{"en":"P7","ru":"P7","tt":"P7"},"gradFormula":{"en":"∂C/∂yᵢ = 4 Σⱼ (p_ij−q_ij)(yᵢ−yⱼ)(1+‖yᵢ−yⱼ‖²)⁻¹","ru":"∂C/∂yᵢ = 4 Σⱼ (p_ij−q_ij)(yᵢ−yⱼ)(1+‖yᵢ−yⱼ‖²)⁻¹","tt":"∂C/∂yᵢ = 4 Σⱼ (p_ij−q_ij)(yᵢ−yⱼ)(1+‖yᵢ−yⱼ‖²)⁻¹"},"attractLbl":{"en":"p > q → pull together (attract)","ru":"p > q → притягивает","tt":"p > q → тарта"},"repelLbl":{"en":"p < q → push apart (repel)","ru":"p < q → расталкивает","tt":"p < q → этә"},"caveatHead":{"en":"read a t-SNE map with care","ru":"читай карту t-SNE осторожно","tt":"t-SNE картасын сак укы"},"caveatPerp":{"en":"perplexity is a knob — change it, the picture changes","ru":"перплексия — регулятор: меняешь его — меняется картина","tt":"перплексия — борма: үзгәртсәң, картина үзгәрә"},"caveatGaps":{"en":"gaps & cluster sizes are NOT global distances","ru":"промежутки и размеры кластеров — НЕ глобальные расстояния","tt":"бушлыклар һәм кластер зурлыклары — гомуми ераклыклар ТҮГЕЛ"},"caveatTrust":{"en":"trust the neighbourhoods, not the empty space","ru":"доверяй окрестностям, не пустоте","tt":"күршелекләргә ышан, бушлыкка түгел"},"t0":{"en":"Gaussian affinity","ru":"гауссова близость","tt":"Гаусс якынлыгы"},"t1":{"en":"Student-t affinity","ru":"близость Стьюдента","tt":"Стьюдент якынлыгы"},"t2":{"en":"match P to Q","ru":"согласуем P и Q","tt":"P белән Q'ны тигезлә"},"t3":{"en":"gradient = forces","ru":"градиент = силы","tt":"градиент = көчләр"},"t4":{"en":"read with care","ru":"читай осторожно","tt":"сак укы"},"tsneCaveat":{"en":"perplexity changes the picture","ru":"перплексия меняет картину","tt":"перплексия картинаны үзгәртә"},"s0":{"en":"Start in high-D. For the anchor word 'cat', t-SNE turns distances into a probability: each neighbor j gets a Gaussian affinity p(j|i) = exp(−‖xᵢ−xⱼ‖²/2σᵢ²), normalized to sum to 1. Near words (other animals) get tall bars; far words (royalty) get almost nothing. The width σ is not guessed — it is tuned by binary search so the row has a chosen PERPLEXITY (here 5), which acts like the effective number of neighbors the anchor pays attention to.","ru":"Начинаем в высокой размерности. Для якорного слова «cat» t-SNE превращает расстояния в вероятность: каждый сосед j получает гауссову близость p(j|i) = exp(−‖xᵢ−xⱼ‖²/2σᵢ²), нормированную в сумму 1. Близкие слова (другие животные) дают высокие столбцы; далёкие (королевские) — почти ничего. Ширина σ не угадывается — её подбирают двоичным поиском так, чтобы у строки была заданная ПЕРПЛЕКСИЯ (здесь 5), играющая роль эффективного числа соседей, на которых смотрит якорь.","tt":"Югары үлчәмдә башлыйбыз. «cat» терәк сүзе өчен t-SNE ераклыкларны ихтималлыкка әйләндерә: һәр күрше j Гаусс якынлыгын ала p(j|i) = exp(−‖xᵢ−xⱼ‖²/2σᵢ²), суммасы 1 булырлык нормалаштырылган. Якын сүзләр (башка хайваннар) биек баганалар бирә; ерак сүзләр (патшалык) — диярлек берни. σ киңлеге чамаланмый — ул икеле эзләү белән сайлана, шунлыктан юлда сайланган ПЕРПЛЕКСИЯ (биредә 5) була, ул терәк игътибар иткән эффектив күршеләр санын аңлата."},"s1":{"en":"Now the low-D side. t-SNE lays the points out in 2-D and measures their closeness with a Student-t kernel q_ij ∝ (1+‖yᵢ−yⱼ‖²)⁻¹ — not a Gaussian. The inset compares the two: the Student-t (orange) has a HEAVY TAIL, so even far-apart points keep a little affinity. That tail is the cure for the 'crowding problem': it lets clusters spread out and gives moderately-distant points room to move apart in the plane.","ru":"Теперь низкая размерность. t-SNE раскладывает точки в 2-D и измеряет их близость ядром Стьюдента q_ij ∝ (1+‖yᵢ−yⱼ‖²)⁻¹ — не гауссовым. Вставка сравнивает оба: у Стьюдента (оранжевый) ТЯЖЁЛЫЙ ХВОСТ, поэтому даже далёкие точки сохраняют немного близости. Этот хвост лечит «проблему скученности»: он позволяет кластерам расходиться и даёт умеренно-далёким точкам место, чтобы разойтись на плоскости.","tt":"Хәзер түбән үлчәм. t-SNE нокталарны 2-D'та урнаштыра һәм аларның якынлыгын Стьюдент төше белән үлчи q_ij ∝ (1+‖yᵢ−yⱼ‖²)⁻¹ — Гаусс түгел. Кертем икесен чагыштыра: Стьюдентның (кызгылт-сары) АВЫР КОЙРЫГЫ бар, шуңа күрә ерак нокталар да бераз якынлык саклый. Бу койрык «кысылу проблемасын» дәвалый: ул кластерларга таралырга мөмкинлек бирә һәм урта-ерак нокталарга яссылыкта аерылырга урын бирә."},"s2":{"en":"What does t-SNE optimize? It wants the low-D closeness q to match the high-D closeness p. We overlay the anchor's q bars (orange) on its p bars (blue): where they differ, the layout is wrong. The single number measuring the total mismatch is the Kullback–Leibler divergence KL(P‖Q) = Σ p_ij log(p_ij/q_ij) — shown here for the real layout. t-SNE moves the points to drive this cost down (it is always ≥ 0, and 0 only if q equals p everywhere).","ru":"Что оптимизирует t-SNE? Он хочет, чтобы низкоразмерная близость q совпала с высокоразмерной p. Накладываем столбцы q якоря (оранжевые) на его столбцы p (синие): где они расходятся, раскладка неверна. Единое число, измеряющее общее расхождение, — дивергенция Кульбака–Лейблера KL(P‖Q) = Σ p_ij log(p_ij/q_ij) — показана для реальной раскладки. t-SNE двигает точки, чтобы снизить эту цену (она всегда ≥ 0 и равна 0, только если q всюду равно p).","tt":"t-SNE нәрсә оптимальләштерә? Ул түбән үлчәмле якынлык q югары үлчәмле p белән туры килсен ди. Терәкнең q баганаларын (кызгылт-сары) p баганаларына (зәңгәр) өстен куябыз: алар аерылган җирдә урнашу дөрес түгел. Гомуми тәңгәлсезлекне үлчәүче бер сан — Кульбак–Лейблер дивергенциясе KL(P‖Q) = Σ p_ij log(p_ij/q_ij) — чын урнашу өчен күрсәтелгән. t-SNE бу бәяне киметер өчен нокталарны кузгата (ул һәрвакыт ≥ 0, һәм q бар җирдә p'гә тигез булганда гына 0)."},"s3":{"en":"How do the points move? Take the gradient of KL with respect to each point yᵢ: ∂C/∂yᵢ = 4 Σⱼ (p_ij−q_ij)(yᵢ−yⱼ)(1+‖yᵢ−yⱼ‖²)⁻¹. Each arrow is the descent direction for that point. Where p > q the term pulls two points together (an attractive force); where p < q it pushes them apart (a repulsive force). Following these forces, step after step, is exactly the migration the companion view animates — same algorithm, seen as forces.","ru":"Как движутся точки? Берём градиент KL по каждой точке yᵢ: ∂C/∂yᵢ = 4 Σⱼ (p_ij−q_ij)(yᵢ−yⱼ)(1+‖yᵢ−yⱼ‖²)⁻¹. Каждая стрелка — направление спуска для точки. Там, где p > q, член тянет две точки вместе (сила притяжения); где p < q — расталкивает их (сила отталкивания). Следование этим силам шаг за шагом — это и есть миграция, которую показывает соседний виджет: тот же алгоритм, увиденный как силы.","tt":"Нокталар ничек кузгала? KL'ның һәр yᵢ ноктасы буенча градиентын алабыз: ∂C/∂yᵢ = 4 Σⱼ (p_ij−q_ij)(yᵢ−yⱼ)(1+‖yᵢ−yⱼ‖²)⁻¹. Һәр ук — шул нокта өчен төшү юнәлеше. p > q булган җирдә член ике ноктаны бергә тарта (тарту көче); p < q булган җирдә аларны этә (этү көче). Бу көчләргә адымлап-адым иярү — нәкъ күрше виджет күрсәткән миграция: шул ук алгоритм, көчләр буларак күрелгән."},"s4":{"en":"One caution before you read a t-SNE map. Perplexity is a knob: change it and the picture changes — a few tight blobs at low perplexity, looser structure at high. And because t-SNE only preserves WHO-is-near-WHOM locally, the gaps between clusters and the sizes of clusters are not meaningful global distances. Trust the neighborhoods; do not measure the empty space between islands.","ru":"Одно предупреждение, прежде чем читать карту t-SNE. Перплексия — это регулятор: измени его — и картина меняется: несколько плотных сгустков при низкой перплексии, более рыхлая структура при высокой. И поскольку t-SNE сохраняет лишь локальное «кто рядом с кем», промежутки между кластерами и их размеры — не осмысленные глобальные расстояния. Доверяй окрестностям; не измеряй пустоту между островами.","tt":"t-SNE картасын укыр алдыннан бер кисәтү. Перплексия — бу борма: аны үзгәрт — картина үзгәрә: түбән перплексиядә берничә тыгыз төер, югарыда йомшаграк төзелеш. Һәм t-SNE бары локаль «кем кем янында» дигәнне саклаганга, кластерлар арасындагы бушлыклар һәм аларның зурлыклары — мәгънәле гомуми ераклыклар түгел. Күршелекләргә ышан; утраулар арасындагы бушлыкны үлчәмә."}},"title":{"en":"Inside t-SNE: affinities, Student-t, KL, gradient","ru":"Внутри t-SNE: близости, Стьюдент-t, KL, градиент","tt":"t-SNE эчендә: якынлыклар, Стьюдент-t, KL, градиент"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
