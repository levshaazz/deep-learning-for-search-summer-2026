istown type-case count and how close Morse's code lands to the optimum.","cite":"Gleick, The Information (2011); J. D. Cook 2017 on Norvig's frequencies; Pierce 1980","typeE":12000,"typeT":9000,"typeZ":200,"dotDashUnitsMorse":4.527,"dotDashUnitsOptimal":4.126,"efficiencyPct":91,"ituUnitsMorse":6.0054,"ituUnitsOptimal":5.6616,"ituEfficiencyPct":94.3,"_warn":"WHO did the counting (Morse or Vail) is disputed — Gleick: 'their partisans differ'."}}},"i18n":{"_doc":"Step captions + static labels for the letter-entropy widget. EN + RU + TT. ALL numbers drawn in the figure (H, H₀, F₀…F₃, the redundancy, the 0.6–1.3 band) come from data/l17-entropy.json + data/l17-bench.json — never from this file. `dec` is the decimal separator the widget uses to format them, so the ru/tt layers print 4,76 (narrative/style-ru.md §2) without the widget knowing the language.","dec":{"en":".","ru":",","tt":","},"alt":{"en":"A sorted bar chart of letter probabilities beside a thermometer of bits per symbol: a uniform alphabet sits at the 4.76-bit ceiling, real English letter frequencies drop the floor to 4.1758, digrams drop it further, a 33-letter Russian alphabet raises the ceiling instead, and the F0-to-F3 staircase descends toward the 0.6–1.3 bits human band.","ru":"Отсортированные столбцы вероятностей букв рядом с термометром бит на символ: равномерный алфавит стоит на потолке 4,76 бита, настоящие английские частоты роняют пол до 4,1758, диграммы роняют его дальше, русский алфавит из 33 букв вместо этого поднимает потолок, а лестница F₀…F₃ спускается к человеческой полосе 0,6–1,3 бита.","tt":"Хәрефләр ихтималлыгының тәртипләнгән баганалары янында символга бит термометры: тигез алфавит 4,76 бит түшәмендә тора, чын инглиз ешлыклары идәнне 4,1758 кә төшерә, диграммалар аны тагын да түбәнәйтә, 33 хәрефле рус алфавиты исә түшәмне күтәрә, ә F₀…F₃ баскычы 0,6–1,3 бит кеше полосасына таба төшә."},"head":{"en":"reshape the letters — watch the floor","ru":"пересыпь буквы — и посмотри на пол","tt":"хәрефләрне бүтәнчә сал — идәнгә кара"},"thermo":{"en":"bits / symbol","ru":"бит / символ","tt":"бит / символ"},"thermoLetter":{"en":"bits / letter","ru":"бит / буква","tt":"бит / хәреф"},"hSym":{"en":"H","ru":"H","tt":"H"},"ceilSym":{"en":"H₀","ru":"H₀","tt":"H₀"},"redLbl":{"en":"R = 1 − H/H₀","ru":"R = 1 − H/H₀","tt":"R = 1 − H/H₀"},"p0":{"en":"uniform · 27 symbols (26 letters + space)","ru":"равномерно · 27 символов (26 букв + пробел)","tt":"тигез · 27 символ (26 хәреф + буш урын)"},"p1":{"en":"English · 26 letters, sorted (top 8 labelled)","ru":"английский · 26 букв по убыванию (подписаны 8)","tt":"инглиз · 26 хәреф кими бара (8 е билгеләнгән)"},"p2":{"en":"the same bars · digrams tighten the estimate","ru":"те же столбцы · диграммы ужимают оценку","tt":"шул ук баганалар · диграммалар бәяне кыса"},"p3":{"en":"Russian · 33 letters, sorted (top 8 labelled)","ru":"русский · 33 буквы по убыванию (подписаны 8)","tt":"рус · 33 хәреф кими бара (8 е билгеләнгән)"},"p4":{"en":"the staircase F₀ → F₁ → F₂ → F₃ → F₁₀₀","ru":"лестница F₀ → F₁ → F₂ → F₃ → F₁₀₀","tt":"баскыч F₀ → F₁ → F₂ → F₃ → F₁₀₀"},"n0":{"en":"uniform: every symbol equally likely — nothing to squeeze out","ru":"равномерно: все символы равновероятны — сжимать нечего","tt":"тигез: һәр символ бертигез ихтимал — кысарга берни юк"},"n1":{"en":"frequencies fan the bars out — the floor drops below the ceiling; the scale is bits/LETTER now","ru":"частоты разводят столбцы — пол падает ниже потолка; шкала теперь бит/БУКВУ","tt":"ешлыклар баганаларны аера — идән түшәм астына төшә; шкала хәзер хәрефкә бит"},"n2":{"en":"the bars did not move: CONTEXT lowers the floor — and the scale is back to bits/SYMBOL","ru":"столбцы не двигались: пол снижает КОНТЕКСТ — и шкала снова бит/СИМВОЛ","tt":"баганалар кузгалмады: идәнне КОНТЕКСТ төшерә — ә шкала кабат символга бит"},"n3":{"en":"33 letters: the ceiling rose too — only R compares two alphabets","ru":"33 буквы: потолок тоже вырос — алфавиты сравнимы только по R","tt":"33 хәреф: түшәм дә күтәрелде — алфавитлар R буенча гына чагыштырыла"},"n4":{"en":"each step of context digs deeper — a human stops in the band","ru":"каждый шаг контекста копает глубже — человек тормозит на полосе","tt":"контекстның һәр адымы тирәнрәк казый — кеше полосада туктый"},"s0":{"en":"Start flat. Twenty-seven equally likely symbols — 26 letters plus the space — and every symbol costs the same. That equal cost IS the ceiling F₀: the most any alphabet of this size can ever charge you per symbol. There is nothing here to compress.","ru":"Начни с плоского. Двадцать семь равновероятных символов — 26 букв плюс пробел, — и каждый стоит одинаково. Эта одинаковая цена и есть потолок F₀: больше алфавит такого размера с тебя не возьмёт. Сжимать здесь нечего.","tt":"Тигез хәлдән башла. Егерме җиде бертигез ихтимал символ — 26 хәреф һәм буш урын, — һәм һәрберсе бер үк бәһале. Нәкъ шушы тигез бәһа — түшәм F₀: мондый зурлыктагы алфавит синнән күбрәген алмый. Монда кысар нәрсә юк."},"s1":{"en":"Now pour in the real English letter frequencies. The bars fan out — «e» towers, the tail flattens toward zero — and the floor H drops away from the ceiling H₀ without moving it. Only the top eight letters are labelled: putting all 26 on one row turns them into a smear.","ru":"Теперь пересыпь буквы по настоящим английским частотам. Столбцы разъезжаются — «e» вырастает, хвост ложится почти в ноль, — и пол H отходит от потолка H₀, не сдвигая его. Подписаны только восемь верхних: поставить все 26 в один ряд — значит превратить их в кашу.","tt":"Хәзер хәрефләрне чын инглиз ешлыклары буенча сал. Баганалар аерыла — «e» үсә, койрык нульгә ята, — һәм идән H түшәм H₀ дан ераклаша, аны кузгатмыйча. Өстәге сигезе генә билгеләнгән: 26 сын бер рәткә куйсаң, алар буталчыкка әйләнә."},"s2":{"en":"Look at the bar chart: it did not move. The next drop, from F₁ to F₂, is bought by CONTEXT — knowing the previous letter — not by frequency. «q» is rare, yet after «q» the letter that follows is almost free.","ru":"Посмотри на столбцы: они не сдвинулись. Следующее падение, от F₁ к F₂, куплено КОНТЕКСТОМ — знанием предыдущей буквы, — а не частотой. «q» редкая, но после «q» следующая буква почти бесплатна.","tt":"Баганаларга кара: алар кузгалмады. Киләсе төшү, F₁ дән F₂ гә, ешлык белән түгел, ә КОНТЕКСТ белән — алдагы хәрефне белү белән — сатып алынган. «q» сирәк, ләкин «q» дан соң килгән хәреф диярлек бушлай."},"s3":{"en":"Switch to Russian: 33 letters, so the CEILING rises before anything else happens. H is higher here than in English — and that means nothing on its own. A different alphabet is a different scale; only the redundancy R = 1 − H/H₀ compares, and it says 11.2 % against 11.5 %: the two languages waste almost exactly as much.","ru":"Переключись на русский: 33 буквы дают другой максимум H₀. Значения H зависят от алфавита, корпуса и способа подсчёта. В показанных таблицах избыточность R = 1 − H/H₀ равна 11,2 % и 11,5 % — это сравнение конкретных частотных моделей, а не мера того, какой язык эффективнее.","tt":"Русчага күч: 33 хәреф, шуңа ТҮШӘМ башка бар нәрсәдән алда күтәрелә. H монда инглизчәдәгедән югарырак — һәм бу үзе генә бернәрсә дә аңлатмый. Башка алфавит — башка шкала; тик R = 1 − H/H₀ редундантлыгы гына чагыштырыла, ә ул 11,2 % ка каршы 11,5 % ди: ике тел дә диярлек бертигез исраф итә."},"s4":{"en":"The whole staircase at once. Each extra letter of context digs the floor deeper — F₀ from frequency alone, then F₁, F₂, F₃ — and with a hundred letters of context a human predictor lands in the shaded band, not at zero. That band is the target every language model is still walking down toward.","ru":"Вся лестница разом: F₀ — равномерный алфавит, F₁ — отдельные частоты, F₂ и F₃ — учёт контекста. Исторический опыт с предсказанием по длинному контексту даёт закрашенную полосу. Это оценка для конкретной методики, а не доказанный предел для любых текстов и современных языковых моделей.","tt":"Бөтен баскыч бердән. Контекстның һәр өстәмә хәрефе идәнне тирәнрәк казый — F₀ ялгыз ешлыклар буенча, аннары F₁, F₂, F₃, — ә йөз хәреф контекст белән кеше-фаразлаучы нульгә түгел, ә буялган полосага эләгә. Нәкъ шушы полоса — тел модельләре әле дә төшеп килгән максат."}},"title":{"en":"Reshape the letters, watch the floor","ru":"Пересыпь буквы — и посмотри на пол","tt":"Хәрефләрне бүтәнчә сал — идәнгә кара"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
