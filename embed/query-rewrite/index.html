</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>Query rewriting: HyDE &amp; multi-query lift recall</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="3" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>3</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"query-rewrite","mountName":"mountQueryRewrite","maxStep":3,"data":{"_doc":"Query rewriting, exact (stdlib). A short, vocabulary-poor query finds the true doc at rank 8 → recall@5 = 0, RR = 1/8 = 0.125. HyDE writes a hypothetical answer (rich with cardiac-cycle terms), embeds THAT → true doc rises to rank 2 → recall@5 = 1, RR = 1/2 = 0.5 (single-true-doc BINARY recall). Multi-query is a SEPARATE 5-relevant gold-set (NEVER blended with HyDE's recall): the single query retrieves 2/5 → recall@5 = 0.4; the union of 3 paraphrases retrieves 4/5 → recall@5 = 0.8. Real = cited/frozen HyDE lift on nfcorpus (gen_l10_real.py).","_source":"_research/gen_l10.py (toy, stdlib): RR=1/rank; single recall@5=(trueRank≤5); multi recall@5=|gold∩found|/5.","query":"How does the heart pump blood?","trueDocId":"doc_cardiac_cycle","original":{"rankedList":["doc_blood_types","doc_anatomy","doc_exercise","doc_diet","doc_circulatory","doc_valves","doc_pressure","doc_cardiac_cycle","doc_history","doc_aneurysm"],"trueRank":8,"recallAt5":0,"rr":0.125},"hyde":{"hypotheticalDoc":"The cardiac cycle drives blood flow: during ventricular systole the ventricles contract, ejecting blood; during diastole they refill. Pressure gradients and one-way valves keep circulation moving.","rankedList":["doc_circulatory","doc_cardiac_cycle","doc_valves","doc_anatomy","doc_pressure","doc_exercise","doc_diet","doc_blood_types","doc_history","doc_aneurysm"],"trueRank":2,"recallAt5":1,"rr":0.5},"multiQuery":{"paraphrases":["How does the heart pump blood?","What happens during the cardiac cycle?","Explain ventricular systole and diastole."],"goldRelevant":["gold_cycle","gold_systole","gold_ventricle","gold_diastole","gold_output"],"foundSingle":["gold_cycle","gold_systole"],"foundUnion":["gold_cycle","gold_systole","gold_ventricle","gold_diastole"],"recallAt5Single":0.4,"recallAt5Union":0.8}},"dataSets":{"l10-rewrite":{"_doc":"Query rewriting, exact (stdlib). A short, vocabulary-poor query finds the true doc at rank 8 → recall@5 = 0, RR = 1/8 = 0.125. HyDE writes a hypothetical answer (rich with cardiac-cycle terms), embeds THAT → true doc rises to rank 2 → recall@5 = 1, RR = 1/2 = 0.5 (single-true-doc BINARY recall). Multi-query is a SEPARATE 5-relevant gold-set (NEVER blended with HyDE's recall): the single query retrieves 2/5 → recall@5 = 0.4; the union of 3 paraphrases retrieves 4/5 → recall@5 = 0.8. Real = cited/frozen HyDE lift on nfcorpus (gen_l10_real.py).","_source":"_research/gen_l10.py (toy, stdlib): RR=1/rank; single recall@5=(trueRank≤5); multi recall@5=|gold∩found|/5.","query":"How does the heart pump blood?","trueDocId":"doc_cardiac_cycle","original":{"rankedList":["doc_blood_types","doc_anatomy","doc_exercise","doc_diet","doc_circulatory","doc_valves","doc_pressure","doc_cardiac_cycle","doc_history","doc_aneurysm"],"trueRank":8,"recallAt5":0,"rr":0.125},"hyde":{"hypotheticalDoc":"The cardiac cycle drives blood flow: during ventricular systole the ventricles contract, ejecting blood; during diastole they refill. Pressure gradients and one-way valves keep circulation moving.","rankedList":["doc_circulatory","doc_cardiac_cycle","doc_valves","doc_anatomy","doc_pressure","doc_exercise","doc_diet","doc_blood_types","doc_history","doc_aneurysm"],"trueRank":2,"recallAt5":1,"rr":0.5},"multiQuery":{"paraphrases":["How does the heart pump blood?","What happens during the cardiac cycle?","Explain ventricular systole and diastole."],"goldRelevant":["gold_cycle","gold_systole","gold_ventricle","gold_diastole","gold_output"],"foundSingle":["gold_cycle","gold_systole"],"foundUnion":["gold_cycle","gold_systole","gold_ventricle","gold_diastole"],"recallAt5Single":0.4,"recallAt5Union":0.8}}},"i18n":{"_doc":"Step captions + small labels for query-rewrite. EN canonical + RU + TT. Every NUMBER (rank 8/2, recall@5 0/1, RR 0.125/0.5, multi-query 0.4/0.8) comes from data/l10-rewrite.json, never from these strings.","alt":{"en":"A ranked list where the true doc sits at rank 8 (below the top-5 cut) under the original query; HyDE lifts it to rank 2; a separate multi-query gold-set raises recall@5 from 0.4 to 0.8.","ru":"Ранжированный список, где истинный документ на 8-м месте (ниже отсечки топ-5) при исходном запросе; HyDE поднимает его на 2-е; отдельный multi-query gold-set поднимает recall@5 с 0,4 до 0,8.","tt":"Ранжланган исемлек, анда чын документ 8 нче урында (топ-5 кисүеннән түбән) башлангыч сорауда; HyDE аны 2 нчегә күтәрә; аерым multi-query gold-set recall@5 ны 0,4 тән 0,8 гә күтәрә."},"ranked":{"en":"retrieved, ranked","ru":"извлечено, по рангу","tt":"табылган, ранг буенча"},"cut":{"en":"top-5 cut","ru":"отсечка топ-5","tt":"топ-5 кисүе"},"trueDoc":{"en":"true doc","ru":"истинный документ","tt":"чын документ"},"rank":{"en":"rank","ru":"ранг","tt":"ранг"},"origLbl":{"en":"original query","ru":"исходный запрос","tt":"башлангыч сорау"},"hydeLbl":{"en":"HyDE query","ru":"HyDE-запрос","tt":"HyDE-сорау"},"hydeTitle":{"en":"HyDE","ru":"HyDE","tt":"HyDE"},"hydeL1":{"en":"write a hypothetical","ru":"пишем гипотетический","tt":"гипотетик яз"},"hydeL2":{"en":"answer, then embed","ru":"ответ, кодируем его","tt":"җавап, эмбеддлы"},"hydeL3":{"en":"THAT vector","ru":"ИМЕННО его вектор","tt":"НӘКЪ шул вектор"},"mqHead":{"en":"multi-query · a separate 5-relevant gold-set","ru":"multi-query · отдельный gold-set из 5 релевантных","tt":"multi-query · аерым 5 релевантлы gold-set"},"mqSingle":{"en":"single query","ru":"один запрос","tt":"бер сорау"},"mqUnion":{"en":"union of 3 paraphrases","ru":"объединение 3 перефразировок","tt":"3 парафразаның берләшмәсе"},"s0":{"en":"The query “How does the heart pump blood?” is short and vocabulary-poor. The true doc speaks of “cardiac cycle, ventricular systole” — a lexical and semantic mismatch. So the retriever ranks the true doc only 8th: below the top-5 cut, it is never read. recall@5 = 0, RR = 1/8 = 0.125.","ru":"Запрос «Как сердце качает кровь?» короткий и бедный лексикой. Истинный документ говорит о «сердечном цикле, систоле желудочков» — лексическое и смысловое расхождение. Поэтому поисковик ставит истинный документ лишь на 8-е место: ниже отсечки топ-5 его не читают. recall@5 = 0, RR = 1/8 = 0,125.","tt":"«Йөрәк канны ничек кудыра?» сорауы кыска һәм лексикага ярлы. Чын документ «йөрәк циклы, карынчык систоласы» турында сөйли — лексик һәм мәгънәви туры килмәү. Шуңа эзләгеч чын документны бары 8 нче урынга куя: топ-5 кисүеннән түбән, аны укымыйлар. recall@5 = 0, RR = 1/8 = 0,125."},"s1":{"en":"HyDE's trick: don't search with the bare question. First ask an LLM to write a hypothetical answer paragraph — full of the words a real answer would use (cardiac cycle, ventricles, systole) — and embed THAT paragraph instead of the question.","ru":"Трюк HyDE: не искать голым вопросом. Сначала просим LLM написать гипотетический абзац-ответ — полный слов, которые были бы в настоящем ответе (сердечный цикл, желудочки, систола) — и кодируем ИМЕННО этот абзац вместо вопроса.","tt":"HyDE хәйләсе: ялангач сорау белән эзләмә. Башта LLM дан гипотетик җавап абзацы язуын сорыйбыз — чын җавапта булачак сүзләр белән тулы (йөрәк циклы, карынчыклар, систола) — һәм сорау урынына НӘКЪ шул абзацны эмбеддлыйбыз."},"s2":{"en":"The hypothetical answer's vector lands right next to the true doc — they speak the same vocabulary. Re-retrieve, and the true doc jumps from rank 8 to rank 2: now inside the top-5. recall@5 = 1, RR = 1/2 = 0.5. Same retriever, a better query.","ru":"Вектор гипотетического ответа оказывается прямо рядом с истинным документом — они говорят на одном языке. Переизвлекаем, и истинный документ прыгает с 8-го на 2-е место: теперь внутри топ-5. recall@5 = 1, RR = 1/2 = 0,5. Тот же поисковик, лучший запрос.","tt":"Гипотетик җавапның векторы чын документ янәшәсенә төшә — алар бер үк сүзлек белән сөйли. Яңадан эзлибез, һәм чын документ 8 нче урыннан 2 нчегә сикерә: хәзер топ-5 эчендә. recall@5 = 1, RR = 1/2 = 0,5. Шул ук эзләгеч, яхшырак сорау."},"s3":{"en":"Multi-query attacks recall differently — on a SEPARATE query with 5 relevant docs (never blended with HyDE's single-doc count). The bare query retrieves 2 of 5 → recall@5 = 0.4. Issue 3 paraphrases and take the UNION of their top-5: it covers 4 of 5 → recall@5 = 0.8. More phrasings, more of the relevant set found.","ru":"Multi-query атакует полноту иначе — на ОТДЕЛЬНОМ запросе с 5 релевантными документами (не смешивая со счётом HyDE по одному документу). Голый запрос достаёт 2 из 5 → recall@5 = 0,4. Выдай 3 перефразировки и возьми ОБЪЕДИНЕНИЕ их топ-5: оно покрывает 4 из 5 → recall@5 = 0,8. Больше формулировок — больше найденного из релевантного набора.","tt":"Multi-query recall'га башкача һөҗүм итә — 5 релевант документлы АЕРЫМ сорауда (HyDE ның бер-документлы исәбе белән бутамыйча). Ялангач сорау 5 тән 2 не таба → recall@5 = 0,4. 3 парафраза бир һәм аларның топ-5 ләренең БЕРЛӘШМӘСЕН ал: ул 5 тән 4 не каплый → recall@5 = 0,8. Күбрәк формулировка — релевант җыелмадан күбрәк табыла."}},"title":{"en":"Query rewriting: HyDE & multi-query lift recall","ru":"Переписывание запроса: HyDE и multi-query поднимают полноту","tt":"Сорауны яңадан язу: HyDE һәм multi-query recall'ны күтәрә"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
