of blood."}],"answerClaims":[{"text":"The heart is a muscular organ that pumps blood.","supported":true},{"text":"It contracts rhythmically.","supported":true},{"text":"Ventricular systole ejects blood into the arteries.","supported":true},{"text":"William Harvey discovered this circulation in 1628.","supported":false}],"groundTruthClaims":[{"text":"The heart pumps blood through the body.","inContext":true},{"text":"Ventricular systole ejects blood into the arteries.","inContext":true},{"text":"Diastole then refills the heart chambers.","inContext":false}],"reverseQuestionCos":[0.92,0.88,0.31],"k":4,"totalRelevant":2,"precisionAtK":[{"k":1,"precisionAtK":1,"relevant":true},{"k":2,"precisionAtK":0.5,"relevant":false},{"k":3,"precisionAtK":0.6667,"relevant":true},{"k":4,"precisionAtK":0.5,"relevant":false}],"faithfulness":0.75,"answerRelevance":0.7033,"contextPrecision":0.8333,"contextRecall":0.6667,"supportedClaims":3,"answerClaimCount":4,"groundTruthInContext":2,"groundTruthCount":3},"dataSets":{"l11-ragas":{"_src":"toy worked example (gen_l11.py, stdlib) — RAGAS four metrics, hand-checkable fractions/means","question":"How does the heart pump blood?","contexts":[{"id":"c1","rank":1,"relevant":true,"text":"The heart is a muscular organ that pumps blood through the circulatory system."},{"id":"c2","rank":2,"relevant":false,"text":"Blood type is determined by antigens on the surface of red blood cells."},{"id":"c3","rank":3,"relevant":true,"text":"Ventricular systole contracts the ventricles, ejecting blood into the arteries."},{"id":"c4","rank":4,"relevant":false,"text":"The average adult human has roughly five litres of blood."}],"answerClaims":[{"text":"The heart is a muscular organ that pumps blood.","supported":true},{"text":"It contracts rhythmically.","supported":true},{"text":"Ventricular systole ejects blood into the arteries.","supported":true},{"text":"William Harvey discovered this circulation in 1628.","supported":false}],"groundTruthClaims":[{"text":"The heart pumps blood through the body.","inContext":true},{"text":"Ventricular systole ejects blood into the arteries.","inContext":true},{"text":"Diastole then refills the heart chambers.","inContext":false}],"reverseQuestionCos":[0.92,0.88,0.31],"k":4,"totalRelevant":2,"precisionAtK":[{"k":1,"precisionAtK":1,"relevant":true},{"k":2,"precisionAtK":0.5,"relevant":false},{"k":3,"precisionAtK":0.6667,"relevant":true},{"k":4,"precisionAtK":0.5,"relevant":false}],"faithfulness":0.75,"answerRelevance":0.7033,"contextPrecision":0.8333,"contextRecall":0.6667,"supportedClaims":3,"answerClaimCount":4,"groundTruthInContext":2,"groundTruthCount":3}},"i18n":{"_doc":"Step captions + labels for ragas-metrics. EN canonical + RU + TT. Every NUMBER (faithfulness 0.75, answer-relevance 0.7033, context-precision 0.8333, context-recall 0.6667; the 3/4 and 2/3 fractions) comes from data/l11-ragas.json, never from these strings.","alt":{"en":"A RAGAS scorecard: a generated answer's four claims (three supported, one hallucinated), then four gauges — faithfulness, answer relevance, context precision, context recall — each revealed and scored 0 to 1.","ru":"Карточка RAGAS: четыре утверждения сгенерированного ответа (три подтверждены, одно галлюцинация), затем четыре шкалы — faithfulness, answer relevance, context precision, context recall — каждая раскрывается и оценивается от 0 до 1.","tt":"RAGAS картасы: ясалган җавапның дүрт раславы (өчесе расланган, берсе галлюцинация), аннары дүрт шкала — faithfulness, answer relevance, context precision, context recall — һәрберсе ачыла һәм 0 дән 1 гә кадәр бәяләнә."},"answerHead":{"en":"generated answer · claim-by-claim","ru":"сгенерированный ответ · по утверждениям","tt":"ясалган җавап · раславлап"},"mFaith":{"en":"faithfulness","ru":"верность ответа","tt":"җавап тугрылыгы"},"mRel":{"en":"answer relevance","ru":"релевантность","tt":"релевантлык"},"mPrec":{"en":"context precision","ru":"точность контекста","tt":"контекст төгәллеге"},"mRec":{"en":"context recall","ru":"полнота контекста","tt":"контекст тулылыгы"},"s0":{"en":"No gold answer here — only the question, the retrieved contexts, and a generated answer broken into atomic claims. Three are supported by the contexts; one (“William Harvey, 1628”) is fluent but unsupported — a hallucination. RAGAS scores generation without a reference answer.","ru":"Здесь нет эталонного ответа — только вопрос, извлечённые контексты и сгенерированный ответ, разбитый на атомарные утверждения. Три подтверждены контекстами; одно («Уильям Гарвей, 1628») звучит гладко, но не подтверждено — галлюцинация. RAGAS оценивает генерацию без эталона.","tt":"Бу җирдә эталон җавап юк — бары сорау, табылган контекстлар һәм атомар раславларга бүленгән ясалган җавап. Өчесе контекстлар белән расланган; берсе («Уильям Гарвей, 1628») шома яңгырый, ләкин расланмаган — галлюцинация. RAGAS генерацияне эталонсыз бәяли."},"s1":{"en":"Faithfulness = supported claims / total claims = 3/4 = 0.75. It catches the hallucinated claim directly: one unsupported sentence drops the score a full quarter. This is the metric that grades “did the answer stay grounded in what we retrieved?”","ru":"Faithfulness = подтверждённые утверждения / все утверждения = 3/4 = 0,75. Она прямо ловит галлюцинацию: одно неподтверждённое предложение снижает оценку на четверть. Это метрика «остался ли ответ привязан к тому, что мы извлекли?»","tt":"Faithfulness = расланган раславлар / барлык раславлар = 3/4 = 0.75. Ул галлюцинацияне туры тота: бер расланмаган җөмлә бәяне чиреккә төшерә. Бу «җавап без тапканга бәйле калдымы?» дигән метрика."},"s2":{"en":"Answer relevance reverse-engineers questions from the answer and measures their mean cosine to the original question (mean[0.92, 0.88, 0.31] = 0.7033). The drifting third question — born of the hallucinated claim — drags the mean down. It grades “does the answer actually address the question?”","ru":"Answer relevance восстанавливает вопросы из ответа и измеряет их среднюю косинусную близость к исходному вопросу (mean[0,92, 0,88, 0,31] = 0,7033). Сбившийся третий вопрос — порождённый галлюцинацией — тянет среднее вниз. Метрика «отвечает ли ответ на сам вопрос?»","tt":"Answer relevance җаваптан сорауларны кире торгыза һәм аларның чыганак сорауга уртача косинус якынлыгын үлчи (mean[0.92, 0.88, 0.31] = 0,7033). Читкә тайпылган өченче сорау — галлюцинациядән туган — уртачаны түбән тарта. «Җавап сорауга җавап бирәме?» дигән метрика."},"s3":{"en":"Context precision asks whether the relevant chunks sit near the top of what was retrieved: Σ precision@k over the relevant ranks, divided by the relevant count = (1 + 2/3)/2 = 0.8333. Relevant items at ranks 1 and 3, with noise between, cost some precision. It grades the retriever's ranking.","ru":"Context precision спрашивает, стоят ли релевантные чанки вверху извлечённого: Σ precision@k по релевантным рангам, делённая на число релевантных = (1 + 2/3)/2 = 0,8333. Релевантные на рангах 1 и 3, с шумом между ними, стоят части точности. Метрика ранжирования ретривера.","tt":"Context precision релевант кисәкләр табылганның өстендә торамы дип сорый: Σ precision@k релевант ранглар буенча, релевантлар санына бүленә = (1 + 2/3)/2 = 0,8333. 1 һәм 3 рангтагы релевантлар, арада шау-шу белән, төгәллекнең бер өлешен ала. Ретривер ранжлавын бәяли."},"s4":{"en":"Context recall asks the opposite: of the ground-truth claims, how many are actually present in the retrieved context? 2 of 3 = 0.6667 — the third truth (“diastole refills the heart”) was never retrieved. Together the four metrics decompose RAG quality into generation faithfulness, relevance, and both sides of retrieval.","ru":"Context recall спрашивает обратное: сколько из эталонных утверждений действительно присутствует в извлечённом контексте? 2 из 3 = 0,6667 — третье эталонное утверждение («диастола наполняет сердце») не было извлечено. Вместе четыре метрики раскладывают качество RAG на верность генерации, релевантность и обе стороны извлечения.","tt":"Context recall киресен сорый: эталон раславларның ничәсе чыннан да табылган контекстта бар? 3 тән 2 се = 0,6667 — өченче хакыйкать («диастола йөрәкне тутыра») табылмаган. Бергә дүрт метрика RAG сыйфатын генерация тугрылыгына, релевантлыкка һәм эзләүнең ике ягына таркаталар."}},"title":{"en":"RAGAS: the four metrics","ru":"RAGAS: четыре метрики","tt":"RAGAS: дүрт метрика"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
