mes are read from data.triples, never typed here.","alt":{"en":"An entity graph for a two-hop question. Three retrieved documents sit above five linked entities. A single-hop pick of the top document names the founder but no field of study, so recall is zero; a two-hop graph traversal from the company to its founder to the field reaches the answer node, so recall is one.","ru":"Граф сущностей для двухшагового вопроса. Три извлечённых документа над пятью связанными сущностями. Одношаговый выбор лучшего документа называет основателя, но не область обучения, поэтому полнота нулевая; двухшаговый обход графа от компании к её основателю и к области достигает узла-ответа, поэтому полнота единичная.","tt":"Икеадымлы сорау өчен сущностьлар графы. Биш бәйләнгән сущность өстендә өч табылган документ. Иң яхшы документны бер адымда сайлау нигезләүчене атый, ләкин уку өлкәсен түгел, шуңа тулылык нуль; компаниядән аның нигезләүчесенә, аннары өлкәгә графны ике адымда үтү җавап-төенгә җитә, шуңа тулылык бер."},"questionHead":{"en":"question","ru":"вопрос","tt":"сорау"},"hopsLabel":{"en":"hops needed","ru":"нужно шагов","tt":"кирәк адымнар"},"docsHead":{"en":"retrieved documents","ru":"извлечённые документы","tt":"табылган документлар"},"graphHead":{"en":"entity graph","ru":"граф сущностей","tt":"сущностьлар графы"},"noField":{"en":"no field","ru":"нет области","tt":"өлкә юк"},"recallSingle":{"en":"single-hop recall","ru":"полнота за один шаг","tt":"бер адымлы тулылык"},"recallMulti":{"en":"multi-hop recall","ru":"полнота за несколько шагов","tt":"күпадымлы тулылык"},"realHead":{"en":"real run","ru":"реальный запуск","tt":"чын җибәрү"},"realExtracted":{"en":"extracted","ru":"извлёк","tt":"чыгарды"},"realTriples":{"en":"triples","ru":"троек","tt":"өчлекне"},"realTraversed":{"en":"traversed to","ru":"обошёл до","tt":"үтте"},"communityNote":{"en":"GraphRAG also pre-summarises graph communities","ru":"GraphRAG также заранее резюмирует сообщества графа","tt":"GraphRAG шулай ук граф җәмгыятьләрен алдан йомгаклый"},"s0":{"en":"The question asks for the field the founder of Acme Corp studied — but no single document names both the founder and a field of study. Above sit the three retrieved documents; below, the entities they mention wait as faint nodes. Answering will take more than one lookup.","ru":"Вопрос спрашивает, какую область изучал основатель Acme Corp, — но ни один документ не называет одновременно и основателя, и область обучения. Сверху — три извлечённых документа; снизу упомянутые в них сущности ждут бледными узлами. Ответ потребует не одного обращения.","tt":"Сорау Acme Corp нигезләүчесе нинди өлкәне өйрәнгәнен сорый — ләкин бер документ та нигезләүчене дә, уку өлкәсен дә бергә атамый. Өстә — өч табылган документ; аста аларда телгә алынган сущностьлар тонык төеннәр булып көтә. Җавап бер мөрәҗәгатьтән артыграк таләп итәчәк."},"s1":{"en":"Single-hop retrieval grabs the one best document and stops. It names the founder, Dana Reyes, but says nothing about a field of study — so the answer is simply not in this chunk. Recall against the question lands at zero: the right fact lives one hop away, in another document.","ru":"Одношаговое извлечение берёт один лучший документ и останавливается. Он называет основателя, Дану Рейес, но ничего не говорит об области обучения — значит, ответа в этом фрагменте просто нет. Полнота по вопросу оказывается нулевой: нужный факт лежит на один шаг дальше, в другом документе.","tt":"Бер адымлы эзләү иң яхшы бер документны ала да туктый. Ул нигезләүчене, Дана Рейесны, атый, ләкин уку өлкәсе турында берни әйтми — димәк, җавап бу кисәктә бөтенләй юк. Сорау буенча тулылык нульгә төшә: кирәкле факт бер адым ераграк, икенче документта."},"s2":{"en":"Instead of treating documents as a flat bag, we extract entities and relations and link them into a graph — starting with the chain that answers the question. From d1 the company links to its founder; from d2 the founder links to what she studied. Acme Corp → Dana Reyes → computer science: the two facts that matter, now connected across two documents.","ru":"Вместо того чтобы держать документы плоским мешком, мы извлекаем сущности и связи и сшиваем их в граф — начиная с цепочки, которая отвечает на вопрос. Из d1 компания связывается с основателем; из d2 основатель — с тем, что она изучала. Acme Corp → Дана Рейес → computer science: два нужных факта, теперь соединённые через два документа.","tt":"Документларны яссы капчык итеп тотуның урынына, без сущностьларны һәм бәйләнешләрне чыгарып графка тегәбез — сорауга җавап бирә торган чылбырдан башлап. d1 дән компания нигезләүчесенә бәйләнә; d2 дән нигезләүче нәрсә өйрәнгәненә. Acme Corp → Дана Рейес → computer science: кирәкле ике факт, хәзер ике документ аша тоташтырылган."},"s3":{"en":"The rest of the graph fills in too: Acme Corp is headquartered in Portland, Dana Reyes studied at MIT, and MIT is located in Cambridge. These context edges are facts the extractor lifted but the question does not need — the full constellation, with the answer-path already laid through it.","ru":"Остальная часть графа тоже заполняется: Acme Corp находится в Портленде, Дана Рейес училась в MIT, а MIT расположен в Кембридже. Эти контекстные рёбра — факты, которые извлёк экстрактор, но которые вопросу не нужны: полное созвездие, сквозь которое уже проложен путь к ответу.","tt":"Графның калган өлеше дә тулыла: Acme Corp Портлендта урнашкан, Дана Рейес MIT та укыган, ә MIT Кембриджда. Бу контекст кырыйлары — экстрактор чыгарган, ләкин сорауга кирәкми торган фактлар: тулы йолдызлык, аша инде җавап юлы салынган."},"s4":{"en":"Now we walk the graph. Start at Acme Corp, follow the founded_by edge to Dana Reyes, then her studied edge to computer science — two hops crossing two documents to reach the answer node. The fact a single lookup missed sits at the end of a short path, so recall is now full.","ru":"Теперь мы идём по графу. Начинаем с Acme Corp, по ребру founded_by переходим к Дане Рейес, затем по её ребру studied — к computer science: два шага через два документа до узла-ответа. Факт, упущенный одним обращением, лежит в конце короткого пути, и полнота теперь полная.","tt":"Хәзер без граф буенча барабыз. Acme Corp тан башлыйбыз, founded_by кырые буенча Дана Рейескә күчәбез, аннары аның studied кырые буенча computer science кә — җавап-төенгә җитү өчен ике документ аша ике адым. Бер мөрәҗәгать ычкындырган факт кыска юлның ахырында тора, шуңа тулылык хәзер тулы."},"s5":{"en":"This is not just a toy: a real local model, llama3.1:8b, read the same three documents, extracted the triples on its own, and then traversed the graph to the same field of study. The entities and relations were the model's; chaining two documents was the graph's. GraphRAG also pre-summarises clusters of the graph into community summaries for global questions.","ru":"Это не просто игрушка: настоящая локальная модель, llama3.1:8b, прочитала те же три документа, сама извлекла тройки и затем обошла граф до той же области обучения. Сущности и связи дала модель; цепочку из двух документов построил граф. GraphRAG также заранее резюмирует кластеры графа в сводки сообществ для глобальных вопросов.","tt":"Бу бары уенчык кына түгел: чын локаль модель, llama3.1:8b, шул ук өч документны укыды, өчлекләрне үзе чыгарды, аннары граф буенча шул ук уку өлкәсенә кадәр үтте. Сущностьлар һәм бәйләнешләр модельнеке; ике документны чылбырлау графныкы. GraphRAG шулай ук граф кластерларын глобаль сораулар өчен җәмгыять йомгакларына алдан туплый."}},"title":{"en":"GraphRAG: multi-hop traversal","ru":"GraphRAG: многошаговый обход","tt":"GraphRAG: күпадымлы үтү"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
