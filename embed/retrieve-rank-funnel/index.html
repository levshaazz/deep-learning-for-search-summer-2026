"},"desc1":{"en":"cheap, high-recall: BM25 / ANN — optimises recall","ru":"дёшево, широкий охват: BM25 / ANN — оптимизирует полноту","tt":"арзан, югары тулылык: BM25 / ANN — recall оптимальлаштыра"},"name2":{"en":"Ranking (stage 1)","ru":"Ранжирование (этап 1)","tt":"Ранжлау (этап 1)"},"desc2":{"en":"moderate cost, many features: GBDT / Learning-to-Rank","ru":"умеренная цена, много признаков: GBDT / Learning-to-Rank","tt":"урта бәя, күп билге: GBDT / Learning-to-Rank"},"name3":{"en":"Re-rank (stage 2)","ru":"Переранжирование (этап 2)","tt":"Кабат ранжлау (этап 2)"},"costlbl":{"en":"compute/doc","ru":"вычислений/док","tt":"исәпләү/док"},"desc3":{"en":"expensive cross-encoder + business rules — optimises precision@k","ru":"дорогой кросс-энкодер + бизнес-правила — оптимизирует precision@k","tt":"кыйммәтле кросс-энкодер + бизнес-кагыйдәләр — precision@k оптимальлаштыра"},"s0":{"en":"Start with the whole corpus — ~10⁹ documents. You can't run an expensive model on all of them. So you build a funnel.","ru":"Начинаем со всего корпуса — ~10⁹ документов. Дорогую модель на всех не запустить. Поэтому строим воронку.","tt":"Бөтен корпустан башлыйбыз — ~10⁹ документ. Кыйммәтле модельне барысында да эшләтеп булмый. Шуңа күрә воронка төзибез."},"s1":{"en":"First, a cheap high-recall sweep (BM25 / ANN) keeps ~10³ candidates. Never throw away the answer this early — recall lives here.","ru":"Сначала дешёвый высокополнотный проход (BM25 / ANN) оставляет ~10³ кандидатов. Не выбрасывай ответ так рано — здесь живёт полнота.","tt":"Башта арзан югары-тулылыклы үтеш (BM25 / ANN) ~10³ кандидат калдыра. Җавапны болай иртә ташлама — тулылык биредә яши."},"s2":{"en":"A mid-cost ranker scores the survivors down to ~10² with many features.","ru":"Ранкер средней цены сужает выживших до ~10² по множеству признаков.","tt":"Урта бәяле ранжлаучы исән калганнарны күп билге буенча ~10²'гә кадәр киметә."},"s3":{"en":"Finally the expensive cross-encoder re-ranks the last ~10 — precision@k where the user looks. Each stage spends ~10× more compute on ~10× fewer candidates.","ru":"Наконец дорогой кросс-энкодер переранжирует последние ~10 — precision@k там, куда смотрит пользователь. Каждый этап тратит ~10× больше вычислений на ~10× меньше кандидатов.","tt":"Ниһаять, кыйммәтле кросс-энкодер соңгы ~10'ны кабат ранжлый — кулланучы караган җирдә precision@k. Һәр этап ~10× азрак кандидатка ~10× күбрәк исәпләү тота."}},"title":{"en":"The retrieve → rank cascade","ru":"Каскад извлечь → ранжировать","tt":"Эзләү → ранжлау каскады"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
