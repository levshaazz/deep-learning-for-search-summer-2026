</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>The RAG loop as a neural circuit diagram: retrieve → rerank → generate</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="2" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>2</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"ncd-rag","mountName":"mountNcdRag","maxStep":2,"data":{},"dataSets":{},"i18n":{"_doc":"ncd-rag — the retrieval-augmented-generation loop in the NCD lens, rebuilt to actually USE the notation it claims. The corpus is a REGION that ENCLOSES the N document wires feeding the retriever (it used to be a node with an arrow coming out of it, dressed in the region idiom). The two narrowings N→K and K→k are HEXAGONS — the glyph _ncd.js defines as 'reindex / slice (top-k)' — where the top-k used to be a stack of cards. The query still enters TWICE (the grounding arc): that is the insight of RAG and the one thing the old figure got right. Structural: N, K, k are symbolic, no grounded numbers.","alt":{"en":"The RAG loop drawn as a neural circuit diagram. On the left, a dashed violet region encloses the corpus: N document vectors, drawn as pentagons because they were encoded offline and are only looked up now, their wires bundled and fed into a fast retriever. The query enters that retriever from above — a second axis in. A hexagon, the slice glyph, cuts N down to K candidates; a slower cross-encoder reranks them, and a second hexagon cuts K down to k. Finally the k documents and the query TOGETHER condition a language model that writes the grounded answer: the query enters a second time, along the dashed arc, so the model is asked what these documents say about the very question that fetched them. The funnel is N to K to k to one answer.","ru":"RAG-петля в виде neural circuit diagram. Слева пунктирная фиолетовая область охватывает корпус: N векторов документов, нарисованных пятиугольниками — они закодированы офлайн, и сейчас их лишь достают из индекса; их провода собраны в пучок и заведены в быстрый ретривер. Запрос входит в этот ретривер сверху — это вторая входная ось. Шестиугольник, глиф среза, режет N до K кандидатов; более медленный cross-encoder переупорядочивает их, и второй шестиугольник режет K до k. Наконец k документов и запрос ВМЕСТЕ обусловливают языковую модель, которая пишет обоснованный ответ: запрос входит второй раз, по пунктирной дуге, поэтому модель спрашивают, что эти документы говорят ровно о том вопросе, который их и достал. Воронка: N → K → k → один ответ.","tt":"RAG-циклы neural circuit diagram буларак. Сулда пунктир миләүшә өлкә корпусны камап ала: N документ векторы, биш почмаклар белән сызылган — алар офлайн кодланган, хәзер аларны индекстан алалар гына; чыбыклары бәйләмгә җыелып, тиз ретривга керә. Сорау бу ретривга өстән керә — бу икенче керү күчәре. Алтыпочмак, кисем глифы, N ны K кандидатка кадәр кисә; әкренрәк cross-encoder аларны яңадан тәртипли, ә икенче алтыпочмак K ны k га кадәр кисә. Ниһаять k документ һәм сорау БЕРГӘ тел моделенә шарт (контекст) итеп бирелә, һәм ул нигезле җавап яза: сорау икенче тапкыр керә, пунктир дуга буенча, шуңа модельдән нәкъ шул документларны алып килгән сорау турында сорыйлар. Воронка: N → K → k → бер җавап."},"legMap":{"en":"region = the corpus axis N · hexagon = a slice (top-k) · the query enters TWICE","ru":"область = ось корпуса N · шестиугольник = срез (top-k) · запрос входит ДВАЖДЫ","tt":"өлкә = корпус күчәре N · алтыпочмак = кисем (top-k) · сорау ИКЕ тапкыр керә"},"lblQuery":{"en":"query","ru":"запрос","tt":"сорау"},"tagCorpus":{"en":"N · the corpus","ru":"N · корпус","tt":"N · корпус"},"lblRetrieve":{"en":"retrieve","ru":"извлечь","tt":"алу"},"lblRetrieveSub":{"en":"bi-encoder · fast","ru":"bi-encoder · быстро","tt":"bi-encoder · тиз"},"lblRerank":{"en":"rerank","ru":"реранк","tt":"реранк"},"lblRerankSub":{"en":"cross-encoder","ru":"cross-encoder","tt":"cross-encoder"},"lblGenerate":{"en":"generate","ru":"генерация","tt":"генерация"},"lblGenerateSub":{"en":"LLM","ru":"LLM","tt":"LLM"},"lblTopK":{"en":"top-K","ru":"top-K","tt":"top-K"},"lblTopk":{"en":"top-k","ru":"top-k","tt":"top-k"},"lblAnswer":{"en":"answer","ru":"ответ","tt":"җавап"},"lgTitle":{"en":"the funnel","ru":"воронка","tt":"воронка"},"lgAxis":{"en":"broadcast axis","ru":"broadcast-ось","tt":"broadcast күчәре"},"lgKept":{"en":"docs kept","ru":"оставлено док.","tt":"калдырылган док."},"lgWork":{"en":"work / query","ru":"работа / запрос","tt":"эш / сорау"},"lgWorkBi":{"en":"N × one dot","ru":"N × один dot","tt":"N × бер dot"},"lgWorkCross":{"en":"+ K × a full BERT","ru":"+ K × полный BERT","tt":"+ K × тулы BERT"},"lgOrder":{"en":"ordering","ru":"порядок","tt":"тәртип"},"lgOrderRough":{"en":"roughly right","ru":"примерно верный","tt":"якынча дөрес"},"lgOrderSharp":{"en":"sharp","ru":"точный","tt":"төгәл"},"lgCtx":{"en":"what the LLM sees","ru":"что видит LLM","tt":"LLM нәрсә күрә"},"lgCtxV":{"en":"k docs + the query","ru":"k док. + запрос","tt":"k док. + сорау"},"lgOut":{"en":"answers","ru":"ответов","tt":"җаваплар"},"lgN0":{"en":"The corpus is not a box the arrow comes out of — it is the AXIS the query is broadcast over, so it is drawn as a region ENCLOSING the N document wires. The first hexagon is the slice that ends it: N → K.","ru":"Корпус — это не прямоугольник, из которого выходит стрелка: это ОСЬ, вдоль которой запрос уходит в broadcast, поэтому он нарисован областью, ОХВАТЫВАЮЩЕЙ N проводов документов. Первый шестиугольник — тот срез, что эту ось обрывает: N → K.","tt":"Корпус — уктан чыга торган турыпочмак түгел: ул — сорау broadcast ителә торган КҮЧӘР, шуңа ул N документ чыбыгын КАМАП АЛГАН өлкә булып сызылган. Беренче алтыпочмак — шул күчәрне өзә торган кисем: N → K."},"lgN1":{"en":"A second hexagon, a second slice: K → k. You can afford the expensive reader only because the first slice already threw away everything but K — the cascade is two hexagons, and nothing else.","ru":"Второй шестиугольник — второй срез: K → k. Дорогой читатель по карману только потому, что первый срез уже выбросил всё, кроме K, — каскад это два шестиугольника, и ничего больше.","tt":"Икенче алтыпочмак — икенче кисем: K → k. Кыйммәтле укучыны бары тик беренче кисем K дан башканы ташлаганга гына күтәрә аласың — каскад ул ике алтыпочмак, башка бернәрсә түгел."},"lgN2":{"en":"The query enters TWICE — that dashed arc is the whole of RAG. The model is not asked what it knows; it is asked what these k documents say, and the same query that fetched them is what it is asked about.","ru":"Запрос входит ДВАЖДЫ — эта пунктирная дуга и есть весь RAG. Модель спрашивают не о том, что она знает; её спрашивают, что говорят эти k документов, — и спрашивают ровно о том запросе, который их и достал.","tt":"Сорау ИКЕ тапкыр керә — шул пунктир дуга ул бөтен RAG. Модельдән ул белгәнне сорамыйлар; аннан шушы k документ нәрсә әйткәнен сорыйлар — һәм нәкъ аларны алып килгән сорау турында сорыйлар."},"s0":{"en":"Retrieve. Look at the left of the figure: the corpus is a dashed REGION, and it ENCLOSES the N documents — because a corpus is not a thing you point an arrow at, it is the axis the query is broadcast over. Each document is a pentagon (an element: encoded offline, only looked up now), and their wires bundle into a FAST retriever. The query comes into that same retriever from above — a second axis in. Then the hexagon: in this notation a hexagon is a slice, and this one is the slice N → K. This is the recall stage — cast a wide net cheaply. K is far smaller than N, but still too many to hand a language model, and their order is only roughly right.","ru":"Извлечь. Посмотри на левую часть схемы: корпус — это пунктирная ОБЛАСТЬ, и она ОХВАТЫВАЕТ N документов, потому что корпус — не то, на что показывают стрелкой, а ось, вдоль которой запрос уходит в broadcast. Каждый документ — пятиугольник (элемент: закодирован офлайн, сейчас его лишь достают), их провода собираются в пучок и уходят в БЫСТРЫЙ ретривер. Запрос приходит в тот же ретривер сверху — вторая входная ось. Дальше шестиугольник: в этой нотации шестиугольник — это срез, и вот этот срез — N → K. Это стадия полноты: дёшево закинуть широкий невод. K много меньше N, но всё ещё слишком много для языковой модели, и порядок их лишь приблизительно верен.","tt":"Алу. Схеманың сул ягына карагыз: корпус — пунктир ӨЛКӘ, һәм ул N документны КАМАП АЛА, чөнки корпус — ук белән күрсәтә торган нәрсә түгел, ә сорау broadcast ителә торган күчәр. Һәр документ — биш почмак (элемент: офлайн кодланган, хәзер аны алалар гына), чыбыклары бәйләмгә җыелып ТИЗ ретривга китә. Сорау шул ук ретривга өстән керә — икенче керү күчәре. Аннары алтыпочмак: бу нотациядә алтыпочмак — кисем, ә бу кисем — N → K. Бу тулылык стадиясе: арзан итеп киң ау салу. K, N нән күпкә кечерәк, әмма тел моделенә бирер өчен һаман күп, һәм тәртипләре якынча гына дөрес."},"s1":{"en":"Rerank. A slower, sharper model — a cross-encoder, the one that reads query and document together — reorders those K candidates, and a SECOND hexagon slices again: K → k. Two hexagons, and that is the whole cascade. Notice what makes the expensive model affordable at all: the first slice already threw away everything but K, so the reranker never has to look at the corpus. This is the precision stage — it fixes the ordering the cheap retriever only got roughly right, so the very best passages float to the top.","ru":"Реранк. Более медленная, более точная модель — cross-encoder, тот самый, который читает запрос и документ вместе, — переупорядочивает эти K кандидатов, и ВТОРОЙ шестиугольник режет снова: K → k. Два шестиугольника — и это весь каскад. Заметь, за счёт чего дорогая модель вообще по карману: первый срез уже выбросил всё, кроме K, поэтому реранкеру не приходится смотреть на корпус. Это стадия точности: она чинит порядок, который дешёвый ретривер угадал лишь грубо, и лучшие пассажи всплывают наверх.","tt":"Реранк. Әкренрәк, төгәлрәк модель — cross-encoder, сорау белән документны бергә укучысы — шул K кандидатны яңадан тәртипли, ә ИКЕНЧЕ алтыпочмак тагын кисә: K → k. Ике алтыпочмак — менә шул бөтен каскад. Кыйммәтле модельнең ни өчен күтәрелә алганын күрегез: беренче кисем K дан башканы ташлаган инде, шуңа реранкерга корпуска карарга кирәкми. Бу төгәллек стадиясе: ул арзан ретрив тупас кына тапкан тәртипне төзәтә, иң яхшы пассажлар өскә калка."},"s2":{"en":"Generate. The k surviving documents and the query TOGETHER condition a language model, which writes the grounded answer. Follow the dashed arc: the query enters a SECOND time, straight into the top of the generator. That arc is the whole of RAG — the model is not being asked what it knows, it is being asked what these k documents say about the very question that went and fetched them. Two wires into the generator, one answer out. The whole loop is one funnel, and every narrowing in it is a hexagon: N → K → k → 1.","ru":"Генерация. k выживших документов и запрос ВМЕСТЕ обусловливают языковую модель, которая пишет обоснованный ответ. Проследи пунктирную дугу: запрос входит ВТОРОЙ раз, прямо в верх генератора. Эта дуга и есть весь RAG — модель спрашивают не о том, что она знает, а о том, что эти k документов говорят ровно про тот вопрос, который их и достал. Два провода в генератор, один ответ наружу. Вся петля — одна воронка, и каждое сужение в ней — шестиугольник: N → K → k → 1.","tt":"Генерация. Исән калган k документ һәм сорау БЕРГӘ тел моделенә шарт (контекст) итеп бирелә, һәм ул нигезле җавап яза. Пунктир дуганы күзәтегез: сорау ИКЕНЧЕ тапкыр керә, туры генераторның өстенә. Шул дуга ул бөтен RAG — модельдән ул белгәнне түгел, ә нәкъ аларны алып килгән сорау турында шушы k документ нәрсә әйткәнен сорыйлар. Генераторга ике чыбык, чыгышта бер җавап. Бөтен цикл — бер воронка, һәм андагы һәр тарайту — алтыпочмак: N → K → k → 1."}},"title":{"en":"The RAG loop as a neural circuit diagram: retrieve → rerank → generate","ru":"RAG-петля как neural circuit diagram: retrieve → rerank → generate","tt":"RAG-циклы neural circuit diagram буларак: retrieve → rerank → generate"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
