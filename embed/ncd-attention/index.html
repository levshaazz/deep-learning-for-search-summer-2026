ircuit diagram: wires are tensor axes, boxes are operations. Q·Kᵀ contracts the d axis into scores — and in doing so creates an n by n axis, which is exactly the quadratic memory cost; softmax normalises over the key axis, and a weighted sum with V contracts that big axis back down into the context vector. The head and batch axes are broadcasts woven around the whole operation, multiplying the n by n axis until it reaches 25.8 gigabytes at 32768 tokens. The final step deletes the divide-by-root-d box and shows softmax saturating to 0.995, all but one-hot, so the gradient dies.","ru":"Масштабированное скалярное внимание в виде neural circuit diagram: провода — оси тензора, прямоугольники — операции. Q·Kᵀ стягивает ось d в оценки — и при этом создаёт ось n×n, которая и есть квадратичная стоимость по памяти; softmax нормирует по оси ключей, а взвешенная сумма с V стягивает эту большую ось обратно в контекстный вектор. Оси голов и батча — broadcast, оплетающий всю операцию и умножающий ось n×n, пока та не дорастает до 25,8 гигабайт при 32768 токенах. Последний шаг убирает прямоугольник деления на корень из d и показывает, как softmax насыщается до 0,995 — почти one-hot, и градиент гибнет.","tt":"Масштаблы скаляр игътибар neural circuit diagram буларак: чыбыклар — тензор күчәрләре, турыпочмаклар — операцияләр. Q·Kᵀ d күчәрен бәяләргә җыя — һәм шул ук вакытта n×n күчәрен тудыра, ул нәкъ квадратик хәтер бәясе; softmax ачкыч күчәре буенча нормалаштыра, ә V белән авырлыклы сумма шул зур күчәрне контекст векторына кире җыя. Башлар һәм батч күчәрләре — бөтен операцияне урап алган broadcast, ул n×n күчәрен 32768 токенда 25.8 гигабайтка җиткерә. Соңгы адым d тамырына бүлү блогын бетерә һәм softmax 0.995 кә кадәр туенуын күрсәтә — диярлек one-hot, градиент үлә."},"legMap":{"en":"wire = axis · box = operation · woven wire = broadcast","ru":"провод = ось · прямоугольник = операция · оплётка = broadcast","tt":"чыбык = күчәр · турыпочмак = операция · урау = broadcast"},"legCf":{"en":"delete one box and the circuit still runs — it just stops learning","ru":"убери один прямоугольник — схема всё ещё считает, просто перестаёт учиться","tt":"бер турыпочмакны бетер — схема һаман исәпли, ул бары тик өйрәнүдән туктый"},"lblIn":{"en":"tokens","ru":"токены","tt":"токеннар"},"lblScores":{"en":"scores","ru":"оценки","tt":"бәяләр"},"lblWeights":{"en":"attention","ru":"внимание","tt":"игътибар"},"lblOut":{"en":"context","ru":"контекст","tt":"контекст"},"lblContract":{"en":"contract d","ru":"стягиваем d","tt":"d җыябыз"},"lblSoftmax":{"en":"softmax over keys","ru":"softmax по ключам","tt":"ачкычлар буенча softmax"},"tagHead":{"en":"broadcast: h heads","ru":"broadcast: h голов","tt":"broadcast: h баш"},"tagBatch":{"en":"broadcast: b batch","ru":"broadcast: b батч","tt":"broadcast: b батч"},"blockCore":{"en":"one head","ru":"одна голова","tt":"бер баш"},"lgTitle":{"en":"axes & cost","ru":"оси и стоимость","tt":"күчәрләр һәм бәя"},"uMB":{"en":"MB","ru":"МБ","tt":"МБ"},"uGB":{"en":"GB","ru":"ГБ","tt":"ГБ"},"lgNoScale":{"en":"no ÷√dₖ","ru":"без ÷√dₖ","tt":"÷√dₖ сыз"},"lgWithScale":{"en":"with ÷√dₖ","ru":"с ÷√dₖ","tt":"÷√dₖ белән"},"lgN0":{"en":"The cup contracts d — and in doing so BIRTHS an n×n axis. That axis is the quadratic cost.","ru":"Чаша стягивает d — и тем самым РОЖДАЕТ ось n×n. Эта ось и есть квадратичная стоимость.","tt":"Касә d ны җыя — һәм шуның белән n×n күчәрен ТУДЫРА. Бу күчәр — квадратик бәя."},"lgN1":{"en":"softmax does not change the shape: n×n in, n×n out.","ru":"softmax не меняет форму: n×n на входе, n×n на выходе.","tt":"softmax форманы үзгәртми: керештә n×n, чыгышта n×n."},"lgN2":{"en":"The sum over keys contracts n×n back down to n×d. The big axis lived and died right here.","ru":"Сумма по ключам стягивает n×n обратно в n×d. Большая ось родилась и умерла прямо здесь.","tt":"Ачкычлар буенча сумма n×n не кире n×d ка җыя. Зур күчәр нәкъ шунда туды һәм үлде."},"lgN3":{"en":"The weave multiplies that n×n axis by h. This is the memory bill, not a metaphor.","ru":"Оплётка умножает эту ось n×n на h. Это счёт за память, а не метафора.","tt":"Урау шул n×n күчәрен h га тапкырлый. Бу — хәтер өчен счёт, метафора түгел."},"lgN4":{"en":"Without the scale, softmax saturates: 0.995 is all but one-hot, so the gradient dies.","ru":"Без масштаба softmax насыщается: 0,995 — это почти one-hot, и градиент гибнет.","tt":"Масштабсыз softmax туена: 0.995 — диярлек one-hot, градиент үлә."},"cfHead":{"en":"the same dot product q·k = 6, two fates","ru":"одно и то же скалярное произведение q·k = 6, две судьбы","tt":"шул ук скаляр тапкырчыгыш q·k = 6, ике язмыш"},"cfNo":{"en":"no ÷√dₖ","ru":"без ÷√dₖ","tt":"÷√dₖ сыз"},"cfYes":{"en":"÷√dₖ = 2","ru":"÷√dₖ = 2","tt":"÷√dₖ = 2"},"cfVerBad":{"en":"one-hot → gradient ≈ 0","ru":"почти one-hot → градиент ≈ 0","tt":"one-hot → градиент ≈ 0"},"cfVerOk":{"en":"soft → the gradient lives","ru":"мягко → градиент жив","tt":"йомшак → градиент исән"},"s0":{"en":"Contract d, then scale. The token wire (blue) is projected by learned boxes into Q, K, V. Q and K meet at the CUP — the cup is exactly where an axis disappears, and here it eats d, leaving raw dot products. The ÷√dₖ box then divides them by √4 = 2, and the row that reaches softmax is [1, 0, 3]. Now watch the ledger: d died, but an n×n axis was just BORN. Nothing in the picture warns you about it, and that axis is the whole quadratic cost of attention.","ru":"Стягиваем d, затем масштабируем. Провод токенов (синий) проецируется обучаемыми прямоугольниками в Q, K, V. Q и K встречаются в ЧАШЕ — чаша ровно там, где ось исчезает: это стягивание оси (в литературе — «тензорная свёртка»), и здесь оно съедает d, оставляя сырые скалярные произведения. Прямоугольник ÷√dₖ делит их на √4 = 2, и до softmax доходит строка [1, 0, 3]. А теперь смотри на сводку: ось d умерла, но только что РОДИЛАСЬ ось n×n. Картинка о ней не предупреждает, а именно она — вся квадратичная стоимость внимания.","tt":"d ны җыябыз, аннары масштаблыйбыз. Токен чыбыгы (зәңгәр) өйрәнелгән турыпочмаклар белән Q, K, V га проекцияләнә. Q һәм K КАСӘДӘ очраша — касә нәкъ күчәр юкка чыккан урын, монда ул d ны ашый һәм чи скаляр тапкырчыгышлар калдыра. ÷√dₖ блогы аларны √4 = 2 гә бүлә, һәм softmax ка [1, 0, 3] юлы килеп җитә. Хәзер җыелмага карагыз: d күчәре үлде, әмма n×n күчәре яңа гына ТУДЫ. Рәсем бу турыда кисәтми, ә нәкъ ул — игътибарның бөтен квадратик бәясе."},"s1":{"en":"softmax over the key axis — and this time you can see inside it. The triangle is not magic: it exponentiates every score, sums the exponentials, and divides each by that sum. The panel under the triangle does exactly that, term by term, with the real numbers. Note what does NOT happen: the shape does not change. n×n goes in, n×n comes out. softmax is free in memory terms — the damage was already done at the cup.","ru":"softmax по оси ключей — и на этот раз видно, что у него внутри. Треугольник — не магия: он возводит каждую оценку в экспоненту, складывает экспоненты и делит каждую на эту сумму. Панель под треугольником делает ровно это, член за членом, на настоящих числах. Заметь, чего НЕ происходит: форма не меняется. Вошло n×n, вышло n×n. По памяти softmax бесплатен — ущерб был нанесён ещё в чаше.","tt":"Ачкыч күчәре буенча softmax — һәм бу юлы аның эче күренә. Өчпочмак сихер түгел: ул һәр бәяне экспонентага күтәрә, экспоненталарны куша һәм һәрберсен шул суммага бүлә. Өчпочмак астындагы панель нәкъ шуны эшли, әгъза саен, чын саннар белән. Нәрсә БУЛМАВЫН күрегез: форма үзгәрми. n×n керде, n×n чыкты. Хәтер ягыннан softmax бушлай — зыян инде касәдә салынган."},"s2":{"en":"Context. The V wire arrives and a second cup contracts the key axis: the weighted sum turns the big n×n attention matrix back into a compact n×d context (0.958, 0.886). The whole life of the expensive axis is visible in one picture — born at the first cup, killed at the second. Note where this chain STOPS: at the output of ONE head. Putting the h heads back together (concat + L_O) is a separate operation, and it has its own diagram.","ru":"Контекст. Приходит провод V, и вторая чаша стягивает ось ключей: взвешенная сумма превращает большую матрицу внимания n×n обратно в компактный контекст n×d (0,958, 0,886). Вся жизнь дорогой оси видна на одной картинке — родилась в первой чаше, убита во второй. Заметь, где цепочка ОБРЫВАЕТСЯ: на выходе ОДНОЙ головы. Собрать h голов обратно (concat + L_O) — отдельная операция, и у неё своя схема.","tt":"Контекст. V чыбыгы килә, һәм икенче касә ачкыч күчәрен җыя: авырлыклы сумма зур n×n игътибар матрицасын кире компакт n×d контекстка (0.958, 0.886) әйләндерә. Кыйммәтле күчәрнең бөтен гомере бер рәсемдә: беренче касәдә туды, икенчесендә үтерелде. Чылбыр КАЙДА өзелгәнен күрегез: БЕР башның чыгышында. h башны кире җыю (concat + L_O) — аерым операция, аның үз схемасы."},"s3":{"en":"Broadcast — and the bill. The head axis h and the batch axis b are broadcasts: woven wires, not a special ‘batch rule’ hidden in the code. But a weave MULTIPLIES whatever it wraps, and what it wraps is the n×n axis. Read the ledger: 12 heads at 512 tokens is 6.3 MB, at 4096 it is 403 MB, at 32768 it is 25.8 GB. The picture never changed shape — only n did.","ru":"Broadcast — и счёт. Ось голов h и ось батча b — это broadcast: оплетающие провода, а не особое «правило батча», спрятанное в коде. Но оплётка УМНОЖАЕТ то, что оплетает, а оплетает она ось n×n. Читай сводку: 12 голов при 512 токенах — 6,3 МБ, при 4096 — 403 МБ, при 32768 — 25,8 ГБ. Картинка не изменила форму — изменилось только n.","tt":"Broadcast — һәм счёт. Башлар күчәре h һәм батч күчәре b — broadcast: урап алучы чыбыклар, кодта яшерелгән аерым «батч кагыйдәсе» түгел. Ләкин урау үзе урап алганны ТАПКЫРЛЫЙ, ә ул n×n күчәрен урый. Җыелманы укыгыз: 512 токенда 12 баш — 6.3 МБ, 4096 да — 403 МБ, 32768 дә — 25.8 ГБ. Рәсем формасын үзгәртмәде — бары тик n үзгәрде."},"s4":{"en":"Now break it. Delete the ÷√dₖ box and feed the SAME dot product, 6, down both branches. Unscaled, softmax(0,0,6) returns 0.995 — all but one-hot, and a saturated softmax has a vanishing gradient, so the layer stops learning. Scaled by √dₖ = 2, the score becomes 3 and softmax(0,0,3) returns a soft 0.909. The circuit still RUNS without that box. It just never learns — which is why the notation is worth having: the failure is a missing glyph, not a mystery.","ru":"А теперь сломаем. Убираем прямоугольник ÷√dₖ и подаём ОДНО И ТО ЖЕ скалярное произведение, 6, в обе ветви. Без масштаба softmax(0,0,6) даёт 0,995 — почти one-hot, а у насыщенного softmax градиент исчезает, и слой перестаёт учиться. С делением на √dₖ = 2 оценка становится 3, и softmax(0,0,3) даёт мягкие 0,909. Без этого прямоугольника схема всё ещё СЧИТАЕТ. Она просто никогда не научится — вот ради чего нужна нотация: отказ выглядит как недостающий глиф, а не как загадка.","tt":"Ә хәзер ватабыз. ÷√dₖ блогын бетерәбез һәм ШУЛ УК скаляр тапкырчыгышны, 6 ны, ике тармакка да бирәбез. Масштабсыз softmax(0,0,6) 0.995 бирә — диярлек one-hot, ә туенган softmax та градиент юкка чыга, катлам өйрәнүдән туктый. √dₖ = 2 гә бүлгәч бәя 3 була, һәм softmax(0,0,3) йомшак 0.909 бирә. Бу турыпочмаксыз да схема ИСӘПЛИ. Ул бары тик беркайчан өйрәнмәячәк — нотация нәкъ шуның өчен кирәк: ватылу җитмәгән глиф булып күренә, серле хәл булып түгел."},"sumKeys":{"en":"Σ keys","ru":"Σ ключи","tt":"Σ ачкыч"},"lblOneHead":{"en":"one head","ru":"одна голова","tt":"бер баш"},"workHead":{"en":"inside the triangle:","ru":"внутри треугольника:","tt":"өчпочмак эчендә:"},"workDiv":{"en":"each ÷ Σ → the weights above","ru":"каждое ÷ Σ → веса выше","tt":"һәрберсе ÷ Σ → өстәге авырлыклар"}},"title":{"en":"Attention as a neural circuit diagram: the axis that costs 25.8 GB","ru":"Внимание как neural circuit diagram: ось, которая стоит 25,8 ГБ","tt":"Игътибар neural circuit diagram буларак: 25.8 ГБ торган күчәр"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
