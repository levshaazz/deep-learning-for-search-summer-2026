f":0.0683,"absDiff":0.0683,"rank":9,"sign":"+"},{"diff":0.0742,"absDiff":0.0742,"rank":10,"sign":"+"},{"diff":0.0743,"absDiff":0.0743,"rank":11,"sign":"+"},{"diff":0.0798,"absDiff":0.0798,"rank":12,"sign":"+"},{"diff":0.1095,"absDiff":0.1095,"rank":13,"sign":"+"},{"diff":0.1248,"absDiff":0.1248,"rank":14,"sign":"+"},{"diff":0.1647,"absDiff":0.1647,"rank":15,"sign":"+"}],"Wplus":95,"Wminus":25,"W":25,"expr":"W+ = 95, W- = 25 → W = min(W+,W-) = 25"},"ciHalfWidth":{"_doc":"95% CI half-width = t_crit · SE, SE = sd/√n. t_crit is a t-table lookup (df=14).","tCrit":2.145,"tCritSource":"t_{0.975, df=14} table lookup","sd":0.0676,"n":15,"sqrtN":3.873,"se":0.01747,"seExpr":"0.0676/√15 = 0.0676/3.8730 = 0.01747","halfWidth":0.0375,"halfWidthExpr":"2.145·0.01747 = 0.0375","meanDiff":0.0397,"interval":[0.0023,0.0772],"intervalExpr":"0.0397 ± 0.0375 = [0.0023, 0.0772]"}}},"i18n":{"_doc":"Step captions for significance-test (L4 'Is the difference real?'). EN canonical + RU; TT falls back. Every number in the FIGURE comes from data/l4-systems.json (15 per-query nDCG diffs; meanDiff 0.0397, sdDiff 0.0676, n=15; paired t=2.2753, p=0.03914; Wilcoxon W=25, p=0.04791; permutation p=0.03979/32768; 95% CI [0.0023,0.0772]) — the SAME source the deck + facts-gate use, so the displayed numbers can't drift.","alt":{"en":"Fifteen per-query nDCG differences (B minus A) as a strip — eleven positive, four negative, mean +0.0397 — resolved by a permutation test, a paired t-test (t=2.275, p=0.039) and Wilcoxon (p=0.048) into a verdict: all p < 0.05 and the 95% CI [0.0023, 0.0772] excludes zero, so the win is real.","ru":"Пятнадцать разностей nDCG по запросам (B минус A): одиннадцать положительных, четыре отрицательных, среднее +0,0397. Перестановочный тест, парный t-тест (t=2,275, p=0,039) и тест Уилкоксона (p=0,048) дают p < 0,05; 95% ДИ [0,0023, 0,0772] не включает ноль. Это статистически значимый результат при допущениях тестов, а не гарантия воспроизведения.","tt":"Унбиш сорау буенча nDCG аермасы (B минус A) полоса итеп — унбере уңай, дүрте тискәре, урташа +0,0397 — пермутация тесты, парлы t-тест (t=2,275, p=0,039) һәм Уилкоксон (p=0,048) белән хөкемгә җиткерелгән: барлык p < 0,05, ә 95% ИИ [0,0023, 0,0772] нульне үз эченә алмый, шуңа күрә җиңү чын."},"title":{"en":"B − A, per query","ru":"B − A, по запросу","tt":"B − A, сорау буенча"},"axisMean":{"en":"mean","ru":"среднее","tt":"урташа"},"axisZero":{"en":"0 (tie)","ru":"0 (ничья)","tt":"0 (тигезлек)"},"winB":{"en":"B wins","ru":"B выигрывает","tt":"B җиңә"},"winA":{"en":"A wins","ru":"A выигрывает","tt":"A җиңә"},"permLabel":{"en":"flip every sign — 2^15 ways","ru":"переверни все знаки — 2^15 способов","tt":"барлык билгеләрне әйләндер — 2^15 ысул"},"verdictReal":{"en":"⇒ the win is real, not noise.","ru":"⇒ статистически значимо при допущениях теста.","tt":"⇒ җиңү чын, шау-шу түгел."},"verdictNoise":{"en":"⇒ could be luck — hold.","ru":"⇒ данных недостаточно для уверенного вывода.","tt":"⇒ бәхет булуы мөмкин — тукта."},"s0":{"en":"Two rankers, 15 queries each. Subtract per query: B − A. Eleven bars point up (B wins), four point down (A wins). The average gap is +0.0397 nDCG — small, and four queries actively disagree. Real, or the luck of which 15 queries you drew?","ru":"Два ранкера, по 15 запросов. Вычти по запросу: B − A. Одиннадцать столбиков вверх (B выигрывает), четыре вниз (A выигрывает). Средний разрыв +0,0397 nDCG — маленький, и четыре запроса прямо против. Настоящий или удача в том, какие 15 запросов выпали?","tt":"Ике ранжлаучы, һәрберсе 15 сорау. Сорау буенча алып ташла: B − A. Унбер багана өскә (B җиңә), дүрте аска (A җиңә). Уртача аерма +0,0397 nDCG — кечкенә, һәм дүрт сорау ачыктан-ачык каршы. Чынмы, әллә нинди 15 сорау чыгуыңдагы бәхетме?"},"s1":{"en":"Make the null concrete: if B ≈ A, the sign on each query's difference is a coin flip. So flip every sign every possible way — all 2^15 = 32768 arrangements — recompute the mean each time, and count how often pure luck fakes a gap ≥ 0.0397. It happens 0.03979 of the time: p ≈ 0.040. No formula, just counting.","ru":"Зададим нулевую гипотезу: при ней метки A и B внутри каждой независимой пары обменяемы. Перебери все 2^15 = 32768 комбинаций знаков, каждый раз пересчитай среднее и посчитай долю случаев, где модуль среднего ≥ 0,0397. Эта доля равна 0,03979: двустороннее p ≈ 0,040. Это вероятность не менее экстремального результата при нулевой гипотезе и допущениях теста.","tt":"Нульне конкретлаштырыйк: әгәр B ≈ A булса, һәр сорау аермасының билгесе — тәңкә ыргыту. Шулай итеп барлык билгеләрне бар мөмкин ысул белән әйләндер — барлык 2^15 = 32768 урнаштыру — һәр тапкыр урташаны яңадан исәплә һәм саф бәхет ≥ 0,0397 аерманы ничек еш ясаганын сана. Бу очракларның 0,03979'ында була: p ≈ 0,040. Формуласыз, бары санау."},"s2":{"en":"The paired t-test is the fast approximation: divide the mean gap by its standard error. t = 0.0397 / (0.0676 / √15) = 2.275 on df = 14, which the t-table turns into p ≈ 0.039. Wilcoxon, which uses only the ranks of the differences, lands at p ≈ 0.048 — just under the line.","ru":"Парный t-тест — быстрое приближение: подели средний разрыв на его стандартную ошибку. t = 0,0397 / (0,0676 / √15) = 2,275 при df = 14, что по t-таблице даёт p ≈ 0,039. Уилкоксон, использующий лишь ранги разностей, выходит на p ≈ 0,048 — впритык под чертой.","tt":"Парлы t-тест — тиз якынайту: уртача аерманы аның стандарт хатасына бүл. t = 0,0397 / (0,0676 / √15) = 2,275, df = 14, бу t-таблица буенча p ≈ 0,039 бирә. Уилкоксон, бары тик аермаларның рангларын кулланган, p ≈ 0,048'кә чыга — нәкъ сызык астында."},"s3":{"en":"Three roads, one destination: permutation p ≈ 0.040, t-test p ≈ 0.039, Wilcoxon p ≈ 0.048 — all below 0.05. The 95% CI for the true gain is [0.0023, 0.0772]: it excludes zero, so the win is real. But it grazes zero — the effect is small and fragile. The honest fix is more queries.","ru":"Три дороги, один пункт: перестановочный p ≈ 0,040, t-тест p ≈ 0,039, Уилкоксон p ≈ 0,048 — все ниже 0,05. 95% ДИ для истинного прироста — [0,0023, 0,0772]: он не включает ноль, что согласуется со статистической значимостью. Но его нижняя граница близка к нулю — величина эффекта оценена неточно. Честное лекарство — больше запросов.","tt":"Өч юл, бер пункт: пермутация p ≈ 0,040, t-тест p ≈ 0,039, Уилкоксон p ≈ 0,048 — барысы 0,05'тән түбән. Чын өстәмә өчен 95% ИИ — [0,0023, 0,0772]: ул нульне үз эченә алмый, шуңа күрә җиңү чын. Әмма ул нульгә тидереп үтә — эффект кечкенә һәм нечкә. Намуслы чара — күбрәк сорау."}},"title":{"en":"Is the metric gap real, or luck?","ru":"Разрыв метрики настоящий или удача?","tt":"Метрика аермасы чынмы, әллә бәхетме?"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
