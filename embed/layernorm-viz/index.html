 mean≈0, var≈1."},"dataSets":{"l6-layernorm":{"method":"LayerNorm over the real 4-d cat attention-output vector (population var, ε=1e-5, learned γ,β toy)","dim":4,"eps":0.00001,"x":[0.579,1.996,0.91,0.425],"mean":0.9775,"var":0.3765,"std":0.6136,"centred":[-0.399,1.018,-0.068,-0.552],"normed":[-0.6495,1.6599,-0.11,-0.9004],"normedMean":0,"normedVar":1,"gamma":[1.2,0.9,1.1,1],"beta":[0.1,-0.1,0,0.2],"out":[-0.6793,1.3939,-0.121,-0.7004],"note":"the real cat attention-output row; subtract mean, divide by std → centred unit-scale vector (on a sphere, ‖normed‖=√d=2); then γ scales and β shifts. Pre-affine vector has mean≈0, var≈1."}},"i18n":{"_doc":"Step captions + small in-SVG labels for layernorm-viz. EN canonical + RU + TT (all written). The figure normalises the REAL 4-d cat attention-output vector x=[0.579,1.996,0.91,0.425] (μ=0.98, σ²=0.38, σ=0.61) — the SAME vector the L6 deck s38 twin uses. Every NUMBER shown (x, mean, var, std, the centred/normed/out bars, normedMean≈0, normedVar≈1, γ, β) comes from data/l6-layernorm.json, never from these strings.","alt":{"en":"LayerNorm applied to the cat token's 4-dimensional attention-output vector: a bar view shows the raw off-centre vector recentred to mean 0 then rescaled to unit variance and finally scaled by gamma and shifted by beta; a unit-circle view shows the vector landing on the unit sphere after normalisation.","ru":"LayerNorm для 4-мерного вектора выхода внимания токена cat: на барах сырой смещённый вектор центрируется к среднему 0, затем масштабируется к единичной дисперсии и наконец масштабируется на gamma и сдвигается на beta; на единичной окружности показано, как вектор оказывается на единичной сфере после нормализации.","tt":"cat токенының 4 үлчәмле игътибар чыгышы векторына кулланылган LayerNorm: баганаларда чи, үзәктән читкә киткән вектор уртача 0 гә үзәкләшә, аннары берәмлек дисперсиягә масштаблана һәм ниһаять gamma га масштаблана һәм beta га күчә; берәмлек әйләнәсе векторның нормализациядән соң берәмлек сферага килеп төшүен күрсәтә."},"rawHead":{"en":"x = attn-out(“cat”), d = 4","ru":"x = выход внимания (“cat”)","tt":"x = игътибар чыгышы (“cat”)"},"barsHead":{"en":"per-dimension value","ru":"значение по измерению","tt":"үлчәм буенча кыйммәт"},"meanLbl":{"en":"mean μ","ru":"среднее μ","tt":"уртача μ"},"varLbl":{"en":"var σ²","ru":"дисп. σ²","tt":"дисп. σ²"},"stdLbl":{"en":"std","ru":"std","tt":"std"},"sphereHead":{"en":"the vector on the unit circle","ru":"на единичной окружности","tt":"берәмлек әйләнәсендә"},"rawTag":{"en":"raw x","ru":"сырой x","tt":"чи x"},"normedTag":{"en":"normed","ru":"норм.","tt":"норм."},"affineNote":{"en":"σ² ≠ 1 after γ,β (rescaled)","ru":"σ² ≠ 1 после γ,β (масштабир.)","tt":"γ,β дан соң σ² ≠ 1 (масштаблн.)"},"stageRaw":{"en":"x","ru":"x","tt":"x"},"stageCentred":{"en":"x − μ","ru":"x − μ","tt":"x − μ"},"stageNormed":{"en":"(x − μ) / std","ru":"(x − μ) / std","tt":"(x − μ) / std"},"stageOut":{"en":"γ · normed + β","ru":"γ · normed + β","tt":"γ · normed + β"},"s0":{"en":"Here is the cat token's attention-output vector x — four numbers, [0.579, 1.996, 0.91, 0.425], the very vector we built with attention. They sit off-centre: their mean is 0.98 and their variance is 0.38. The dashed line marks the mean. A raw vector like this can drift in scale from layer to layer, which makes training unstable.","ru":"Вот вектор выхода внимания токена cat — четыре числа, [0,579, 1,996, 0,91, 0,425], тот самый вектор, что мы построили вниманием. Они смещены: их среднее 0,98, а дисперсия 0,38. Пунктир отмечает среднее. Такой сырой вектор может «уплывать» по масштабу от слоя к слою, что делает обучение нестабильным.","tt":"Менә cat токенының игътибар чыгышы векторы x — дүрт сан, [0.579, 1.996, 0.91, 0.425], нәкъ без игътибар белән төзегән вектор. Алар үзәктән читтә: уртачасы 0.98, дисперсиясе 0.38. Өзек сызык уртачаны билгели. Мондый чи вектор катламнан катламга масштабы буенча «агып» китә ала, бу өйрәнүне тотрыксыз итә."},"s1":{"en":"First move: subtract the mean. Every bar drops by μ, so the vector now straddles zero — the dashed baseline slides from 0.98 down to 0. The shape is unchanged; we have only recentred it.","ru":"Первый шаг: вычитаем среднее. Каждый бар опускается на μ, и вектор теперь расположен вокруг нуля — пунктирная база съезжает с 0,98 к 0. Форма не меняется; мы лишь перецентрировали вектор.","tt":"Беренче адым: уртачаны алабыз. Һәр багана μ га төшә, һәм вектор хәзер нуль тирәсендә урнаша — өзек сызык 0.98 дан 0 гә шуа. Форма үзгәрми; без аны бары үзәкләштердек."},"s2":{"en":"Second move: divide by the standard deviation. The bars rescale to unit spread — now the mean is 0 and the variance is 1. Geometrically the vector has been pulled onto the unit circle (a unit sphere in higher dimensions): same direction, fixed length. That is what LayerNorm means by “normalise.”","ru":"Второй шаг: делим на стандартное отклонение. Бары масштабируются к единичному разбросу — теперь среднее 0, а дисперсия 1. Геометрически вектор притянут на единичную окружность (единичную сферу в больших размерностях): то же направление, фиксированная длина. Именно это LayerNorm и называет «нормализацией».","tt":"Икенче адым: стандарт тайпылышка бүләбез. Баганалар берәмлек таралышка масштаблана — хәзер уртача 0, дисперсия 1. Геометрик яктан вектор берәмлек әйләнәсенә (зуррак үлчәмнәрдә берәмлек сферага) тартыла: шул ук юнәлеш, теркәлгән озынлык. LayerNorm «нормализация» дип нәкъ шуны атый."},"s3":{"en":"Last move: the learned scale γ and shift β. Each dimension is multiplied by its own γ and offset by its own β, bending the bars back into a useful shape. Normalisation fixed the scale; γ and β give the model the freedom to undo or reshape it where that helps.","ru":"Последний шаг: обучаемые масштаб γ и сдвиг β. Каждое измерение умножается на свой γ и сдвигается на свой β, изгибая бары в полезную форму. Нормализация зафиксировала масштаб; γ и β дают модели свободу отменить или переформировать его там, где это полезно.","tt":"Соңгы адым: өйрәнелгән масштаб γ һәм күчереш β. Һәр үлчәм үз γ сына тапкырлана һәм үз β сына күчә, баганаларны файдалы формага бөгә. Нормализация масштабны теркәде; γ һәм β моделгә аны кирәк урында кире кайтару яки үзгәртү иреген бирә."}},"title":{"en":"LayerNorm, geometrically: subtract mean → divide by std → scale + shift","ru":"LayerNorm геометрически: вычесть среднее → разделить на std → масштаб + сдвиг","tt":"LayerNorm геометрик: уртачаны алу → std га бүлү → масштаб + күчереш"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
