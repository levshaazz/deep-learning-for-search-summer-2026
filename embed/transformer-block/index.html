</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>The Transformer encoder block, assembled</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="5" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>5</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"transformer-block","mountName":"mountTransformerBlock","maxStep":5,"data":{},"dataSets":{},"i18n":{"_doc":"Step captions + box labels for transformer-block. EN canonical + RU + TT (all written). Pure structural diagram — no numeric data; all text lives here.","alt":{"en":"A Transformer encoder block drawn bottom to top: input embeddings plus positional encoding, Multi-Head Attention, Add and Norm with a residual skip, position-wise Feed-Forward, a second Add and Norm with a residual skip, repeated N times.","ru":"Блок энкодера Трансформера снизу вверх: входные эмбеддинги плюс позиционное кодирование, Multi-Head Attention, Add and Norm с остаточной связью, позиционный Feed-Forward, второй Add and Norm с остаточной связью, повторённые N раз.","tt":"Трансформер энкодер блогы астан өскә: керү эмбеддинглары һәм позиция кодлау, Multi-Head Attention, калдыклы сикерү белән Add and Norm, позицияле Feed-Forward, икенче Add and Norm калдыклы сикерү белән, N тапкыр кабатланган."},"inputLbl":{"en":"input embeddings","ru":"входные эмбеддинги","tt":"керү эмбеддинглары"},"inputSub":{"en":"+ positional encoding","ru":"+ позиционное кодирование","tt":"+ позиция кодлау"},"mhaLbl":{"en":"Multi-Head Attention","ru":"Multi-Head Attention","tt":"Multi-Head Attention"},"mhaSub":{"en":"h heads · softmax(QKᵀ/√d_k)V","ru":"h голов · softmax(QKᵀ/√d_k)V","tt":"h баш · softmax(QKᵀ/√d_k)V"},"addNormLbl":{"en":"Add & Norm","ru":"Add & Norm","tt":"Add & Norm"},"addNormSub":{"en":"LayerNorm(x + sublayer(x))","ru":"LayerNorm(x + подслой(x))","tt":"LayerNorm(x + асткатлам(x))"},"ffnLbl":{"en":"Feed-Forward (FFN)","ru":"Feed-Forward (FFN)","tt":"Feed-Forward (FFN)"},"ffnSub":{"en":"two linears + ReLU, per position","ru":"два линейных + ReLU, поэлементно","tt":"ике сызыклы + ReLU, һәр позициягә"},"residual":{"en":"skip","ru":"skip","tt":"skip"},"stackLbl":{"en":"repeat this block ×N (e.g. N = 6, 12, 24)","ru":"повторить блок ×N (напр. N = 6, 12, 24)","tt":"блокны ×N кабатла (мәс. N = 6, 12, 24)"},"s0":{"en":"Start at the bottom: each token’s embedding, with its positional encoding added in, enters the block. Data flows upward through the stack.","ru":"Начнём снизу: эмбеддинг каждого токена, с добавленным позиционным кодированием, входит в блок. Данные текут вверх по стеку.","tt":"Астан башлыйбыз: һәр токенның эмбеддинги, позиция кодлавы өстәлгән, блокка керә. Мәгълүмат стек буйлап өскә ага."},"s1":{"en":"First sublayer: Multi-Head Attention. Every token attends to every other (and itself) across h parallel heads — the Council deciding who to heed.","ru":"Первый подслой: Multi-Head Attention. Каждый токен внимателен к каждому другому (и к себе) в h параллельных головах — Совет решает, кого слушать.","tt":"Беренче асткатлам: Multi-Head Attention. Һәр токен һәр башкасына (һәм үзенә) h параллель башта игътибар итә — Шура кемгә колак салырга карар итә."},"s2":{"en":"Then Add & Norm. A residual skip carries the input straight past attention and adds it back — so gradients flow and nothing is lost — and LayerNorm rescales the sum to keep it stable.","ru":"Затем Add & Norm. Остаточная связь проводит вход мимо внимания и прибавляет его обратно — градиенты текут, ничего не теряется — а LayerNorm пере-масштабирует сумму, удерживая её устойчивой.","tt":"Аннары Add & Norm. Калдыклы сикерү керүне игътибар яныннан үткәреп кире өсти — градиентлар ага, бернәрсә югалмый — ә LayerNorm сумманы тотрыклы тоту өчен яңадан масштаблый."},"s3":{"en":"Second sublayer: a position-wise Feed-Forward network — two linear layers with a ReLU between them — applied to each token independently. This is where most of the parameters live.","ru":"Второй подслой: позиционная Feed-Forward сеть — два линейных слоя с ReLU между ними — применяемая к каждому токену независимо. Здесь живёт большинство параметров.","tt":"Икенче асткатлам: позицияле Feed-Forward челтәр — арасында ReLU булган ике сызыклы катлам — һәр токенга бәйсез кулланыла. Параметрларның күбесе шунда яши."},"s4":{"en":"Another Add & Norm wraps the FFN: residual skip plus LayerNorm again. Every sublayer in the block follows the same x → sublayer(x) → add → norm recipe.","ru":"Ещё один Add & Norm оборачивает FFN: снова остаточная связь плюс LayerNorm. Каждый подслой блока следует одному рецепту x → подслой(x) → сложить → нормировать.","tt":"Тагын бер Add & Norm FFN'ны урый: янә калдыклы сикерү һәм LayerNorm. Блоктагы һәр асткатлам шул ук x → асткатлам(x) → кушу → нормалаштыру рецептын кабатлый."},"s5":{"en":"That is one encoder layer. Stack it ×N — 6 in the original Transformer, 12 or 24 in BERT — and depth lets the model build ever richer contextual representations. The output is a context-aware vector per token.","ru":"Это один слой энкодера. Сложи его ×N — 6 в оригинальном Трансформере, 12 или 24 в BERT — и глубина даёт модели строить всё более богатые контекстные представления. На выходе — вектор с учётом контекста на каждый токен.","tt":"Бу — бер энкодер катламы. Аны ×N өеп куй — оригиналь Трансформерда 6, BERT'та 12 яки 24 — һәм тирәнлек модельгә һаман да байрак контекст тәкъдимнәре төзергә мөмкинлек бирә. Чыгышта — һәр токенга контекстны исәпкә алган вектор."}},"title":{"en":"The Transformer encoder block, assembled","ru":"Блок энкодера Трансформера, собранный по частям","tt":"Трансформер энкодер блогы, өлешләп җыелган"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"},{"step":5,"labelKey":"s5"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
