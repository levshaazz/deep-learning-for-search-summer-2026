/d}); PE(pos,2i+1)=cos(pos/10000^{2i/d})","d":8,"nPos":8,"grid":[[0,1,0,1,0,1,0,1],[0.841,0.54,0.1,0.995,0.01,1,0.001,1],[0.909,-0.416,0.199,0.98,0.02,1,0.002,1],[0.141,-0.99,0.296,0.955,0.03,1,0.003,1],[-0.757,-0.654,0.389,0.921,0.04,0.999,0.004,1],[-0.959,0.284,0.479,0.878,0.05,0.999,0.005,1],[-0.279,0.96,0.565,0.825,0.06,0.998,0.006,1],[0.657,0.754,0.644,0.765,0.07,0.998,0.007,1]],"note":"low dims = fast sinusoids (local), high dims = slow (global); fixed, not learned"}},"i18n":{"_doc":"Step captions + small labels for positional-enc. EN canonical + RU + TT (all written). Every cell value comes from data/l6-positional.json (the 8×8 grid); these strings carry no numbers that the data owns.","alt":{"en":"An 8 by 8 sinusoidal positional-encoding heatmap: rows are positions 0 to 7, columns are embedding dimensions 0 to 7, even columns sine and odd columns cosine, low dimensions fast and high dimensions slow.","ru":"Тепловая карта синусоидального позиционного кодирования 8 на 8: строки — позиции 0–7, столбцы — измерения 0–7, чётные столбцы синус, нечётные косинус, низкие измерения быстрые, высокие медленные.","tt":"8гә 8 синусоидаль позиция кодлау җылылык картасы: юллар — позицияләр 0–7, баганалар — үлчәмнәр 0–7, парлы баганалар синус, тагы баганалар косинус, түбән үлчәмнәр тиз, югары үлчәмнәр әкрен."},"formulaLabel":{"en":"PE(pos,2i)=sin(pos/10000^{2i/d})  ·  PE(pos,2i+1)=cos(…)","ru":"PE(pos,2i)=sin(pos/10000^{2i/d})  ·  PE(pos,2i+1)=cos(…)","tt":"PE(pos,2i)=sin(pos/10000^{2i/d})  ·  PE(pos,2i+1)=cos(…)"},"dimAxis":{"en":"dimension i  (even = sin · odd = cos) →","ru":"измерение i  (чётное = sin · нечётное = cos) →","tt":"үлчәм i  (парлы = sin · тагы = cos) →"},"posAxis":{"en":"pos ↓","ru":"pos ↓","tt":"pos ↓"},"takeaway":{"en":"low dims wiggle fast (local), high dims drift slow (global).","ru":"низкие измерения колеблются быстро (локально), высокие меняются медленно (глобально).","tt":"түбән үлчәмнәр тиз тирбәлә (локаль), югары үлчәмнәр әкрен үзгәрә (глобаль)."},"takeaway2":{"en":"fixed by formula — not learned. always in [−1, 1].","ru":"задано формулой — не обучается. всегда в [−1, 1].","tt":"формула белән билгеләнгән — өйрәнелми. һәрвакыт [−1, 1] эчендә."},"s0":{"en":"Attention is order-blind — “dog bites man” reads the same as “man bites dog.” So we add a fixed position signal to each token. Here is the grid: one row per position, one column per dimension, each cell a sine or cosine value.","ru":"Внимание слепо к порядку — «dog bites man» читается так же, как «man bites dog». Поэтому к каждому токену добавляем фиксированный сигнал позиции. Вот сетка: строка на позицию, столбец на измерение, в каждой ячейке значение синуса или косинуса.","tt":"Игътибар тәртипкә сукыр — «dog bites man» «man bites dog» кебек үк укыла. Шуңа һәр токенга билгеле позиция сигналы өстибез. Менә челтәр: һәр позициягә юл, һәр үлчәмгә багана, һәр күзәнәктә синус яки косинус кыйммәте."},"s1":{"en":"Read it position by position, top to bottom. Position 0 is the all-sin-0 / all-cos-1 baseline; each next row shifts the phase a little. No two rows are identical, so every position carries a unique fingerprint.","ru":"Читаем по позициям, сверху вниз. Позиция 0 — базовая строка (все sin = 0, все cos = 1); каждая следующая строка немного сдвигает фазу. Двух одинаковых строк нет, поэтому каждая позиция несёт уникальный отпечаток.","tt":"Позицияләп укыйбыз, өстән аска. Позиция 0 — базис юл (барлык sin = 0, барлык cos = 1); һәр киләсе юл фазаны бераз күчерә. Бертөрле ике юл юк, шуңа һәр позиция үзенчәлекле эз йөртә."},"s2":{"en":"Now read it dimension by dimension, left to right. The leftmost columns flip sign quickly down the grid — short wavelengths — while the rightmost columns barely change — long wavelengths. Low dims encode fine position, high dims encode coarse position.","ru":"Теперь читаем по измерениям, слева направо. Левые столбцы быстро меняют знак сверху вниз — короткие длины волн, — а правые почти не меняются — длинные длины волн. Низкие измерения кодируют тонкую позицию, высокие — грубую.","tt":"Хәзер үлчәмләп укыйбыз, сулдан уңга. Сул баганалар аска таба тиз тамга алмаштыра — кыска дулкын озынлыклары, — ә уң баганалар диярлек үзгәрми — озын дулкыннар. Түбән үлчәмнәр нечкә позицияне, югары үлчәмнәр эре позицияне кодлый."},"s3":{"en":"Every value stays in [−1, 1], and the whole grid is computed from a closed-form formula — fixed, not learned. The model gets order for free, and the same pattern extends to positions it never saw in training.","ru":"Каждое значение остаётся в [−1, 1], и вся сетка вычисляется по замкнутой формуле — задана, не обучается. Модель получает порядок бесплатно, и тот же узор продолжается на позиции, которых не было в обучении.","tt":"Һәр кыйммәт [−1, 1] эчендә кала, һәм бөтен челтәр ябык формуладан исәпләнә — билгеләнгән, өйрәнелми. Модель тәртипне бушлай ала, һәм шул ук үрнәк ул өйрәнүдә күрмәгән позицияләргә дә сузыла."}},"title":{"en":"Sinusoidal positional encoding: sin/cos(pos/10000^{2i/d})","ru":"Синусоидальное позиционное кодирование: sin/cos(pos/10000^{2i/d})","tt":"Синусоидаль позиция кодлау: sin/cos(pos/10000^{2i/d})"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
