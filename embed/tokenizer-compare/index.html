,"continuation":true,"bare":"app"},{"piece":"##iness","continuation":true,"bare":"iness"}]},{"word":"of","pieces":[{"piece":"of","continuation":false,"bare":"of"}]},{"word":"replaying","pieces":[{"piece":"replay","continuation":false,"bare":"replay"},{"piece":"##ing","continuation":true,"bare":"ing"}]},{"word":"games","pieces":[{"piece":"games","continuation":false,"bare":"games"}]}],"rank":2},{"name":"Unigram","family":"prune (likelihood loss)","mechanism":"fit a unigram LM, Viterbi-decode the best segmentation","marker":"none","tokens":["the","un","happi","ne","s","s","o","f","replay","in","g","game","s"],"count":13,"vocabSize":80,"perWord":[{"word":"the","tokens":["the"]},{"word":"unhappiness","tokens":["un","happi","ne","s","s"]},{"word":"of","tokens":["o","f"]},{"word":"replaying","tokens":["replay","in","g"]},{"word":"games","tokens":["game","s"]}],"rank":3},{"name":"Byte-level BPE","family":"merge (frequency, on bytes)","mechanism":"256-byte alphabet + BPE; `Ġ` marks a leading space","marker":"Ġ","tokens":["Ġ","t","h","e","Ġ","u","n","h","a","p","p","i","n","e","s","s","Ġ","o","f","Ġ","r","e","p","l","a","y","i","n","g","Ġ","g","a","m","e","s"],"count":35,"vocabSize":256,"perWord":[{"word":"the","tokens":["Ġ","t","h","e"]},{"word":"unhappiness","tokens":["Ġ","u","n","h","a","p","p","i","n","e","s","s"]},{"word":"of","tokens":["Ġ","o","f"]},{"word":"replaying","tokens":["Ġ","r","e","p","l","a","y","i","n","g"]},{"word":"games","tokens":["Ġ","g","a","m","e","s"]}],"rank":4}],"ranking":[{"rank":1,"name":"BPE","count":7},{"rank":2,"name":"WordPiece","count":9},{"rank":3,"name":"Unigram","count":13},{"rank":4,"name":"Byte-level BPE","count":35}],"counts":{"BPE":7,"WordPiece":9,"Unigram":13,"Byte-level BPE":35},"spread":{"min":7,"max":35},"note":"Same word, same vocab budget, four cutters → four different segmentations and four different token counts. Fewer tokens = more efficient (less compute, cheaper API, longer effective context). The byte-level cutter spends most of a small vocab on its 256-byte alphabet, so it can merge little and stays near character-level — most tokens."}},"i18n":{"alt":{"en":"Several tokenizers split the same text differently, shown side by side with their token counts.","ru":"Несколько токенизаторов по-разному разбивают один и тот же текст — показаны рядом с числом токенов.","tt":"Берничә токенизатор бер үк текстны төрлечә бүлә — токен саны белән янәшә күрсәтелгән."},"_doc":"Step captions + small labels for tokenizer-compare (four cutters on one input, ranked by token count). EN canonical + RU + TT, all 100%. The sample input, the four token lists, the counts and the ranking all live in data/l2-tokenizers.json (generated by _research/gen_l2_tokenizers.py with HuggingFace tokenizers). All four train on the SAME tiny 13-line corpus toward the SAME small target vocab (150), but on a corpus that small each lands at its own REAL vocabSize — Unigram prunes below the target (~80), byte-level floors at its 256-byte alphabet — so the captions speak of the shared CORPUS, never a uniform vocab size. s0 shows the raw input; s1..s4 reveal each cutter in count-rank order (BPE 7 → WordPiece 9 → Unigram 13 → Byte-level BPE 35); s5 locks the ranked verdict. Small labels name the regions and the markers (## continuation, ␣ leading space).","inputHead":{"en":"The same input, four cutters, one tiny corpus","ru":"Один вход, четыре резака, один крошечный корпус","tt":"Бер керем, дүрт кискеч, бер кечкенә корпус"},"tokensLab":{"en":"tokens","ru":"токенов","tt":"токен"},"moreChip":{"en":"… +{n} more","ru":"… ещё +{n}","tt":"… тагын +{n}"},"markerHash":{"en":"## marks a word-internal piece (a continuation)","ru":"## помечает внутрисловный кусок (продолжение)","tt":"## сүз эчендәге кисәкне билгели (дәвам)"},"markerSpace":{"en":"␣ marks a leading space folded into the byte stream","ru":"␣ помечает ведущий пробел, вшитый в байтовый поток","tt":"␣ байт агымына теккән алдагы бушлыкны билгели"},"verdict":{"en":"Fewer tokens = more efficient: less compute, cheaper API, longer effective context.","ru":"Меньше токенов = эффективнее: меньше вычислений, дешевле API, длиннее эффективный контекст.","tt":"Азрак токен = нәтиҗәлерәк: азрак исәпләү, арзанрак API, озынрак эффектив контекст."},"s0":{"en":"One input to cut: «the unhappiness of replaying games». We trained four tokenizers on the SAME tiny corpus toward the SAME small target vocabulary, so the only thing that differs is HOW each one chooses to split. (The corpus is so small that each algorithm lands at its own real size — the byte-level cutter floors at its 256-byte alphabet, the others end up smaller.) Watch the same five words become wildly different token streams.","ru":"Один вход для разреза: «the unhappiness of replaying games». Мы обучили четыре токенизатора на ОДНОМ крошечном корпусе с ОДНИМ маленьким целевым словарём, так что различается только то, КАК каждый решает резать. (Корпус настолько мал, что каждый алгоритм приходит к своему реальному размеру — байтовый резак упирается в свой алфавит из 256 байт, остальные оказываются меньше.) Смотри, как одни и те же пять слов превращаются в совершенно разные потоки токенов.","tt":"Кисәр өчен бер керем: «the unhappiness of replaying games». Без дүрт токенлаштыргычны БЕР кечкенә корпуста БЕР кечкенә максат сүзлегенә таба өйрәттек, шуңа күрә бары тик һәркайсы НИЧЕК кисәргә сайлавы гына аерыла. (Корпус шул кадәр кечкенә ки, һәр алгоритм үз чын зурлыгына килә — байт кискече үзенең 256 байт алфавитына төртелә, калганнары кечерәк була.) Шул ук биш сүзнең бөтенләй төрле токен агымнарына әйләнгәнен күзәт."},"s1":{"en":"BPE goes first — it merges the most FREQUENT adjacent pair, over and over. On this small vocabulary it has learned `unhappiness`, `playing` and `games` as whole pieces, so the input costs just 7 tokens: [the · un · happiness · of · re · playing · games]. The fewest — the most efficient cutter here.","ru":"BPE первым — он сливает самую ЧАСТУЮ соседнюю пару, снова и снова. На этом маленьком словаре он выучил `unhappiness`, `playing` и `games` как целые куски, так что вход стоит всего 7 токенов: [the · un · happiness · of · re · playing · games]. Меньше всех — самый эффективный резак здесь.","tt":"Беренче — BPE: ул иң ЕШ очраган күрше парны кабат-кабат куша. Бу кечкенә сүзлектә ул `unhappiness`, `playing` һәм `games`-ны бөтен кисәк итеп өйрәнгән, шуңа күрә керем небары 7 токен тора: [the · un · happiness · of · re · playing · games]. Иң азы — биредә иң нәтиҗәле кискеч."},"s2":{"en":"WordPiece (BERT's cutter) merges by likelihood GAIN, not raw frequency, and it MARKS every word-internal piece with `##`. The bare piece starts a word; each `##` glues onto the one before. Here `unhappiness` becomes `un ##h ##app ##iness` — 9 tokens, two more than BPE, but the word boundaries stay legible.","ru":"WordPiece (резак BERT) сливает по ПРИРОСТУ правдоподобия, а не по сырой частоте, и ПОМЕЧАЕТ каждый внутрисловный кусок префиксом `##`. Голый кусок начинает слово; каждый `##` приклеивается к предыдущему. Здесь `unhappiness` становится `un ##h ##app ##iness` — 9 токенов, на два больше, чем у BPE, но границы слов остаются читаемыми.","tt":"WordPiece (BERT кискече) чи ешлык буенча түгел, ихтималлык ҮСЕШЕ буенча куша, һәм һәр сүз эчендәге кисәкне `##` белән БИЛГЕЛИ. Ялангач кисәк сүзне башлый; һәр `##` алдагысына ябыша. Биредә `unhappiness` `un ##h ##app ##iness` була — 9 токен, BPE-дан икегә күбрәк, ләкин сүз чикләре укылырлык кала."},"s3":{"en":"Unigram (the cutter behind SentencePiece, T5, LLaMA) runs the loop BACKWARDS: it fits a probabilistic language model over a big seed vocabulary and then keeps the segmentation the model finds most LIKELY. Its likelihood decode splits `unhappiness` as `un happi ne s s` — 13 tokens, finer than the merge-based two.","ru":"Unigram (один из алгоритмов SentencePiece, используемый в T5) гоняет цикл ЗАДОМ НАПЕРЁД: он подгоняет вероятностную языковую модель над большим затравочным словарём и оставляет сегментацию, которую модель считает самой ВЕРОЯТНОЙ. Его правдоподобный разбор режет `unhappiness` на `un happi ne s s` — 13 токенов, мельче, чем у двух на слияниях.","tt":"Unigram (SentencePiece, T5, LLaMA артындагы кискеч) циклны АРТКАРАК гонит: ул зур орлык сүзлеге өстендә ихтималлык тел моделен туры китерә һәм модель иң ИХТИМАЛ дип санаган сегментлауны калдыра. Аның ихтималлык чишелеше `unhappiness`-ны `un happi ne s s` итеп кисә — 13 токен, кушуга нигезләнгән икесеннән дә ваграк."},"s4":{"en":"Byte-level BPE (GPT-2/4's cutter) works on raw BYTES — its alphabet is all 256 of them, and `␣` is a leading space folded into the stream. That guarantees zero `[UNK]`, but on this tiny corpus its vocabulary floors at that 256-byte alphabet with almost nothing left to merge, so it stays near character-level: 35 tokens — by far the most here.","ru":"Байтовый BPE (резак GPT-2/4) работает с сырыми БАЙТАМИ — его алфавит — это все 256, а `␣` — это ведущий пробел, вшитый в поток. Это гарантирует ноль `[UNK]`, но на этом крошечном корпусе его словарь упирается в тот самый алфавит из 256 байт, и сливать почти нечего, так что он остаётся около уровня символов: 35 токенов — намного больше всех здесь.","tt":"Байт BPE (GPT-2/4 кискече) чи БАЙТЛАР белән эшли — аның алфавиты — барлык 256-сы, ә `␣` — агымга теккән алдагы бушлык. Бу нуль `[UNK]` гарантияли, ләкин бу кечкенә корпуста аның сүзлеге шул 256 байт алфавитына төртелә, кушарга диярлек бернәрсә калмый, шуңа күрә ул символ дәрәҗәсенә якын кала: 35 токен — биредә күпкә күбрәк."},"s5":{"en":"Side by side, the verdict is plain: 7 vs 9 vs 13 vs 35 tokens for the very same sentence and the very same training corpus. Ranked fewest (green) to most (amber), the efficiency bars say it at a glance. Fewer tokens means less compute (attention is O(n²)), a cheaper API bill, and a longer effective context window — which is exactly why the choice of tokenizer is never neutral.","ru":"При сравнении рядом разница очевидна: 7 против 9 против 13 против 35 токенов для одного и того же предложения и одного и того же обучающего корпуса. Ранжированные от меньшего (зелёный) к большему (янтарный), полосы позволяют увидеть разницу с одного взгляда. Меньше токенов — меньше вычислений (внимание это O(n²)), дешевле счёт за API и длиннее эффективное окно контекста — именно поэтому выбор токенизатора никогда не нейтрален.","tt":"Янәшә куйганда хөкем ачык: бер үк җөмлә һәм бер үк өйрәтү корпусы өчен 7-гә каршы 9-га каршы 13-кә каршы 35 токен. Аздан (яшел) күпкә (гәрәбә) таба тезелгән нәтиҗәлелек сызыклары моны бер карашта әйтә. Азрак токен — азрак исәпләү (игътибар O(n²)), арзанрак API счёты һәм озынрак эффектив контекст тәрәзәсе — нәкъ шуңа күрә токенлаштыргыч сайлау беркайчан да нейтраль түгел."}},"title":{"en":"Tokenizer compare — four cutters, one input","ru":"Сравнение токенизаторов — четыре резака, один вход","tt":"Токенлаштыргычларны чагыштыру — дүрт кискеч, бер керем"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"},{"step":5,"labelKey":"s5"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
