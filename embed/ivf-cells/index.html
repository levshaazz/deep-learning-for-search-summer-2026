]==c1) — else nprobe=2 would not reach the 3rd NN and recall would not climb 0.6667→1.0. Real = frozen FAISS IVF-PQ recall vs nprobe (gen_l9_real.py).","_source":"_research/gen_l9.py (toy, stdlib) + gen_l9_real.py (FAISS IVF-PQ, /usr/bin/python3)","toy":{"points":[[2.5,2.2],[3,2.8],[4,2],[1.5,1.5],[1,3],[6,1],[5.5,3],[2,6],[3,6.5]],"assign":[0,0,1,0,0,1,1,2,2],"centroids":[[2,2],[5,2],[2,6]],"query":[3,2],"queryCell":0,"nlist":3,"k":3,"trueNN":[0,1,2],"cellRankByDist":[0,1,2],"probe":{"1":{"cells":[0],"found":[0,1],"recall":0.6667},"2":{"cells":[0,1],"found":[0,1,2],"recall":1}}},"toy2":{"_doc":"nprobe sweep: 20 frozen points, nlist=5 committed centroids, k=5. The 5 true-NN are distributed across the first 3 cells-by-distance (3 in c0, 1 in c4, 1 in c1), so probing more cells climbs recall 0.6 -> 0.8 -> 1.0. cellRankByDist orders cells by centroid-to-q distance; nprobe takes the first n of them. Fractions are exact (found / 5).","points":[[5,4],[4,5],[6,6],[8,7],[9,4],[2,2],[12,4],[13,5],[11,3],[4,12],[5,13],[3,11],[12,12],[13,13],[11,11],[10,9],[11,10],[9,8],[1,9],[9,1]],"assign":[0,0,0,4,1,0,1,1,1,2,2,2,3,3,3,4,4,4,2,1],"centroids":[[4,4],[12,4],[4,12],[12,12],[10,9]],"query":[5,5],"queryCell":0,"nlist":5,"k":5,"trueNN":[0,1,2,3,4],"cellRankByDist":[0,4,1,2,3],"sweep":[{"nprobe":1,"cellsProbed":[0],"pointsScanned":4,"found":[0,1,2],"recall":0.6},{"nprobe":2,"cellsProbed":[0,4],"pointsScanned":8,"found":[0,1,2,3],"recall":0.8},{"nprobe":3,"cellsProbed":[0,4,1],"pointsScanned":13,"found":[0,1,2,3,4],"recall":1},{"nprobe":4,"cellsProbed":[0,4,1,2],"pointsScanned":17,"found":[0,1,2,3,4],"recall":1},{"nprobe":5,"cellsProbed":[0,4,1,2,3],"pointsScanned":20,"found":[0,1,2,3,4],"recall":1}]}}},"i18n":{"_doc":"Step captions + small labels for ivf-cells. EN canonical + RU + TT. Every NUMBER (recall@3 0.6667, 1.0; nprobe; found counts) comes from data/l9-ivf.json, never from these strings.","alt":{"en":"Nine points in three coloured cells with three centroids and a query; probing more cells (nprobe) raises recall@3 from 0.6667 to 1.0.","ru":"Девять точек в трёх цветных ячейках с тремя центроидами и запросом; пробуя больше ячеек (nprobe), recall@3 растёт с 0,6667 до 1,0.","tt":"Өч төсле күзәнәктә тугыз нокта, өч центроид һәм сорау; күбрәк күзәнәк тикшергәндә (nprobe) recall@3 0.6667 дән 1.0 гә күтәрелә."},"query":{"en":"query","ru":"запрос","tt":"сорау"},"probed":{"en":"probe cells","ru":"пробуем ячейки","tt":"күзәнәкләрне тикшерәбез"},"found":{"en":"found","ru":"найдено","tt":"табылды"},"qLands":{"en":"the query lands in its cell","ru":"запрос попадает в свою ячейку","tt":"сорау үз күзәнәгенә төшә"},"readPoints":{"en":"9 vectors, each assigned to the nearest of 3 centroids (cells)","ru":"9 векторов, каждый отнесён к ближайшему из 3 центроидов (ячеек)","tt":"9 вектор, һәрберсе 3 центроидның (күзәнәкнең) иң якынына билгеләнгән"},"s0":{"en":"An inverted file (IVF) first carves the space into nlist = 3 cells: every vector is assigned to its nearest centroid (◇). Search will no longer scan all 9 points — only the points in the cells we choose to probe.","ru":"Инвертированный файл (IVF) сначала разбивает пространство на nlist = 3 ячейки: каждый вектор относится к ближайшему центроиду (◇). Поиск больше не сканирует все 9 точек — только точки в ячейках, которые мы решаем пробовать.","tt":"Инвертлы файл (IVF) башта киңлекне nlist = 3 күзәнәккә бүлә: һәр вектор иң якын центроидка (◇) билгеләнә. Эзләү бүтән 9 нокталарны да сканламый — бары без тикшерергә сайлаган күзәнәкләрдәге нокталарны."},"s1":{"en":"The query (★) is matched to the nearest centroid: it lands in cell c0. Its three true nearest neighbours are ringed — two sit inside c0, but the third lies just across the border in c1.","ru":"Запрос (★) сопоставляется с ближайшим центроидом: он попадает в ячейку c0. Три его истинных ближайших соседа обведены — два внутри c0, но третий — сразу за границей, в c1.","tt":"Сорау (★) иң якын центроидка туры китерелә: ул c0 күзәнәгенә төшә. Аның өч чын иң якын күршесе боҗралы — икесе c0 эчендә, ә өченчесе нәкъ чик артында, c1 дә."},"s2":{"en":"nprobe = 1 probes only the query's own cell, c0. It finds the two true neighbours inside c0 but misses the third (stranded in c1): 2 of 3 → recall@3 = 0.6667. Probing one cell is fast but leaves a neighbour behind.","ru":"nprobe = 1 пробует только собственную ячейку запроса, c0. Она находит двух истинных соседей внутри c0, но пропускает третьего (застрявшего в c1): 2 из 3 → recall@3 = 0,6667. Пробовать одну ячейку быстро, но один сосед теряется.","tt":"nprobe = 1 бары сорауның үз күзәнәген, c0 ны тикшерә. Ул c0 эчендәге ике чын күршене таба, ләкин өченчесен (c1 дә калган) калдыра: 3 тән 2 → recall@3 = 0.6667. Бер күзәнәк тикшерү тиз, ләкин бер күрше югала."},"s3":{"en":"nprobe = 2 also probes the second-nearest cell, c1 — exactly where the stranded neighbour sits. Now all three true neighbours are found: 3 of 3 → recall@3 = 1.0. More probes buy recall at the cost of more work; nprobe is the dial.","ru":"nprobe = 2 пробует и вторую по близости ячейку, c1 — ровно там, где застрял сосед. Теперь найдены все три истинных соседа: 3 из 3 → recall@3 = 1,0. Больше проб даёт больше полноты ценой работы; nprobe — это регулятор.","tt":"nprobe = 2 икенче иң якын күзәнәкне, c1 не дә тикшерә — нәкъ калган күрше торган җирне. Хәзер өч чын күрше дә табылды: 3 тән 3 → recall@3 = 1.0. Күбрәк тикшерү күбрәк recall бирә, эш бәрабәренә; nprobe — бу көйләгеч."},"_doc_toy2":"nprobe sweep (toy2 variant): 20 points, 5 cells, k=5. Step captions t0..t6 + small read-out labels. Selected by labels.variant === 'toy2'. Every NUMBER (recall 0.6/0.8/1.0, pointsScanned, found counts) comes from data.toy2 in l9-ivf.json, never from these strings.","scanned":{"en":"points scanned","ru":"точек просканировано","tt":"нокта сканланды"},"trueNNlbl":{"en":"true nearest neighbours","ru":"истинные ближайшие соседи","tt":"чын иң якын күршеләр"},"ringed":{"en":"ringed","ru":"обведены","tt":"боҗралы"},"readPoints5":{"en":"20 vectors, each assigned to the nearest of 5 centroids (cells)","ru":"20 векторов, каждый отнесён к ближайшему из 5 центроидов (ячеек)","tt":"20 вектор, һәрберсе 5 центроидның (күзәнәкнең) иң якынына билгеләнгән"},"t0":{"en":"A larger IVF index: 20 vectors carved into nlist = 5 cells, each vector assigned to its nearest centroid (◇). Search will scan only the points in the cells we choose to probe — so the number of cells probed (nprobe) sets both the work done and the recall reached.","ru":"Более крупный индекс IVF: 20 векторов разбиты на nlist = 5 ячеек, каждый вектор отнесён к ближайшему центроиду (◇). Поиск сканирует только точки в ячейках, которые мы решаем пробовать — поэтому число пробуемых ячеек (nprobe) задаёт и объём работы, и достигнутую полноту.","tt":"Зуррак IVF индексы: 20 вектор nlist = 5 күзәнәккә бүленгән, һәр вектор иң якын центроидка (◇) билгеләнгән. Эзләү бары без тикшерергә сайлаган күзәнәкләрдәге нокталарны сканлый — шуңа тикшерелгән күзәнәкләр саны (nprobe) эшнең күләмен дә, ирешелгән recall ны да билгели."},"t1":{"en":"The query (★) is matched to the nearest centroid and lands in cell c0. Its five true nearest neighbours (k = 5) are ringed — they are NOT all in c0: they spread across the first few cells by centroid distance, so one cell will not catch them all.","ru":"Запрос (★) сопоставляется с ближайшим центроидом и попадает в ячейку c0. Пять его истинных ближайших соседей (k = 5) обведены — они НЕ все в c0: они разбросаны по нескольким ближайшим по центроиду ячейкам, поэтому одна ячейка не поймает их всех.","tt":"Сорау (★) иң якын центроидка туры китерелә һәм c0 күзәнәгенә төшә. Аның биш чын иң якын күршесе (k = 5) боҗралы — алар барысы да c0 да ТҮГЕЛ: алар центроид ераклыгы буенча беренче берничә күзәнәккә таралган, шуңа бер күзәнәк аларны барысын да тотмый."},"t2":{"en":"nprobe = 1 probes only the query's own cell, c0. It scans 4 points and finds 3 of the 5 true neighbours: recall@5 = 0.6. Fast, but two true neighbours sit in other cells and are missed (shown with a dashed red ring).","ru":"nprobe = 1 пробует только собственную ячейку запроса, c0. Она сканирует 4 точки и находит 3 из 5 истинных соседей: recall@5 = 0,6. Быстро, но два истинных соседа в других ячейках пропущены (показаны красным пунктирным кольцом).","tt":"nprobe = 1 бары сорауның үз күзәнәген, c0 ны тикшерә. Ул 4 нокта сканлый һәм 5 чын күршенең 3 ен таба: recall@5 = 0.6. Тиз, ләкин ике чын күрше башка күзәнәкләрдә калдырылды (кызыл өзек боҗра белән күрсәтелгән)."},"t3":{"en":"nprobe = 2 also probes the next-nearest cell (c4). Now 8 points are scanned and a fourth true neighbour is found: recall@5 = 0.8. One neighbour is still stranded in a farther cell.","ru":"nprobe = 2 пробует и следующую по близости ячейку (c4). Теперь сканируется 8 точек и найден четвёртый истинный сосед: recall@5 = 0,8. Один сосед всё ещё застрял в более далёкой ячейке.","tt":"nprobe = 2 икенче иң якын күзәнәкне (c4) дә тикшерә. Хәзер 8 нокта сканлана һәм дүртенче чын күрше табыла: recall@5 = 0.8. Бер күрше әле дә ерактагы күзәнәктә калган."},"t4":{"en":"nprobe = 3 adds cell c1: 13 points scanned, and the fifth true neighbour is found at last — recall@5 = 1.0. Three of the five cells held all the true neighbours, so probing the three nearest cells is enough for perfect recall.","ru":"nprobe = 3 добавляет ячейку c1: просканировано 13 точек, и наконец найден пятый истинный сосед — recall@5 = 1,0. Три из пяти ячеек содержали всех истинных соседей, поэтому пробы трёх ближайших ячеек достаточно для полноты 1,0.","tt":"nprobe = 3 c1 күзәнәген өсти: 13 нокта сканланды, һәм ниһаять бишенче чын күрше табылды — recall@5 = 1.0. Биш күзәнәкнең өчесе барлык чын күршеләрне тоткан, шуңа өч иң якын күзәнәкне тикшерү тулы recall өчен җитә."},"t5":{"en":"nprobe = 4 probes a fourth cell (c2): 17 points scanned. Recall is already 1.0, so the extra cell finds no new true neighbour — it is pure extra work. This is the diminishing-returns region of the nprobe dial.","ru":"nprobe = 4 пробует четвёртую ячейку (c2): просканировано 17 точек. Recall уже 1,0, поэтому лишняя ячейка не находит новых истинных соседей — это чистая лишняя работа. Это область убывающей отдачи регулятора nprobe.","tt":"nprobe = 4 дүртенче күзәнәкне (c2) тикшерә: 17 нокта сканланды. Recall инде 1.0, шуңа артык күзәнәк яңа чын күрше тапмый — бу саф артык эш. Бу nprobe көйләгеченең кими барган кайтарым өлкәсе."},"t6":{"en":"nprobe = 5 probes every cell: all 20 points scanned — this is now exhaustive search, no cells skipped. Recall stays 1.0 but the work is maximal. The lesson: a small nprobe already buys full recall here; more probing only costs.","ru":"nprobe = 5 пробует все ячейки: просканированы все 20 точек — это уже полный перебор, ни одна ячейка не пропущена. Recall остаётся 1,0, но работа максимальна. Урок: небольшой nprobe здесь уже даёт полноту 1,0; больше проб — только затраты.","tt":"nprobe = 5 һәр күзәнәкне тикшерә: барлык 20 нокта сканланды — бу хәзер тулы эзләү, бер күзәнәк тә калдырылмаган. Recall 1.0 булып кала, ләкин эш иң зур. Сабак: бу очракта кечкенә nprobe инде тулы recall бирә; күбрәк тикшерү бары чыгым."}},"title":{"en":"IVF: probe the nearest cells, recall vs nprobe","ru":"IVF: пробуем ближайшие ячейки, полнота против nprobe","tt":"IVF: иң якын күзәнәкләрне тикшерү, recall һәм nprobe"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
