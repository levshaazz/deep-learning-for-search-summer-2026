экспоненциаль 2^g−1 (0,6563), — gain функциясен сайлау баллны үзгәртүен күрсәтә, шуңа кайсын алганыңны күрсәтергә кирәк."},"rankCol":{"en":"rank","ru":"ранг","tt":"ранг"},"gradeCol":{"en":"grade","ru":"оценка","tt":"бәя"},"gainCol":{"en":"gain","ru":"gain","tt":"gain"},"discCol":{"en":"discount","ru":"дисконт","tt":"дисконт"},"binaryTag":{"en":"binary gain","ru":"бинарный gain","tt":"бинар gain"},"linearTag":{"en":"linear gain  (g)","ru":"линейный gain  (g)","tt":"сызыкча gain  (g)"},"expTag":{"en":"exponential gain  (2^g − 1)","ru":"экспоненциальный gain  (2^g − 1)","tt":"экспоненциаль gain  (2^g − 1)"},"dcgLabel":{"en":"DCG","ru":"DCG","tt":"DCG"},"idcgLabel":{"en":"IDCG","ru":"IDCG","tt":"IDCG"},"ndcgLabel":{"en":"nDCG","ru":"nDCG","tt":"nDCG"},"verdict":{"en":"Same ranking, three scores — state which gain you used.","ru":"Одно ранжирование, три оценки — указывай, какой gain взял.","tt":"Бер ранжлау, өч балл — кайсы gain алганыңны күрсәт."},"s0":{"en":"The same eight-result ranking, but now graded, not binary. Each hit carries a relevance grade: two strong space docs at ranks 2 and 4 score grade 3, two marginal ones at ranks 6 and 8 score grade 1, the four off-topic results score 0. nDCG still discounts each gain by 1/log₂(rank+1).","ru":"Одно и то же ранжирование из восьми результатов, но теперь градуированное, а не бинарное. Каждое попадание несёт оценку релевантности: два сильных космических документа на рангах 2 и 4 получают оценку 3, два маргинальных на рангах 6 и 8 — оценку 1, четыре не по теме — 0. nDCG по-прежнему дисконтирует каждый gain на 1/log₂(ранг+1).","tt":"Сигез нәтиҗәле бер үк ранжлау, әмма хәзер градуирланган, бинар түгел. Һәр туры килү релевантлык бәясен йөртә: 2 һәм 4 рангтагы ике көчле космос документы 3 бәясен ала, 6 һәм 8 рангтагы ике маргиналь — 1 бәясен, темага туры килмәгән дүртесе — 0. nDCG һаман һәр gain-ны 1/log₂(ранг+1)-гә дисконтлый."},"s1":{"en":"Binary gain first: flatten every grade to 1-if-relevant. Only the discounts matter, so DCG = 0.6309 + 0.4307 + 0.3562 + 0.3155 = 1.7333; the ideal puts all four hits up top → IDCG = 2.5616. nDCG = 1.7333 / 2.5616 = 0.6766. Binary can't tell a grade-3 from a grade-1.","ru":"Сначала бинарный gain: сплющи каждую оценку в 1, если релевантно. Важны только дисконты, так что DCG = 0,6309 + 0,4307 + 0,3562 + 0,3155 = 1,7333; идеал ставит все четыре попадания наверх → IDCG = 2,5616. nDCG = 1,7333 / 2,5616 = 0,6766. Бинарный не отличит оценку 3 от оценки 1.","tt":"Башта бинар gain: һәр бәяне, релевант булса, 1-гә сплющла. Бары тик дисконтлар гына мөһим, шуңа DCG = 0,6309 + 0,4307 + 0,3562 + 0,3155 = 1,7333; идеал дүрт туры килүне дә өскә куя → IDCG = 2,5616. nDCG = 1,7333 / 2,5616 = 0,6766. Бинар 3 бәясен 1 бәясеннән аера алмый."},"s2":{"en":"Linear graded gain uses the grade itself: gain = g. The two grade-3 hits now weigh three times a grade-1. DCG = 3·0.6309 + 3·0.4307 + 1·0.3562 + 1·0.3155 = 3.8565; the ideal front-loads grades 3,3,1,1 → IDCG = 5.8235. nDCG = 0.6622 — slightly below binary's 0.6766, because the strong hits sit at rank 2 and 4, not 1 and 2.","ru":"Линейный градуированный gain берёт саму оценку: gain = g. Два попадания с оценкой 3 теперь весят втрое больше оценки 1. DCG = 3·0,6309 + 3·0,4307 + 1·0,3562 + 1·0,3155 = 3,8565; идеал выводит вперёд оценки 3,3,1,1 → IDCG = 5,8235. nDCG = 0,6622 — чуть ниже бинарного 0,6766, потому что сильные попадания стоят на рангах 2 и 4, а не 1 и 2.","tt":"Сызыкча градуирланган gain бәянең үзен ала: gain = g. 3 бәясе булган ике туры килү хәзер 1 бәясеннән өч тапкыр авыррак. DCG = 3·0,6309 + 3·0,4307 + 1·0,3562 + 1·0,3155 = 3,8565; идеал 3,3,1,1 бәяләрен алга чыгара → IDCG = 5,8235. nDCG = 0,6622 — бинарның 0,6766-сыннан бераз түбәнрәк, чөнки көчле туры килүләр 1 һәм 2 рангта түгел, ә 2 һәм 4 рангта тора."},"s3":{"en":"Exponential gain, 2^g − 1, punishes burying a great result even harder: a grade-3 jumps to 7 while a grade-1 stays 1. DCG = 7·0.6309 + 7·0.4307 + 1·0.3562 + 1·0.3155 = 8.1029; IDCG = 12.3472. nDCG = 8.1029 / 12.3472 = 0.6563 — the lowest of the three. Same ranking, three scores (0.6766 / 0.6622 / 0.6563). They disagree because they reward different things — so always state which gain you used.","ru":"Экспоненциальный gain, 2^g − 1, ещё жёстче карает за зарытый отличный результат: оценка 3 прыгает до 7, а оценка 1 остаётся 1. DCG = 7·0,6309 + 7·0,4307 + 1·0,3562 + 1·0,3155 = 8,1029; IDCG = 12,3472. nDCG = 8,1029 / 12,3472 = 0,6563 — ниже всех трёх. Одно ранжирование, три оценки (0,6766 / 0,6622 / 0,6563). Они расходятся, потому что награждают за разное, — поэтому всегда указывай, какой gain взял.","tt":"Экспоненциаль gain, 2^g − 1, яхшы нәтиҗәне күмгән өчен тагын да катырак җәзалый: 3 бәясе 7-гә сикерә, ә 1 бәясе 1 булып кала. DCG = 7·0,6309 + 7·0,4307 + 1·0,3562 + 1·0,3155 = 8,1029; IDCG = 12,3472. nDCG = 8,1029 / 12,3472 = 0,6563 — өчесеннән дә түбәнрәк. Бер ранжлау, өч балл (0,6766 / 0,6622 / 0,6563). Алар аерылалар, чөнки төрле нәрсә өчен бүләклиләр, — шуңа күрә һәрвакыт кайсы gain алганыңны күрсәт."}},"title":{"en":"Graded-gain nDCG: binary vs linear vs exponential","ru":"Градуированный nDCG: бинарный против линейного и экспоненциального","tt":"Дәрәҗәле nDCG: бинар, сызыклы һәм экспоненциаль"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
