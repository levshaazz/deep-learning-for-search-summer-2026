g","ranked":[{"caption":"dog","cos":0.991},{"caption":"cat","cos":0.6609},{"caption":"car","cos":0.2877}],"top1":"dog"},{"image":"car","ranked":[{"caption":"car","cos":0.9949},{"caption":"dog","cos":0.329},{"caption":"cat","cos":0.1712}],"top1":"car"}],"recallAt1":1,"matchedMeanCos":0.9944,"mismatchedMeanCos":0.3791,"contrastiveGap":0.6153,"callbackNote":"Same cosine-in-a-shared-space idea as L6 contrastive learning (Sir Cosine), now across modalities: image and its caption are trained to be neighbours; everything else is pushed apart.","real":{"_visModel":"llava:7b","top1Accuracy":1,"top1Correct":5,"n":5,"note":"Real llava:7b forced-choice image→caption on 5 TEXT-FREE shapes (so it's vision, not OCR): 5/5 correct. The matching caption is the model's top pick — cross-modal retrieval in a shared space."}},"dataSets":{"l12-clip":{"_src":"toy shared-space cosine matrix (gen_l12.py, stdlib) — CLIP cross-modal retrieval + REAL llava run","concepts":["cat","dog","car"],"imageVectors":{"cat":[0.9,0.3,0.1,0],"dog":[0.3,0.9,0.2,0],"car":[0,0.15,0.85,0.45]},"textVectors":{"cat":[0.85,0.35,0.12,0],"dog":[0.35,0.85,0.15,0.1],"car":[0.05,0.1,0.8,0.5]},"cosineMatrix":[[0.9974,0.6547,0.171],[0.6609,0.991,0.2877],[0.1712,0.329,0.9949]],"retrievedPerImage":["cat","dog","car"],"diagonalCorrect":3,"topKByImage":[{"image":"cat","ranked":[{"caption":"cat","cos":0.9974},{"caption":"dog","cos":0.6547},{"caption":"car","cos":0.171}],"top1":"cat"},{"image":"dog","ranked":[{"caption":"dog","cos":0.991},{"caption":"cat","cos":0.6609},{"caption":"car","cos":0.2877}],"top1":"dog"},{"image":"car","ranked":[{"caption":"car","cos":0.9949},{"caption":"dog","cos":0.329},{"caption":"cat","cos":0.1712}],"top1":"car"}],"recallAt1":1,"matchedMeanCos":0.9944,"mismatchedMeanCos":0.3791,"contrastiveGap":0.6153,"callbackNote":"Same cosine-in-a-shared-space idea as L6 contrastive learning (Sir Cosine), now across modalities: image and its caption are trained to be neighbours; everything else is pushed apart.","real":{"_visModel":"llava:7b","top1Accuracy":1,"top1Correct":5,"n":5,"note":"Real llava:7b forced-choice image→caption on 5 TEXT-FREE shapes (so it's vision, not OCR): 5/5 correct. The matching caption is the model's top pick — cross-modal retrieval in a shared space."}}},"i18n":{"_doc":"Step captions + small labels for clip-matrix (L12 multimodal CLIP). EN canonical + RU + TT. Every NUMBER (the cosine cells, the matched/mismatched means, the contrastive gap, the diagonal tally, the real llava accuracy and its fraction, the concept names) comes from data/l12-clip.json, never from these strings.","alt":{"en":"A CLIP shared-space cosine matrix: image concepts as rows, caption concepts as columns, each cell the cosine of an image against a caption. The matching diagonal lights up green, then two bars compare the mean matched cosine against the mean mismatched cosine, and a badge shows a real llava image-to-caption forced-choice run.","ru":"Матрица косинусов в общем пространстве CLIP: концепты изображений по строкам, концепты подписей по столбцам, в каждой ячейке — косинус изображения и подписи. Совпадающая диагональ загорается зелёным, затем две шкалы сравнивают средний косинус совпадающих пар со средним косинусом несовпадающих, а бейдж показывает реальный прогон llava с выбором подписи по изображению.","tt":"CLIP уртак киңлегендәге косинус матрицасы: рәсем концептлары юлларда, язма концептлары баганаларда, һәр күзәнәктә — рәсем белән язманың косинусы. Туры килгән диагональ яшел булып яна, аннары ике шкала туры килгән парларның уртача косинусын туры килмәгәннәренекенә чагыштыра, ә билге llava ның чын рәсем-язма сайлау узуын күрсәтә."},"head":{"en":"one shared space · cosine(image i, caption j)","ru":"одно общее пространство · cosine(изображение i, подпись j)","tt":"бер уртак киңлек · cosine(рәсем i, язма j)"},"textAxis":{"en":"caption (text) j →","ru":"подпись (текст) j →","tt":"язма (текст) j →"},"imgAxis":{"en":"↓ image i","ru":"↓ изображение i","tt":"↓ рәсем i"},"tally":{"en":"top match on the diagonal","ru":"лучшее совпадение — на диагонали","tt":"иң яхшы туры килү — диагональдә"},"rowPick":{"en":"scan one row → pick its brightest cell (argmax)","ru":"просматриваем одну строку → берём самую яркую ячейку (argmax)","tt":"бер юлны карап чыгабыз → иң якты күзәнәкне алабыз (argmax)"},"matched":{"en":"matching pairs (diagonal)","ru":"совпадающие пары (диагональ)","tt":"туры килгән парлар (диагональ)"},"mismatched":{"en":"everything else (off-diagonal)","ru":"всё остальное (вне диагонали)","tt":"калган барысы (диагональдән тыш)"},"gapLbl":{"en":"contrastive gap","ru":"контрастный разрыв","tt":"контраст аермасы"},"real":{"en":"real llava:7b · image→caption forced choice","ru":"реальный llava:7b · выбор подписи по изображению","tt":"чын llava:7b · рәсемгә язма сайлау"},"s0":{"en":"Both pictures and their captions are embedded into ONE shared space — the same coordinate system holds image vectors and text vectors at once. Down the rows sit three image concepts; across the columns sit the same three caption concepts. The grid is empty for now: every cell will become the cosine similarity between an image and a caption.","ru":"И картинки, и их подписи вкладываются в ОДНО общее пространство — одна система координат держит сразу векторы изображений и векторы текста. По строкам идут три концепта изображений; по столбцам — те же три концепта подписей. Пока сетка пуста: каждая ячейка станет косинусной близостью между изображением и подписью.","tt":"Рәсемнәр дә, аларның язмалары да БЕР уртак киңлеккә урнаштырыла — бер үк координаталар системасы рәсем векторларын һәм текст векторларын бер юлы тота. Юллар буенча өч рәсем концепты; баганалар буенча — шул ук өч язма концепты. Хәзергә челтәр буш: һәр күзәнәк рәсем белән язма арасындагы косинус охшашлыкка әйләнәчәк."},"s1":{"en":"Now fill each cell with the cosine of that image against that caption, shaded by value: pale where they are far apart, deep green where they nearly coincide. A bright band runs down the diagonal — an image and its own caption land almost on top of each other — while the off-diagonal cells stay faint. The structure is already visible before we name it.","ru":"Теперь заполняем каждую ячейку косинусом этого изображения и этой подписи, окрашивая по значению: бледно там, где они далеки, насыщенно-зелёно там, где почти совпадают. По диагонали идёт яркая полоса — изображение и его собственная подпись ложатся почти друг на друга, — а ячейки вне диагонали остаются тусклыми. Структура видна ещё до того, как мы её назвали.","tt":"Хәзер һәр күзәнәкне шул рәсем белән шул язманың косинусы белән тутырабыз, кыйммәт буенча төсләп: ерак булганда — ачык, диярлек тәңгәл килгәндә — куе яшел. Диагональ буенча якты тасма бара — рәсем һәм аның үз язмасы диярлек бер-берсе өстенә төшә, — ә диагональдән тыш күзәнәкләр тонык кала. Структура без аны атаганчы ук күренә."},"s2":{"en":"Take one image row — the cat — and scan it left to right. Cross-modal retrieval is a single act: pick the cell with the highest cosine, the argmax of the row. The losing cells fade; the brightest one is ringed green — and it is the cat's own caption. That one pick is 'search the captions with a picture' in miniature.","ru":"Возьмём одну строку-изображение — кошку — и просмотрим её слева направо. Кросс-модальный поиск — это один шаг: берём ячейку с наибольшим косинусом, argmax строки. Проигравшие ячейки гаснут; самая яркая обведена зелёным — и это собственная подпись кошки. Этот один выбор и есть «поиск по подписям картинкой» в миниатюре.","tt":"Бер рәсем юлын — мәчене — алыйк һәм аны сулдан уңга карап чыгыйк. Кросс-модаль эзләү — бер генә гамәл: иң зур косинуслы күзәнәкне, юлның argmax ын алабыз. Оттырган күзәнәкләр сүнә; иң яктысы яшел белән уратып алынган — һәм ул мәченең үз язмасы. Шул бер сайлау — рәсем белән язмаларны эзләүнең кечкенә күренеше."},"s3":{"en":"For each image row, the top match is the cell with the highest cosine — and it is the diagonal one, the image's own caption. Highlighted in green, the winning cells form a clean diagonal: every image retrieves the right caption. This argmax-per-row is exactly cross-modal retrieval — searching text with a picture, or pictures with text, inside the shared space.","ru":"Для каждой строки-изображения лучшее совпадение — ячейка с наибольшим косинусом, и это именно диагональная, собственная подпись изображения. Подсвеченные зелёным, выигравшие ячейки образуют чистую диагональ: каждое изображение извлекает правильную подпись. Этот argmax по строке и есть кросс-модальный поиск — ищем текст картинкой или картинки текстом внутри общего пространства.","tt":"Һәр рәсем юлы өчен иң яхшы туры килү — иң зур косинуслы күзәнәк, һәм ул нәкъ диагональдәгесе, рәсемнең үз язмасы. Яшел белән билгеләнгән җиңүче күзәнәкләр чиста диагональ ясый: һәр рәсем дөрес язманы таба. Юл буенча бу argmax — нәкъ кросс-модаль эзләү: уртак киңлектә рәсем белән текст яки текст белән рәсем эзләү."},"s4":{"en":"Why does the diagonal win so cleanly? Average the cosine of the matching pairs and average it for everything else: the matched mean is high and the mismatched mean is low, and the gap between them is wide. These hand-set vectors illustrate the contrastive idea from L7 (Sir Cosine) across modalities. They are not outputs of a CLIP model or a training run.","ru":"Почему диагональ выигрывает так чисто? Усредни косинус совпадающих пар и усредни его для всего остального: среднее у совпадающих высокое, у несовпадающих — низкое, а разрыв между ними широкий. Эти вручную заданные векторы иллюстрируют контрастную идею из L7 (Сэр Косинус) между модальностями. Это не выход CLIP и не результат запуска обучения.","tt":"Ни өчен диагональ шулкадәр чиста җиңә? Туры килгән парларның косинусын уртачалагыз һәм калган барысы өчен дә уртачалагыз: туры килгәннәрнең уртачасы зур, туры килмәгәннәренеке кечкенә, ә алар арасындагы аерма киң. Кулдан куелган бу векторлар L7 дәге (Сэр Косинус) контраст идеясен модальлекләр арасында күрсәтә. Алар CLIP моделенең яки өйрәтүнең чыгышы түгел."},"s5":{"en":"And this is not just a toy. A real llava:7b vision model, given pictures of plain text-free shapes and asked to pick the matching caption, gets every one of them right — so it is reading the image, not the letters in it. The matching caption is the model's top choice: cross-modal retrieval in a shared space, working on a genuine multimodal model.","ru":"И это не просто игрушка. Настоящая визуальная модель llava:7b, которой дают картинки с простыми фигурами без текста и просят выбрать подходящую подпись, угадывает все до единой — значит, она читает изображение, а не буквы в нём. Совпадающая подпись — это лучший выбор модели: кросс-модальный поиск в общем пространстве, работающий на настоящей мультимодальной модели.","tt":"Һәм бу бары уенчык кына түгел. Чын llava:7b күрү моделе, аңа текстсыз гади фигуралы рәсемнәр биреп туры килгән язманы сайларга кушканда, барысын да дөрес таба — димәк, ул рәсемне укый, ә эчендәге хәрефләрне түгел. Туры килгән язма — моделнең иң яхшы сайлавы: уртак киңлектә кросс-модаль эзләү, чын мультимодаль модельдә эшләп."}},"title":{"en":"CLIP: the shared-space matrix","ru":"CLIP: матрица общего пространства","tt":"CLIP: уртак киңлек матрицасы"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
