,"u":[1,1],"v":[10,10],"u_dot_v":20,"normU":1.414214,"normV":14.142136,"cos":1,"angleDeg":0,"euclid":12.727922,"euclidExact":"√162","story":"(1,1) and (10,10) point the same way — cosine sees them as identical (1.0); Euclidean treats them as far apart (≈12.73)."},{"id":"orthogonal","name":"orthogonal","u":[1,0],"v":[0,1],"u_dot_v":0,"normU":1,"normV":1,"cos":0,"angleDeg":90,"euclid":1.414214,"euclidExact":"√2","story":"(1,0) and (0,1) are at 90° — cosine = 0 (no shared direction)."},{"id":"opposite","name":"opposite","u":[1,1],"v":[-1,-1],"u_dot_v":-2,"normU":1.414214,"normV":1.414214,"cos":-1,"angleDeg":180,"euclid":2.828427,"euclidExact":"2√2","story":"(1,1) and (-1,-1) point the opposite way — cosine = -1."}]},"dataSets":{"l2-cosine":{"_doc":"Canonical worked example for L2 'First Contact' similarity arc (climb-cosine beat). Single source for the cosine-sphere widget (slide + Book) AND the facts-gate. Pedagogical point: (1,1) and (10,10) point the SAME way → cosine sees them as identical (1.0), but Euclidean treats them as far apart (√162 ≈ 12.73) — length lies.","_source":"_research/data/cosine_examples.json :: classic_pairs (generator output; the facts-gate asserts this file == that artifact)","primary":"same-dir","relation":"‖x − y‖² = 2(1 − cos θ)   (for unit vectors)","pairs":[{"id":"same-dir","name":"same direction, different magnitude","u":[1,1],"v":[10,10],"u_dot_v":20,"normU":1.414214,"normV":14.142136,"cos":1,"angleDeg":0,"euclid":12.727922,"euclidExact":"√162","story":"(1,1) and (10,10) point the same way — cosine sees them as identical (1.0); Euclidean treats them as far apart (≈12.73)."},{"id":"orthogonal","name":"orthogonal","u":[1,0],"v":[0,1],"u_dot_v":0,"normU":1,"normV":1,"cos":0,"angleDeg":90,"euclid":1.414214,"euclidExact":"√2","story":"(1,0) and (0,1) are at 90° — cosine = 0 (no shared direction)."},{"id":"opposite","name":"opposite","u":[1,1],"v":[-1,-1],"u_dot_v":-2,"normU":1.414214,"normV":1.414214,"cos":-1,"angleDeg":180,"euclid":2.828427,"euclidExact":"2√2","story":"(1,1) and (-1,-1) point the opposite way — cosine = -1."}]}},"i18n":{"_doc":"Single source of the cosine-sphere widget's human text. EN canonical + RU; TT to be authored by the native-speaker reviewer (resolver falls back tt -> ru -> en). The widget itself ships NO prose — all text comes from these keys (REFERENCE_IMPL_L2 a.6 rule 4).","alt":{"en":"Two vectors from the origin; cosine measures the angle between them, Euclidean distance measures the gap between their tips.","ru":"Два вектора из начала координат; косинус измеряет угол между ними, евклидово расстояние — промежуток между их концами.","tt":"Координаталар башыннан ике вектор; cosine алар арасындагы почмакны үлчи, евклид ераклыгы аларның очлары арасындагы аралыкны үлчи."},"s0":{"en":"Two vectors, u = (1,1) and v = (10,10). They point the same way — but one is much longer.","ru":"Два вектора, u = (1,1) и v = (10,10). Они смотрят в одну сторону — но один намного длиннее.","tt":"Ике вектор, u = (1,1) һәм v = (10,10). Алар бер якка карый — әмма берсе күпкә озынрак."},"s1":{"en":"Euclidean distance measures the gap between their tips: ‖u − v‖ = √162 ≈ 12.73. It calls them far apart.","ru":"Евклидово расстояние измеряет промежуток между концами: ‖u − v‖ = √162 ≈ 12,73. Оно считает их далёкими.","tt":"Евклид ераклыгы аларның очлары арасындагы аралыкны үлчи: ‖u − v‖ = √162 ≈ 12.73. Ул аларны бер-берсеннән ерак дип саный."},"s2":{"en":"But the angle between them is θ = 0°, so cosine = 1. Cosine says they are identical in direction.","ru":"Но угол между ними θ = 0°, поэтому косинус = 1. Косинус считает их одинаковыми по направлению.","tt":"Әмма алар арасындагы почмак θ = 0°, шуңа cosine = 1. Cosine аларны юнәлеш буенча бертөрле дип саный."},"s3":{"en":"Project both onto the unit sphere (normalize). They land on the same point — direction is all that's left.","ru":"Спроецируем оба на единичную сферу (нормируем). Они попадают в одну точку — остаётся только направление.","tt":"Икесен дә берәмлек сферага проекциялик (нормалаштырабыз). Алар бер үк ноктага эләгә — бары тик юнәлеш кенә кала."},"s4":{"en":"For unit vectors the two views connect: ‖x − y‖² = 2(1 − cos θ). Same direction ⇒ cosine 1 — and distance 0 only AFTER normalizing: the raw u and v above share a direction but not a length, so ‖u − v‖ stays large.","ru":"Для единичных векторов две картины связаны: ‖x − y‖² = 2(1 − cos θ). Одно направление ⇒ косинус 1, а расстояние 0 — только ПОСЛЕ нормировки: у сырых u и v направление общее, а длина разная, поэтому ‖u − v‖ остаётся большим.","tt":"Берәмлек векторлар өчен ике күренеш бәйләнгән: ‖x − y‖² = 2(1 − cos θ). Бер юнәлеш ⇒ cosine 1, ә ераклык 0 — бары тик нормалаштыргач: чи u һәм v юнәлеше уртак, әмма озынлыгы төрле, шуңа ‖u − v‖ зур булып кала."},"euclid":{"en":"Euclidean","ru":"Евклид","tt":"Евклид"},"angleLabel":{"en":"θ","ru":"θ","tt":"θ"},"cosLabel":{"en":"cos","ru":"cos","tt":"cos"},"unitCircle":{"en":"unit sphere","ru":"единичная сфера","tt":"берәмлек сфера"}},"title":{"en":"Cosine on the unit sphere","ru":"Косинус на единичной сфере","tt":"Берәмлек сферасында косинус"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
