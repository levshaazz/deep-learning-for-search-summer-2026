(p) curve and its peak) come from data/l17-entropy.json → coin + coinCurve — never from this file. The only exception is the OPTIONAL data.coin.selfInfo pair, whose documented fallback [2, 0.415] the logic.js comment spells out. `dec` is the language's decimal mark: the widget renders every datum through it, so ru/tt read 0,8113 and en reads 0.8113.","dec":{"en":".","ru":",","tt":","},"bits":{"en":"bits","ru":"бита","tt":"бит"},"bits1":{"en":"bit","ru":"бит","tt":"бит"},"alt":{"en":"A brass dial whose needle reads surprise in bits: it points at −log₂ p for the outcome under the pointer, with a red floor line welded onto the scale at the entropy H. Beside it, the entropy curve H(p) over p in [0,1] rises to exactly one bit at the fair coin p = 0.5, and a pair of bars shows each outcome's surprise weighted by how often it happens, stacking end to end into H. A wrong model q lifts the needle off the floor by the hatched KL gap.","ru":"Латунный циферблат, чья стрелка читает удивление в битах: она указывает на −log₂ p для исхода под указателем, а на шкале приварена красная линия пола — энтропия H. Рядом кривая энтропии H(p) на p∈[0,1] поднимается ровно до одного бита у честной монеты p = 0,5, а пара столбцов показывает удивление каждого исхода, взвешенное его частотой, и складывается встык в H. Ошибочная модель q поднимает стрелку над полом на заштрихованный зазор KL.","tt":"Җиз циферблат, аның күрсәткече гаҗәплекне битларда укый: ул күрсәткеч астындагы нәтиҗә өчен −log₂ p ны күрсәтә, ә шкалага энтропия H урынында кызыл идән сызыгы ябыштырылган. Янәшәдә p∈[0,1] өстендәге H(p) энтропия кәкресе гадел тәңкәдә p = 0,5 ноктасында нәкъ бер биткә күтәрелә, ә ике багана һәр нәтиҗәнең ешлыгына тапкырланган гаҗәплеген күрсәтә һәм ялганып H га җыела. Ялгыш модель q күрсәткечне идәннән штрихланган KL кылы кадәр күтәрә."},"head":{"en":"the surprise needle: −log₂ p and its average H","ru":"стрелка удивления: −log₂ p и её среднее H","tt":"гаҗәплек күрсәткече: −log₂ p һәм аның уртачасы H"},"dialHead":{"en":"surprise, bits","ru":"удивление, бит","tt":"гаҗәплек, бит"},"curveHead":{"en":"H(p) — bits per toss","ru":"H(p) — бит на бросок","tt":"H(p) — атуга бит"},"barsHead":{"en":"surprise per outcome, then weighted","ru":"удивление по исходам, потом с весами","tt":"нәтиҗә буенча гаҗәплек, аннары авырлык"},"outRare":{"en":"heads (p)","ru":"орёл (p)","tt":"герб (p)"},"outCommon":{"en":"tails (1−p)","ru":"решка (1−p)","tt":"язу (1−p)"},"wRare":{"en":"× p","ru":"× p","tt":"× p"},"wCommon":{"en":"× (1−p)","ru":"× (1−p)","tt":"× (1−p)"},"floorTag":{"en":"H","ru":"H","tt":"H"},"maxTag":{"en":"max","ru":"макс","tt":"макс"},"rdSelf":{"en":"−log₂ p","ru":"−log₂ p","tt":"−log₂ p"},"rdH":{"en":"H(p)","ru":"H(p)","tt":"H(p)"},"rdCE":{"en":"H(p,q)","ru":"H(p,q)","tt":"H(p,q)"},"rdKL":{"en":"KL(p‖q)","ru":"KL(p‖q)","tt":"KL(p‖q)"},"rdPP":{"en":"PP","ru":"PP","tt":"PP"},"rdFloor":{"en":"floor","ru":"пол","tt":"чик"},"rdBelow":{"en":"below 1 bit ⇒ the skew is exploitable","ru":"меньше 1 бита ⇒ перекос сжимаем","tt":"1 биттан ким ⇒ авышлык кысыла"},"s0":{"en":"Surprise is −log₂ p: a rare outcome is TALL, a common one is short. On this biased coin heads costs 2 bits of surprise, tails only 0.415 — the two bar lengths are the two self-informations, nothing averaged yet.","ru":"Удивление — это −log₂ p: редкий исход ДЛИННЫЙ, частый — короткий. У этой кривой монеты орёл стоит 2 бита удивления, решка — всего 0,415. Две длины столбцов и есть две собственные информации, пока без всякого усреднения.","tt":"Гаҗәплек — ул −log₂ p: сирәк нәтиҗә ОЗЫН, еш очраганы кыска. Бу кыек тәңкәдә герб 2 бит гаҗәплек тора, язу исә бары 0,415. Ике баганының озынлыгы — ике үз мәгълүматы, әле бернинди уртачалау да юк."},"s1":{"en":"But you rarely pay the rare price. Weight each bar by how often its outcome actually happens: the tall rare one shrinks by ×p, the short common one by ×(1−p). Surprise you almost never meet barely counts.","ru":"Но за редкий исход ты платишь редко. Взвесь каждый столбец тем, как часто этот исход вообще случается: длинный редкий сжимается на ×p, короткий частый — на ×(1−p). Удивление, которое ты почти не встречаешь, почти не считается.","tt":"Ләкин син сирәк нәтиҗә өчен сирәк түлисең. Һәр баганага аның нәтиҗәсе ничек еш очравын авырлык итеп куй: озын сирәге ×p кадәр, кыска ешы ×(1−p) кадәр кими. Син очратмаган гаҗәплек диярлек исәпләнми."},"s2":{"en":"Stack the two weighted contributions end to end: their sum IS the entropy H(p), the average surprise per toss. Draw it for every p and you get a cap that peaks at exactly 1 bit for the fair coin, p = 0.5 — maximum ignorance.","ru":"Сложи два взвешенных вклада встык — их сумма и есть энтропия H(p), среднее удивление на бросок. Нарисуй её для каждого p, и получится колпак с максимумом ровно в 1 бит у честной монеты, p = 0,5: предел незнания.","tt":"Ике авырлыклы өлешне ялгап куй — аларның суммасы ул энтропия H(p), һәр атуга уртача гаҗәплек. Аны һәр p өчен сыз, һәм гадел тәңкәдә p = 0,5 ноктасында нәкъ 1 биткә җиткән калпак килеп чыга: белмәүнең чиге."},"s3":{"en":"Lock the needle at p = 0.25: the coin's entropy is H = 0.8113 bits, and the red floor line is welded onto the dial right there. Below 1 bit means the skew is exploitable — yet a code for a single toss still spends a whole bit; 0.8113 is the floor that codes over blocks of tosses approach.","ru":"Зафиксируй стрелку на p = 0,25: энтропия монеты H = 0,8113 бита, и красная линия пола приварена к циферблату именно там. Меньше 1 бита — значит перекос можно сжать, но код для одного броска всё равно тратит целый бит; 0,8113 — это пол, к которому подходят коды на блоках бросков.","tt":"Күрсәткечне p = 0,25 ноктасында беркет: тәңкәнең энтропиясе H = 0,8113 бит, кызыл идән сызыгы циферблатка нәкъ шунда ябыштырылган. 1 биттан ким булу — авышлыкны кысып була дигән сүз, ләкин бер ату өчен код барыбер бөтен бер бит сарыф итә; 0,8113 — ату блокларына корылган кодлар якынлаша торган идән."},"s4":{"en":"Now bolt on a WRONG model: q insists the coin is fair. The needle leaves the floor and reads the cross-entropy H(p,q) = 1 bit; the hatched wedge between floor and needle is the KL tax, 0.1887 bits. In perplexity that is 2 against a floor of 1.7548 — a COUNT of equally likely options, not bits; the «1.75 bits» of act 4 is a different number.","ru":"Теперь прикрути НЕВЕРНУЮ модель: q упорно считает монету честной. Стрелка сходит с пола и показывает кросс-энтропию H(p,q) = 1 бит; заштрихованный клин между полом и стрелкой — это налог KL, 0,1887 бита. В перплексии это 2 против пола 1,7548 — число равновероятных вариантов, а не биты; «1,75 бита» из акта 4 — другое число.","tt":"Хәзер ЯЛГЫШ модель тагып кара: q тәңкәне гадел дип нык саный. Күрсәткеч идәннән аерыла һәм кисешмә энтропиясен H(p,q) = 1 бит күрсәтә; идән белән күрсәткеч арасындагы штрихланган кыл — ул KL салымы, 0,1887 бит. Перплексиядә бу 1,7548 чиккә каршы 2 — бу тигез ихтимал вариантлар САНЫ, бит түгел; 4 нче акттагы «1,75 бит» — башка сан."}},"title":{"en":"The surprise needle","ru":"Стрелка удивления","tt":"Гаҗәплек күрсәткече"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
