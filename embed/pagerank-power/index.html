ылки и он — авторитет.","tt":"Өч битле сылтамалар графы: A → B, B → C, C → A һәм B, шуңа B-да ике керүче сылтама бар һәм ул — авторитет."},"_doc":"Step captions + small labels for pagerank-power. EN canonical + RU; TT falls back to EN. All numbers come from data/l3-pagerank.json (edges A→B, B→C, C→A, C→B; d=0.85; outdeg A=1,B=1,C=2; PR1(B)=0.475; converged A≈0.2148, B≈0.3974, C≈0.3878 — B the authority). Mirrors the deck's 5-step e2e 'Power iteration on a 3-page web'.","graphHead":{"en":"The 3-page web","ru":"Веб из трёх страниц","tt":"3 битле веб"},"vectorHead":{"en":"Rank vector PR","ru":"Вектор рангов PR","tt":"Ранглар векторы PR"},"updateHead":{"en":"Power-iteration update","ru":"Обновление степенного метода","tt":"Дәрәҗә методы яңартуы"},"outdegLabel":{"en":"out-degree","ru":"исх. степень","tt":"чыг. дәрәҗә"},"iterLabel":{"en":"iteration","ru":"итерация","tt":"итерация"},"authorityTag":{"en":"2 in-links → authority","ru":"2 входящие → авторитет","tt":"2 керүче сылтама → абруй"},"convergedTag":{"en":"converged","ru":"сошлось","tt":"якынайды"},"s0":{"en":"Three pages, four links: A→B, B→C, C→A, C→B. Out-degrees are A=1, B=1, C=2, so C splits its vote in half. With no prior knowledge the rank vector starts uniform — every page at 1/3 ≈ 0.3333.","ru":"Три страницы, четыре ссылки: A→B, B→C, C→A, C→B. Исходящие степени A=1, B=1, C=2, поэтому C делит свой голос пополам. Без априорного знания вектор рангов стартует равномерно — каждая страница по 1/3 ≈ 0,3333.","tt":"Өч бит, дүрт сылтама: A→B, B→C, C→A, C→B. Чыгучы дәрәҗәләр A=1, B=1, C=2, шуңа күрә C үз тавышын яртыга бүлә. Алдан белем булмаганда ранглар векторы тигез башлана — һәр бит 1/3 ≈ 0,3333."},"s1":{"en":"Apply the update to one node in full — B. Its in-links are A (whole vote, outdeg 1) and C (half, outdeg 2), with every PR₀ = 0.3333 substituted. The teleport floor is base = (1−0.85)/3 = 0.0500.","ru":"Применим обновление к одной вершине полностью — к B. Её входящие ссылки — A (целый голос, исх. 1) и C (половина, исх. 2), с подстановкой PR₀ = 0,3333. Базовый вклад телепортации: base = (1−0,85)/3 = 0,0500.","tt":"Яңартуны бер түбәгә тулысынча кулланабыз — B'га. Аның керүче сылтамалары — A (бөтен тавыш, чыг. 1) һәм C (яртысы, чыг. 2), һәр PR₀ = 0,3333 куелган. Телепорт-идәне: base = (1−0,85)/3 = 0,0500."},"s2":{"en":"PR₁(B) = 0.0500 + 0.85·(0.3333/1 + 0.3333/2) = 0.0500 + 0.85·0.5000 = 0.0500 + 0.4250 = 0.4750. After one pass B already jumps to 0.475 — its two in-links pour in. The bars move.","ru":"PR₁(B) = 0,0500 + 0,85·(0,3333/1 + 0,3333/2) = 0,0500 + 0,85·0,5000 = 0,0500 + 0,4250 = 0,4750. После одного прохода B уже подскакивает до 0,475 — две входящие вливаются. Столбики движутся.","tt":"PR₁(B) = 0,0500 + 0,85·(0,3333/1 + 0,3333/2) = 0,0500 + 0,85·0,5000 = 0,0500 + 0,4250 = 0,4750. Бер үтештән соң B инде 0,475'кә сикерә — аның ике керүче сылтамасы коела. Баганалар хәрәкәтләнә."},"s3":{"en":"Repeat the same update for every node, every pass. The vector oscillates with shrinking amplitude — after four iterations it reads (0.1993, 0.4058, 0.3949), already close to where it lands.","ru":"Повторяй то же обновление для каждой вершины, каждый проход. Вектор колеблется с убывающей амплитудой — после четырёх итераций он равен (0,1993, 0,4058, 0,3949), уже близко к финалу.","tt":"Шул ук яңартуны һәр түбә өчен, һәр үтештә кабатла. Вектор кими барган амплитуда белән тирбәлә — дүрт итерациядән соң ул (0,1993, 0,4058, 0,3949) тигез, инде финалга якын."},"s4":{"en":"After 25 iterations the numbers stop moving: PR = (0.2148, 0.3974, 0.3878). B holds the largest share because two pages — A and C — vote for it, while A and C each have only one in-link.","ru":"После 25 итераций числа замирают: PR = (0,2148, 0,3974, 0,3878). B держит наибольшую долю, потому что за неё голосуют две страницы — A и C, тогда как у A и C по одной входящей ссылке.","tt":"25 итерациядән соң саннар туктый: PR = (0,2148, 0,3974, 0,3878). B иң зур өлешне тота, чөнки аның өчен ике бит — A һәм C — тавыш бирә, ә A һәм C'ның һәрберсенең бер генә керүче сылтамасы бар."},"s5":{"en":"The ranking is B 0.3974 > C 0.3878 > A 0.2148 — the link graph, not the text, decides. PageRank is a query-independent signal: computed once, about the page itself, before anyone searches anything.","ru":"Ранжирование: B 0,3974 > C 0,3878 > A 0,2148 — решает граф ссылок, а не текст. PageRank — независимый от запроса сигнал: вычислен один раз, о самой странице, до того как кто-то что-то ищет.","tt":"Ранжлау: B 0,3974 > C 0,3878 > A 0,2148 — текст түгел, сылтамалар графы хәл итә. PageRank — сораудан бәйсез сигнал: бер тапкыр исәпләнгән, биткә үзенә кагылышлы, кемдер берәр нәрсә эзләгәнгә кадәр."}},"title":{"en":"PageRank power iteration","ru":"PageRank: степенной метод","tt":"PageRank: дәрәҗә методы"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"},{"step":5,"labelKey":"s5"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
