cision@k, MRR, MAP and nDCG.","ru":"Список из 8 результатов в порядке BM25 с отметками релевантности и метрики ранжирования: Recall@k, Precision@k, MRR, MAP и nDCG.","tt":"BM25 буенча ранжланган 8 нәтиҗәдән исемлек, релевантлык билгеләре белән, һәм ранжлау метрикалары: Recall@k, Precision@k, MRR, MAP һәм nDCG."},"listTitle":{"en":"BM25 ranking","ru":"Ранжирование BM25","tt":"BM25 ранжлавы"},"rpTitle":{"en":"Recall@k  &  Precision@k","ru":"Recall@k  и  Precision@k","tt":"Recall@k  һәм  Precision@k"},"recall":{"en":"Recall@k","ru":"Recall@k","tt":"Recall@k"},"precision":{"en":"Precision@k","ru":"Precision@k","tt":"Precision@k"},"idealLabel":{"en":"ideal order","ru":"идеальный порядок","tt":"идеаль тәртип"},"s0":{"en":"8 results ranked by BM25; ✓ = relevant (same category as the query). The ✓/✗ pattern down the list is what every metric below tries to summarise in a single number.","ru":"8 результатов в порядке BM25; ✓ = релевантный (та же категория, что и запрос). Узор ✓/✗ по списку — это то, что каждая метрика ниже пытается выразить одним числом.","tt":"BM25 буенча ранжланган 8 нәтиҗә; ✓ = релевант (сорау белән бер үк категория). Исемлек буенча ✓/✗ үрнәге — астагы һәр метрика моны бер сан белән гомумиләштерергә тырыша."},"s1":{"en":"Cut the list at depth k. Recall@k = how many relevant docs you caught; Precision@k = what fraction of the top-k are relevant. Both depend on where you cut.","ru":"Обрежем список на глубине k. Recall@k — сколько релевантных документов поймали; Precision@k — какая доля топ-k релевантна. Обе зависят от того, где обрезать.","tt":"Исемлекне k тирәнлегендә кис. Recall@k — ничә релевант документ эләктердең; Precision@k — топ-k'ның нинди өлеше релевант. Икесе дә кайда кисүеңә бәйле."},"s2":{"en":"MRR cares only about the first relevant result: reciprocal rank RR = 1/rank. Averaged over many queries it rewards getting one good answer to the very top fast.","ru":"MRR смотрит только на первый релевантный результат: обратный ранг RR = 1/ранг. Усреднённый по многим запросам, он награждает за быстрый вывод одного хорошего ответа наверх.","tt":"MRR бары тик беренче релевант нәтиҗәгә генә карый: кире ранг RR = 1/ранг. Күп сораулар буенча уртачаланганда ул бер яхшы җавапны өскә тиз чыгаруны бүләкли."},"s3":{"en":"MAP averages the precision measured at each relevant position, so every relevant doc — not just the first — pulls its weight. One query here, so MAP = AP.","ru":"MAP усредняет точность, измеренную в каждой релевантной позиции, поэтому вклад вносит каждый релевантный документ, а не только первый. Здесь один запрос, поэтому MAP = AP.","tt":"MAP һәр релевант позициядә үлчәнгән төгәллекне уртачалый, шуңа күрә бары тик беренчесе генә түгел, һәр релевант документ үз өлешен кертә. Биредә бер сорау, шуңа күрә MAP = AP."},"s4":{"en":"nDCG discounts each relevant doc's gain by position (1/log₂(rank+1)) — the contribution column. Sum those discounted gains to get DCG = 0.6309 + 0.4307 + 0.3562 + 0.3155 = 1.7333, then divide by IDCG = 2.5616 (the ideal order, all four hits on top). nDCG = 1.7333 / 2.5616 = 0.6766 — one number in [0,1].","ru":"nDCG дисконтирует вклад каждого релевантного документа по позиции (1/log₂(ранг+1)) — столбец вклада. Просуммируй эти дисконтированные вклады: DCG = 0,6309 + 0,4307 + 0,3562 + 0,3155 = 1,7333, затем подели на IDCG = 2,5616 (идеальный порядок, все четыре попадания наверху). nDCG = 1,7333 / 2,5616 = 0,6766 — одно число в [0,1].","tt":"nDCG һәр релевант документның файдасын позиция буенча дисконтлый (1/log₂(ранг+1)) — өлеш баганасы. Бу дисконтланган файдаларны куш: DCG = 0,6309 + 0,4307 + 0,3562 + 0,3155 = 1,7333, аннары IDCG = 2,5616-га бүл (идеаль тәртип, дүрт туры килү дә өстә). nDCG = 1,7333 / 2,5616 = 0,6766 — [0,1] эчендәге бер сан."},"mrrHint":{"en":"first relevant result;","ru":"первый релевантный результат;","tt":"беренче релевант нәтиҗә;"},"mrrHintB":{"en":"MRR averages 1/rank over many queries","ru":"MRR усредняет 1/ранг по многим запросам","tt":"MRR күп сорау буенча 1/ранглны уртачалый"},"mapHintLead":{"en":"mean of precision at each relevant rank:","ru":"среднее точности по релевантным рангам:","tt":"һәр релевант рангтагы төгәллекнең уртачасы:"},"mapHintOver":{"en":"over","ru":"делить на","tt":"бүлеп"}},"title":{"en":"Ranking metrics","ru":"Метрики ранжирования"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
