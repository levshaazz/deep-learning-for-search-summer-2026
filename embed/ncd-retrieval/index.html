</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>Retrieval as a neural circuit diagram: count the encoder boxes</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="2" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>2</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"ncd-retrieval","mountName":"mountNcdRetrieval","maxStep":2,"data":{"_doc":"CITED published baselines — NOT computed in this repo. Use verbatim with the source string.","_source":"_research/gen_l3.py · 20 Newsgroups (sci.space, rec.sport.hockey), 8 shortest docs, deterministic (constants quoted from the cited papers below)","cited":true,"msmarco":{"metric":"MRR@10","split":"MS MARCO passage dev","BM25":0.187,"denseANCE":0.33,"ColBERT":0.36,"source":"Nguyen et al. 2016 (MS MARCO); BM25 ≈0.187 MRR@10 (official Anserini/pyserini); ANCE single-vector MS MARCO passage dev MRR@10=0.330 (RocketQA, Qu et al. 2021, Table 2, https://aclanthology.org/2021.naacl-main.466.pdf); DPR is not evaluated on MS MARCO in that table; ColBERT Khattab & Zaharia 2020"},"beir":{"metric":"nDCG@10","split":"BEIR avg (18 datasets, zero-shot)","BM25":0.43,"denseDPR":0.23,"ColBERTv2":0.5,"source":"Thakur et al. 2021 (BEIR), avg nDCG@10 over 18 zero-shot datasets: BM25 ≈0.43; original DPR (Karpukhin 2020 NQ checkpoint) only ≈0.23 (−47.7% vs BM25, the worst generalization in the paper); ColBERTv2 (Santhanam et al. 2022) ≈0.50 over its 13 reported BEIR sets"}},"dataSets":{"l3-benchmarks":{"_doc":"CITED published baselines — NOT computed in this repo. Use verbatim with the source string.","_source":"_research/gen_l3.py · 20 Newsgroups (sci.space, rec.sport.hockey), 8 shortest docs, deterministic (constants quoted from the cited papers below)","cited":true,"msmarco":{"metric":"MRR@10","split":"MS MARCO passage dev","BM25":0.187,"denseANCE":0.33,"ColBERT":0.36,"source":"Nguyen et al. 2016 (MS MARCO); BM25 ≈0.187 MRR@10 (official Anserini/pyserini); ANCE single-vector MS MARCO passage dev MRR@10=0.330 (RocketQA, Qu et al. 2021, Table 2, https://aclanthology.org/2021.naacl-main.466.pdf); DPR is not evaluated on MS MARCO in that table; ColBERT Khattab & Zaharia 2020"},"beir":{"metric":"nDCG@10","split":"BEIR avg (18 datasets, zero-shot)","BM25":0.43,"denseDPR":0.23,"ColBERTv2":0.5,"source":"Thakur et al. 2021 (BEIR), avg nDCG@10 over 18 zero-shot datasets: BM25 ≈0.43; original DPR (Karpukhin 2020 NQ checkpoint) only ≈0.23 (−47.7% vs BM25, the worst generalization in the paper); ColBERTv2 (Santhanam et al. 2022) ≈0.50 over its 13 reported BEIR sets"}}},"i18n":{"_doc":"ncd-retrieval — CONCRETE redesign. A toy corpus of 4 documents is scored against one query; the three retrievers differ in WHAT runs per document (the corpus axis N). Step 0 = bi-encoder, 1 = cross-encoder, 2 = ColBERT. Bar lengths are illustrative (structural), not grounded numbers.","alt":{"en":"A query scored against a toy corpus of four documents, drawn as a neural circuit diagram. The corpus is the broadcast axis N; each retriever runs a different operation per document. Bi-encoder: each document card carries a row of grey pre-encoded vector cells, so only a cheap dot product runs per document (one encoder pass, for the query). Cross-encoder: the grey vectors are gone — an empty dashed slot sits where the cached vector would be, because a full encoder must run on query+document for every document (N passes), reading both together. ColBERT: the grey vectors return as a grid, one per document token, and a token-level MaxSim runs per document. Score bars rank the documents; top-k are highlighted.","ru":"Запрос оценивается против игрушечного корпуса из четырёх документов, нарисовано как neural circuit diagram. Корпус — это broadcast-ось N; каждый ретривер выполняет свою операцию на документ. Bi-encoder: на карточке каждого документа лежит ряд серых предвычисленных ячеек вектора, поэтому на документ идёт лишь дешёвое скалярное произведение (один прогон кодировщика — для запроса). Cross-encoder: серые векторы исчезли — там, где лежал бы кэшированный вектор, остался пустой пунктирный слот, потому что полный кодировщик обязан прогоняться на запрос+документ для каждого документа (N прогонов), читая их вместе. ColBERT: серые векторы возвращаются сеткой, по одному на токен документа, и на документ идёт токенный MaxSim. Полоски-оценки ранжируют документы; top-k подсвечены.","tt":"Сорау дүрт документтан торган уенчык корпуска каршы бәяләнә, neural circuit diagram буларак. Корпус — broadcast күчәре N; һәр ретривер документка үз операциясен башкара. Bi-encoder: һәр документ карточкасында соры алдан кодланган вектор күзәнәкләре рәте ята, шуңа документка бары арзан скаляр тапкырчык бара (бер кодлаучы үтеше — сорау өчен). Cross-encoder: соры векторлар юкка чыккан — кэшланган вектор яткан урында буш пунктир слот калган, чөнки тулы кодлаучы һәр документ өчен сорау+документ өстендә эшләргә тиеш (N үтеш), икесен бергә укып. ColBERT: соры векторлар челтәр булып кайта, документның һәр токенына берәү, һәм документка токен MaxSim бара. Бәя-таякчыклар документларны ранглый; top-k яктыртылган."},"legMap":{"en":"document card · operation run per document · score bar · top-k ✓","ru":"карточка документа · операция на документ · полоска-оценка · top-k ✓","tt":"документ карточкасы · документка операция · бәя-таякчык · top-k ✓"},"query":{"en":"neural nets for search","ru":"нейросети для поиска","tt":"эзләү өчен нейросетьләр"},"lblQuery":{"en":"query","ru":"запрос","tt":"сорау"},"lblCorpus":{"en":"N · corpus (4 docs)","ru":"N · корпус (4 док.)","tt":"N · корпус (4 док.)"},"lblScore":{"en":"score","ru":"оценка","tt":"бәя"},"lblTopk":{"en":"top-k","ru":"top-k","tt":"top-k"},"lblPre":{"en":"pre-encoded","ru":"предвыч.","tt":"алдан код."},"noPre":{"en":"nothing to pre-compute","ru":"предвычислить нечего","tt":"алдан исәпләргә бернәрсә юк"},"opBi":{"en":"q · dᵢ","ru":"q · dᵢ","tt":"q · dᵢ"},"opCol":{"en":"MaxSim","ru":"MaxSim","tt":"MaxSim"},"doc1":{"en":"Dense retrieval · DPR","ru":"Плотный поиск · DPR","tt":"Тыгыз эзләү · DPR"},"doc2":{"en":"Borscht recipe","ru":"Рецепт борща","tt":"Борщ рецепты"},"doc3":{"en":"Inverted index","ru":"Инвертированный индекс","tt":"Инвертлы индекс"},"doc4":{"en":"ColBERT · late interaction","ru":"ColBERT · late interaction","tt":"ColBERT · late interaction"},"tagBi":{"en":"N: cheap dot per doc","ru":"N: дешёвый dot на документ","tt":"N: документка арзан dot"},"tagCross":{"en":"N: a FULL encoder per doc","ru":"N: ПОЛНЫЙ кодировщик на документ","tt":"N: документка ТУЛЫ кодлаучы"},"tagCol":{"en":"N: token MaxSim per doc","ru":"N: токенный MaxSim на документ","tt":"N: документка токен MaxSim"},"costBi":{"en":"1 encoder pass / query","ru":"1 прогон кодировщика / запрос","tt":"1 кодлаучы үтеше / сорау"},"costCross":{"en":"N encoder passes / query","ru":"N прогонов кодировщика / запрос","tt":"N кодлаучы үтеше / сорау"},"costCol":{"en":"1 encode + N cheap MaxSim","ru":"1 кодирование + N дешёвых MaxSim","tt":"1 кодлау + N арзан MaxSim"},"s0":{"en":"Bi-encoder. The encoder runs ONCE — on the query — turning it into a vector (the cyan cells, top right). Every document was already encoded offline: that is the row of grey cells sitting on each document card, marked “pre-encoded”. Nothing in the corpus is computed at query time, so per document only a cheap dot product q·dᵢ runs inside the corpus axis N. Count the encoder boxes: just one. The gold docs (DPR, ColBERT) top the ranking; the borscht recipe sinks. This is why bi-encoders scale to billions of documents.","ru":"Bi-encoder. Кодировщик работает ОДИН раз — на запросе — превращая его в вектор (голубые ячейки справа вверху). Каждый документ уже закодирован офлайн: это ряд серых ячеек на карточке каждого документа, с пометкой «предвыч.». В момент запроса в корпусе не считается ничего, поэтому на документ внутри оси корпуса N идёт лишь дешёвое скалярное произведение q·dᵢ. Посчитай прямоугольники кодировщика: он один. Релевантные (DPR, ColBERT) поднимаются вверх, рецепт борща тонет. Поэтому bi-encoder масштабируется на миллиарды документов.","tt":"Bi-encoder. Кодлаучы БЕР тапкыр эшли — сорау өстендә — аны векторга әйләндерә (уң өстә зәңгәр күзәнәкләр). Һәр документ инде офлайн кодланган: бу — һәр документ карточкасындагы соры күзәнәкләр рәте, «алдан код.» билгесе белән. Сорау вакытында корпуста бернәрсә исәпләнми, шуңа документка N күчәре эчендә бары арзан q·dᵢ бара. Кодлаучы турыпочмакларын санагыз: бары бер. Релевантлар (DPR, ColBERT) өскә күтәрелә, борщ рецепты бата. Шуңа bi-encoder миллиард документка масштаблана."},"s1":{"en":"Cross-encoder. Look at what DISAPPEARED: the grey vectors are gone from every card, and there is no query vector either — only an empty dashed slot where the cached vector used to be. That absence is the whole design. A cross-encoder reads query and document TOGETHER, so the document half cannot be encoded before the query arrives; there is nothing to precompute. Instead a FULL encoder runs on query＋documentᵢ for EVERY document. Count the encoder boxes: one per row, N of them. The ranking is sharper (a bigger gap between gold and the recipe) — but at N encoder passes per query it cannot touch a large corpus. The accuracy⇄cost trade-off is the number of orange boxes, and the price of those boxes is the empty slots.","ru":"Cross-encoder. Смотри, что ИСЧЕЗЛО: серые векторы пропали со всех карточек, и вектора запроса тоже нет — остался лишь пустой пунктирный слот там, где лежал кэшированный вектор. Это отсутствие и есть вся суть. Cross-encoder читает запрос и документ ВМЕСТЕ, поэтому документную половину нельзя закодировать до прихода запроса; предвычислять нечего. Вместо этого ПОЛНЫЙ кодировщик прогоняется на запрос＋документᵢ для КАЖДОГО документа. Посчитай прямоугольники: по одному на строку, всего N. Ранжирование резче (больше разрыв между релевантным и рецептом) — но при N прогонах на запрос большой корпус недостижим. Компромисс точность⇄стоимость — это число оранжевых прямоугольников, а цена за них — пустые слоты.","tt":"Cross-encoder. Нәрсә ЮККА ЧЫККАНЫН карагыз: соры векторлар барлык карточкалардан да киткән, сорау векторы да юк — кэшланган вектор яткан урында буш пунктир слот кына калган. Менә шул юклык — бөтен мәгънә. Cross-encoder сорауны һәм документны БЕРГӘ укый, шуңа документ ягын сорау килгәнче кодлап булмый; алдан исәпләргә бернәрсә юк. Аның урынына ТУЛЫ кодлаучы ҺӘР документ өчен сорау＋документᵢ өстендә эшли. Турыпочмакларны санагыз: һәр юлга берәү, барлыгы N. Ранглау кискенрәк — әмма сорауга N үтеш белән зур корпус мөмкин түгел. Төгәллек⇄бәя компромиссы — кызгылт турыпочмаклар саны, ә аларның бәясе — буш слотлар."},"s2":{"en":"ColBERT — late interaction, the middle ground. The vectors are BACK, and they multiplied: each document card now carries a GRID of grey cells, not a row — one pre-encoded vector per document TOKEN — and the query is encoded once into a grid of token vectors too. That is what “late interaction” looks like: nothing is contracted into a single vector before the query meets the document. Per document, only a cheap MaxSim runs inside N — match each query token to its best document token, then sum. One encoder box (like the bi-encoder), yet the ranking is nearly as sharp as the cross-encoder. You pay for it in storage: a vector per token, not per document.","ru":"ColBERT — позднее взаимодействие, золотая середина. Векторы ВЕРНУЛИСЬ — и размножились: на карточке каждого документа теперь не ряд, а СЕТКА серых ячеек — по одному предвычисленному вектору на каждый ТОКЕН документа, — и запрос тоже кодируется один раз в сетку токен-векторов. Вот как выглядит «позднее взаимодействие»: ничего не стягивается в один вектор до того, как запрос встретится с документом. На документ внутри N идёт лишь дешёвый MaxSim — сопоставить каждый токен запроса лучшему токену документа, затем сумма. Один прямоугольник кодировщика (как у bi-encoder), но ранжирование почти такое же резкое, как у cross-encoder. Платишь ты за это хранением: вектор на токен, а не на документ.","tt":"ColBERT — соңгы интеракция, урта юл. Векторлар КАЙТТЫ — һәм күбәйде: һәр документ карточкасында хәзер рәт түгел, ә соры күзәнәкләр ЧЕЛТӘРЕ — документның һәр ТОКЕНЫНА бер алдан кодланган вектор, — сорау да бер тапкыр токен-векторлар челтәренә кодлана. «Соңгы интеракция» әнә шулай күренә: сорау документ белән очрашканчы бернәрсә дә бер векторга җыелмый. Документка N эчендә бары арзан MaxSim бара — һәр сорау токенын иң яхшы документ токенына туры китерү, аннары сумма. Бер кодлаучы турыпочмагы (bi-encoder кебек), әмма ранглау cross-encoder кебек үк кискен диярлек. Моның бәясе — саклау: документка түгел, токенга бер вектор."},"lgTitle":{"en":"cost & quality","ru":"стоимость и качество","tt":"бәя һәм сыйфат"},"lgEnc":{"en":"encoder / query","ru":"кодировщик / запрос","tt":"кодлаучы / сорау"},"lgPre":{"en":"precomputable","ru":"предпосчёт","tt":"алдан исәпләү"},"lgPer":{"en":"per document","ru":"на документ","tt":"документка"},"lgPerBi":{"en":"q·dᵢ","ru":"q·dᵢ","tt":"q·dᵢ"},"lgPerCross":{"en":"full BERT","ru":"полный BERT","tt":"тулы BERT"},"lgPreTok":{"en":"per token","ru":"по токенам","tt":"токеннар буенча"},"lgYes":{"en":"yes","ru":"да","tt":"әйе"},"lgNo":{"en":"no","ru":"нет","tt":"юк"},"lgMrr":{"en":"MRR@10 · MS MARCO","ru":"MRR@10 · MS MARCO","tt":"MRR@10 · MS MARCO"},"lgN0":{"en":"One encoder pass, on the query. The document vectors were computed offline, so nothing in the corpus is touched at query time — this is why a bi-encoder scales to billions. 0.33 (ANCE, RocketQA Table 2) against BM25’s 0.187.","ru":"Один прогон кодировщика — на запросе. Векторы документов посчитаны офлайн, поэтому в момент запроса корпус вообще не трогают — вот почему bi-encoder масштабируется на миллиарды. 0,33 (ANCE, RocketQA Table 2) против 0,187 у BM25.","tt":"Бер кодлаучы үтеше — сорауда. Документ векторлары офлайн исәпләнгән, сорау вакытында корпуска кагылмыйлар — bi-encoder шуңа миллиард документка масштаблана. BM25 ның 0.187 енә каршы 0.33 (ANCE, RocketQA Table 2)."},"lgN1":{"en":"Count the encoder boxes: there are N. The encoder reads query and document TOGETHER, so there is nothing to precompute. Best quality — and on a million-document corpus, a million BERT passes per query. That is why it only ever runs as a reranker.","ru":"Посчитай прямоугольники кодировщика: их N. Кодировщик читает запрос и документ ВМЕСТЕ, поэтому предпосчитать нечего. Качество лучшее — и при корпусе в миллион — это миллион прогонов BERT на каждый запрос. Поэтому он живёт только в реранке.","tt":"Кодлаучы турыпочмакларын санагыз: алар N. Кодлаучы сорауны һәм документны БЕРГӘ укый, шуңа алдан исәпләргә бернәрсә юк. Сыйфат иң яхшысы — ә миллион документлы корпуста бу һәр сорауга миллион BERT үтеше. Шуңа ул реранкта гына яши."},"lgN2":{"en":"One pass on the query, like the bi-encoder — but the contraction is LATE: MaxSim compares token to token. You pay in storage (a vector per document token) and you get 0.36, above the single-vector dense retriever’s 0.33.","ru":"Один прогон на запрос, как у bi-encoder — но стягивание ПОЗДНЕЕ: MaxSim сравнивает токен с токеном. Платишь хранением (вектор на каждый токен документа), получаешь 0,36 — выше одновекторного плотного (0,33).","tt":"Сорауга бер үтеш, bi-encoder кебек — ләкин җыю СОҢГА кала: MaxSim токенны токен белән чагыштыра. Саклауда түлисез (документның һәр токенына вектор), 0.36 аласыз — бер-векторлы тыгыз ретриверның 0.33 еннән югарырак."}},"title":{"en":"Retrieval as a neural circuit diagram: count the encoder boxes","ru":"Поиск как neural circuit diagram: посчитайте прямоугольники кодировщика","tt":"Эзләү neural circuit diagram буларак: кодлаучы турыпочмакларын санагыз"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
