al lengths, the dyadic pair) come from data/l17-entropy.json → huffman.nonDyadic + source4 — never from this file. RU follows narrative/style-ru.md: «ты», decimal comma, ё, «ёлочки».","alt":{"en":"Five letters merged pairwise into a Huffman tree: the queue on the left hands its two smallest nodes to a parent, the tree grows edge by edge with 0/1 bits, and two bars at the bottom compare the entropy floor H with the average code length the finished code actually pays.","ru":"Пять букв попарно сливаются в дерево Хаффмана: очередь слева отдаёт два самых лёгких узла родителю, дерево растёт ребро за ребром с битами 0/1, а две полосы внизу сравнивают пол энтропии H со средней длиной кода, которую платит готовый код.","tt":"Биш хәреф парлап Хаффман агачына кушыла: сулдагы чират ике иң җиңел төенне ата-төенгә бирә, агач 0/1 битлары белән кабырга артыннан кабырга үсә, ә аста ике баганача H энтропия идәнен әзер код түли торган урталаштырылган озынлык белән чагыштыра."},"head":{"en":"build the Huffman tree — and read the bill off it","ru":"построй дерево Хаффмана — и прочитай по нему счёт","tt":"Хаффман агачын төз — һәм аның буенча хисапны укы"},"queueHead":{"en":"queue — lightest first","ru":"очередь: сначала лёгкие","tt":"чират: башта җиңелләр"},"treeHead":{"en":"the tree — root at the top","ru":"дерево — корень сверху","tt":"агач — тамыры өстә"},"codeHead":{"en":"read the codewords off the edges (left 0, right 1)","ru":"читай кодовые слова по рёбрам (влево 0, вправо 1)","tt":"код сүзләрен кабыргалар буенча укы (сулга 0, уңга 1)"},"tableHead":{"en":"should pay vs actually pays","ru":"сколько должна — сколько платит","tt":"күпме тиеш — күпме түли"},"colSym":{"en":"sym","ru":"симв.","tt":"симв."},"colP":{"en":"p","ru":"p","tt":"p"},"colIdeal":{"en":"−log₂ p","ru":"−log₂ p","tt":"−log₂ p"},"colLen":{"en":"len","ru":"длина","tt":"озынлык"},"unitBits":{"en":"bits","ru":"бита","tt":"бит"},"gapLabel":{"en":"L̄ − H","ru":"L̄ − H","tt":"L̄ − H"},"partialLabel":{"en":"Σ p(parents) so far","ru":"Σ p(родителей) пока","tt":"Σ p(ата-төеннәр) хәзергә"},"dyadHead":{"en":"a dyadic source (½, ¼, ⅛, ⅛): the same construction pays exactly H","ru":"диадический источник (½, ¼, ⅛, ⅛): та же сборка платит ровно H","tt":"диадик чыганак (½, ¼, ⅛, ⅛): шул ук җыелма төгәл H түли"},"s0":{"en":"Five letters, five leaves, sorted by probability: I 0.08, O 0.12, A 0.20, T 0.25, E 0.35. The red rule on the floor is the entropy H = 2.1531 bits — no prefix code may pay less than that. Nothing has been merged yet.","ru":"Пять букв — пять листьев, отсортированных по вероятности: I 0,08, O 0,12, A 0,20, T 0,25, E 0,35. Красная черта на полу — энтропия H = 2,1531 бита: дешевле неё не заплатит ни один префиксный код. Пока ничего не слито.","tt":"Биш хәреф — биш яфрак, ихтималлык буенча тезелгән: I 0,08, O 0,12, A 0,20, T 0,25, E 0,35. Идәндәге кызыл сызык — энтропия H = 2,1531 бит: аннан арзанга бер префиксле код та түләми. Әле бернәрсә кушылмаган."},"s1":{"en":"Take the two lightest nodes — I 0.08 and O 0.12 — and hang them under one parent worth 0.20. The rarest letters go deepest, which is the whole idea: a long code for the rare letter, a short one for the common.","ru":"Берём два самых лёгких узла — I 0,08 и O 0,12 — и вешаем их под общего родителя весом 0,20. Самые редкие буквы уходят глубже всех, и в этом вся идея: длинный код редкому, короткий — частому.","tt":"Ике иң җиңел төенне — I 0,08 һәм O 0,12 — алабыз һәм аларны 0,20 авырлыктагы уртак ата-төен астына элмәкли. Иң сирәк хәрефләр иң тирәнгә китә, бөтен идея шунда: сиреккә озын код, ешка — кыска."},"s2":{"en":"The parent goes back into the queue as an ordinary node — that is the whole algorithm. Now the two lightest are A 0.20 and the fresh node 0.20; they merge into 0.40.","ru":"Родитель возвращается в очередь обычным узлом — в этом весь алгоритм. Теперь два самых лёгких — это A 0,20 и свежий узел 0,20; они сливаются в 0,40.","tt":"Ата-төен чиратка гади төен буларак кире кайта — бөтен алгоритм шунда. Хәзер ике иң җиңеле — A 0,20 һәм яңа төен 0,20; алар 0,40 булып кушыла."},"s3":{"en":"Two merges close the tree: T 0.25 with E 0.35 gives 0.60, and the last pair 0.40 + 0.60 gives the root 1.00. Now walk down from the root writing 0 to the left and 1 to the right — E 11, T 10, A 00, O 011, I 010.","ru":"Два слияния закрывают дерево: T 0,25 с E 0,35 дают 0,60, а последняя пара 0,40 + 0,60 даёт корень 1,00. Теперь иди вниз от корня и пиши 0 влево, 1 вправо — E 11, T 10, A 00, O 011, I 010.","tt":"Ике кушылу агачны яба: T 0,25 белән E 0,35 — 0,60, ә соңгы пар 0,40 + 0,60 тамырны 1,00 бирә. Хәзер тамырдан аска төш һәм сулга 0, уңга 1 яз — E 11, T 10, A 00, O 011, I 010."},"s4":{"en":"The bill: L̄ = 2.2000 bits against H = 2.1531 — a gap of 0.0469 bit, 2.2 %. Look at the table for why: E should pay 1.5146 bits and an integer code can only pay 2. Where the probabilities are dyadic (½, ¼, ⅛, ⅛) the ideal lengths are already whole numbers, so there is nothing to round up and L̄ = H = 1.75 exactly.","ru":"Счёт: L̄ = 2,2000 бита против H = 2,1531 — разрыв 0,0469 бита, то есть 2,2 %. Смотри в таблицу, почему: E должна платить 1,5146 бита, а целочисленный код умеет платить только 2. Там, где вероятности диадические (½, ¼, ⅛, ⅛), идеальные длины уже целые — округлять вверх нечего, и L̄ = H = 1,75 ровно.","tt":"Хисап: L̄ = 2,2000 бит, ә H = 2,1531 — аерма 0,0469 бит, ягъни 2,2 %. Ни өчен икәнен таблицадан кара: E 1,5146 бит түләргә тиеш, ә бөтен санлы код бары 2 генә түли ала. Ихтималлыклар диадик булганда (½, ¼, ⅛, ⅛), идеаль озынлыклар инде бөтен сан — түгәрәкләргә бернәрсә юк, һәм L̄ = H = 1,75 төгәл."}},"title":{"en":"Build the Huffman tree","ru":"Построй дерево Хаффмана","tt":"Хаффман агачын төз"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
