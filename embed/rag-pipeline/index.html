ved":[{"id":"doc_cardiac_cycle","score":0.82,"chunk":"The cardiac cycle alternates systole and diastole; ventricular contraction ejects blood."},{"id":"doc_circulatory","score":0.79,"chunk":"The circulatory system moves blood through arteries and veins to the body's tissues."},{"id":"doc_valves","score":0.71,"chunk":"Heart valves keep blood flowing one way between the atria and ventricles."},{"id":"doc_anatomy","score":0.65,"chunk":"The heart has four chambers: two atria and two ventricles."}],"prompt":"System: Answer using ONLY the context. Context: [4 chunks]. Question: How does the heart pump blood?","answer":"The heart pumps blood through the cardiac cycle: during systole the ventricles contract and eject blood, while valves keep it flowing one way [doc_cardiac_cycle, doc_valves]."},"retrievalMath":{"dims":["pump/contraction","anatomy/structure","flow/vessels","valves/one-way"],"query":[3,2,1,1],"normQuery":3.873,"docs":[{"id":"doc_cardiac_cycle","vec":[1,2,1,2],"dot":10,"normDoc":3.1623,"cos4":0.8165,"cos":0.82},{"id":"doc_circulatory","vec":[1,2,2,2],"dot":11,"normDoc":3.6056,"cos4":0.7877,"cos":0.79},{"id":"doc_valves","vec":[1,5,0,2],"dot":15,"normDoc":5.4772,"cos4":0.7071,"cos":0.71}],"formula":"cos = dot(q,d) / (‖q‖·‖d‖)","note":"2-dp cos reproduces trace.retrieved scores 0.82/0.79/0.71 — recomputed from raw vectors, never hand-picked."},"offline":[{"id":"ingest"},{"id":"chunk"},{"id":"embed"},{"id":"index"}],"online":[{"id":"qembed"},{"id":"retrieve"},{"id":"rerank"},{"id":"assemble"},{"id":"generate"}]},"dataSets":{"l7-rag":{"_doc":"TOY RAG / full-search pipeline for the rag-pipeline widget. phase 'offline' = build-time (amortized once over the corpus); phase 'online' = query-time (the per-query latency budget). The retrieve→rerank pair is the neural cascade; generate carries grounding/citations.","_source":"_research/gen_l7.py (toy, stdlib)","offline":[{"id":"ingest"},{"id":"chunk"},{"id":"embed"},{"id":"index"}],"online":[{"id":"qembed"},{"id":"retrieve"},{"id":"rerank"},{"id":"assemble"},{"id":"generate"}]},"l10-rag":{"_doc":"RAG anchor trace + token budget. Toy (exact, stdlib): context 4096; system 200 + query 30 + k·256-token chunks, reserving 512 for the answer. At k=4 → stuffed 1024, prompt 1254, headroom 2842. kMax = floor((4096−200−30−512)/256) = floor(3354/256) = 13 — the window caps how much you can retrieve (why ranking matters). ONE canonical end-to-end trace is the lecture's recurring anchor figure (the rag-pipeline widget recurs with one stage in focus on 5 beats). climb-chunking and climb-queryrewrite reference this same running example. Real = frozen retrieve→generate trace, spliced by _research/gen_l10_real.py.","_source":"_research/gen_l10.py (toy, stdlib) + gen_l10_real.py (real retrieve→generate, /usr/bin/python3)","contextWindow":4096,"systemTokens":200,"queryTokens":30,"answerReserve":512,"chunkTokens":256,"stages":["chunk","embed","retrieve","stuff","generate"],"worked":{"k":4,"stuffed":1024,"promptTotal":1254,"headroom":2842},"kMax":13,"trace":{"query":"How does the heart pump blood?","retrieved":[{"id":"doc_cardiac_cycle","score":0.82,"chunk":"The cardiac cycle alternates systole and diastole; ventricular contraction ejects blood."},{"id":"doc_circulatory","score":0.79,"chunk":"The circulatory system moves blood through arteries and veins to the body's tissues."},{"id":"doc_valves","score":0.71,"chunk":"Heart valves keep blood flowing one way between the atria and ventricles."},{"id":"doc_anatomy","score":0.65,"chunk":"The heart has four chambers: two atria and two ventricles."}],"prompt":"System: Answer using ONLY the context. Context: [4 chunks]. Question: How does the heart pump blood?","answer":"The heart pumps blood through the cardiac cycle: during systole the ventricles contract and eject blood, while valves keep it flowing one way [doc_cardiac_cycle, doc_valves]."},"retrievalMath":{"dims":["pump/contraction","anatomy/structure","flow/vessels","valves/one-way"],"query":[3,2,1,1],"normQuery":3.873,"docs":[{"id":"doc_cardiac_cycle","vec":[1,2,1,2],"dot":10,"normDoc":3.1623,"cos4":0.8165,"cos":0.82},{"id":"doc_circulatory","vec":[1,2,2,2],"dot":11,"normDoc":3.6056,"cos4":0.7877,"cos":0.79},{"id":"doc_valves","vec":[1,5,0,2],"dot":15,"normDoc":5.4772,"cos4":0.7071,"cos":0.71}],"formula":"cos = dot(q,d) / (‖q‖·‖d‖)","note":"2-dp cos reproduces trace.retrieved scores 0.82/0.79/0.71 — recomputed from raw vectors, never hand-picked."}}},"i18n":{"_doc":"Step captions + static labels for the rag-pipeline widget. EN + RU + TT. The stage list comes from data/l7-rag.json; this file only names the stages and the narration.","alt":{"en":"A left-to-right pipeline split into an offline build half (ingest, chunk, embed, index) and an online query half (retrieve, rerank, assemble, generate); the cascade is retrieve plus rerank, and the LLM produces a grounded answer with citations.","ru":"Конвейер слева направо, разделённый на офлайн-сборку (приём, нарезка, эмбеддинг, индекс) и онлайн-запрос (извлечение, переранжирование, сборка, генерация); каскад — это извлечение плюс переранжирование, а LLM выдаёт обоснованный ответ со ссылками.","tt":"Сулдан уңга пайплайн офлайн-җыюга (кабул итү, кисү, эмбеддинг, индекс) һәм онлайн-сорауга (алу, кабат ранжлау, җыю, генерация) бүленгән; каскад — алу плюс кабат ранжлау, ә LLM нигезле җавапны сылтамалар белән бирә."},"bandOffline":{"en":"OFFLINE · build-time (once)","ru":"ОФЛАЙН · сборка (один раз)","tt":"ОФЛАЙН · җыю (бер тапкыр)"},"bandOnline":{"en":"ONLINE · query-time (per request)","ru":"ОНЛАЙН · запрос (на запрос)","tt":"ОНЛАЙН · сорау (һәр сорауга)"},"query":{"en":"query","ru":"запрос","tt":"сорау"},"ingest":{"en":"ingest","ru":"приём","tt":"кабул итү"},"chunk":{"en":"chunk","ru":"нарезка","tt":"кисү"},"embed":{"en":"embed","ru":"эмбеддинг","tt":"эмбеддинг"},"index":{"en":"index","ru":"индекс","tt":"индекс"},"qembed":{"en":"embed q","ru":"эмбед q","tt":"эмбед q"},"retrieve":{"en":"retrieve","ru":"извлечь","tt":"алу"},"rerank":{"en":"rerank","ru":"реранк","tt":"реранк"},"assemble":{"en":"assemble","ru":"сборка","tt":"җыю"},"generate":{"en":"generate","ru":"генерация","tt":"генерация"},"stuff":{"en":"stuff","ru":"вставка","tt":"кушу"},"flowLabel":{"en":"retrieve → augment → generate","ru":"извлечь → дополнить → сгенерировать","tt":"алу → өстәү → генерацияләү"},"cascadeTag":{"en":"the neural cascade","ru":"нейронный каскад","tt":"нейрон каскад"},"answerTag":{"en":"→ grounded + cited","ru":"→ обоснованно + цитаты","tt":"→ нигезле + цитаталы"},"citeTag":{"en":"+ citations","ru":"+ ссылки","tt":"+ сылтамалар"},"s0":{"en":"Offline, once per corpus: ingest documents, clean and chunk them, embed every chunk with the bi-encoder, and store the vectors in an ANN index. Expensive — but amortized over every future query.","ru":"Офлайн, один раз на корпус: принять документы, очистить и нарезать, закодировать каждый кусок би-энкодером и сложить векторы в ANN-индекс. Дорого — но окупается на всех будущих запросах.","tt":"Офлайн, корпуска бер тапкыр: документларны кабул итү, чистарту һәм кисү, һәр кисәкне би-энкодер белән эмбедләү һәм векторларны ANN-индекска салу. Кыйммәт — әмма бар киләчәк сорауларга бүленә."},"s1":{"en":"At query time: embed the query, retrieve the top-k from the index (the Scouts), rerank the shortlist (the Judges), assemble the survivors into a context. This is the per-request latency budget.","ru":"На запросе: закодировать запрос, извлечь топ-k из индекса (Разведчики), переранжировать шорт-лист (Судьи), собрать выживших в контекст. Это бюджет задержки на запрос.","tt":"Сорау вакытында: сорауны эмбедләү, индекстан топ-k алу (Разведчиклар), кыска исемлекне кабат ранжлау (Судьялар), исән калганнарны контекстка җыю. Бу һәр сорауга тоткарлык бюджеты."},"s2":{"en":"The retrieve→rerank pair is exactly the neural cascade: the bi-encoder Scouts sweep wide and cheap; the cross-encoder Judges deliberate on the few. Cheap-and-wide first, dear-and-narrow last.","ru":"Пара извлечь→переранжировать — это и есть нейронный каскад: би-энкодер-Разведчики метут вширь и дёшево; кросс-энкодер-Судьи вникают в немногих. Сначала дёшево-и-широко, потом дорого-и-узко.","tt":"Алу→кабат ранжлау пары — нәкъ нейрон каскад: би-энкодер-Разведчиклар киң һәм арзан себерә; кросс-энкодер-Судьялар азларга тирәнтен карый. Башта арзан-һәм-киң, аннары кыйммәт-һәм-тар."},"s3":{"en":"For RAG, the LLM reads the reranked context and writes an answer grounded in those passages — with citations back to the sources. Retrieval quality caps answer quality: garbage in, garbage out.","ru":"Для RAG модель читает переранжированный контекст и пишет ответ, опирающийся на эти отрывки — со ссылками на источники. Качество поиска ограничивает качество ответа: мусор на входе — мусор на выходе.","tt":"RAG өчен LLM кабат ранжланган контекстны укый һәм шул өзекләргә нигезләнгән җавап яза — чыганакларга сылтамалар белән. Эзләү сыйфаты җавап сыйфатын чикли: чүп керсә — чүп чыга."}},"title":{"en":"The full pipeline (search & RAG)","ru":"Полный пайплайн (поиск и RAG)","tt":"Тулы пайплайн (эзләү һәм RAG)"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
