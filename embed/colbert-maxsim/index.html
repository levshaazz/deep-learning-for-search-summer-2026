</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>Late interaction (MaxSim)</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="3" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>3</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"colbert-maxsim","mountName":"mountColbertMaxsim","maxStep":3,"data":{"_doc":"Late interaction / ColBERT MaxSim. Toy = hand-computable token×token cosine matrices (stdlib): MaxSim = sum_i max_j cos(E_q[i], E_d[j]). docRel 2.35 > docIrr 1.30 (the lexical trap: a perfect 'bank' match alone is not enough). Real = frozen ColBERT-style token sims, spliced by _research/gen_l8_real.py.","_source":"_research/gen_l8.py (toy, stdlib) + gen_l8_real.py (ColBERT checkpoint, /usr/bin/python3)","toy":{"qTokens":["river","bank","flood"],"docRel":{"text":"the riverside plain flooded","dTokens":["the","riverside","plain","flooded"],"sim":[[0.1,0.9,0.4,0.3],[0.05,0.5,0.45,0.2],[0.08,0.35,0.25,0.95]],"rowMax":[0.9,0.5,0.95],"maxSim":2.35},"docIrr":{"text":"the bank approved a loan","dTokens":["the","bank","loan","approved"],"sim":[[0.05,0.2,0.1,0.08],[0.05,0.98,0.3,0.15],[0.05,0.12,0.1,0.08]],"rowMax":[0.2,0.98,0.12],"maxSim":1.3}},"real":{"model":"colbert-ir/colbertv2.0","dim":128,"projected":true,"normalized":true,"pair":{"query":"river bank flood","docRel":"the riverside plain flooded","docIrr":"the bank approved a loan"},"maxSimRel":3.0635,"maxSimIrr":1.7809,"note":"real ColBERT per-token embeddings: BERT last_hidden_state projected 768→128 by the checkpoint's `linear.weight`, then L2-normalized; MaxSim = sum_i max_j cos; eval()+no_grad()+manual_seed(0); committed frozen. Toy and real agree on ORDERING (maxSimRel > maxSimIrr), not magnitude."}},"dataSets":{"l8-colbert":{"_doc":"Late interaction / ColBERT MaxSim. Toy = hand-computable token×token cosine matrices (stdlib): MaxSim = sum_i max_j cos(E_q[i], E_d[j]). docRel 2.35 > docIrr 1.30 (the lexical trap: a perfect 'bank' match alone is not enough). Real = frozen ColBERT-style token sims, spliced by _research/gen_l8_real.py.","_source":"_research/gen_l8.py (toy, stdlib) + gen_l8_real.py (ColBERT checkpoint, /usr/bin/python3)","toy":{"qTokens":["river","bank","flood"],"docRel":{"text":"the riverside plain flooded","dTokens":["the","riverside","plain","flooded"],"sim":[[0.1,0.9,0.4,0.3],[0.05,0.5,0.45,0.2],[0.08,0.35,0.25,0.95]],"rowMax":[0.9,0.5,0.95],"maxSim":2.35},"docIrr":{"text":"the bank approved a loan","dTokens":["the","bank","loan","approved"],"sim":[[0.05,0.2,0.1,0.08],[0.05,0.98,0.3,0.15],[0.05,0.12,0.1,0.08]],"rowMax":[0.2,0.98,0.12],"maxSim":1.3}},"real":{"model":"colbert-ir/colbertv2.0","dim":128,"projected":true,"normalized":true,"pair":{"query":"river bank flood","docRel":"the riverside plain flooded","docIrr":"the bank approved a loan"},"maxSimRel":3.0635,"maxSimIrr":1.7809,"note":"real ColBERT per-token embeddings: BERT last_hidden_state projected 768→128 by the checkpoint's `linear.weight`, then L2-normalized; MaxSim = sum_i max_j cos; eval()+no_grad()+manual_seed(0); committed frozen. Toy and real agree on ORDERING (maxSimRel > maxSimIrr), not magnitude."}}},"i18n":{"_doc":"Labels + step captions for colbert-maxsim. EN canonical + RU (native) + TT. All numbers (the cosine cells, row-maxes and the MaxSim total) come from data/l8-colbert.json — never from i18n.","alt":{"en":"A token-by-token similarity matrix between the query tokens and the document tokens; each query token's strongest cell is highlighted, and the highlighted maxes are summed into the MaxSim score.","ru":"Матрица сходства между токенами запроса и документа; для каждого токена запроса подсвечивается сильнейшая ячейка, а подсвеченные максимумы суммируются в оценку MaxSim.","tt":"Сорау токеннары белән документ токеннары арасында токен-токенга охшашлык матрицасы; һәр сорау токенының иң көчле күзәнәге яктыртыла, яктыртылган максимумнар MaxSim баллына кушыла."},"head":{"en":"every query token vs every document token — cosine in each cell","ru":"каждый токен запроса против каждого токена документа — косинус в каждой ячейке","tt":"һәр сорау токены һәр документ токенына каршы — һәр күзәнәктә косинус"},"qLabel":{"en":"query ↓","ru":"запрос ↓","tt":"сорау ↓"},"maxLabel":{"en":"max","ru":"макс.","tt":"макс."},"scoreLabel":{"en":"MaxSim","ru":"MaxSim","tt":"MaxSim"},"s0":{"en":"ColBERT keeps one vector PER TOKEN — no pooling into a single vector. Here are the query's tokens down the side and the document's tokens across the top.","ru":"ColBERT хранит по одному вектору НА КАЖДЫЙ ТОКЕН — без свёртки в один вектор. Слева — токены запроса, сверху — токены документа.","tt":"ColBERT һәр ТОКЕНГА бер вектор саклый — бер векторга җыймыйча. Читтә — сорау токеннары, өстә — документ токеннары."},"s1":{"en":"Fill every cell with the cosine between that query token and that document token. Darker means a stronger token-level match.","ru":"Заполняем каждую ячейку косинусом между этим токеном запроса и этим токеном документа. Темнее — сильнее совпадение на уровне токенов.","tt":"Һәр күзәнәкне шул сорау токены белән шул документ токены арасындагы косинус белән тутырабыз. Караңгырак — токен дәрәҗәсендә көчлерәк туры килү."},"s2":{"en":"For each query token, take its MAX across the row — the single document token it matches best. Every query token salutes its strongest partner.","ru":"Для каждого токена запроса берём МАКСИМУМ по строке — тот единственный токен документа, с которым он совпадает лучше всего. Каждый токен запроса салютует сильнейшему партнёру.","tt":"Һәр сорау токены өчен юл буенча МАКСИМУМны алабыз — ул иң яхшы туры килгән бердәнбер документ токены. Һәр сорау токены иң көчле партнёрына сәлам бирә."},"s3":{"en":"Sum those row-maxes to get the MaxSim score. A high score needs MANY query tokens to find a match — not just one loud one. That is what beats the lexical trap.","ru":"Суммируем эти построчные максимумы — получаем оценку MaxSim. Оценка суммирует лучшие совпадения всех токенов запроса. В показанном примере несколько хороших совпадений перевешивают одно сильное; это не гарантия для любого запроса.","tt":"Шул юл-максимумнарны кушабыз — MaxSim баллын алабыз. Югары балл өчен туры килүне КҮП сорау токены табарга тиеш — бер кычкырык кына түгел. Нәкъ менә шул лексик капкынны җиңә."}},"title":{"en":"Late interaction (MaxSim)","ru":"Позднее взаимодействие (MaxSim)","tt":"Соңгы тәэсир итешү (MaxSim)"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
