</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>The residual highway: x → x+attn → Norm → x+ffn → Norm</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="4" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>4</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"residual-stream","mountName":"mountResidualStream","maxStep":4,"data":{"method":"residual stream over a toy 6-d vector (post-LN Transformer order)","dim":6,"stages":[{"id":"x0","label":"x (input)","vec":[1,0.5,-0.5,2,0,1.5],"delta":null,"norm":2.7839},{"id":"add-attn","label":"x + attn(x)","vec":[1.4,0.3,0.1,1.7,0.5,1.4],"delta":[0.4,-0.2,0.6,-0.3,0.5,-0.1],"norm":2.6758},{"id":"norm-1","label":"LayerNorm","vec":[0.808,-0.969,-1.292,1.292,-0.646,0.808],"delta":null,"norm":2.4495},{"id":"add-ffn","label":"+ ffn(x)","vec":[0.708,-0.669,-1.092,1.692,-1.146,1.008],"delta":[-0.1,0.3,0.2,0.4,-0.5,0.2],"norm":2.7079},{"id":"norm-2","label":"LayerNorm","vec":[0.566,-0.683,-1.066,1.459,-1.115,0.838],"delta":null,"norm":2.4495}],"note":"each sublayer ADDS a delta to the running x (x = x + sublayer(x)); LayerNorm rescales. The representation accumulates along a highway, it is never thrown away."},"dataSets":{"l6-residual":{"method":"residual stream over a toy 6-d vector (post-LN Transformer order)","dim":6,"stages":[{"id":"x0","label":"x (input)","vec":[1,0.5,-0.5,2,0,1.5],"delta":null,"norm":2.7839},{"id":"add-attn","label":"x + attn(x)","vec":[1.4,0.3,0.1,1.7,0.5,1.4],"delta":[0.4,-0.2,0.6,-0.3,0.5,-0.1],"norm":2.6758},{"id":"norm-1","label":"LayerNorm","vec":[0.808,-0.969,-1.292,1.292,-0.646,0.808],"delta":null,"norm":2.4495},{"id":"add-ffn","label":"+ ffn(x)","vec":[0.708,-0.669,-1.092,1.692,-1.146,1.008],"delta":[-0.1,0.3,0.2,0.4,-0.5,0.2],"norm":2.7079},{"id":"norm-2","label":"LayerNorm","vec":[0.566,-0.683,-1.066,1.459,-1.115,0.838],"delta":null,"norm":2.4495}],"note":"each sublayer ADDS a delta to the running x (x = x + sublayer(x)); LayerNorm rescales. The representation accumulates along a highway, it is never thrown away."}},"i18n":{"_doc":"Step captions + small in-SVG labels for residual-stream. EN canonical + RU + TT (all written). Every NUMBER shown in the figure (each stage's 6-d vec, the added deltas, the L2 norm per stage incl. the two LayerNorm stages = 2.4495 = √6) comes from data/l6-residual.json, never from these strings. Deltas are illustrative (a toy block), not learned weights.","alt":{"en":"The residual highway through one Transformer block: a running 6-dimensional representation x rides a lane left to right; at each sublayer a side branch ADDS its output to x (x becomes x plus attention, then LayerNorm renormalises, then x plus the feed-forward output, then LayerNorm again). The previous vector stays faintly visible at each add to show the representation is added to, never replaced; an L2-norm readout tracks the running length, and the two LayerNorm stages both bring it to 2.4495.","ru":"Остаточная магистраль через один блок трансформера: бегущее 6-мерное представление x движется по полосе слева направо; на каждом подслое боковая ветвь ДОБАВЛЯЕТ свой выход к x (x становится x плюс внимание, затем LayerNorm перенормирует, затем x плюс выход полносвязного слоя, затем снова LayerNorm). Предыдущий вектор остаётся слабо видимым при каждом добавлении, показывая, что представление дополняется, а не заменяется; индикатор L2-нормы отслеживает текущую длину, и оба этапа LayerNorm приводят её к 2,4495.","tt":"Бер трансформер блогы аша калдык юлы: йөгерүче 6 үлчәмле күрсәтмә x сулдан уңга юлдан бара; һәр асткатламда ян тармак үз чыгышын x ка ӨСТИ (x x плюс игътибар була, аннары LayerNorm кабат нормалаштыра, аннары x плюс тулысынча тоташкан катлам чыгышы, аннары тагын LayerNorm). Алдагы вектор һәр өстәүдә йомшак күренеп кала, күрсәтмә алыштырылмый, ә өстәлә икәнен күрсәтә; L2-норма күрсәткече агымдагы озынлыкны күзәтә, һәм ике LayerNorm этабы да аны 2.4495 кә китерә."},"highwayLbl":{"en":"residual highway","ru":"магистраль x","tt":"калдык юлы"},"normLbl":{"en":"‖x‖","ru":"‖x‖","tt":"‖x‖"},"addLbl":{"en":"+","ru":"+","tt":"+"},"skipLbl":{"en":"skip: x passes through","ru":"skip: x напрямую","tt":"skip: x турыдан"},"prevLbl":{"en":"previous x (still here)","ru":"прежний x (всё ещё здесь)","tt":"элекке x (әле дә монда)"},"deltaLbl":{"en":"sublayer(x)","ru":"sublayer(x)","tt":"sublayer(x)"},"s0":{"en":"The representation x enters the block riding a highway — six numbers, length ‖x‖ shown at the checkpoint. Hold onto this lane: x will be carried all the way through, never thrown away.","ru":"Представление x входит в блок по магистрали — шесть чисел, длина ‖x‖ показана на контрольной точке. Запомни эту полосу: x пронесётся через весь блок и не будет выброшен.","tt":"Күрсәтмә x блокка юлдан керә — алты сан, ‖x‖ озынлыгы тикшерү ноктасында күрсәтелә. Бу юлны истә тотыгыз: x бөтен блок аша үткәреләчәк, беркайчан да ташланмаячак."},"s1":{"en":"First sublayer: attention. Its output enters from a side branch and is ADDED to x — the running vector becomes x + attn(x). The faint vector underneath is the old x: it is still there. The skip connection lets x bypass the block entirely; the sublayer only adds a correction.","ru":"Первый подслой: внимание. Его выход входит по боковой ветви и ДОБАВЛЯЕТСЯ к x — бегущий вектор становится x + attn(x). Бледный вектор внизу — это прежний x: он по-прежнему на месте. Skip-связь позволяет x обойти блок целиком; подслой лишь добавляет поправку.","tt":"Беренче асткатлам: игътибар. Аның чыгышы ян тармактан керә һәм x ка ӨСТӘЛӘ — йөгерүче вектор x + attn(x) була. Аста йомшак күренгән вектор — элекке x: ул әле дә урынында. Skip-бәйләнеш x ка блокны бөтенләй урап үтәргә мөмкинлек бирә; асткатлам бары төзәтмә өсти."},"s2":{"en":"Add & Norm — the first LayerNorm. The running vector is renormalised: its length settles to 2.4495 (that is √6, the L2 norm of a unit-RMS six-dimensional vector). Normalising keeps the highway from drifting in scale as adds pile up.","ru":"Add & Norm — первый LayerNorm. Бегущий вектор перенормируется: его длина устанавливается в 2,4495 (это √6, L2-норма шестимерного вектора с единичным RMS). Нормализация не даёт магистрали «уплывать» по масштабу по мере накопления добавлений.","tt":"Add & Norm — беренче LayerNorm. Йөгерүче вектор кабат нормалаштырыла: аның озынлыгы 2.4495 кә урнаша (бу √6, берәмлек RMS лы алты үлчәмле векторның L2-нормасы). Нормализация өстәүләр җыелган саен юлның масштабы буенча агып китүен булдырмый."},"s3":{"en":"Second sublayer: the feed-forward network. Again its output enters from a side branch and is ADDED — x becomes (LayerNorm output) + ffn(x). Same pattern as attention: a side branch, a “+”, the old vector still beneath. Two adds so far, never a replacement.","ru":"Второй подслой: полносвязная сеть. Снова её выход входит по боковой ветви и ДОБАВЛЯЕТСЯ — x становится (выход LayerNorm) + ffn(x). Тот же приём, что и у внимания: боковая ветвь, «+», прежний вектор всё ещё внизу. Два добавления и ни одной замены.","tt":"Икенче асткатлам: тулысынча тоташкан челтәр. Тагын аның чыгышы ян тармактан керә һәм ӨСТӘЛӘ — x (LayerNorm чыгышы) + ffn(x) була. Игътибардагы кебек үк ысул: ян тармак, «+», элекке вектор әле дә аста. Хәзергә ике өстәү, бер дә алыштыру юк."},"s4":{"en":"Add & Norm again — the second LayerNorm. The length returns to 2.4495 = √6. That is one whole block: two adds and two norms. The highway carried x the entire way; each sublayer only nudged it, which is why very deep stacks still train.","ru":"Снова Add & Norm — второй LayerNorm. Длина возвращается к 2,4495 = √6. Это и есть один целый блок: два добавления и две нормализации. Магистраль пронесла x весь путь; каждый подслой лишь подталкивал его — поэтому очень глубокие стеки всё ещё обучаются.","tt":"Тагын Add & Norm — икенче LayerNorm. Озынлык 2.4495 = √6 кә кайта. Бу — бер тулы блок: ике өстәү һәм ике нормализация. Юл x ны бөтен юл буе алып барды; һәр асткатлам аны бары этәрде — шуңа бик тирән өемнәр дә әле дә өйрәнелә."}},"title":{"en":"The residual highway: x → x+attn → Norm → x+ffn → Norm","ru":"Остаточная магистраль: x → x+attn → Norm → x+ffn → Norm","tt":"Калдык юлы: x → x+attn → Norm → x+ffn → Norm"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
