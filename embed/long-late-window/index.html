ment twenty thousand tokens long drawn to scale, with the model's eight-thousand-token window covering only its first two fifths; three strategies in turn — truncating the tail, cutting it into three touching macro-chunks whose seam severs a dependency, and cutting into three overlapping macro-chunks whose overlap is read and then discarded.","ru":"Документ на двадцать тысяч токенов, нарисованный в масштабе; окно модели в восемь тысяч токенов покрывает лишь первые две пятых. Три стратегии по очереди: обрезать хвост; разрезать на три стыкующихся макро-чанка, шов которых рвёт зависимость; и разрезать на три перекрывающихся макро-чанка, перекрытие которых прочитано и затем выброшено.","tt":"Егерме мең токенлы документ масштабта сызылган; модельнең сигез мең токенлы тәрәзәсе аның беренче ике бишенчесен генә каплый. Өч стратегия чиратлап: койрыкны кисү; тегеше бәйләнешне өзә торган өч тоташ макро-чанкка бүлү; һәм өелешүе укылып, аннары ташлана торган өч макро-чанкка бүлү."},"docHead":{"en":"the document, to scale","ru":"документ в масштабе","tt":"документ масштабта"},"tokens":{"en":"tokens","ru":"токенов","tt":"токен"},"window":{"en":"model window","ru":"окно модели","tt":"модель тәрәзәсе"},"refTag":{"en":"the referent","ru":"референт","tt":"референт"},"ansTag":{"en":"the answer-chunk","ru":"чанк-ответ","tt":"җавап чанкы"},"rowsTruncate":{"en":"what actually gets indexed","ru":"что реально попадёт в индекс","tt":"чынлыкта индекска нәрсә эләгә"},"rowsNaive":{"en":"macro-chunks, no overlap","ru":"макро-чанки без перекрытия","tt":"өелешүсез макро-чанклар"},"rowsLate":{"en":"macro-chunks with an ω-token overlap","ru":"макро-чанки с перекрытием в ω токенов","tt":"ω токенлы өелешүле макро-чанклар"},"lost":{"en":"never indexed","ru":"в индекс не попадёт","tt":"индекска эләкми"},"covered":{"en":"covered:","ru":"покрыто:","tt":"капланган:"},"encoded":{"en":"tokens encoded:","ru":"закодировано токенов:","tt":"кодланган токен:"},"overheadTag":{"en":"overhead:","ru":"переплата:","tt":"артык түләү:"},"macro":{"en":"macro-chunks","ru":"макро-чанка","tt":"макро-чанк"},"starts":{"en":"starts:","ru":"старты:","tt":"башлары:"},"s0strat":{"en":"a document more than twice as long as the window","ru":"документ вдвое с лишним длиннее окна","tt":"тәрәзәдән ике тапкырдан артык озын документ"},"s1strat":{"en":"strategy 1 — truncate","ru":"стратегия 1 — обрезать","tt":"1 нче стратегия — кисеп ташлау"},"s1note":{"en":"the answer-chunk is never indexed at all","ru":"чанк-ответ вообще не попадает в индекс","tt":"җавап чанкы бөтенләй индекска эләкми"},"s2strat":{"en":"strategy 2 — cut naively (ω = 0)","ru":"стратегия 2 — резать наивно (ω = 0)","tt":"2 нче стратегия — наив кисү (ω = 0)"},"s2note":{"en":"but the seam severs the dependency all over again","ru":"но шов снова рвёт зависимость","tt":"ләкин тегеш бәйләнешне яңадан өзә"},"s3strat":{"en":"strategy 3 — long late chunking","ru":"стратегия 3 — длинное позднее чанкование","tt":"3 нче стратегия — озын соңгы чанклау"},"s3note":{"en":"the token at the seam reads across it — the arc holds","ru":"токен на шве читает сквозь него — дуга цела","tt":"тегештәге токен аның аша укый — дуга бөтен"},"s4strat":{"en":"line 14 — discard the overlap embeddings","ru":"строка 14 — выбросить эмбеддинги перекрытия","tt":"14 нче юл — өелешү эмбеддингларын ташлау"},"s4note":{"en":"every token is indexed exactly once; the tax is ω per seam","ru":"каждый токен попадает в индекс ровно один раз; налог — ω за шов","tt":"һәр токен индекска нәкъ бер тапкыр эләгә; салым — тегешкә ω"},"caveat":{"en":"l_max and ω are our example values — the paper publishes none,","ru":"l_max и ω — наши значения для примера: в статье их нет,","tt":"l_max белән ω — мисал өчен алынган кыйммәтләр: мәкаләдә алар юк,"},"s0":{"en":"Twenty thousand tokens of document, and a model that can hold eight thousand one hundred and ninety-two of them at once. The window covers the first two fifths — and the answer-chunk sits far outside it, with its referent named on the very first page.","ru":"Двадцать тысяч токенов документа — и модель, которая держит разом восемь тысяч сто девяносто два. Окно покрывает первые две пятых, а чанк-ответ лежит далеко за ним, и его референт назван на самой первой странице.","tt":"Егерме мең токенлы документ — һәм бер юлы сигез мең бер йөз туксан икене тота алган модель. Тәрәзә беренче ике бишенчене каплый, ә җавап чанкы аннан ерак ята, референты исә иң беренче биттә аталган."},"s1":{"en":"Truncate, and the tail goes dark. Late chunking is not weakened here, it is absent: the answer-chunk never reaches the index at all. Chunking a long document was worth +24,47 % relative nDCG — this throws that away wholesale.","ru":"Обрезаем — и хвост гаснет. Позднее чанкование здесь не ослаблено, его просто нет: чанк-ответ вообще не доходит до индекса. Нарезка длинного документа стоила +24,47 % отн. nDCG — это выбрасывает её целиком.","tt":"Кисеп ташлыйбыз — койрык сүнә. Соңгы чанклау монда көчсезләнми, ул бөтенләй юк: җавап чанкы индекска барып та җитми. Озын документны бүлү +24,47 % чагыштырма nDCG биргән иде — бу аны бөтенләй ташлый."},"s2":{"en":"Cut it into three touching macro-chunks instead. Every token is now indexed — but look at the arc: the dependency that crosses a seam is severed exactly as it was in ordinary naive chunking, only at a coarser scale.","ru":"Тогда режем на три стыкующихся макро-чанка. Теперь в индексе каждый токен — но посмотри на дугу: зависимость, пересекающая шов, разорвана ровно так же, как при обычном наивном чанковании, только в более крупном масштабе.","tt":"Ул чакта өч тоташ макро-чанкка бүләбез. Хәзер һәр токен индекста — ләкин дугага кара: тегеш аша үткән бәйләнеш гадәти наив бүлүдәге кебек үк өзелгән, бары эрерәк масштабта."},"s3":{"en":"Long late chunking: overlap the macro-chunks by ω tokens, so stride = l_max − ω = 7 680, and three chunks start at 0, 7 680 and 15 360. A token sitting on a seam is now read once inside a window that also contains its context — the arc holds.","ru":"Длинное позднее чанкование: перекрываем макро-чанки на ω токенов, тогда stride = l_max − ω = 7 680, и три чанка стартуют с 0, 7 680 и 15 360. Токен на шве читается внутри окна, где есть и его контекст, — дуга цела.","tt":"Озын соңгы чанклау: макро-чанкларны ω токенга өелдерәбез, шунда stride = l_max − ω = 7 680, ә өч чанк 0, 7 680 һәм 15 360 дан башлана. Тегештәге токен контексты да булган тәрәзә эчендә укыла — дуга бөтен."},"s4":{"en":"And now the line everybody skips. The overlapping tokens were encoded twice, but line 14 KEEPS ONLY ONE COPY — the overlap exists so a token can see its context, not so it can enter the index twice. The bill: 21 024 tokens encoded, 1 024 of them extra, exactly ω per seam, about five per cent at index time and nothing at all at query time.","ru":"А теперь строка, которую все пропускают. Перекрывающиеся токены закодированы дважды, но строка 14 ОСТАВЛЯЕТ ТОЛЬКО ОДНУ КОПИЮ: перекрытие нужно, чтобы токен увидел контекст, а не чтобы дважды попасть в индекс. Счёт: закодировано 21 024 токена, из них лишних 1 024 — ровно ω на шов, около пяти процентов на индексации и ноль на запросе.","tt":"Ә хәзер һәркем ташлап киткән юл. Өелешкән токеннар ике тапкыр кодланган, ләкин 14 нче юл БЕР КҮЧЕРМӘНЕ ГЕНӘ КАЛДЫРА: өелешү токен контекстны күрсен өчен кирәк, ике тапкыр индекска керсен өчен түгел. Хисап: 21 024 токен кодланган, шуларның 1 024 е артык — нәкъ тегешкә ω, индекслауда якынча биш процент, ә сорауда бөтенләй нуль."},"caveat2":{"en":"and the repository ships two different defaults (ω = 256 and ω = 512).","ru":"а в репозитории два разных дефолта (ω = 256 и ω = 512).","tt":"ә репозиторийда ике төрле дефолт (ω = 256 һәм ω = 512)."}},"title":{"en":"The window, the seam, and what we throw away","ru":"Окно, шов и то, что мы выбрасываем","tt":"Тәрәзә, тегеш һәм ташлаган нәрсә"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime live
