</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>Agentic RAG: the ReAct loop</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="4" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>4</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"agentic-loop","mountName":"mountAgenticLoop","maxStep":4,"data":{"_src":"toy ReAct/Self-RAG/CRAG trace (gen_l11.py) + REAL frozen llama3.1:8b ReAct trace","react":{"question":"What did the founder of Acme Corp study?","steps":[{"step":0,"thought":"I need the founder of Acme Corp.","action":"lookup[Acme Corp]","observation":"Acme Corp was founded by Dana Reyes.","recallAt1":0},{"step":1,"thought":"Now find what Dana Reyes studied.","action":"lookup[Dana Reyes]","observation":"Dana Reyes studied computer science at MIT.","recallAt1":1},{"step":2,"thought":"I can answer now.","action":"finish[computer science at MIT]","observation":null,"recallAt1":1}],"recallByStep":[0,1,1],"hops":2,"solved":true},"selfRag":{"reflectionTokens":["Retrieve","IsRel","IsSup","IsUse"],"note":"The model emits reflection tokens to gate retrieval and critique its own output (L10 callback)."},"crag":{"grades":["correct","ambiguous","wrong"],"actions":{"correct":"use as-is","ambiguous":"combine + web search","wrong":"discard, rewrite"},"note":"A retrieval evaluator grades each doc and branches — the L10 self-correcting loop (callback)."},"real":{"_model":"llama3.1:8b","question":"What publishing company did an author of the book 'The Pragmatic Programmer' co-found?","steps":3,"solved":true,"finalAnswer":"Pragmatic Bookshelf","trace":[{"step":0,"type":"lookup","query":"the pragmatic programmer","observation":"The book 'The Pragmatic Programmer' was written by Andrew Hunt and David Thomas."},{"step":1,"type":"lookup","query":"andrew hunt","observation":"Andrew Hunt is a software author who co-founded the publisher Pragmatic Bookshelf."},{"step":2,"type":"finish","query":null,"observation":null}],"note":"Real llama3.1:8b ReAct loop (temp 0, seed 42): a 2-hop question solved in 3 steps (book → author → publisher → finish). Structure (an entity list) made the small model a capable agent."}},"dataSets":{"l11-agentic":{"_src":"toy ReAct/Self-RAG/CRAG trace (gen_l11.py) + REAL frozen llama3.1:8b ReAct trace","react":{"question":"What did the founder of Acme Corp study?","steps":[{"step":0,"thought":"I need the founder of Acme Corp.","action":"lookup[Acme Corp]","observation":"Acme Corp was founded by Dana Reyes.","recallAt1":0},{"step":1,"thought":"Now find what Dana Reyes studied.","action":"lookup[Dana Reyes]","observation":"Dana Reyes studied computer science at MIT.","recallAt1":1},{"step":2,"thought":"I can answer now.","action":"finish[computer science at MIT]","observation":null,"recallAt1":1}],"recallByStep":[0,1,1],"hops":2,"solved":true},"selfRag":{"reflectionTokens":["Retrieve","IsRel","IsSup","IsUse"],"note":"The model emits reflection tokens to gate retrieval and critique its own output (L10 callback)."},"crag":{"grades":["correct","ambiguous","wrong"],"actions":{"correct":"use as-is","ambiguous":"combine + web search","wrong":"discard, rewrite"},"note":"A retrieval evaluator grades each doc and branches — the L10 self-correcting loop (callback)."},"real":{"_model":"llama3.1:8b","question":"What publishing company did an author of the book 'The Pragmatic Programmer' co-found?","steps":3,"solved":true,"finalAnswer":"Pragmatic Bookshelf","trace":[{"step":0,"type":"lookup","query":"the pragmatic programmer","observation":"The book 'The Pragmatic Programmer' was written by Andrew Hunt and David Thomas."},{"step":1,"type":"lookup","query":"andrew hunt","observation":"Andrew Hunt is a software author who co-founded the publisher Pragmatic Bookshelf."},{"step":2,"type":"finish","query":null,"observation":null}],"note":"Real llama3.1:8b ReAct loop (temp 0, seed 42): a 2-hop question solved in 3 steps (book → author → publisher → finish). Structure (an entity list) made the small model a capable agent."}}},"i18n":{"_doc":"Step captions + small labels for agentic-loop. EN canonical + RU + TT. Every NUMBER (the 2 hops, recall@1 0→1, the real run's 3 steps) and every TRACE STRING (the question, the lookup/finish actions, the observations, the final answer 'Pragmatic Bookshelf', the model name llama3.1:8b) comes from data/l11-agentic.json, never from these strings.","alt":{"en":"A ReAct loop over a two-hop question: three lanes — Thought, Action, Observation — iterate. The first lookup finds the founder, the second lands the missing fact, and recall@1 climbs from 0 to 1. A finish step gives the answer, a real llama-3.1 run badge appears, and Self-RAG reflection tokens and CRAG grades are shown as the structured cousins of free-form ReAct.","ru":"Цикл ReAct над двухшаговым вопросом: три дорожки — мысль, действие, наблюдение — идут по кругу. Первый поиск находит основателя, второй добывает недостающий факт, и recall@1 растёт с 0 до 1. Шаг finish даёт ответ, появляется бейдж реального запуска llama-3.1, а рефлексивные токены Self-RAG и оценки CRAG показаны как структурированные родичи свободного ReAct.","tt":"Ике адымлы сорау өстендә ReAct циклы: өч юл — Уй, Гамәл, Күзәтү — кабатлана. Беренче эзләү нигез салучыны таба, икенчесе җитмәгән фактны китерә, һәм recall@1 0 дән 1 гә кадәр үсә. Finish адымы җавап бирә, чын llama-3.1 җибәрү билгесе чыга, ә Self-RAG рефлексия токеннары һәм CRAG бәяләре ирекле ReAct ның структуралы туганнары буларак күрсәтелә."},"qHead":{"en":"2-hop question","ru":"двухшаговый вопрос","tt":"ике адымлы сорау"},"recallLabel":{"en":"recall@1","ru":"recall@1","tt":"recall@1"},"laneThought":{"en":"Thought","ru":"Мысль","tt":"Уй"},"laneAction":{"en":"Action","ru":"Действие","tt":"Гамәл"},"laneObservation":{"en":"Observation","ru":"Наблюдение","tt":"Күзәтү"},"finishLabel":{"en":"finish","ru":"finish","tt":"finish"},"realBadge":{"en":"{model} solved it in {steps} steps","ru":"{model} решил — шагов: {steps}","tt":"{model} аны {steps} адымда чиште"},"selfRagHdr":{"en":"Self-RAG · reflection tokens","ru":"Self-RAG · рефлексивные токены","tt":"Self-RAG · рефлексия токеннары"},"cragHdr":{"en":"CRAG · retrieval grades","ru":"CRAG · оценки извлечения","tt":"CRAG · эзләү бәяләре"},"s0":{"en":"A two-hop question can't be answered from one retrieval — the answer lives behind a fact we don't have yet. So instead of retrieving once, the model runs a loop: Thought, then Action, then Observation, repeated. recall@1 starts at zero — nothing relevant has been found.","ru":"На двухшаговый вопрос нельзя ответить одним извлечением — ответ скрыт за фактом, которого у нас пока нет. Поэтому вместо одного извлечения модель запускает цикл: Мысль, затем Действие, затем Наблюдение, и так по кругу. recall@1 начинается с нуля — релевантного ещё ничего не найдено.","tt":"Ике адымлы сорауга бер эзләү белән җавап биреп булмый — җавап әле бездә булмаган факт артында яшеренгән. Шуңа бер тапкыр эзләү урынына модель цикл җибәрә: Уй, аннары Гамәл, аннары Күзәтү, шулай әйләнеп. recall@1 нуль белән башлана — релевант берни табылмаган."},"s1":{"en":"First iteration. The Thought names what's missing; the Action is a lookup that searches for the first entity; the Observation returns the founder's name. We're one hop in, but we still don't have what was actually asked — so recall@1 is still zero.","ru":"Первая итерация. Мысль называет, чего не хватает; Действие — это lookup, который ищет первую сущность; Наблюдение возвращает имя основателя. Мы прошли один шаг, но всё ещё не получили того, о чём спрашивали, — поэтому recall@1 по-прежнему ноль.","tt":"Беренче итерация. Уй нәрсә җитмәгәнен атый; Гамәл — беренче объектны эзләүче lookup; Күзәтү нигез салучының исемен кайтара. Без бер адым уздык, ләкин чыннан да соралганны әле алмадык — шуңа recall@1 һаман нуль."},"s2":{"en":"Second iteration — this is the hop that matters. The new Thought feeds the founder's name back into a second lookup, and this Observation finally returns the missing fact. The chain closed: recall@1 jumps to one and the Observation lane turns green.","ru":"Вторая итерация — именно этот шаг решает всё. Новая Мысль подставляет имя основателя во второй lookup, и это Наблюдение наконец возвращает недостающий факт. Цепочка замкнулась: recall@1 подскакивает до единицы, и дорожка Наблюдения становится зелёной.","tt":"Икенче итерация — нәкъ менә шул адым хәл итә. Яңа Уй нигез салучының исемен икенче lookup ка тапшыра, һәм бу Күзәтү ниһаять җитмәгән фактны кайтара. Чылбыр ябылды: recall@1 берәүгә сикерә, һәм Күзәтү юлы яшелгә әйләнә."},"s3":{"en":"With both hops landed, the model stops looping and emits a finish action with the answer — the loop is solved. And this isn't only a toy: a real, small open model ran exactly this ReAct loop end to end on a different two-hop question and got it right, shown in the badge below.","ru":"Когда оба шага сделаны, модель прекращает цикл и выдаёт действие finish с ответом — цикл решён. И это не только игрушка: настоящая небольшая открытая модель прошла ровно этот цикл ReAct до конца на другом двухшаговом вопросе и ответила верно, как показано в бейдже ниже.","tt":"Ике адым да үтәлгәч, модель циклны туктата һәм җавап белән finish гамәлен бирә — цикл чишелде. Һәм бу бары уенчык кына түгел: чын кечкенә ачык модель нәкъ шушы ReAct циклын башка ике адымлы сорауда ахырынача узды һәм дөрес җавап бирде, түбәндәге билгедә күрсәтелгәнчә."},"s4":{"en":"Free-form ReAct improvises its loop in natural language. Its structured cousins make the same control flow explicit: Self-RAG emits reflection tokens to decide when to retrieve and to critique its own output, while CRAG grades each retrieved doc and branches on the grade. Both are the L10 self-correcting loop, now tokenized.","ru":"Свободный ReAct импровизирует свой цикл на естественном языке. Его структурированные родичи делают тот же поток управления явным: Self-RAG выдаёт рефлексивные токены, чтобы решать, когда извлекать, и критиковать собственный вывод, а CRAG оценивает каждый извлечённый документ и ветвится по оценке. Оба — самокорректирующийся цикл из L10, теперь в токенах.","tt":"Ирекле ReAct үз циклын табигый телдә импровизацияли. Аның структуралы туганнары шул ук идарә агымын ачык итә: Self-RAG кайчан эзләргә кирәклеген хәл итәр өчен һәм үз нәтиҗәсен тәнкыйтьләр өчен рефлексия токеннары бирә, ә CRAG һәр табылган документны бәяли һәм бәягә карап тармаклана. Икесе дә — L10 дагы үзен төзәтүче цикл, хәзер токеннарда."}},"title":{"en":"Agentic RAG: the ReAct loop","ru":"Агентный RAG: цикл ReAct","tt":"Агентлы RAG: ReAct циклы"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
