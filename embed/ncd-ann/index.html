</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>ANN: the broadcast that shrank</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="2" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>2</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"ncd-ann","mountName":"mountNcdAnn","maxStep":2,"data":{},"dataSets":{},"i18n":{"_doc":"ncd-ann — approximate nearest-neighbour search (HNSW/IVF) in the neural-circuit-diagram lens. Step 0 = exact (broadcast over all N documents; C = N), 1 = approximate (the dashed broadcast region shrinks to the candidate set C = the graph walk PLUS every neighbour of a walked node — SCORED is not the same as EXPANDED, which is why d5/d6 carry cups without ever being stepped on), 2 = the price (a true neighbour that sits 2 hops from every expanded node — behind the frontier — is never scored → recall < 1; a one-edge-away 'miss' would be impossible, since SEARCH-LAYER scores every neighbour of every expanded node). DELIBERATELY SYMBOLIC: the course has no grounded ANN recall/latency figures in data/, so this widget states N, C ≪ N, |C| ≈ hops · degree, N·d, ≈ |C|·d, 1.0 and < 1.0 — and never a fabricated measurement.","alt":{"en":"Exact and approximate nearest-neighbour search drawn as the same neural circuit diagram. A query wire enters a dashed violet broadcast region. In exact search the region encloses all ten indexed documents (pentagons), and every one of them carries a contraction cup — a dot product q·dᵢ — so the cost is N·d and recall is 1.0 by construction. In approximate search the same circuit is drawn, but the broadcast region has shrunk to a candidate set C reached by an orange walk over a proximity graph from an entry point. C is not just the four documents the walk expanded: d5 and d6, their neighbours, also carry cups — they were scored but never expanded — so the work is about |C|·d with |C| roughly hops times graph degree. The documents outside C are faded and have no cups at all: they are never scored. One of the two true neighbours (green) is d10, which lies two hops from every expanded document, behind that frontier; the two edges into it are drawn red and dashed because they were never crossed, it is never scored, and recall drops below 1.","ru":"Точный и приближённый поиск ближайших соседей, нарисованные как одна и та же neural circuit diagram. Провод запроса входит в пунктирную фиолетовую broadcast-область. При точном поиске область охватывает все десять проиндексированных документов (пятиугольники), и у каждого есть чаша-стягивание — скалярное произведение q·dᵢ, — поэтому стоимость равна N·d, а полнота равна 1,0 по построению. При приближённом поиске схема та же, но broadcast-область сжалась до множества кандидатов C, до которого доходит оранжевый обход графа близости из точки входа. C — это не только четыре раскрытых обходом документа: у d5 и d6, их соседей, тоже есть чаши — их оценили, но так и не раскрыли, — поэтому работа равна примерно |C|·d, где |C| ≈ прыжки × степень графа. Документы за пределами C притушены, и чаш перед ними нет вовсе: их никогда не оценивают. Один из двух настоящих соседей (зелёный) — это d10: он лежит в двух прыжках от любого раскрытого документа, за этой границей; два ребра, ведущие к нему, нарисованы красным пунктиром, потому что по ним так и не прошли, его никогда не оценивают, и полнота падает ниже 1.","tt":"Төгәл һәм якынча иң якын күршеләрне эзләү — бер үк neural circuit diagram буларак. Сорау чыбыгы пунктир шәмәхә broadcast өлкәсенә керә. Төгәл эзләүдә өлкә индекслы ун документны да (бишпочмаклар) эченә ала, һәм һәрберсенең касә-җыюы бар — q·dᵢ скаляр тапкырчыгы, — шуңа бәя N·d, ә тулылык төзелеше буенча 1.0. Якынча эзләүдә схема шул ук, әмма broadcast өлкәсе кандидатлар күплеге C га кадәр кысылган; аңа керү ноктасыннан якынлык графы буенча кызгылт йөрү аша җитәләр. C — йөрү ачкан дүрт документ кына түгел: аларның күршеләре d5 һәм d6 да касә йөртә — аларны бәяләгәннәр, әмма беркайчан ачмаганнар, — шуңа эш якынча |C|·d, монда |C| ≈ сикерүләр × граф дәрәҗәсе. C дан тыштагы документлар сүнгән, аларның алдында касәләр бөтенләй юк: аларны беркайчан бәяләмиләр. Ике чын күршенең берсе (яшел) — d10: ул ачылган һәр документтан ике сикерү ераклыкта, шул чик артында; аңа илтүче ике кырый кызыл пунктир белән сызылган, чөнки алар буенча беркайчан үтмәгәннәр, аны беркайчан бәяләмиләр, һәм тулылык 1 дән түбән төшә."},"legMap":{"en":"pentagon = a document · ⌣ = contraction q·dᵢ = scored · dashed = the region C · orange = the walk · green = a true neighbour","ru":"пятиугольник = документ · ⌣ = стягивание q·dᵢ = оценён · пунктир = область C · оранжевый = обход · зелёный = настоящий сосед","tt":"бишпочмак = документ · ⌣ = җыю q·dᵢ = бәяләнгән · пунктир = C өлкәсе · кызгылт = йөрү · яшел = чын күрше"},"lblQuery":{"en":"query","ru":"запрос","tt":"сорау"},"query":{"en":"neural search","ru":"нейропоиск","tt":"нейроэзләү"},"tagN":{"en":"N · broadcast over EVERY document","ru":"N · broadcast по КАЖДОМУ документу","tt":"N · broadcast ҺӘР документ буенча"},"tagNghost":{"en":"N · the corpus (unchanged)","ru":"N · корпус (не изменился)","tt":"N · корпус (үзгәрмәде)"},"tagC":{"en":"C · scored: walk + neighbours","ru":"C · оценено: обход + соседи","tt":"C · бәяләнгән: йөрү + күршеләр"},"lblEntry":{"en":"entry point","ru":"точка входа","tt":"керү ноктасы"},"lblScored":{"en":"scored,","ru":"оценены,","tt":"бәяләнгән,"},"lblNotExp":{"en":"not expanded","ru":"но не раскрыты","tt":"ачылмаган"},"lblUnscored":{"en":"N − C never scored","ru":"N − C не оценены","tt":"N − C бәяләнми"},"lblMiss":{"en":"never scored","ru":"не оценён","tt":"бәяләнмәгән"},"lblRecall":{"en":"recall < 1.0","ru":"полнота < 1,0","tt":"тулылык < 1.0"},"costExact":{"en":"cost:  N · d","ru":"стоимость:  N · d","tt":"бәя:  N · d"},"costAnn":{"en":"cost:  ≈ |C| · d","ru":"стоимость:  ≈ |C| · d","tt":"бәя:  ≈ |C| · d"},"s0":{"en":"Exact search. The query wire enters a dashed broadcast region that encloses EVERY document in the index: all N of them lie on that axis, and each one carries its own contraction cup — the dot product q·dᵢ. The cost is written on the axis itself: N·d multiplications per query. Exact search is simply the special case in which the candidate set IS the corpus, C = N — and that is the one and only reason it can promise recall 1.0. You looked at everything.","ru":"Точный поиск. Провод запроса входит в пунктирную broadcast-область, которая охватывает КАЖДЫЙ документ индекса: все N лежат на этой оси, и у каждого своя чаша-стягивание — скалярное произведение q·dᵢ. Стоимость написана прямо на оси: N·d умножений на запрос. Точный поиск — это просто частный случай, в котором множество кандидатов совпадает с корпусом, C = N; и ровно поэтому — и только поэтому — он может обещать полноту 1,0. Просмотрено всё до единого.","tt":"Төгәл эзләү. Сорау чыбыгы пунктир broadcast өлкәсенә керә, ул индекстагы ҺӘР документны эченә ала: барлык N шул күчәрдә ята, һәм һәрберсенең үз касә-җыюы бар — q·dᵢ скаляр тапкырчыгы. Бәясе күчәрдә үк язылган: сорауга N·d тапкырлау. Төгәл эзләү — кандидатлар күплеге корпус белән тәңгәл килгән аерым очрак кына, C = N; нәкъ шуңа — һәм бары тик шуңа — ул 1.0 тулылык вәгъдә итә ала. Сез барысына да карадыгыз."},"s1":{"en":"Approximate search. Nothing about the circuit changed — the same wire, the same cup, the same dot product. What changed is the SIZE of the axis you broadcast over: a walk over the proximity graph starts at an entry point and hops toward the query (orange). Now look at which documents get a cup. Not only the four the walk EXPANDED — d5 and d6 get one too, and the walk never steps on them. To decide where to hop next you must score every neighbour of every node you open, so the candidate set C is the walk PLUS its frontier: scored is not the same as expanded. That is why the bill is |C|·d, with |C| ≈ hops · degree — and the documents left outside C are the ones that are truly never scored: in front of them there is no cup at all.","ru":"Приближённый поиск. В схеме не изменилось ничего — тот же провод, та же чаша, то же скалярное произведение. Изменился РАЗМЕР оси, по которой идёт broadcast: обход графа близости стартует из точки входа и прыгает в сторону запроса (оранжевое). Теперь посмотри, у каких документов появилась чаша. Не только у четырёх, которые обход РАСКРЫЛ, — чаши есть и у d5, и у d6, а обход на них так и не ступил. Чтобы выбрать следующий прыжок, нужно оценить всех соседей каждой раскрытой вершины, поэтому множество кандидатов C — это обход ПЛЮС его граница: «оценён» и «раскрыт» — разные вещи. Именно поэтому счёт равен |C|·d, где |C| ≈ прыжки × степень, — а по-настоящему неоценёнными остаются документы за пределами C: перед ними нет чаши вовсе.","tt":"Якынча эзләү. Схемада бернәрсә үзгәрмәде — шул ук чыбык, шул ук касә, шул ук скаляр тапкырчык. Broadcast барган күчәрнең ЗУРЛЫГЫ үзгәрде: якынлык графы буенча йөрү керү ноктасыннан башлана һәм сорау ягына сикерә (кызгылт). Хәзер кайсы документларда касә барлыкка килгәнен карагыз. Йөрү АЧКАН дүртесендә генә түгел — d5 та, d6 да касә йөртә, ә йөрү аларга бервакытта да басмады. Киләсе сикерүне сайлар өчен һәр ачылган түбәнең барлык күршеләрен бәяләргә кирәк, шуңа кандидатлар күплеге C — ул йөрү ПЛЮС аның чиге: «бәяләнгән» һәм «ачылган» — төрле нәрсә. Нәкъ шуңа хисап |C|·d, монда |C| ≈ сикерүләр × дәрәҗә, — ә чыннан да бәяләнмичә калганнары — C дан тыштагы документлар: алар алдында бөтенләй касә юк."},"s2":{"en":"The price. The index holds two true neighbours of q: d4, which the walk reached and scored (green), and d10, which it never even looked at. Every route into d10 runs through d5 or d6 — the frontier, scored but never expanded — so the two red dashed edges were never crossed. d10 lies TWO hops from every node the search opened: a local optimum, which is the only kind of miss a graph walk can actually make. It is outside C, so no cup ever forms in front of it, and what is never scored can never be returned: recall drops below 1. You did not buy the speed with cleverness; you bought it by exchanging a guarantee for a budget. HNSW and IVF are simply the machinery for choosing how big that budget is.","ru":"Цена. У запроса в индексе два настоящих соседа: до d4 обход дошёл и оценил его (зелёный), а на d10 он даже не взглянул. Любой путь к d10 идёт через d5 или d6 — это граница: их оценили, но не раскрыли, — поэтому по двум красным пунктирным рёбрам так никто и не прошёл. d10 лежит в ДВУХ прыжках от каждой раскрытой вершины: это локальный оптимум, а он и есть единственный промах, который обход графа способен совершить на самом деле. d10 остался за пределами C, поэтому перед ним не появляется чаши, а неоценённое невозможно вернуть: полнота падает ниже 1. Скорость куплена не хитростью, а обменом гарантии на бюджет — HNSW и IVF лишь машинерия выбора того, насколько велик этот бюджет.","tt":"Бәя. Индекста сорауның ике чын күршесе бар: d4 ка йөрү җитте һәм аны бәяләде (яшел), ә d10 га ул күз дә салмады. d10 га илтүче һәр юл d5 яки d6 аша бара — бу чик: аларны бәяләгәннәр, әмма ачмаганнар, — шуңа ике кызыл пунктир кырый буенча беркем дә үтмәде. d10 ачылган һәр түбәдән ИКЕ сикерү ераклыкта ята: бу локаль оптимум, ә ул — граф буенча йөрү чыннан да ясый ала торган бердәнбер хата. d10 C дан тышта калды, шуңа аның алдында касә барлыкка килми, ә бәяләнмәгәнне кайтарып та булмый: тулылык 1 дән түбән төшә. Тизлек хәйлә белән түгел, гарантияне бюджетка алмаштырып сатып алынган — HNSW һәм IVF шул бюджетның зурлыгын сайлау машинасы гына."},"lgTitle":{"en":"cost & recall","ru":"стоимость и полнота","tt":"бәя һәм тулылык"},"lgAxis":{"en":"broadcast axis","ru":"broadcast-ось","tt":"broadcast күчәре"},"lgCands":{"en":"|C| (scored)","ru":"|C| (оценено)","tt":"|C| (бәяләнгән)"},"lgCups":{"en":"contractions (cups)","ru":"стягивания (чаши)","tt":"җыюлар (касәләр)"},"lgWork":{"en":"work / query","ru":"работа / запрос","tt":"эш / сорау"},"lgRecall":{"en":"recall","ru":"полнота","tt":"тулылык"},"lgHops":{"en":"hops","ru":"прыжки","tt":"сикерү"},"lgDeg":{"en":"degree","ru":"степень","tt":"дәрәҗә"},"lgN0":{"en":"Exact search is the special case C = N: you broadcast over the whole corpus, so you pay for the whole corpus — N contractions, N·d multiplications. In exchange you get the only thing exact search can promise: recall 1.0, by construction.","ru":"Точный поиск — частный случай C = N: broadcast идёт по всему корпусу, значит, и платишь ты за весь корпус: N стягиваний, N·d умножений. Взамен получаешь единственное, что может обещать точный поиск: полноту 1,0 по построению.","tt":"Төгәл эзләү — C = N аерым очрагы: broadcast бөтен корпус буенча бара, димәк, бөтен корпус өчен түлисез: N җыю, N·d тапкырлау. Каршысына төгәл эзләү вәгъдә итә ала торган бердәнбер нәрсә: 1.0 тулылык, төзелеше буенча."},"lgN1":{"en":"The circuit is unchanged; only the axis shrank. C is not the walk — it is the walk PLUS every neighbour of a walked node, because to choose the next hop you must score them all. So |C| ≈ hops · degree, still ≪ N, and the bill follows |C|, not the corpus. What recall survives is now an open question, not a guarantee.","ru":"Схема прежняя — сжалась только ось. C — это не обход: это обход ПЛЮС все соседи раскрытых вершин, ведь чтобы выбрать следующий прыжок, их все нужно оценить. Значит, |C| ≈ прыжки × степень, всё ещё ≪ N, и счёт следует за |C|, а не за корпусом. Какая полнота уцелела — теперь открытый вопрос, а не гарантия.","tt":"Схема шул ук — күчәр генә кысылды. C — йөрү түгел: ул йөрү ПЛЮС ачылган түбәләрнең барлык күршеләре, чөнки киләсе сикерүне сайлар өчен аларның барысын бәяләргә кирәк. Димәк, |C| ≈ сикерүләр × дәрәҗә, барыбер ≪ N, һәм хисап корпуска түгел, |C| га иярә. Нинди тулылык калды — бу инде гарантия түгел, ачык сорау."},"lgN2":{"en":"A true neighbour that no expanded node can even see is a neighbour you never scored. That is what recall < 1 means — and it is not a bug, it is the deal: you traded a guarantee for a budget.","ru":"Настоящий сосед, которого не видит ни одна раскрытая вершина, — это сосед, оставшийся без оценки. Именно это и значит «полнота < 1», и это не баг, а сделка: ты меняешь гарантию на бюджет.","tt":"Ачылган бер түбә дә күрми торган чын күрше — сез бәяләмәгән күрше. «Тулылык < 1» шуны аңлата, һәм бу баг түгел, ә килешү: сез гарантияне бюджетка алыштырдыгыз."}},"title":{"en":"ANN: the broadcast that shrank","ru":"ANN: broadcast, который сжался","tt":"ANN: кысылган broadcast"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
