</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>MRR &amp; MAP average over a query set</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="4" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>4</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"ndcg-multiquery","mountName":"mountNdcgMultiquery","maxStep":4,"data":{"_doc":"Two-query example so MRR≠RR and MAP≠AP are actually demonstrated. Q1 = the L3 BM25 ranking's relevance pattern; Q2 = a second query with a different pattern (top hit at rank 1). MRR/MAP are the means over the two queries.","_source":"_research/gen_l4.py · Q1 from l3-bm25.json relevance, Q2 synthetic deterministic","ks":[1,3,5,8],"q1":{"rels":[0,1,0,1,0,1,0,1],"rr":0.5,"ap":0.5,"atK":{"1":{"p":0,"r":0},"3":{"p":0.3333,"r":0.25},"5":{"p":0.4,"r":0.5},"8":{"p":0.5,"r":1}}},"q2":{"rels":[1,0,1,1,0,0,1,0],"rr":1,"ap":0.747,"atK":{"1":{"p":1,"r":0.25},"3":{"p":0.6667,"r":0.5},"5":{"p":0.6,"r":0.75},"8":{"p":0.5,"r":1}},"apHitPrecisions":[{"rank":1,"hitNumber":1,"precision":1,"expr":"P@1=1/1=1.0000"},{"rank":3,"hitNumber":2,"precision":0.6667,"expr":"P@3=2/3=0.6667"},{"rank":4,"hitNumber":3,"precision":0.75,"expr":"P@4=3/4=0.7500"},{"rank":7,"hitNumber":4,"precision":0.5714,"expr":"P@7=4/7=0.5714"}],"apExpr":"(1.0000 + 0.6667 + 0.7500 + 0.5714) / 4 = 0.7470","apSumNumerator":2.9881,"relevantTotal":4},"mrr":0.75,"map":0.6235,"note":"RR1=0.5, RR2=1.0 → MRR=0.75 (≠ either RR); AP1=0.5, AP2=0.747 → MAP=0.6235 (≠ either AP)."},"dataSets":{"l4-multiquery":{"_doc":"Two-query example so MRR≠RR and MAP≠AP are actually demonstrated. Q1 = the L3 BM25 ranking's relevance pattern; Q2 = a second query with a different pattern (top hit at rank 1). MRR/MAP are the means over the two queries.","_source":"_research/gen_l4.py · Q1 from l3-bm25.json relevance, Q2 synthetic deterministic","ks":[1,3,5,8],"q1":{"rels":[0,1,0,1,0,1,0,1],"rr":0.5,"ap":0.5,"atK":{"1":{"p":0,"r":0},"3":{"p":0.3333,"r":0.25},"5":{"p":0.4,"r":0.5},"8":{"p":0.5,"r":1}}},"q2":{"rels":[1,0,1,1,0,0,1,0],"rr":1,"ap":0.747,"atK":{"1":{"p":1,"r":0.25},"3":{"p":0.6667,"r":0.5},"5":{"p":0.6,"r":0.75},"8":{"p":0.5,"r":1}},"apHitPrecisions":[{"rank":1,"hitNumber":1,"precision":1,"expr":"P@1=1/1=1.0000"},{"rank":3,"hitNumber":2,"precision":0.6667,"expr":"P@3=2/3=0.6667"},{"rank":4,"hitNumber":3,"precision":0.75,"expr":"P@4=3/4=0.7500"},{"rank":7,"hitNumber":4,"precision":0.5714,"expr":"P@7=4/7=0.5714"}],"apExpr":"(1.0000 + 0.6667 + 0.7500 + 0.5714) / 4 = 0.7470","apSumNumerator":2.9881,"relevantTotal":4},"mrr":0.75,"map":0.6235,"note":"RR1=0.5, RR2=1.0 → MRR=0.75 (≠ either RR); AP1=0.5, AP2=0.747 → MAP=0.6235 (≠ either AP)."}},"i18n":{"_doc":"Step captions for ndcg-multiquery (L4 'a single query can mislead — metrics average over a query SET'). EN canonical + RU; TT falls back. Every number comes from data/l4-multiquery.json (Q1 RR=0.5/AP=0.5, Q2 RR=1.0/AP=0.747, MRR=0.75, MAP=0.6235) — the SAME source the facts-gate use.","alt":{"en":"Two queries, each with its own result list; per query a reciprocal rank and an average precision, then both averaged across the set into MRR=0.75 and MAP=0.6235 — a mean equal to neither query alone.","ru":"Два запроса, у каждого свой список результатов; на запрос — обратный ранг и средняя точность, затем оба усредняются по набору в MRR=0,75 и MAP=0,6235 — среднее, не равное ни одному запросу.","tt":"Ике сорау, һәрберсенең үз нәтиҗәләр исемлеге; һәр сорауга — кире ранг һәм уртача төгәллек, аннары икесе дә җыелма буенча MRR=0,75 һәм MAP=0,6235 итеп уртачалана — бер сорауга да тигез булмаган урташа."},"q1Title":{"en":"Query 1","ru":"Запрос 1","tt":"Сорау 1"},"q2Title":{"en":"Query 2","ru":"Запрос 2","tt":"Сорау 2"},"hit":{"en":"relevant","ru":"релевантно","tt":"релевант"},"miss":{"en":"not relevant","ru":"нерелевантно","tt":"релевант түгел"},"rrLabel":{"en":"RR = 1/rank of first hit","ru":"RR = 1/ранг первого попадания","tt":"RR = 1/беренче туры килүнең рангы"},"apLabel":{"en":"AP = mean precision at each hit","ru":"AP = средняя точность на каждом попадании","tt":"AP = һәр туры килүдәге уртача төгәллек"},"mrrLabel":{"en":"MRR = mean RR over the set","ru":"MRR = среднее RR по набору","tt":"MRR = җыелма буенча уртача RR"},"mapLabel":{"en":"MAP = mean AP over the set","ru":"MAP = среднее AP по набору","tt":"MAP = җыелма буенча уртача AP"},"lesson":{"en":"Neither matches a single query — that is the point of a mean.","ru":"Ни одно не равно отдельному запросу — в этом и смысл среднего.","tt":"Берсе дә аерым сорауга тигез түгел — урташаның мәгънәсе шунда."},"s0":{"en":"One query can lie. So bring two. Query 1 hits at ranks 2, 4, 6, 8; Query 2 hits at ranks 1, 3, 4, 7. MRR and MAP only show their teeth across a query *set*, so we score each query, then average.","ru":"Один запрос может соврать. Так возьми два. Запрос 1 попадает на рангах 2, 4, 6, 8; Запрос 2 — на рангах 1, 3, 4, 7. MRR и MAP показывают зубы только на *наборе* запросов, поэтому оценим каждый, а потом усредним.","tt":"Бер сорау алдый ала. Шуңа күрә икене ал. Сорау 1 рангларда 2, 4, 6, 8 туры килә; Сорау 2 — рангларда 1, 3, 4, 7. MRR һәм MAP үз тешләрен сорауларның *җыелмасында* гына күрсәтә, шуңа күрә һәр сорауны бәялибез, аннары уртачалыйбыз."},"s1":{"en":"Reciprocal rank cares only about the *first* hit. Query 1's first relevant result sits at rank 2 → RR = 1/2 = 0.5. Query 2 strikes at rank 1 → RR = 1/1 = 1.0. Two queries, two very different reciprocal ranks.","ru":"Обратный ранг заботится только о *первом* попадании. Первый релевантный результат Запроса 1 стоит на ранге 2 → RR = 1/2 = 0,5. Запрос 2 бьёт на ранге 1 → RR = 1/1 = 1,0. Два запроса — два очень разных обратных ранга.","tt":"Кире ранг бары тик *беренче* туры килү турында гына кайгырта. Сорау 1нең беренче релевант нәтиҗәсе 2нче рангта → RR = 1/2 = 0,5. Сорау 2 1нче рангта бәрә → RR = 1/1 = 1,0. Ике сорау — ике бик төрле кире ранг."},"s2":{"en":"Average precision averages the precision at *each* rank where a relevant doc appears. Query 1 works out to AP = 0.5. Query 2's hits at ranks 1, 3, 4, 7 give precisions 1.0, 0.667, 0.75, 0.571, so AP = (1.0 + 0.667 + 0.75 + 0.571) / 4 = 0.747.","ru":"Средняя точность усредняет точность на *каждом* ранге, где есть релевантный документ. У Запроса 1 выходит AP = 0,5. Попадания Запроса 2 на рангах 1, 3, 4, 7 дают точности 1,0, 0,667, 0,75, 0,571, так что AP = (1,0 + 0,667 + 0,75 + 0,571) / 4 = 0,747.","tt":"Уртача төгәллек релевант документ булган *һәр* рангтагы төгәллекне уртачалый. Сорау 1дә AP = 0,5 килеп чыга. Сорау 2нең рангларда 1, 3, 4, 7 туры килүләре 1,0, 0,667, 0,75, 0,571 төгәллекләрен бирә, шулай итеп AP = (1,0 + 0,667 + 0,75 + 0,571) / 4 = 0,747."},"s3":{"en":"First average the reciprocal ranks across the set: MRR = (0.5 + 1.0) / 2 = 0.75. The mean of the two first-hit scores — Query 1 struck at rank 2, Query 2 at rank 1, and 0.75 sits between them.","ru":"Сначала усредни обратные ранги по набору: MRR = (0,5 + 1,0) / 2 = 0,75. Среднее двух оценок первого попадания — Запрос 1 ударил на ранге 2, Запрос 2 на ранге 1, и 0,75 лежит между ними.","tt":"Башта кире рангларны җыелма буенча уртачала: MRR = (0,5 + 1,0) / 2 = 0,75. Беренче туры килү ике бәясенең урташасы — Сорау 1 2нче рангта бәрде, Сорау 2 1нче рангта, һәм 0,75 алар арасында."},"s4":{"en":"Now average the average precisions: MAP = (0.5 + 0.747) / 2 = 0.6235. Notice: each final number equals *neither* query on its own. That is exactly why you report the mean over a query set, never a single lucky (or unlucky) query.","ru":"Теперь усредни средние точности: MAP = (0,5 + 0,747) / 2 = 0,6235. Заметь: каждое итоговое число не равно *ни одному* запросу по отдельности. Именно поэтому ты сообщаешь среднее по набору запросов, а не по одному удачному (или неудачному) запросу.","tt":"Хәзер уртача төгәллекләрне уртачала: MAP = (0,5 + 0,747) / 2 = 0,6235. Игътибар ит: һәр йомгак сан аерым алганда *бер* сорауга да тигез түгел. Нәкъ менә шуңа күрә син сорауларның җыелмасы буенча урташаны хәбәр итәсең, бер уңышлы (яки уңышсыз) сорау буенча түгел."}},"title":{"en":"MRR & MAP average over a query set","ru":"MRR и MAP усредняют по набору запросов","tt":"MRR һәм MAP сораулар җыелмасы буенча уртачалый"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
