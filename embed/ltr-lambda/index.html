</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>Learning to Rank (RankNet → λ)</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="3" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>3</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"ltr-lambda","mountName":"mountLtrLambda","maxStep":3,"data":{"_doc":"Learning to Rank. Toy = hand-computable RankNet sigmoid + LambdaRank ΔnDCG weighting (stdlib). RankNet P=σ(s_i−s_j)=σ(1.2)=0.7685, cost=0.2633, gradient=1−σ=0.2315; the mis-ordered [j,i] has nDCG 0.6309, the swap lifts it to 1.0 → ΔnDCG 0.3691; λ = gradient·ΔnDCG = 0.0854. Threads RankNet → LambdaRank → LambdaMART.","_source":"_research/gen_l8.py (toy, stdlib). nDCG discount 1/log2(rank+1) is L4's formula (data/l4-metrics.json).","toy":{"pair":{"docI":{"id":"i","rel":1,"score":1.5},"docJ":{"id":"j","rel":0,"score":0.3}},"scoreDiff":1.2,"rankNetProb":0.7685,"rankNetCost":0.2633,"gradient":0.2315,"ndcg":{"currentOrder":["j","i"],"current":0.6309,"afterSwap":1,"deltaNdcg":0.3691},"lambda":0.0854}},"dataSets":{"l8-ltr":{"_doc":"Learning to Rank. Toy = hand-computable RankNet sigmoid + LambdaRank ΔnDCG weighting (stdlib). RankNet P=σ(s_i−s_j)=σ(1.2)=0.7685, cost=0.2633, gradient=1−σ=0.2315; the mis-ordered [j,i] has nDCG 0.6309, the swap lifts it to 1.0 → ΔnDCG 0.3691; λ = gradient·ΔnDCG = 0.0854. Threads RankNet → LambdaRank → LambdaMART.","_source":"_research/gen_l8.py (toy, stdlib). nDCG discount 1/log2(rank+1) is L4's formula (data/l4-metrics.json).","toy":{"pair":{"docI":{"id":"i","rel":1,"score":1.5},"docJ":{"id":"j","rel":0,"score":0.3}},"scoreDiff":1.2,"rankNetProb":0.7685,"rankNetCost":0.2633,"gradient":0.2315,"ndcg":{"currentOrder":["j","i"],"current":0.6309,"afterSwap":1,"deltaNdcg":0.3691},"lambda":0.0854}}},"i18n":{"_doc":"Labels + step captions for ltr-lambda. EN canonical + RU (native) + TT. All numbers (the scores, the RankNet probability, the nDCG values and λ) come from data/l8-ltr.json — never from i18n.","alt":{"en":"Two documents with model scores; the RankNet probability of the score difference on a 0-to-1 gauge; the nDCG gained by swapping the mis-ordered pair; and the resulting lambda force pulling the relevant doc up and the other down.","ru":"Два документа с оценками модели; вероятность RankNet от разности оценок на шкале 0–1; прирост nDCG от обмена неверно упорядоченной пары; и итоговая сила λ, тянущая релевантный документ вверх, а другой — вниз.","tt":"Модель балллары булган ике документ; балл аермасының RankNet ихтималы 0–1 шкаласында; дөрес тәртипләнмәгән парны алыштырудан nDCG үсеше; һәм нәтиҗәдә релевант документны өскә, икенчесен аска тарткан λ көче."},"head":{"en":"two documents, two model scores — which should rank higher?","ru":"два документа, две оценки модели — кто должен стоять выше?","tt":"ике документ, ике модель баллы — кайсысы югарырак торырга тиеш?"},"docI":{"en":"docᵢ (rel)","ru":"докᵢ (рел)","tt":"докᵢ (рел)"},"docJ":{"en":"doc_j","ru":"док_j","tt":"док_j"},"deltaLabel":{"en":"ΔnDCG","ru":"ΔnDCG","tt":"ΔnDCG"},"s0":{"en":"Two documents get scores from the model. docᵢ is the relevant one, doc_j is not — but the raw scores alone don't tell us how to train.","ru":"Два документа получают оценки от модели. докᵢ релевантен, док_j — нет, но одни лишь сырые оценки не говорят, как обучать.","tt":"Ике документ моделдән балл ала. докᵢ релевант, док_j — юк, әмма бер чи балллар гына ничек өйрәтергә икәнен әйтми."},"s1":{"en":"RankNet reads the preference as a probability of the SCORE DIFFERENCE: P(i ≻ j) = σ(s_i − s_j). Above 0.5 means the model already leans the right way — just not confidently enough.","ru":"RankNet читает предпочтение как вероятность РАЗНОСТИ ОЦЕНОК: P(i ≻ j) = σ(s_i − s_j). Выше 0,5 — модель уже склоняется к верному порядку, просто недостаточно уверенно.","tt":"RankNet өстенлекне БАЛЛ АЕРМАСЫ ихтималы итеп укый: P(i ≻ j) = σ(s_i − s_j). 0.5 өстендә — модель инде дөрес якка авыша, әмма җитәрлек ышанычлы түгел."},"s2":{"en":"What does getting this pair right actually buy? Swap the mis-ordered [j, i] into [i, j] and measure the jump in nDCG — that is ΔnDCG (callback L4).","ru":"Что даёт правильный порядок этой пары? Поменяем местами неверный [j, i] на [i, j] и измерим скачок nDCG — это и есть ΔnDCG (отсылка к L4).","tt":"Бу парны дөрес тәртипләү нәрсә бирә? Дөрес түгел [j, i] ны [i, j] га алыштырабыз һәм nDCG сикерүен үлчибез — бу ΔnDCG (L4 искә төшерү)."},"s3":{"en":"LambdaRank skips the loss and defines the gradient directly: λ = gradient · ΔnDCG. A force that pulls i up and j down — harder where the swap improves the ranking more. These λ's are the gradients LambdaMART feeds to its trees.","ru":"LambdaRank пропускает функцию потерь и задаёт градиент напрямую: λ = градиент · ΔnDCG. Сила, тянущая i вверх, а j вниз — тем сильнее, чем больше обмен улучшает ранжирование. Эти λ — те самые градиенты, что LambdaMART подаёт своим деревьям.","tt":"LambdaRank югалту функциясен үткәреп җибәрә һәм градиентны турыдан-туры билгели: λ = градиент · ΔnDCG. i не өскә, j ны аска тарткан көч — алыштыру ранжлауны күбрәк яхшырткан саен көчлерәк. Бу λ-лар — LambdaMART үз агачларына биргән градиентлар."}},"title":{"en":"Learning to Rank (RankNet → λ)","ru":"Обучение ранжированию (RankNet → λ)","tt":"Ранжлауга өйрәнү (RankNet → λ)"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
