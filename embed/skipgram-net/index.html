.1086,0.1253,0.165,0.1518,0.0804,0.0314],"probSum":1,"ranking":[{"word":"prince","prob":0.165},{"word":"queen","prob":0.1635},{"word":"throne","prob":0.1518},{"word":"woman","prob":0.1253},{"word":"man","prob":0.1086},{"word":"cat","prob":0.0804},{"word":"computer","prob":0.0314}],"topContext":"prince","note":"one-hot picks a ROW of W (the lookup); softmax over the vocab predicts context. probs sum to 1."},"dataSets":{"l5-skipgram":{"method":"skip-gram forward pass (tied weights W'=W), 8-word toy vocab, d=4 (GloVe-50 sliced + row-normalised)","vocab":["king","queen","man","woman","prince","throne","cat","computer"],"d":4,"centre":"king","centreIndex":0,"oneHot":[1,0,0,0,0,0,0,0],"W":[[0.485,0.66,-0.573,-0.022],[0.168,0.809,-0.561,-0.046],[-0.144,0.655,-0.262,-0.694],[-0.178,0.637,-0.572,-0.486],[0.537,0.79,-0.289,0.057],[0.493,0.784,-0.174,-0.335],[0.525,-0.581,-0.622,-0.018],[0.036,-0.375,0.824,0.422]],"hidden":[0.485,0.66,-0.573,-0.022],"logits":[1,0.938,0.528,0.672,0.947,0.864,0.228,-0.712],"probs":[0.174,0.1635,0.1086,0.1253,0.165,0.1518,0.0804,0.0314],"probSum":1,"ranking":[{"word":"prince","prob":0.165},{"word":"queen","prob":0.1635},{"word":"throne","prob":0.1518},{"word":"woman","prob":0.1253},{"word":"man","prob":0.1086},{"word":"cat","prob":0.0804},{"word":"computer","prob":0.0314}],"topContext":"prince","note":"one-hot picks a ROW of W (the lookup); softmax over the vocab predicts context. probs sum to 1."}},"i18n":{"_doc":"Step captions + small in-SVG labels for skipgram-net. EN canonical + RU + TT (all written). Every NUMBER and every WORD shown (the vocab, the W cell values, hidden/logits/probs, topContext 'prince', runner-up 'queen', probSum 1.0) comes from data/l5-skipgram.json, never from these strings — i18n carries only human prose + structural labels. Protected terms: skip-gram, softmax, W.","alt":{"en":"The skip-gram network as a forward pass: a one-hot input for 'king' selects a row of the embedding matrix W (the lookup), giving a 4-D hidden vector; tied output weights score every vocab word; softmax turns the scores into a context-word distribution that sums to 1, topped by 'prince'.","ru":"Сеть skip-gram как прямой проход: one-hot для «king» выбирает строку матрицы эмбеддингов W (поиск), давая 4-мерный скрытый вектор; связанные выходные веса оценивают каждое слово словаря; softmax превращает оценки в распределение слов-контекстов, сумма которого равна 1 и вершина — «prince».","tt":"Skip-gram челтәре туры узу буларак: «king» өчен one-hot эмбеддинг матрицасы W'ның юлын сайлый (эзләү), 4 үлчәмле яшерен вектор бирә; бәйләнгән чыгыш авырлыклары сүзлекнең һәр сүзен бәяли; softmax бәяләрне контекст сүзләре таралышына әйләндерә, суммасы 1 була һәм өстендә «prince»."},"inHead":{"en":"input · one-hot","ru":"вход · one-hot","tt":"керем · one-hot"},"wHead":{"en":"W · embedding matrix = lookup table","ru":"W · матрица эмбеддингов = таблица поиска","tt":"W · эмбеддинг матрицасы = эзләү таблицасы"},"hiddenHead":{"en":"hidden = the looked-up row","ru":"скрытый = найденная строка","tt":"яшерен = табылган юл"},"logitsHead":{"en":"logits · score per vocab word","ru":"логиты · оценка на каждое слово","tt":"логитлар · һәр сүзгә бәя"},"probsHead":{"en":"softmax · context distribution (Σ = 1)","ru":"softmax · распределение контекста (Σ = 1)","tt":"softmax · контекст таралышы (Σ = 1)"},"lookupTag":{"en":"select row","ru":"выбрать строку","tt":"юлны сайла"},"dotTag":{"en":"· hidden","ru":"· скрытый","tt":"· яшерен"},"topTag":{"en":"top context","ru":"топ контекста","tt":"топ контекст"},"runnerTag":{"en":"runner-up","ru":"второй","tt":"икенче"},"s0":{"en":"The skip-gram network is fed one centre word — here “king”. At the input it is not a vector yet, just a single index: a one-hot column, a 1 in king's slot and 0 everywhere else across the eight-word vocabulary. A bare position, nothing learned about meaning yet.","ru":"Сеть skip-gram получает на вход одно центральное слово — здесь «king». На входе это ещё не плотное представление смысла, а one-hot-вектор, единица в ячейке king и нули во всех остальных по словарю из восьми слов. Голая позиция, о смысле пока ничего.","tt":"Skip-gram челтәренә бер үзәк сүз бирелә — монда «king». Керемдә ул әле вектор түгел, бары бер индекс: one-hot баганасы, king ячейкасында бер, сигез сүзлек буенча калганнарда нульләр. Ялангач урын, мәгънә турында әле берни юк."},"s1":{"en":"Multiplying a one-hot by the embedding matrix W does nothing clever — it just SELECTS one row. King's 1 picks row 0 of W, and that row IS king's embedding: the four numbers that become the hidden vector. This is the whole secret — the embedding matrix is literally a lookup table, one learned row per word.","ru":"Умножение one-hot на матрицу эмбеддингов W не делает ничего хитрого — оно просто ВЫБИРАЕТ одну строку. Единица king берёт строку 0 матрицы W, и эта строка ЕСТЬ эмбеддинг king: четыре числа, которые становятся скрытым вектором. В этом весь секрет — матрица эмбеддингов и есть таблица поиска, по одной обученной строке на слово.","tt":"One-hot'ны эмбеддинг матрицасы W'га тапкырлау бернинди хәйлә эшләми — ул бары бер юлны САЙЛЫЙ. King'ның бере W'ның 0 нче юлын ала, һәм бу юл — king'ның эмбеддингы ул: яшерен вектор булып китә торган дүрт сан. Менә бөтен сер — эмбеддинг матрицасы нәкъ эзләү таблицасы, һәр сүзгә бер өйрәнелгән юл."},"s2":{"en":"To predict context, the same matrix is reused the other way (tied weights). The hidden vector is dotted with every row of W in turn, giving one raw score — a logit — per vocabulary word. Big logit means the word's row points the same way as king's; the bars on the right read out those eight scores.","ru":"Чтобы предсказать контекст, в этой схеме та же матрица используется в обратную сторону (связанные веса). Скрытый вектор скалярно умножается на каждую строку W по очереди, давая по одной сырой оценке — логиту — на каждое слово словаря. Большой логит означает, что строка слова смотрит туда же, что и king; столбики справа показывают эти восемь оценок.","tt":"Контекстны фаразлар өчен шул ук матрица кире якка кулланыла (бәйләнгән авырлыклар). Яшерен вектор W'ның һәр юлы белән чиратлап скаляр тапкырлана, сүзлекнең һәр сүзенә бер чимал бәя — логит — бирә. Зур логит сүзнең юлы king юнәлешенә карый дигән сүз; уңдагы баганалар бу сигез бәяне күрсәтә."},"s3":{"en":"Softmax turns those scores into probabilities: every bar is now positive and the eight together sum to exactly 1 — a proper distribution over context words. The top prediction is highlighted, with the runner-up just behind it. (A schematic forward pass on sliced GloVe rows, not a trained model — it shows the data FLOW, not a learned distribution.)","ru":"Softmax превращает эти оценки в вероятности: каждый столбик теперь положителен, а восемь вместе дают ровно 1 — настоящее распределение по словам-контекстам. Верхнее предсказание подсвечено, второе — сразу за ним. (Схематичный прямой проход на срезанных строках GloVe, не обученная модель — он показывает ПОТОК данных, а не выученное распределение.)","tt":"Softmax бу бәяләрне ихтималлыкларга әйләндерә: һәр багана хәзер уңай, ә сигезе бергә төгәл 1 бирә — контекст сүзләре буенча чын таралыш. Иң югары фараз билгеләнгән, икенчесе аның артында гына. (Кисеп алынган GloVe юлларында схематик туры узу, өйрәнелгән модель түгел — ул мәгълүмат АГЫМЫН күрсәтә, өйрәнелгән таралышны түгел.)"}},"title":{"en":"Skip-gram: the embedding matrix IS the lookup table","ru":"Skip-gram: матрица эмбеддингов — это таблица поиска","tt":"Skip-gram: эмбеддинг матрицасы — эзләү таблицасы ул"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
