dPct of the spread."}},"i18n":{"_doc":"Step captions + small in-SVG labels for pca-rotate. EN canonical + RU + TT (all written). Every NUMBER (explainedVarPct 79.79/17.42/2.79, var2dPct 97.21, all coordinates) comes from data/l5-pca-rotate.json, never from these strings. Protected terms: PCA, PC1, PC2, PC3. This widget's headline is 97.21% (a clean 30-point 3-D cloud) — kept distinct from dimred-projection's 37.7%.","alt":{"en":"A correlated 3-D point cloud shown in an isometric box, then its three covariance eigenvectors as axes, then the whole cloud rotating so PC1 and PC2 line up with the screen, then a flat 2-D scatter keeping PC1 and PC2.","ru":"Коррелированное 3-D облако точек в изометрической рамке, затем три собственных вектора ковариации как оси, затем всё облако поворачивается так, что PC1 и PC2 совпадают с экраном, затем плоская 2-D диаграмма по PC1 и PC2.","tt":"Изометрик рамкада корреляцияле 3-D нокта болыты, аннары ковариациянең өч үз векторы күчәр буларак, аннары бөтен болыт борыла, PC1 һәм PC2 экран белән тигезләнә, аннары PC1 һәм PC2 саклаган яссы 2-D сибелеш."},"t3d":{"en":"3-D cloud","ru":"3-D облако","tt":"3-D болыт"},"tAxes":{"en":"principal axes","ru":"главные оси","tt":"төп күчәрләр"},"tRotate":{"en":"rotating…","ru":"поворачиваем…","tt":"борабыз…"},"tAligned":{"en":"axes aligned","ru":"оси совмещены","tt":"күчәрләр тигезләнгән"},"tFlat":{"en":"projected to 2-D","ru":"проекция в 2-D","tt":"2-D'га проекция"},"subCorr":{"en":"correlated","ru":"коррелировано","tt":"корреляцияле"},"subRigid":{"en":"rigid turn","ru":"жёсткий поворот","tt":"каты борылыш"},"subAligned":{"en":"PCs on screen axes","ru":"PC на осях экрана","tt":"PC экран күчәрләрендә"},"kept2d":{"en":"PC1 + PC2 keep","ru":"PC1 + PC2 хранят","tt":"PC1 + PC2 саклый"},"varKept":{"en":"kept","ru":"сохранено","tt":"сакланды"},"s0":{"en":"Here is a real correlated cloud of points, drawn in a 3-D box. Most of its spread runs along one slanted direction; a second direction carries a little more; and along a third direction there is almost no spread at all. The structure is there, but our chosen axes don't line up with it.","ru":"Перед нами настоящее коррелированное облако точек в 3-D рамке. Большая часть разброса идёт вдоль одного наклонного направления; второе несёт чуть больше; а вдоль третьего разброса почти нет. Структура есть, но наши оси с ней не совпадают.","tt":"Менә 3-D рамкада чын корреляцияле нокта болыты. Таралышның күп өлеше бер кыек юнәлеш буенча бара; икенчесе бераз күбрәк йөртә; ә өченче юнәлеш буенча таралыш бөтенләй юк диярлек. Төзелеш бар, әмма сайланган күчәрләребез аның белән тигезләнми."},"s1":{"en":"PCA finds the cloud's OWN axes — the eigenvectors of the covariance matrix. The longest arrow (PC1) points along the greatest spread, the next (PC2) along the second, and the short one (PC3) along the direction where the cloud is nearly flat. These three arrows are what we will turn to.","ru":"PCA находит СОБСТВЕННЫЕ оси облака — собственные векторы матрицы ковариации. Самая длинная стрелка (PC1) указывает вдоль наибольшего разброса, следующая (PC2) — вдоль второго, а короткая (PC3) — туда, где облако почти плоское. К этим трём стрелкам мы и будем поворачивать.","tt":"PCA болытның ҮЗ күчәрләрен таба — ковариация матрицасының үз векторларын. Иң озын ук (PC1) иң зур таралыш буенча күрсәтә, киләсе (PC2) — икенче буенча, ә кыска (PC3) — болыт яссы диярлек булган юнәлешкә. Без нәкъ менә шушы өч укка таба борабыз."},"s2":{"en":"Now turn the whole cloud so its own axes swing toward ours. This is a rigid rotation — nothing is stretched or distorted, every distance between points is preserved. Watch the cloud and the arrows pivot together, partway toward alignment with the screen.","ru":"Теперь повернём всё облако, чтобы его собственные оси доворачивались к нашим. Это жёсткий поворот — ничего не растягивается и не искажается, все расстояния между точками сохраняются. Смотри, как облако и стрелки разворачиваются вместе, частично к совмещению с экраном.","tt":"Хәзер бөтен болытны борабыз, аның үз күчәрләре безнекенә таба борылсын. Бу каты борылыш — берни сузылмый, бозылмый, нокталар арасындагы бар ераклык саклана. Болыт белән укларның бергә, экран белән тигезләнүгә таба өлешчә борылуын күзәт."},"s3":{"en":"Fully turned: now the cloud's own axes ARE the screen axes. PC1 runs left–right, PC2 up–down, and the thin PC3 points almost straight at us. The variance splits 79.79% on PC1, 17.42% on PC2, and only 2.79% on PC3 — almost everything lives in the PC1–PC2 plane.","ru":"Полностью повёрнуто: теперь собственные оси облака И ЕСТЬ оси экрана. PC1 идёт влево–вправо, PC2 — вверх–вниз, а тонкий PC3 указывает почти прямо на нас. Дисперсия делится: 79,79% на PC1, 17,42% на PC2 и лишь 2,79% на PC3 — почти всё лежит в плоскости PC1–PC2.","tt":"Тулысынча борылган: хәзер болытның үз күчәрләре — экран күчәрләре. PC1 сулдан-уңга бара, PC2 — өстән-аска, ә нечкә PC3 безгә туры диярлек күрсәтә. Дисперсия бүленә: PC1'дә 79.79%, PC2'дә 17.42%, ә PC3'тә бары 2.79% — бар нәрсә диярлек PC1–PC2 яссылыгында."},"s4":{"en":"Drop the thin PC3 and look straight down the PC1–PC2 plane: the cloud flattens into a flat 2-D scatter. We threw away a whole dimension, yet 97.21% of the original spread survives — only 2.79% was lost. That is PCA: rotate to your own axes, then keep the fattest ones.","ru":"Отбросим тонкий PC3 и посмотрим прямо на плоскость PC1–PC2: облако сплющивается в плоскую 2-D диаграмму. Мы выбросили целое измерение, но 97,21% исходного разброса сохранилось — потеряно лишь 2,79%. Вот что такое PCA: повернуть к своим осям, затем оставить самые «толстые».","tt":"Нечкә PC3'не ташлап, PC1–PC2 яссылыгына туры карыйбыз: болыт яссы 2-D сибелешкә яньчелә. Без бөтен бер үлчәмне ташладык, әмма асыл таралышның 97.21%'ы сакланды — бары 2.79% югалды. Менә шул PCA: үз күчәрләреңә бор, аннары иң «юан»нарын калдыр."}},"title":{"en":"PCA as rotation: turn the cloud, then flatten","ru":"PCA как поворот: повернуть облако, затем сплющить","tt":"PCA борылыш буларак: болытны бор, аннары яньчы"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
