ata file's label field, not from here. Protected terms: t-SNE, PCA. Cluster names (animals/royalty/tech/places) come from the data file.","alt":{"en":"A square plane with 40 points in 4 colors. At first the colors overlap near the center; across steps the points migrate apart into four tight clusters, one per color.","ru":"Квадратная плоскость с 40 точками четырёх цветов. Сначала цвета перемешаны у центра; по шагам точки расходятся в четыре плотных кластера, по одному на цвет.","tt":"Дүрт төстәге 40 ноктасы булган квадрат яссылык. Башта төсләр үзәк янында кушылган; адымнар буенча нокталар дүрт тыгыз кластерга аерыла, һәр төскә берәр."},"scattered":{"en":"scattered","ru":"разбросано","tt":"таралган"},"migrating":{"en":"migrating","ru":"миграция","tt":"миграция"},"settled":{"en":"settled","ru":"устоялось","tt":"тотрыкланды"},"tsneCaveat":{"en":"gaps & sizes are NOT distances","ru":"промежутки и размеры — НЕ расстояния","tt":"бушлыклар һәм зурлыклар — ераклык ТҮГЕЛ"},"s0":{"en":"t-SNE starts from a PCA layout, so at iteration zero the points sit almost on top of one another near the center — the four colored groups are jumbled and hard to tell apart. Nothing has migrated yet; this is only the starting picture.","ru":"t-SNE стартует с PCA-раскладки, поэтому на нулевой итерации точки сидят почти друг на друге у центра — четыре цветные группы перемешаны и плохо различимы. Ничего ещё не мигрировало; это лишь стартовая картина.","tt":"t-SNE PCA урнашуыннан башлый, шуңа күрә нуленче итерациядә нокталар үзәк янында бер-берсе өстендә диярлек утыра — дүрт төсле төркем буталган һәм аеру кыен. Әле берни миграцияләнмәгән; бу бары башлангыч күренеш."},"s1":{"en":"A few hundred iterations in, each point begins to drift toward its true neighbors. The four colors start to peel apart — you can see the clusters forming, though they still touch. This is the migration that gives t-SNE its name's spirit: like points seek like points.","ru":"Спустя несколько сотен итераций каждая точка начинает дрейфовать к своим настоящим соседям. Четыре цвета начинают расходиться — видно, как формируются кластеры, хотя они ещё соприкасаются. Это та самая миграция: похожие точки тянутся к похожим.","tt":"Берничә йөз итерациядән соң һәр нокта үзенең чын күршеләренә таба агыла башлый. Дүрт төс аерыла башлый — кластерлар барлыкка килгәне күренә, гәрчә алар әле орына. Менә шул миграция: охшаш нокталар охшашларга тартыла."},"s2":{"en":"Halfway through, the clusters tighten and the gaps between them widen. The colored islands are now clearly separate — each group has pulled into its own compact knot, and the overlap from the start is gone.","ru":"На середине пути кластеры стягиваются, а промежутки между ними расширяются. Цветные острова теперь явно разделены — каждая группа стянулась в свой компактный узел, и начального перемешивания больше нет.","tt":"Юлның уртасында кластерлар тыгызлана, ә алар арасындагы бушлыклар киңәя. Төсле утраулар хәзер ачык аерылган — һәр төркем үзенең компакт төененә тартылган, башлангыч буталыш юкка чыккан."},"s3":{"en":"After a thousand iterations the layout settles into four clean islands — a map you can read at a glance. But beware: in a t-SNE plot the GAPS between islands and the SIZES of the clusters are not meaningful distances. t-SNE preserves who-is-near-whom locally, not the global geometry.","ru":"После тысячи итераций раскладка устаивается в четыре чистых острова — карту, читаемую с первого взгляда. Но осторожно: на t-SNE ПРОМЕЖУТКИ между островами и РАЗМЕРЫ кластеров — не осмысленные расстояния. t-SNE сохраняет локальное «кто рядом с кем», а не глобальную геометрию.","tt":"Мең итерациядән соң урнашу дүрт чиста утрауга тотрыклана — беренче карашка укыла торган карта. Әмма сак бул: t-SNE графигында утраулар арасындагы БУШЛЫКЛАР һәм кластерларның ЗУРЛЫКЛАРЫ — мәгънәле ераклык түгел. t-SNE локаль «кем кем янында» дигәнне саклый, гомуми геометрияне түгел."}},"title":{"en":"t-SNE as migration: points drift into clusters","ru":"t-SNE как миграция: точки стягиваются в кластеры","tt":"t-SNE миграция буларак: нокталар кластерларга җыела"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
