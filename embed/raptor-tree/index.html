+ summarize chunks recursively; retrieve from any tree level (leaf=detail, root=overview)","source":"Sarthi, Abdullah, Tuli, Khanna, Goldie & Manning, 'RAPTOR: Recursive Abstractive Processing for Tree-Organized Retrieval', ICLR 2024 (arXiv:2401.18059)"},"dataSets":{"l10-raptor":{"_doc":"RAPTOR — recursive abstractive tree (descriptive; the level counts are a toy illustration). Cluster + summarize leaf chunks into higher nodes, recurse to a root: 8 leaf chunks → 3 mid summaries → 1 root, depth 3. Retrieval can pull from ANY level (a high node answers a broad question; a leaf answers a detail) — so a single index serves both zoomed-out and zoomed-in queries. Sarthi et al. 2024.","_source":"_research/gen_l10.py (static, descriptive): tree shape is a toy illustration; cites arXiv:2401.18059.","tree":{"levels":[{"n":8},{"n":3},{"n":1}],"depth":3},"idea":"cluster + summarize chunks recursively; retrieve from any tree level (leaf=detail, root=overview)","source":"Sarthi, Abdullah, Tuli, Khanna, Goldie & Manning, 'RAPTOR: Recursive Abstractive Processing for Tree-Organized Retrieval', ICLR 2024 (arXiv:2401.18059)"}},"i18n":{"_doc":"Step captions + small labels for raptor-tree. EN canonical + RU + TT. Every COUNT (8 leaves, 3 summaries, 1 root, depth 3, the 8→3 and 3→1 fan-in) comes from data/l10-raptor.json (tree.levels / tree.depth), never from these strings — these are only captions and static tags.","alt":{"en":"A recursive summary tree built bottom-up: 8 leaf chunks cluster into 3 summary nodes (fan-in 8 to 3), which summarize into 1 root (3 to 1), depth 3. A broad query is routed to the root overview; a detail query is routed to a leaf — any level is retrievable.","ru":"Рекурсивное дерево саммари снизу вверх: 8 листовых чанков объединяются в 3 узла-саммари (8→3), те — в 1 корень (3→1), глубина 3. Широкий запрос идёт к корню-обзору; детальный — к листу: доступен любой уровень.","tt":"Астан өскә төзелгән рекурсив саммари агачы: 8 яфрак чанк 3 саммари төененә җыела (8→3), алар 1 тамырга (3→1), тирәнлек 3. Киң сорау тамыр-күзәтүгә бара; детальле сорау яфракка — теләсә кайсы дәрәҗә алына."},"title":{"en":"Recursive summary tree","ru":"Рекурсивное дерево саммари","tt":"Рекурсив саммари агачы"},"depth":{"en":"depth","ru":"глубина","tt":"тирәнлек"},"leaf":{"en":"leaves","ru":"листья","tt":"яфраклар"},"summary":{"en":"summaries","ru":"саммари","tt":"саммари"},"root":{"en":"root","ru":"корень","tt":"тамыр"},"fanin":{"en":"fan-in","ru":"схождение","tt":"җыелу"},"broadQuery":{"en":"broad query → overview","ru":"широкий запрос → обзор","tt":"киң сорау → күзәтү"},"detailQuery":{"en":"detail query → leaf","ru":"детальный запрос → лист","tt":"детальле сорау → яфрак"},"s0":{"en":"Start at the bottom: 8 leaf chunks — the raw passages, exactly the units a flat index would store. Standard retrieval stops here, so it can only ever answer at the granularity of a single chunk.","ru":"Начни снизу: 8 листовых чанков — сырые фрагменты, те самые единицы, которые хранит плоский индекс. Обычный поиск останавливается здесь, поэтому может отвечать только на уровне одного чанка.","tt":"Астан башла: 8 яфрак чанк — чимал кисәкләр, нәкъ шул берәмлекләр, тигез индекс саклый торган. Гадәти эзләү монда туктый, шуңа бары бер чанк дәрәҗәсендә җавап бирә ала."},"s1":{"en":"Cluster the leaves and summarize each cluster: the 8 chunks fan in to 3 summary nodes (8 → 3). Each summary node is a short abstraction over several leaves — a level of context no single chunk holds.","ru":"Сгруппируй листья и сделай саммари каждой группы: 8 чанков сходятся в 3 узла-саммари (8 → 3). Каждый узел — короткая абстракция над несколькими листьями: уровень контекста, которого нет ни у одного чанка.","tt":"Яфракларны төркемлә һәм һәр төркемгә саммари яса: 8 чанк 3 саммари төененә җыела (8 → 3). Һәр төен берничә яфрак өстендә кыска абстракция — бер чанкта да булмаган контекст дәрәҗәсе."},"s2":{"en":"Recurse: summarize the 3 summaries into 1 root node (3 → 1). The tree now has depth 3 — leaf, summary, root — a single index that holds the document at three zoom levels at once.","ru":"Рекурсия: сведи 3 саммари в 1 корневой узел (3 → 1). Теперь глубина дерева — 3: лист, саммари, корень — единый индекс, держащий документ сразу на трёх уровнях приближения.","tt":"Рекурсия: 3 саммарины 1 тамыр төененә җый (3 → 1). Хәзер агач тирәнлеге 3: яфрак, саммари, тамыр — документны берьюлы өч якынайту дәрәҗәсендә тоткан бердәм индекс."},"s3":{"en":"Now route by question. A broad, zoomed-out question ('what is this document about?') lands at the ROOT: one summary node answers it directly — no need to read all 8 leaves.","ru":"Теперь маршрутизируй по вопросу. Широкий, обзорный вопрос («о чём этот документ?») попадает в КОРЕНЬ: один узел-саммари отвечает напрямую — не нужно читать все 8 листьев.","tt":"Хәзер сорау буенча юнәлт. Киң, гомуми сорау («бу документ нәрсә турында?») ТАМЫРГА эләгә: бер саммари төене турыдан җавап бирә — 8 яфракны да укырга кирәкми."},"s4":{"en":"A zoomed-in, specific question ('what exact number is in passage 4?') lands at a LEAF: the detail lives in a raw chunk, so retrieval pulls the leaf. One tree, queried at the abstraction level the question needs — that is RAPTOR's payoff (Sarthi et al. 2024).","ru":"Узкий, конкретный вопрос («какое именно число в фрагменте 4?») попадает в ЛИСТ: деталь лежит в сыром чанке, и поиск тянет лист. Одно дерево, опрашиваемое на нужном вопросу уровне абстракции, — в этом выигрыш RAPTOR (Sarthi et al. 2024).","tt":"Тар, конкрет сорау («4 нче кисәктә нинди сан?») ЯФРАККА эләгә: деталь чимал чанкта, шуңа эзләү яфракны тарта. Бер агач, сорау сораган абстракция дәрәҗәсендә сорала — менә RAPTOR файдасы (Sarthi et al. 2024)."}},"title":{"en":"RAPTOR: a recursive summary tree, retrievable at any level","ru":"RAPTOR: рекурсивное дерево саммари, доступно на любом уровне","tt":"RAPTOR: рекурсив саммари агачы, теләсә кайсы дәрәҗәдә алына"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
