,"scaled":[0.045,0.045,0.909],"_note":"same dot 6 → softmax(0,0,6)=(…,0.995) peaky vs ÷√4 → softmax(0,0,3)=(…,0.909) softer"},"posEnc":{"d":4,"freqs":[1,0.01],"pos0":[0,1,0,1],"pos1":[0.841,0.54,0.01,1],"_note":"PE d=4: pos0=(0,1,0,1); pos1=(sin1,cos1,sin.01,cos.01)=(0.841,0.540,0.010,1.000)"},"params":{"d":768,"perBlock":7077888,"perBlockM":7.08,"blocks":12,"tokenEmb":23440896,"attnCoef":4,"ffnCoef":8,"blockCoef":12,"_note":"12·768²=7 077 888≈7.08M per block; 12 blocks + embeddings ≈ 110M (BERT-base)"},"causal":{"scores":[0,2,3],"noMask":[0.035,0.259,0.705],"masked":[0.119,0.881],"_note":"no-mask softmax(0,2,3)=(0.035,0.259,0.705) leaks future t3; causal softmax(0,2)=(0.119,0.881)"},"autoregr":{"scores":[0,1,2],"next":[0.09,0.245,0.665],"_note":"next-token softmax(0,1,2)=(0.090,0.245,0.665)"},"decoding":{"logits":[2,1,0.5,0,-1],"base":[0.563,0.207,0.126,0.076,0.028],"cumulative":[0.563,0.77,0.896,0.972,1],"topk2":[0.731,0.269],"tempSharp":[0.829,0.112,0.041,0.015,0.002],"tempSoft":[0.375,0.227,0.177,0.138,0.084],"TSharp":0.5,"TSoft":2,"_note":"z=(2,1,0.5,0,-1) → base (0.563,0.207,0.126,0.076,0.028); top-k(2) (0.731,0.269); T=0.5 (0.829,…); T=2.0 (0.375,…)"},"memory":{"heads":12,"n":[512,4096,32768],"mb512":0.52,"mb4k":33.6,"gb32k":2.15,"mb512x12":6.3,"mb4kx12":403,"gb32kx12":25.8,"_note":"fp16 2n² bytes/head: n=512→0.52MB, n=32k→2.15GB; ×12 heads → 6.3MB / 403MB / 25.8GB (O(n²))"},"uniform3":0.333}},"i18n":{"_doc":"ncd-debug — FIND THE BUG: three broken circuits in the NCD lens. Bug 1 is a SHAPE bug (K not transposed: a cup cannot contract d=4 against n=3). Bug 2 is a MEANING bug and the dangerous one (softmax over the query axis instead of the key axis — n×n in, n×n out, so every shape check passes). Bug 3 is a COMPOSITION bug (the head axis is never merged back, so the block emits h×n×64 where the next block wants n×768). Numbers from data/l15-attention.json (dk=4, params.d=768, memory.heads=12). EN canonical + RU + TT.","alt":{"en":"Three deliberately broken neural circuit diagrams. In the first, K is not transposed, so the contraction cup tries to join an axis of size four to an axis of size three and the wires do not meet. In the second, the same n by n score grid is drawn twice, held between the same two wires — the query axis n down the left, the key axis m across the top — and the only difference between the two pictures is the softmax triangle: on the right it expands along the key axis, so each row sums to one; on the left it has been turned a quarter turn and expands down the query axis, so each column sums to one instead. The tensor shape is n by n either way, so no shape check can catch it — only the turned triangle can. In the third, the head broadcast axis is never merged back, so the block outputs h by n by 64 where the next block expects n by 768; the fix is a concat hexagon followed by the output projection.","ru":"Три намеренно сломанных neural circuit diagram. В первой K не транспонирован, поэтому чаша-стягивание пытается соединить ось размера четыре с осью размера три, и провода не сходятся. Во второй одна и та же сетка оценок n×n нарисована дважды, натянутая на те же два провода — ось запросов n слева вниз, ось ключей m сверху вправо — и единственное различие между картинками — треугольник softmax: справа он раскрывается вдоль оси ключей, и каждая строка суммируется в единицу; слева он повёрнут на четверть оборота и раскрывается вниз по оси запросов, так что в единицу суммируется каждый столбец. Форма тензора и там, и там n×n, поэтому никакая проверка форм этот баг не поймает — поймает только повёрнутый треугольник. В третьей ось голов так и не собрана обратно, поэтому блок выдаёт h×n×64 там, где следующий блок ждёт n×768; лечится шестиугольником concat и выходной проекцией.","tt":"Өч махсус ватылган neural circuit diagram. Беренчесендә K транспозицияләнмәгән, шуңа җыю касәсе дүрт зурлыктагы күчәрне өч зурлыктагы күчәргә тоташтырырга тырыша, чыбыклар очрашмый. Икенчесендә шул ук n×n бәя челтәре ике тапкыр сызылган, шул ук ике чыбык арасында — сорау күчәре n сулда аска, ачкыч күчәре m өстә уңга — һәм ике рәсем арасындагы бердәнбер аерма — softmax өчпочмагы: уңда ул ачкыч күчәре буенча ачыла, һәр юл бергә җыела; сулда ул чирек әйләнешкә борылган һәм сорау күчәре буенча аска ачыла, шуңа һәр багана бергә җыела. Тензор формасы ике очракта да n×n, шуңа форма тикшерүе бу багны тота алмый — аны борылган өчпочмак кына тота. Өченчесендә башлар күчәре кире җыелмаган, блок h×n×64 бирә, ә киләсе блок n×768 көтә; concat алтыпочмагы һәм чыгыш проекциясе төзәтә."},"legMap":{"en":"a cup joins two EQUAL axes · the triangle points across the axis it normalises","ru":"чаша соединяет две РАВНЫЕ оси · треугольник смотрит поперёк оси, по которой нормируем","tt":"касә ике ТИГЕЗ күчәрне тоташтыра · өчпочмак нормалаштыру күчәре аша карый"},"h0":{"en":"bug 1 — K is not transposed","ru":"баг 1 — K не транспонирован","tt":"баг 1 — K транспозицияләнмәгән"},"h1":{"en":"bug 2 — softmax over the wrong axis","ru":"баг 2 — softmax не по той оси","tt":"баг 2 — softmax дөрес булмаган күчәр буенча"},"h2":{"en":"bug 3 — the heads were never merged","ru":"баг 3 — головы так и не собрали","tt":"баг 3 — башлар җыелмаган"},"noContract":{"en":"no contraction","ru":"стянуть нечего","tt":"җыю мөмкин түгел"},"fix0":{"en":"fix: Kᵀ is 4×3 → (3×4)·(4×3) = 3×3 ✓","ru":"фикс: Kᵀ это 4×3 → (3×4)·(4×3) = 3×3 ✓","tt":"төзәтү: Kᵀ бу 4×3 → (3×4)·(4×3) = 3×3 ✓"},"fix1":{"en":"same wires, same n×n shape — only the triangle turned","ru":"те же провода, та же форма n×n — повёрнут лишь треугольник","tt":"шул ук чыбыклар, шул ук n×n — өчпочмак кына борылган"},"badHdr":{"en":"✗ over queries","ru":"✗ по запросам","tt":"✗ сораулар буенча"},"okHdr":{"en":"✓ over keys","ru":"✓ по ключам","tt":"✓ ачкычлар буенча"},"axQueries":{"en":"n · queries","ru":"n · запросы","tt":"n · сораулар"},"axKeys":{"en":"m · keys","ru":"m · ключи","tt":"m · ачкычлар"},"vs":{"en":"vs","ru":"против","tt":"каршы"},"lblAttn":{"en":"attention","ru":"внимание","tt":"игътибар"},"tagHeads":{"en":"broadcast: h=12 heads","ru":"broadcast: h=12 голов","tt":"broadcast: h=12 баш"},"nextBlock":{"en":"the next block","ru":"следующий блок","tt":"киләсе блок"},"wants":{"en":"wants","ru":"ждёт","tt":"көтә"},"fixLbl":{"en":"fix","ru":"фикс","tt":"төзәтү"},"concat":{"en":"concat","ru":"concat","tt":"concat"},"lgTitle":{"en":"the bug","ru":"баг","tt":"баг"},"lgWant":{"en":"must contract","ru":"надо стянуть","tt":"җыярга кирәк"},"lgGot":{"en":"axes that met","ru":"оси, что встретились","tt":"очрашкан күчәрләр"},"lgFix":{"en":"fix","ru":"фикс","tt":"төзәтү"},"lgShapeIn":{"en":"shape in","ru":"форма на входе","tt":"керештә форма"},"lgShapeOut":{"en":"shape out","ru":"форма на выходе","tt":"чыгышта форма"},"lgNormOver":{"en":"normalised over","ru":"нормируем по","tt":"нормалаштыру күчәре"},"lgQueries":{"en":"queries ✗","ru":"запросам ✗","tt":"сораулар ✗"},"lgKeys":{"en":"keys ✓","ru":"ключам ✓","tt":"ачкычлар ✓"},"lgShouldBe":{"en":"should be","ru":"должно быть по","tt":"тиеш иде"},"lgTypeCheck":{"en":"a shape check says","ru":"проверка форм скажет","tt":"форма тикшерүе әйтә"},"lgPerHead":{"en":"per head","ru":"на голову","tt":"башка"},"lgAfter":{"en":"after","ru":"после","tt":"соң"},"lgNextWants":{"en":"next block wants","ru":"следующий блок ждёт","tt":"киләсе блок көтә"},"lgN0":{"en":"A cup can only contract two axes that MATCH. Here d=4 meets n=3, so there is nothing to contract — the wires do not join. In the formula QKᵀ the transpose is one character and easy to lose; on the diagram the circuit simply comes apart.","ru":"Чаша может стянуть только СОВПАДАЮЩИЕ оси. Здесь d=4 встречается с n=3 — стягивать нечего, провода не сходятся. В формуле QKᵀ транспонирование — это один символ, его легко потерять; на схеме контур просто разваливается.","tt":"Касә бары тик ТИГЕЗ күчәрләрне генә җыя ала. Монда d=4 белән n=3 очраша — җыярга бернәрсә юк, чыбыклар тоташмый. QKᵀ формуласында транспозиция — бер символ, аны югалту җиңел; схемада контур гади генә таркала."},"lgN1":{"en":"This is the dangerous one. n×n goes in and n×n comes out, so every shape assertion in your stack passes and nothing crashes — the model just learns nonsense. NCD draws the triangle ACROSS the axis it normalises, so a triangle turned the wrong way is visible even when the shape is not.","ru":"Вот этот — опасный. Вошло n×n, вышло n×n, поэтому все проверки форм в твоём стеке проходят и ничего не падает — модель просто учит чушь. NCD рисует треугольник ПОПЕРЁК той оси, по которой нормирует, поэтому повёрнутый не туда треугольник видно даже там, где форму не видно.","tt":"Менә бу — куркынычы. n×n керде, n×n чыкты, шуңа стектагы барлык форма тикшерүләре үтә һәм бернәрсә аумый — модель гади генә ахмаклык өйрәнә. NCD өчпочмакны нормалаштыру күчәре АША сыза, шуңа дөрес борылмаган өчпочмак форма күренмәгәндә дә күренә."},"lgN2":{"en":"The head axis was never put back. Blocks compose end to end only because every sublayer preserves the n×m shape — leave h dangling and the next block will not fit. Concat is not glue for convenience; it is the operation that returns the axis you split.","ru":"Ось голов так и не вернули на место. Блоки стыкуются встык только потому, что каждый подслой сохраняет форму n×m — оставь h болтаться, и следующий блок не подойдёт. Concat — это не «склейка для удобства», это операция, возвращающая на место разрезанную ось.","tt":"Башлар күчәре урынына кайтарылмаган. Блоклар бер-берсенә тоташа, чөнки һәр асткатлам n×m форманы саклый — h ны асылынып калдырсагыз, киләсе блок туры килмәячәк. Concat — «уңайлык өчен ябыштыру» түгел, ул сез кискән күчәрне кире кайтара торган операция."},"s0":{"en":"Bug 1 — a SHAPE bug. Q is 3×4 and K is 3×4. To score query against key you must contract the d axis, so K has to arrive transposed: 4×3. It has not. What actually meets at the cup is an axis of size 4 and an axis of size 3, and a cup can only contract axes that MATCH — so there is nothing to contract and the circuit comes apart right there. This bug is the easy kind: a type checker catches it, and so does a glance at the picture.","ru":"Баг 1 — ошибка ФОРМЫ. Q это 3×4, и K это 3×4. Чтобы оценить запрос против ключа, нужно стянуть ось d, а значит K обязан прийти транспонированным: 4×3. Он не пришёл. В чаше на самом деле встречаются ось размера 4 и ось размера 3, а чаша умеет стягивать только СОВПАДАЮЩИЕ оси — стягивать нечего, и контур разваливается прямо здесь. Это лёгкий баг: его поймает и проверка типов, и один взгляд на картинку.","tt":"Баг 1 — ФОРМА хатасы. Q бу 3×4, K бу 3×4. Сорауны ачкычка каршы бәяләр өчен d күчәрен җыярга кирәк, димәк K транспозицияләнеп килергә тиеш: 4×3. Ул килмәгән. Касәдә чынлыкта 4 зурлыктагы күчәр белән 3 зурлыктагы күчәр очраша, ә касә бары тик ТИГЕЗ күчәрләрне генә җыя ала — җыярга бернәрсә юк, контур нәкъ шунда таркала. Бу җиңел баг: аны тип тикшерүе дә, рәсемгә бер караш та тота."},"s1":{"en":"Bug 2 — a MEANING bug, and this is the one that will ruin your week. Both panels below are the SAME circuit: the same n×n score grid, held between the same two wires — the query axis n running down the left, the key axis m running across the top. Compare them and only ONE thing differs: the softmax triangle. On the right it expands ALONG the key axis, so each ROW is a distribution over the keys — correct, and the Σ=1 chips sit beside the rows. On the left the very same triangle has been turned a quarter turn: it now expands down the QUERY axis, so each COLUMN sums to one. Look at the shapes: n×n before, n×n after, in both. Identical. Every shape assertion passes, nothing crashes, no stack trace ever appears; the model simply learns nonsense and you spend a week bisecting hyperparameters. The triangle is the only thing on the page that can tell you — which is precisely why NCD draws it.","ru":"Баг 2 — ошибка СМЫСЛА, и вот он-то и испортит тебе неделю. Обе панели ниже — ОДНА И ТА ЖЕ схема: та же сетка оценок n×n, натянутая на те же два провода — ось запросов n идёт вниз слева, ось ключей m идёт вправо сверху. Сравни их: различается ровно ОДНО — треугольник softmax. Справа он раскрывается ВДОЛЬ оси ключей, поэтому каждая СТРОКА — это распределение по ключам (верно), и чипы Σ=1 стоят рядом со строками. Слева тот же самый треугольник повёрнут на четверть оборота: теперь он раскрывается вниз, вдоль оси ЗАПРОСОВ, и в единицу суммируется каждый СТОЛБЕЦ. Посмотри на формы: n×n до, n×n после — и там, и там. Одинаковые. Все проверки форм проходят, ничего не падает, стектрейса не будет никогда; модель просто учит чушь, а ты неделю делишь пополам гиперпараметры. Единственное, что может тебе об этом сказать, — треугольник. Ровно поэтому NCD его и рисует.","tt":"Баг 2 — МӘГЪНӘ хатасы, һәм нәкъ ул сезнең атнагызны бозачак. Астагы ике панель дә — БЕР ҮК схема: шул ук n×n бәя челтәре, шул ук ике чыбык арасында — сорау күчәре n сулда аска бара, ачкыч күчәре m өстә уңга бара. Чагыштырыгыз: аерма нибары БЕРӘҮ — softmax өчпочмагы. Уңда ул ачкыч күчәре БУЕНЧА ачыла, шуңа һәр ЮЛ ачкычлар буенча бүленеш була (дөрес), һәм Σ=1 чиплары юллар янында тора. Сулда шул ук өчпочмак чирек әйләнешкә борылган: хәзер ул аска, СОРАУ күчәре буенча ачыла, һәм һәр БАГАНА бергә җыела. Формаларга карагыз: элек n×n, аннан соң n×n — икесендә дә. Бертигез. Барлык форма тикшерүләре үтә, бернәрсә аумый, стектрейс беркайчан килмәячәк; модель гади генә ахмаклык өйрәнә. Сезгә моны әйтә алган бердәнбер нәрсә — өчпочмак. NCD аны нәкъ шуңа сыза."},"s2":{"en":"Bug 3 — a COMPOSITION bug. Multi-head attention SPLITS the model dimension: with h=12 heads and m=768, each head works in n×64. That is fine — until you forget to put the axis back. Here the block emits h×n×64: the head axis is still dangling. The next block wants n×768 and will not fit. Blocks compose end to end for exactly one reason — every sublayer preserves the n×m shape — and this one does not. The fix is the bottom row: a concat hexagon (which is precisely the inverse of the split: 12 × 64 = 768) followed by the output projection L_O.","ru":"Баг 3 — ошибка КОМПОЗИЦИИ. Multi-head внимание РАЗРЕЗАЕТ размерность модели: при h=12 головах и m=768 каждая голова работает в n×64. И это нормально — ровно до того момента, как ты забудешь вернуть ось на место. Здесь блок выдаёт h×n×64: ось голов так и болтается. Следующий блок ждёт n×768 и не подойдёт. Блоки стыкуются встык ровно по одной причине — каждый подслой сохраняет форму n×m — а этот не сохраняет. Лечение в нижнем ряду: шестиугольник concat (который и есть в точности обратная операция к разрезанию: 12 × 64 = 768), а за ним выходная проекция L_O.","tt":"Баг 3 — КОМПОЗИЦИЯ хатасы. Multi-head игътибар модель үлчәмен КИСӘ: h=12 баш һәм m=768 булганда, һәр баш n×64 та эшли. Бу нормаль — сез күчәрне урынына кайтарырга онытканчы. Монда блок h×n×64 бирә: башлар күчәре һаман асылынып тора. Киләсе блок n×768 көтә һәм туры килмәячәк. Блоклар нәкъ бер сәбәп аркасында тоташа — һәр асткатлам n×m форманы саклый — ә бу сакламый. Дәва — аскы рәттә: concat алтыпочмагы (ул нәкъ кисүгә кире операция: 12 × 64 = 768), аннары чыгыш проекциясе L_O."}},"title":{"en":"Find the bug: three circuits that do not connect","ru":"Найди баг: три контура, которые не сходятся","tt":"Багны тап: тоташмый торган өч контур"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
