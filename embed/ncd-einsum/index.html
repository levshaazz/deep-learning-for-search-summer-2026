</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>Circuit ↔ einsum ↔ formula: the same statement in three alphabets</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="3" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>3</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"ncd-einsum","mountName":"mountNcdEinsum","maxStep":3,"data":{},"dataSets":{},"i18n":{"_doc":"ncd-einsum — the isomorphism: one contraction written three ways (circuit / einsum subscript string / formula with a Σ), with ONE index lit in all three panes at once. The rule: an index that appears in the inputs and NOT in the output has been contracted — a cup in the diagram, a Σ in the formula, a missing letter in einsum. Structural, no grounded numbers. EN canonical + RU + TT.","alt":{"en":"The same contraction written three ways at once: as a neural circuit diagram, as a PyTorch einsum subscript string, and as a formula with a summation sign. One index is highlighted across all three panes, so you can see that the letter d appears twice on the left of the einsum arrow and never on the right — which is precisely the cup in the diagram and the sigma in the formula. The last step repeats the argument for the second contraction, over m, which produces the context vector.","ru":"Одно и то же стягивание, записанное тремя способами сразу: как neural circuit diagram, как строка индексов einsum в PyTorch и как формула со знаком суммы. Один индекс подсвечен во всех трёх панелях, поэтому видно: буква d встречается дважды слева от стрелки einsum и ни разу справа — а это ровно чаша на схеме и сигма в формуле. Последний шаг повторяет тот же довод для второго стягивания, по m, которое и даёт контекстный вектор.","tt":"Бер үк җыю өч ысул белән бергә язылган: neural circuit diagram буларак, PyTorch einsum индекслар юлы буларак һәм сумма билгеле формула буларак. Бер индекс өч панельдә дә яктыртылган, шуңа күренә: d хәрефе einsum угының сулында ике тапкыр очрый һәм уңында бер дә юк — бу нәкъ схемадагы касә һәм формуладагы сигма. Соңгы адым шул ук дәлилне m буенча икенче җыю өчен кабатлый."},"paneDiagram":{"en":"the circuit","ru":"схема","tt":"схема"},"paneEinsum":{"en":"the einsum","ru":"einsum","tt":"einsum"},"paneFormula":{"en":"the formula","ru":"формула","tt":"формула"},"cupEats":{"en":"the cup eats d","ru":"чаша съедает d","tt":"касә d ны ашый"},"cupEatsM":{"en":"the cup eats m","ru":"чаша съедает m","tt":"касә m ны ашый"},"acrossM":{"en":"across m — not eaten","ru":"поперёк m — но не съедает","tt":"m аша — ләкин ашамый"},"same":{"en":"the same statement","ru":"одно и то же утверждение","tt":"бер үк раслау"},"lgTitle":{"en":"the index","ru":"индекс","tt":"индекс"},"lgIn":{"en":"inputs","ru":"входы","tt":"керешләр"},"lgOut":{"en":"output","ru":"выход","tt":"чыгыш"},"lgSurvives":{"en":"repeated, survives","ru":"повторился и выжил","tt":"кабатланды, исән калды"},"lgDies":{"en":"repeated, vanishes","ru":"повторился и исчез","tt":"кабатланды, юкка чыкты"},"lgFree":{"en":"free, survives","ru":"свободный, выжил","tt":"ирекле, исән калды"},"lgTherefore":{"en":"therefore","ru":"значит","tt":"димәк"},"lgCup":{"en":"a cup","ru":"чаша","tt":"касә"},"lgNoCup":{"en":"no cup","ru":"чаши нет","tt":"касә юк"},"lgShape":{"en":"so the shape is","ru":"значит форма","tt":"димәк форма"},"lgNormOver":{"en":"normalised across","ru":"нормируем поперёк","tt":"аша нормалаштыра"},"lgContracted":{"en":"contracted","ru":"стянуто","tt":"җыелган"},"lgNothing":{"en":"nothing","ru":"ничего","tt":"бернәрсә"},"lgN0":{"en":"Read the string, not the picture: d is on the LEFT of the arrow twice and on the RIGHT not at all. That is the entire definition of a contraction. The cup in the diagram and the Σ in the formula are two more ways of writing exactly that.","ru":"Читай строку, а не картинку: d стоит СЛЕВА от стрелки дважды и СПРАВА — ни разу. Это и есть определение стягивания, целиком. Чаша на схеме и Σ в формуле — ещё два способа записать ровно это.","tt":"Рәсемне түгел, юлны укыгыз: d уктан СУЛДА ике тапкыр тора, ә УҢДА бер дә юк. Җыюның бөтен билгеләмәсе шул. Схемадагы касә һәм формуладагы Σ — шуны язуның тагын ике ысулы."},"lgN1":{"en":"The letters that DO appear on the right are the wires that leave the circuit — and, read in order, they are literally the output shape. n×m. The subscript string is not a mnemonic for the shape; it IS the shape.","ru":"Буквы, которые СТОЯТ справа, — это провода, выходящие из схемы, и, прочитанные по порядку, они буквально и есть форма выхода. n×m. Строка индексов — не мнемоника для формы; она И ЕСТЬ форма.","tt":"Уңда ТОРГАН хәрефләр — схемадан чыгучы чыбыклар, һәм тәртип белән укыганда алар сүзгә-сүз чыгыш формасы. n×m. Индекслар юлы форма өчен мнемоника түгел; ул форманың ҮЗЕ."},"lgN2":{"en":"softmax is the odd one out: it works ACROSS m but does not consume it — nm goes in, nm comes out. No letter vanishes, so there is no cup. That is why the triangle is a different glyph: it re-weights an axis instead of eating it.","ru":"softmax здесь белая ворона: он работает ПОПЕРЁК m, но не съедает его — вошло nm, вышло nm. Ни одна буква не исчезла, значит и чаши нет. Поэтому треугольник — отдельный глиф: он перевзвешивает ось, а не поедает её.","tt":"softmax монда аерым тора: ул m АША эшли, ләкин аны ашамый — nm керде, nm чыкты. Бер хәреф тә юкка чыкмады, димәк касә дә юк. Шуңа өчпочмак — аерым глиф: ул күчәрне ашамый, ә яңадан үлчи."},"lgN3":{"en":"The second contraction, and the same rule: m is repeated on the left, missing on the right, so it dies at a cup. Attention is two contractions with a softmax wedged between them — and you can prove that from the subscript strings alone, without looking at a single picture.","ru":"Второе стягивание — и то же самое правило: m повторяется слева, отсутствует справа, значит умирает в чаше. Внимание — это два стягивания с softmax, вклиненным между ними, и доказать это можно по одним только строкам индексов, ни разу не взглянув на картинку.","tt":"Икенче җыю — һәм шул ук кагыйдә: m сулда кабатлана, уңда юк, димәк ул касәдә үлә. Игътибар — арасына softmax кыстырылган ике җыю, һәм моны бер генә рәсемгә дә карамыйча, бары тик индекслар юлларыннан исбатлап була."},"s0":{"en":"One statement, three alphabets. The bottom two panes are the einsum and the formula; the top is the circuit. Watch the letter d. In the einsum it appears on the LEFT of the arrow twice — once in Q’s ‘nd’, once in K’s ‘md’ — and on the RIGHT it does not appear at all. That is the complete definition of a contraction, and it is why the diagram has a CUP exactly there, and why the formula has a Σ exactly there. Nothing is being illustrated here: the three notations are the same object.","ru":"Одно утверждение, три алфавита. Две нижние панели — einsum и формула, верхняя — схема. Следи за буквой d. В einsum она стоит СЛЕВА от стрелки дважды — в «nd» у Q и в «md» у K — а СПРАВА не стоит вовсе. Это полное определение стягивания, и именно поэтому на схеме ровно там чаша, а в формуле ровно там Σ. Здесь ничего не иллюстрируется: три записи — это один и тот же объект.","tt":"Бер раслау, өч әлифба. Аскы ике панель — einsum һәм формула, өскесе — схема. d хәрефен күзәтегез. einsum та ул уктан СУЛДА ике тапкыр тора — Q ның «nd» сында һәм K ның «md» сында — ә УҢДА бөтенләй юк. Бу җыюның тулы билгеләмәсе, һәм нәкъ шуңа схемада нәкъ шунда касә, ә формулада нәкъ шунда Σ. Монда бернәрсә иллюстрацияләнми: өч язма — бер үк объект."},"s1":{"en":"Now watch the letters that SURVIVE. n and m are on the right of the arrow, and they are exactly the two wires that leave the circuit. Read them in order and you have the output shape — n×m — with no arithmetic and no guessing. This is the payoff of taking the notation seriously: you never again have to run the code to find out what shape came out.","ru":"Теперь смотри на буквы, которые ВЫЖИЛИ. n и m стоят справа от стрелки — и это ровно те два провода, которые выходят из схемы. Прочитай их по порядку — и получишь форму выхода — n×m — без всякой арифметики и без гадания. Вот дивиденд от того, чтобы отнестись к нотации всерьёз: тебе больше никогда не нужно запускать код, чтобы узнать, какая форма получилась.","tt":"Хәзер ИСӘН КАЛГАН хәрефләргә карагыз. n һәм m уктан уңда торалар — һәм нәкъ алар схемадан чыгучы ике чыбык. Тәртип белән укыгыз, һәм сез чыгыш формасын аласыз — n×m — бернинди арифметикасыз һәм фаразсыз. Нотацияне җитди кабул итүнең файдасы шул: сезгә кайсы форма чыкканын белү өчен башка беркайчан код җибәрергә кирәкми."},"s2":{"en":"softmax is the exception that proves the rule. It works ACROSS m — every row is normalised over the key axis — but it does not CONSUME m: n×m goes in, n×m comes out. No letter disappears from the string, so there is no cup. That is exactly why the triangle is its own glyph and not a cup: a cup eats an axis, a triangle merely re-weights along one. Nothing else in attention behaves this way.","ru":"softmax — исключение, подтверждающее правило. Он работает ПОПЕРЁК m: каждая строка нормируется по оси ключей — но он не СЪЕДАЕТ m: вошло n×m, вышло n×m. Из строки не исчезает ни одной буквы, значит и чаши нет. Именно поэтому треугольник — отдельный глиф, а не чаша: чаша съедает ось, треугольник лишь перевзвешивает вдоль неё. Больше во внимании так не ведёт себя ничто.","tt":"softmax — кагыйдәне раслаучы искәрмә. Ул m АША эшли: һәр юл ачкыч күчәре буенча нормалаша — ләкин ул m ны АШАМЫЙ: n×m керде, n×m чыкты. Юлдан бер хәреф тә юкка чыкмый, димәк касә дә юк. Нәкъ шуңа өчпочмак — үз глифы, касә түгел: касә күчәрне ашый, ә өчпочмак бары тик аның буйлап яңадан үлчи. Игътибарда башка бернәрсә дә болай эшләми."},"s3":{"en":"The second contraction, and the rule holds without amendment: m is repeated on the left (‘nm’ and ‘md’), absent on the right (‘nd’) — so m dies at a cup, and the formula sums over it. Step back and look at what you can now say without a picture: attention is TWO contractions with a softmax wedged between them. You can read that off the subscript strings alone. That is what it means for the diagram to BE the einsum rather than to illustrate it.","ru":"Второе стягивание — и правило работает без поправок: m повторяется слева («nm» и «md»), отсутствует справа («nd») — значит m умирает в чаше, а формула по нему суммирует. Отойди на шаг и посмотри, что теперь можно сказать вообще без картинки: внимание — это ДВА СТЯГИВАНИЯ с softmax, вклиненным между ними. Это читается по одним строкам индексов. Вот что значит, что диаграмма НЕ иллюстрирует einsum, а ЯВЛЯЕТСЯ им.","tt":"Икенче җыю — һәм кагыйдә төзәтүсез эшли: m сулда кабатлана («nm» һәм «md»), уңда юк («nd») — димәк m касәдә үлә, ә формула аның буенча суммалый. Бер адым артка китегез һәм хәзер рәсемсез дә нәрсә әйтеп була икәнен карагыз: игътибар — арасына softmax кыстырылган ИКЕ җыю. Моны бары тик индекслар юлларыннан укып була. Диаграмманың einsum ны иллюстрацияләмәве, ә аның ҮЗЕ булуы — менә шул."}},"title":{"en":"Circuit ↔ einsum ↔ formula: the same statement in three alphabets","ru":"Схема ↔ einsum ↔ формула: одно утверждение в трёх алфавитах","tt":"Схема ↔ einsum ↔ формула: өч әлифбада бер үк раслау"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
