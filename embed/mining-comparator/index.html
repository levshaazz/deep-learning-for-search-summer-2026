</style></head> <body data-astro-cid-uucpfnyo> <main class="em-page" data-astro-cid-uucpfnyo> <h1 class="em-title" id="em-title" data-astro-cid-uucpfnyo>Mining strategies compared</h1> <div class="em-stage" data-astro-cid-uucpfnyo> <div class="em-mount" id="em-mount" data-astro-cid-uucpfnyo></div> </div> <p class="em-caption" id="em-caption" aria-live="polite" data-astro-cid-uucpfnyo></p> <div class="em-transport" id="em-transport" role="group" hidden data-astro-cid-uucpfnyo> <button type="button" class="em-btn" data-act="restart" data-astro-cid-uucpfnyo>⤺</button> <button type="button" class="em-btn" data-act="prev" data-astro-cid-uucpfnyo>‹</button> <button type="button" class="em-btn em-play" data-act="play" data-astro-cid-uucpfnyo> <span class="em-ico-play" data-astro-cid-uucpfnyo>▶</span><span class="em-ico-pause" data-astro-cid-uucpfnyo>❚❚</span> </button> <button type="button" class="em-btn" data-act="next" data-astro-cid-uucpfnyo>›</button> <input type="range" class="em-scrub" min="0" max="4" value="0" step="1" data-astro-cid-uucpfnyo> <span class="em-count" aria-hidden="true" data-astro-cid-uucpfnyo><b class="em-k" data-astro-cid-uucpfnyo>0</b>&#8202;/&#8202;<span class="em-n" data-astro-cid-uucpfnyo>4</span></span> </div> </main> <script type="application/json" id="em-payload">{"id":"mining-comparator","mountName":"mountMiningComparator","maxStep":4,"data":{"_doc":"MEASURED on a CONSTRUCTED false-negative-dense toy corpus (R=4 relevant docs per topic, only 1 labelled → 3 unlabelled positives), a cosine-space dual-encoder trained under each negative strategy, recall@10 over 20 seeds. Demonstrates (100% of seeds) the RocketQA INVERSION (in-batch .645 → +undenoised-hard .411 DROPS below it → +denoised .783 recovers) and the ANCE direction (dynamic denoised >> static bm25). The inversion is demonstrable-by-construction, NOT discovered; reproduces the ORDERING, not MS-MARCO magnitudes. The strict random<in-batch<bm25 monotone does NOT hold (those cluster) — that DPR static ladder is a REPORTED bench number (l13-bench.json), never a toy claim.","_source":"_research/gen_l13_negatives.py (frozen CPython-3.9 + numpy 2.0.2)","measured":true,"config":{"n_topics":40,"R":4,"n_dist":6,"n_irrel":400,"dim":32,"epochs":160,"lr":0.05,"tau":0.1,"k_neg":5,"k_inbatch":8,"recall_k":10},"recallAt10":{"random":{"mean":0.62,"std":0.033},"inbatch":{"mean":0.645,"std":0.037},"bm25":{"mean":0.625,"std":0.037},"undenoised":{"mean":0.411,"std":0.03},"denoised":{"mean":0.783,"std":0.039}},"claimsHoldFraction":{"inversion":1,"denoisingRecovers":1,"dynamicGtStatic":1,"denoisedBestUndenoisedWorst":1},"twoAxis":{"falseNeg":{"cosQuery":0.81,"cosPositive":0.8},"hardTrueNeg":{"cosQuery":0.64,"cosPositive":0.62},"secondAxisSeparation":0.18,"_note":"A false negative is near the POSITIVE (cosPositive high) but no harder on the QUERY axis than a hard-TRUE negative — invisible to a query-only view. This is the 2x2 (S36)."},"spine":{"_note":"Pedagogical spine: cosQ/cosPos are design inputs; InfoNCE softmax/loss, Boltzmann gradient weights and the log-N MI ceiling are COMPUTED from them. The two-axis story is n4 vs n5 — same cosQ (~0.75/0.79, both mined) but cosPos 0.31 vs 0.80: n5 is the impostor.","positive":{"id":"dPlus","label":"true positive","cosQ":0.82},"lineup":[{"id":"n1","label":"random","cosQ":0.05,"cosPos":0.03,"band":"easy","isFalse":false},{"id":"n2","label":"in-batch","cosQ":0.41,"cosPos":0.37,"band":"semi","isFalse":false},{"id":"n3","label":"BM25-hard","cosQ":0.63,"cosPos":0.34,"band":"hard","isFalse":false},{"id":"n4","label":"dynamic-hard","cosQ":0.75,"cosPos":0.31,"band":"hard","isFalse":false},{"id":"n5","label":"impostor","cosQ":0.79,"cosPos":0.8,"band":"hard","isFalse":true}],"taus":[0.5,0.2,0.1,0.05],"infonce":[{"tau":0.5,"softmax":[0.241,0.0517,0.1061,0.1648,0.2095,0.2269],"pPos":0.241,"loss":1.4231},{"tau":0.2,"softmax":[0.3224,0.0069,0.0415,0.1247,0.2272,0.2775],"pPos":0.3224,"loss":1.1321},{"tau":0.1,"softmax":[0.416,0.0002,0.0069,0.0622,0.2066,0.3082],"pPos":0.416,"loss":0.8771},{"tau":0.05,"softmax":[0.55,0,0.0002,0.0123,0.1356,0.3019],"pPos":0.55,"loss":0.5978}],"boltzmann":[{"tau":0.5,"weights":[0.0681,0.1398,0.2171,0.276,0.299]},{"tau":0.2,"weights":[0.0101,0.0612,0.184,0.3352,0.4094]},{"tau":0.1,"weights":[0.0003,0.0118,0.1065,0.3537,0.5276]},{"tau":0.05,"weights":[0,0.0003,0.0273,0.3014,0.6709]}],"logNBound":[{"N":4,"logN_nats":1.3863},{"N":16,"logN_nats":2.7726},{"N":64,"logN_nats":4.1589},{"N":256,"logN_nats":5.5452},{"N":1024,"logN_nats":6.9315},{"N":16384,"logN_nats":9.7041}],"minedByStrategy":{"random":["n1"],"inbatch":["n2"],"bm25":["n3"],"undenoised":["n4","n5"],"denoised":["n4"]}}},"dataSets":{"l13-negatives":{"_doc":"MEASURED on a CONSTRUCTED false-negative-dense toy corpus (R=4 relevant docs per topic, only 1 labelled → 3 unlabelled positives), a cosine-space dual-encoder trained under each negative strategy, recall@10 over 20 seeds. Demonstrates (100% of seeds) the RocketQA INVERSION (in-batch .645 → +undenoised-hard .411 DROPS below it → +denoised .783 recovers) and the ANCE direction (dynamic denoised >> static bm25). The inversion is demonstrable-by-construction, NOT discovered; reproduces the ORDERING, not MS-MARCO magnitudes. The strict random<in-batch<bm25 monotone does NOT hold (those cluster) — that DPR static ladder is a REPORTED bench number (l13-bench.json), never a toy claim.","_source":"_research/gen_l13_negatives.py (frozen CPython-3.9 + numpy 2.0.2)","measured":true,"config":{"n_topics":40,"R":4,"n_dist":6,"n_irrel":400,"dim":32,"epochs":160,"lr":0.05,"tau":0.1,"k_neg":5,"k_inbatch":8,"recall_k":10},"recallAt10":{"random":{"mean":0.62,"std":0.033},"inbatch":{"mean":0.645,"std":0.037},"bm25":{"mean":0.625,"std":0.037},"undenoised":{"mean":0.411,"std":0.03},"denoised":{"mean":0.783,"std":0.039}},"claimsHoldFraction":{"inversion":1,"denoisingRecovers":1,"dynamicGtStatic":1,"denoisedBestUndenoisedWorst":1},"twoAxis":{"falseNeg":{"cosQuery":0.81,"cosPositive":0.8},"hardTrueNeg":{"cosQuery":0.64,"cosPositive":0.62},"secondAxisSeparation":0.18,"_note":"A false negative is near the POSITIVE (cosPositive high) but no harder on the QUERY axis than a hard-TRUE negative — invisible to a query-only view. This is the 2x2 (S36)."},"spine":{"_note":"Pedagogical spine: cosQ/cosPos are design inputs; InfoNCE softmax/loss, Boltzmann gradient weights and the log-N MI ceiling are COMPUTED from them. The two-axis story is n4 vs n5 — same cosQ (~0.75/0.79, both mined) but cosPos 0.31 vs 0.80: n5 is the impostor.","positive":{"id":"dPlus","label":"true positive","cosQ":0.82},"lineup":[{"id":"n1","label":"random","cosQ":0.05,"cosPos":0.03,"band":"easy","isFalse":false},{"id":"n2","label":"in-batch","cosQ":0.41,"cosPos":0.37,"band":"semi","isFalse":false},{"id":"n3","label":"BM25-hard","cosQ":0.63,"cosPos":0.34,"band":"hard","isFalse":false},{"id":"n4","label":"dynamic-hard","cosQ":0.75,"cosPos":0.31,"band":"hard","isFalse":false},{"id":"n5","label":"impostor","cosQ":0.79,"cosPos":0.8,"band":"hard","isFalse":true}],"taus":[0.5,0.2,0.1,0.05],"infonce":[{"tau":0.5,"softmax":[0.241,0.0517,0.1061,0.1648,0.2095,0.2269],"pPos":0.241,"loss":1.4231},{"tau":0.2,"softmax":[0.3224,0.0069,0.0415,0.1247,0.2272,0.2775],"pPos":0.3224,"loss":1.1321},{"tau":0.1,"softmax":[0.416,0.0002,0.0069,0.0622,0.2066,0.3082],"pPos":0.416,"loss":0.8771},{"tau":0.05,"softmax":[0.55,0,0.0002,0.0123,0.1356,0.3019],"pPos":0.55,"loss":0.5978}],"boltzmann":[{"tau":0.5,"weights":[0.0681,0.1398,0.2171,0.276,0.299]},{"tau":0.2,"weights":[0.0101,0.0612,0.184,0.3352,0.4094]},{"tau":0.1,"weights":[0.0003,0.0118,0.1065,0.3537,0.5276]},{"tau":0.05,"weights":[0,0.0003,0.0273,0.3014,0.6709]}],"logNBound":[{"N":4,"logN_nats":1.3863},{"N":16,"logN_nats":2.7726},{"N":64,"logN_nats":4.1589},{"N":256,"logN_nats":5.5452},{"N":1024,"logN_nats":6.9315},{"N":16384,"logN_nats":9.7041}],"minedByStrategy":{"random":["n1"],"inbatch":["n2"],"bm25":["n3"],"undenoised":["n4","n5"],"denoised":["n4"]}}}},"i18n":{"_doc":"Step captions + static labels for the mining-comparator widget. EN + RU + TT. ALL recall numbers come from data/l13-negatives.json → recallAt10 (measured); the mined set from spine.minedByStrategy — never from this file.","alt":{"en":"Each negative-mining strategy in turn: the candidate it surfaces from the pool and the recall@10 it yields, with an in-batch baseline line so the undenoised drop and the denoised recovery read as the RocketQA inversion.","ru":"Каждая стратегия майнинга по очереди: какой кандидат она достаёт из пула и какой recall@10 даёт, с линией бейзлайна in-batch, чтобы провал undenoised и восстановление denoised читались как инверсия RocketQA.","tt":"Һәр майнинг стратегиясе чиратлап: ул пулдан нинди кандидат чыгара һәм нинди recall@10 бирә, in-batch базлайн сызыгы белән — undenoised төшүе һәм denoised торгызуы RocketQA инверсиясе булып укылсын."},"poolHead":{"en":"the candidate pool (d⁺ must stay on top)","ru":"пул кандидатов (d⁺ должен остаться сверху)","tt":"кандидатлар пулы (d⁺ өстә калырга тиеш)"},"recallHead":{"en":"recall@10 (measured on the toy, 20 seeds)","ru":"recall@10 (измерено на игрушке, 20 сидов)","tt":"recall@10 (уенчыкта үлчәнгән, 20 сид)"},"refLabel":{"en":"in-batch baseline","ru":"бейзлайн in-batch","tt":"in-batch базлайны"},"strat_random":{"en":"random","ru":"random","tt":"random"},"strat_inbatch":{"en":"in-batch","ru":"in-batch","tt":"in-batch"},"strat_bm25":{"en":"BM25-static","ru":"BM25-static","tt":"BM25-static"},"strat_undenoised":{"en":"undenoised","ru":"undenoised","tt":"undenoised"},"strat_denoised":{"en":"denoised","ru":"denoised","tt":"denoised"},"s0":{"en":"Random negatives pull n₁ from far away — easy, almost no gradient. Recall sits at the baseline; the model barely learns a boundary from negatives this loose.","ru":"Случайные негативы достают n₁ издалека — лёгкие, почти без градиента. Полнота на базовом уровне; модель едва учит границу от таких рыхлых негативов.","tt":"Очраклы негативлар n₁-не ерактан тарта — җиңел, диярлек градиентсыз. Recall базада; модель мондый йомшак негативлардан чик көчкә өйрәнә."},"s1":{"en":"In-batch negatives reuse other queries' positives (n₂) for free — a touch harder, a touch better. This is the baseline every later strategy is measured against.","ru":"Негативы из батча переиспользуют позитивы других запросов (n₂) бесплатно — чуть сложнее, чуть лучше. Это бейзлайн, с которым сравнивают все последующие стратегии.","tt":"Батчтан негативлар башка сорауларның позитивларын (n₂) бушлай куллана — бераз катлаулырак, бераз яхшырак. Бу — соңрак стратегияләр чагыштырыла торган базлайн."},"s2":{"en":"BM25-static hard negatives (n₃) are lexically close but FROZEN — model-independent, so they soon stop matching what the dense model actually confuses. Recall barely moves off the baseline. Note the plateau: random, in-batch and BM25-static all cluster within a hair of each other — a deliberate flat run before the dynamic miner breaks it.","ru":"BM25-статические трудные негативы (n₃) лексически близки, но ЗАМОРОЖЕНЫ — не зависят от модели, поэтому быстро перестают совпадать с тем, что путает плотная модель. Полнота почти не уходит от бейзлайна. Обрати внимание на плато: random, in-batch и BM25-static кучкуются почти вплотную — это намеренно ровный участок перед тем, как его разорвёт динамический майнер.","tt":"BM25-статик катлаулы негативлар (n₃) лексик якын, ләкин ТУҢДЫРЫЛГАН — модельгә бәйсез, шуңа тиздән тыгыз модель буташтырган белән туры килми. Recall базлайннан диярлек китми. Платога игътибар итегез: random, in-batch һәм BM25-static диярлек бер-берсенә ябышып тора — динамик майнер аны өзгәнче атап куелган тигез өлеш."},"s3":{"en":"The dynamic miner reaches for the model's own hardest near-misses — n₄ AND the impostor n₅. With no denoising it pushes n₅ (an unlabelled positive) away, dragging d⁺ down: recall DROPS below in-batch. This is the RocketQA inversion.","ru":"Динамический майнер берёт самые трудные near-miss самой модели — n₄ И импостора n₅. Без очистки он отталкивает n₅ (неразмеченный позитив), утягивая d⁺ вниз: полнота ПРОВАЛИВАЕТСЯ ниже in-batch. Это инверсия RocketQA.","tt":"Динамик майнер модельнең үз иң катлаулы near-miss'ларын ала — n₄ ҺӘМ импостор n₅. Чистартусыз ул n₅-не (билгеләнмәгән позитив) этә, d⁺-ны түбән тарта: recall in-batch'тан ТҮБӘН ТӨШӘ. Бу — RocketQA инверсиясе."},"s4":{"en":"Add a denoiser: a cross-encoder filters the suspected positive n₅ out of the mined set, keeping the worthy-but-true n₄. Recall recovers — and now clears every other strategy.","ru":"Добавляем очистку: кросс-энкодер выкидывает подозреваемый позитив n₅ из намайненного набора, оставляя достойный, но истинный n₄. Полнота восстанавливается — и теперь обгоняет все остальные стратегии.","tt":"Чистарту өстибез: кросс-энкодер шикле позитив n₅-не майнинг җыелмасыннан чыгара, лаеклы ләкин дөрес n₄-не калдыра. Recall торгыза — һәм хәзер бар башка стратегияләрне уза."}},"title":{"en":"Mining strategies compared","ru":"Сравнение стратегий майнинга","tt":"Майнинг стратегияләрен чагыштыру"},"steps":[{"step":0,"labelKey":"s0"},{"step":1,"labelKey":"s1"},{"step":2,"labelKey":"s2"},{"step":3,"labelKey":"s3"},{"step":4,"labelKey":"s4"}]}</script> <!-- runtime lives in its own module (src/scripts/embed-client.js): a page <script> that imports it
